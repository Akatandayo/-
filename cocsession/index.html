<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>深淵卓 — CoC6版セッション</title>
<style>
:root{
  color-scheme: dark;
  --bg:#090c0b; --bg2:#0e1311; --panel:#121916; --panel2:#17201c; --panel3:#1d2924;
  --line:#25332d; --line2:#33463e;
  --ink:#e8dfc8; --ink2:#bcb197; --mute:#7d8a82; --dim:#5b665f;
  --accent:#74b39c; --accent2:#3f7d6b; --accent-ink:#06100c;
  --brass:#c9a766; --brass2:#8c7240;
  --blood:#b8343d; --blood2:#6e161c;
  --ok:#86c493; --crit:#efcb6b; --fumble:#e04552; --info:#86aecb; --secret:#9a8cc9;
  --focus:#efcb6b;
  --font-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  --font-serif:"Shippori Mincho B1","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --font-mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --r:6px; --r2:10px;
  --topbar:48px; --navh:58px;
  --shadow:0 10px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55;overflow:hidden;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 12px;border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;font-size:13px}
.btn:hover{background:var(--panel3);border-color:#4a6157}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent2);border-color:var(--accent);color:#f2f7f3}
.btn.pri:hover{background:#4a8f7c}
.btn.brass{background:#2a2416;border-color:var(--brass2);color:var(--brass)}
.btn.danger{background:#2a1214;border-color:#6e2a30;color:#f0a0a6}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2);border-color:var(--line)}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12px}
.btn.xs{min-height:24px;padding:2px 7px;font-size:11.5px}
.btn.icon{padding:6px;min-width:34px}
.btn.on{background:#22382f;border-color:var(--accent);color:#cfeee2}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}
.field>span,.lbl{font-size:12px;color:var(--ink2);letter-spacing:.04em}
input[type=text],input[type=number],input[type=search],input:not([type]),select,textarea{width:100%;background:#0b100e;border:1px solid var(--line2);border-radius:var(--r);padding:7px 9px;min-height:34px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--mute)}
.small{font-size:12px}
.tiny{font-size:11px}
.serif{font-family:var(--font-serif)}
.sep{height:1px;background:var(--line);margin:12px 0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;border:1px solid var(--line2);font-size:11.5px;white-space:nowrap;background:var(--panel)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.pill.ok .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.pill.warn .dot{background:var(--crit)}
.pill.bad .dot{background:var(--fumble)}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;background:#1e2a25;color:var(--ink2);border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:12.5px;min-height:30px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent2);color:#fff}
h2.ph{font-family:var(--font-serif);font-weight:600;font-size:17px;letter-spacing:.08em;margin:0 0 10px;color:var(--brass);display:flex;align-items:center;gap:8px}
h2.ph::before{content:"";width:14px;height:1px;background:var(--brass2)}
h3.sh{font-family:var(--font-serif);font-size:14px;font-weight:600;margin:14px 0 8px;color:var(--ink);letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:4px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:10px}
.empty{padding:18px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:var(--r2);font-size:13px}
.kbd{font-family:var(--font-mono);font-size:11px;padding:1px 5px;border:1px solid var(--line2);border-radius:3px;background:#0b100e}

/* ---------- app layout ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:var(--topbar) 1fr;grid-template-columns:52px 340px 1fr 380px;grid-template-areas:"top top top top" "rail side main chat";background:var(--bg)}
#app.side-closed{grid-template-columns:52px 0 1fr 380px}
#app.side-closed #side{visibility:hidden}
#topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--line);background:linear-gradient(#0f1513,#0b0f0d);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-serif);font-weight:700;letter-spacing:.12em;color:var(--brass);white-space:nowrap}
.brand .mark{width:26px;height:26px}
.roomname{font-family:var(--font-serif);font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.topspacer{flex:1}
#timerBox{font-family:var(--font-mono);font-size:13px;color:var(--ink2);padding:2px 8px;border:1px solid var(--line);border-radius:var(--r);background:#0b100e}
#rail{grid-area:rail;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:#0b0f0d}
#rail button{width:48px;height:46px;padding:0;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid transparent;border-radius:var(--r);background:transparent;cursor:pointer;color:var(--ink2);font-size:9.5px;gap:2px}
#rail button:hover{background:var(--panel2);color:var(--ink)}
#rail button.on{background:var(--panel3);border-color:var(--line2);color:var(--brass)}
#side{grid-area:side;border-right:1px solid var(--line);background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-width:0}
#main{grid-area:main;position:relative;overflow:hidden;min-width:0}
#chatCol{grid-area:chat;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0}
.panel{display:none;flex-direction:column;height:100%;min-height:0}
.panel.on{display:flex}
.pscroll{overflow:auto;padding:12px;flex:1;min-height:0;overscroll-behavior:contain}
#mnav{display:none}

/* ---------- board ---------- */
#board{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#050706;cursor:grab;user-select:none;-webkit-user-select:none}
#board.panning{cursor:grabbing}
#world.cam{transition:transform 1.4s cubic-bezier(.4,0,.2,1)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;background:radial-gradient(ellipse at 50% 45%,#17221e,#0a0f0d 70%,#060807);box-shadow:0 0 0 1px rgba(201,167,102,.12),0 30px 80px rgba(0,0,0,.6)}
#boardEmpty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;text-align:center;max-width:min(360px,86%);padding:18px 20px;border:1px dashed var(--line2);border-radius:var(--r2);background:rgba(10,14,12,.82);color:var(--ink2);font-size:13px}
#boardEmpty b{display:block;font-family:var(--font-serif);color:var(--brass);font-size:15px;letter-spacing:.1em;margin-bottom:6px}
body.bcast #boardEmpty{display:none}
#bgImg{position:absolute;left:0;top:0;transition:opacity .9s ease;pointer-events:none;-webkit-user-drag:none}
#bgImg2{position:absolute;left:0;top:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
#grid{position:absolute;left:0;top:0;pointer-events:none;opacity:.22}
#tokens{position:absolute;left:0;top:0}
.tok{position:absolute;display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:grab;transition:left .12s linear,top .12s linear}
.tok.dragging{transition:none;z-index:20;cursor:grabbing}
.tok .face{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid var(--c,#999);background:#111 center/cover no-repeat;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--font-serif);color:var(--c,#ddd);box-shadow:0 3px 10px rgba(0,0,0,.6),0 0 0 3px rgba(0,0,0,.4)}
.tok.sel .face{box-shadow:0 0 0 3px var(--focus),0 3px 10px rgba(0,0,0,.6)}
.tok .nm{margin-top:5px;font-size:24px;font-weight:700;padding:0 6px;background:rgba(5,8,7,.8);border-radius:3px;white-space:nowrap;color:#f3ead4;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.tok .bars{width:100%;display:flex;flex-direction:column;gap:3px;margin-top:3px}
.tok .bars .bar{height:10px}
.bar{height:5px;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bc,#86c493);transition:width .4s}
.tok.locked{cursor:default}
#fgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:opacity .9s}
#boardHud{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:6}
#boardHud .btn{background:rgba(14,20,18,.85);backdrop-filter:blur(4px)}
#sceneTitle{position:absolute;left:12px;top:10px;z-index:6;font-family:var(--font-serif);font-size:13px;color:var(--ink2);background:rgba(8,12,10,.7);padding:3px 10px;border-radius:var(--r);border:1px solid var(--line);pointer-events:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#standLayer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.stand{position:absolute;bottom:0;height:78%;max-width:42%;transition:opacity .5s,transform .5s,filter .4s;filter:drop-shadow(0 0 18px rgba(0,0,0,.8))}
.stand img{height:100%;width:auto;object-fit:contain;display:block}
.stand.l{left:2%}.stand.r{right:2%}
.stand.dim{filter:brightness(.45) drop-shadow(0 0 18px rgba(0,0,0,.8))}
.stand.enter{opacity:0;transform:translateY(20px)}

/* effect layers (board) */
#fxBoard{position:absolute;inset:0;pointer-events:none;z-index:5}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(120,0,8,.55) 100%);opacity:0}
.vign.beat{animation:beat 1.1s infinite}
@keyframes beat{0%,100%{opacity:calc(var(--hb,.6)*.25)}12%{opacity:var(--hb,.6)}24%{opacity:calc(var(--hb,.6)*.3)}36%{opacity:calc(var(--hb,.6)*.85)}}
.lbox{position:absolute;left:0;right:0;height:0;background:#000;transition:height .8s cubic-bezier(.6,0,.2,1);z-index:2}
.lbox.t{top:0}.lbox.b{bottom:0}
.lbox.on{height:11%}
#main.tone-mono #world,#main.tone-mono #standLayer{filter:grayscale(1) contrast(1.1)}
#main.tone-sepia #world,#main.tone-sepia #standLayer{filter:sepia(.85) contrast(1.05) brightness(.9)}
#main.tone-red #world,#main.tone-red #standLayer{filter:grayscale(1) sepia(1) saturate(5) hue-rotate(-50deg) brightness(.7)}
#main.tone-cold #world,#main.tone-cold #standLayer{filter:saturate(.4) hue-rotate(160deg) brightness(.8)}
.glitchy #world{animation:glitch 2.4s infinite steps(1)}
@keyframes glitch{0%,86%,100%{transform:var(--wt);filter:none;clip-path:none}87%{clip-path:inset(20% 0 55% 0);transform:var(--wt) translateX(-14px)}89%{clip-path:inset(60% 0 10% 0);transform:var(--wt) translateX(12px);filter:hue-rotate(90deg)}91%{clip-path:inset(5% 0 80% 0);transform:var(--wt) translateX(-6px)}93%{clip-path:none;filter:invert(.1)}}

/* full-screen overlay (sequences, dice) */
#ovl{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#ovl > *{position:absolute}
.blackout{inset:0;background:#000;opacity:0;transition:opacity var(--d,800ms) ease}
.blackout.on{opacity:1}
.flash{inset:0;background:#fff;opacity:0}
.flash.go{animation:flash var(--d,600ms) ease-out forwards}
@keyframes flash{0%{opacity:0}8%{opacity:var(--fo,.95)}100%{opacity:0}}
.shake{animation:shake var(--d,600ms) cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate3d(calc(var(--p,8px)*-.3),1px,0)}20%,80%{transform:translate3d(calc(var(--p,8px)*.5),-2px,0)}30%,50%,70%{transform:translate3d(calc(var(--p,8px)*-1),2px,0)}40%,60%{transform:translate3d(var(--p,8px),-1px,0)}}
.novelbox{left:50%;bottom:5%;transform:translateX(-50%);width:min(900px,92vw);min-height:130px;background:linear-gradient(rgba(6,9,8,.92),rgba(10,14,12,.95));border:1px solid var(--brass2);border-radius:4px;padding:18px 24px 20px;font-family:var(--font-serif);font-size:clamp(16px,2.2vw,22px);line-height:1.8;color:#f1e8d0;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 20px 60px rgba(0,0,0,.8);opacity:0;transition:opacity .4s}
.novelbox.on{opacity:1}
.novelbox .who{position:absolute;top:-15px;left:20px;background:#0b0f0d;border:1px solid var(--brass2);padding:1px 14px;font-size:14px;color:var(--brass);letter-spacing:.1em}
.novelbox .caret{display:inline-block;width:.5em;height:1em;background:var(--brass);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.titlecard{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.92));opacity:0;transition:opacity 1s;text-align:center;padding:0 6vw}
.titlecard.on{opacity:1}
.titlecard .ch{font-family:var(--font-serif);color:var(--brass);letter-spacing:.6em;font-size:clamp(12px,1.6vw,18px);margin-bottom:18px;opacity:0;transform:translateY(8px);transition:all 1.2s .3s}
.titlecard .tt{font-family:var(--font-serif);font-weight:700;color:#f3ead2;font-size:clamp(28px,6vw,72px);letter-spacing:.18em;text-shadow:0 0 30px rgba(0,0,0,.9);opacity:0;filter:blur(8px);transition:all 1.6s .5s}
.titlecard .ln{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent);margin:22px 0;transition:width 1.4s .9s}
.titlecard .st{font-family:var(--font-serif);color:var(--ink2);font-size:clamp(13px,1.8vw,20px);letter-spacing:.25em;opacity:0;transition:opacity 1.2s 1.3s}
.titlecard.on .ch,.titlecard.on .st{opacity:1;transform:none}
.titlecard.on .tt{opacity:1;filter:none}
.titlecard.on .ln{width:min(520px,70vw)}
.telop{left:0;right:0;bottom:16%;display:flex;justify-content:center;opacity:0;transition:opacity .6s,transform .6s;transform:translateY(10px)}
.telop.on{opacity:1;transform:none}
.telop span{background:rgba(0,0,0,.78);border-left:3px solid var(--blood);padding:10px 26px;font-family:var(--font-serif);font-size:clamp(15px,2.4vw,26px);letter-spacing:.12em;color:#f2ead6;max-width:90vw}
.cutin{left:0;right:0;top:50%;height:min(42vh,340px);transform:translateY(-50%);display:flex;align-items:center;overflow:hidden}
.cutin .band{position:absolute;inset:0;background:linear-gradient(100deg,rgba(110,22,28,.95),rgba(20,4,6,.95));transform:skewY(-4deg) scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.7,0,.2,1)}
.cutin.on .band{transform:skewY(-4deg) scaleX(1)}
.cutin img{position:relative;height:120%;margin-left:6vw;transform:translateX(-120%);transition:transform .5s .15s cubic-bezier(.2,.9,.2,1);filter:drop-shadow(0 0 30px #000)}
.cutin.on img{transform:none}
.cutin .ctext{position:relative;margin-left:4vw;font-family:var(--font-serif);font-weight:800;font-size:clamp(22px,5vw,60px);color:#fff;letter-spacing:.1em;text-shadow:0 0 18px #000,4px 4px 0 var(--blood2);opacity:0;transform:translateX(40px);transition:all .5s .35s}
.cutin.on .ctext{opacity:1;transform:none}
.whisper{font-family:var(--font-serif);color:rgba(220,200,190,.85);pointer-events:none;white-space:nowrap;text-shadow:0 0 12px rgba(160,0,10,.9);animation:whisp var(--d,4s) ease-in-out forwards}
@keyframes whisp{0%{opacity:0;filter:blur(6px);transform:translateY(8px) scale(.96)}25%{opacity:.9;filter:blur(0)}70%{opacity:.75}100%{opacity:0;filter:blur(10px);transform:translateY(-14px) scale(1.04)}}
.distort{position:fixed;inset:0;pointer-events:none;z-index:59;backdrop-filter:url(#distortF) blur(.6px);-webkit-backdrop-filter:blur(1.2px) hue-rotate(20deg);opacity:0;transition:opacity .6s}
.distort.on{opacity:1}
#appRoot.wobble{animation:wobble 3s ease-in-out}
@keyframes wobble{0%,100%{filter:none}20%{filter:blur(1.5px) hue-rotate(-25deg) saturate(1.6)}45%{filter:blur(.4px) contrast(1.4)}70%{filter:blur(2px) hue-rotate(15deg)}}

/* dice fx */
.dicefx{left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,rgba(8,12,10,.94),rgba(6,9,8,.86));border:1px solid var(--brass2);border-radius:14px;padding:16px 40px 18px;box-shadow:0 20px 60px rgba(0,0,0,.75);min-width:min(320px,86vw)}
.dicefx.on{opacity:1}
.dicefx .who{font-size:13px;color:var(--ink2);background:rgba(0,0,0,.7);padding:2px 12px;border-radius:99px;letter-spacing:.06em}
.dicefx .num{font-family:var(--font-serif);font-weight:800;font-size:clamp(70px,14vw,150px);line-height:1;color:#f6eedb;text-shadow:0 0 30px rgba(0,0,0,1),0 0 4px #000;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.dicefx .num.land{animation:land .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.dicefx .tgt{font-size:15px;color:var(--ink2);background:rgba(0,0,0,.65);padding:1px 10px;border-radius:4px}
.dicefx .res{font-family:var(--font-serif);font-weight:700;font-size:clamp(20px,3.4vw,34px);letter-spacing:.3em;opacity:0;transition:opacity .3s;text-shadow:0 0 16px #000}
.dicefx .res.on{opacity:1}
.res.success{color:var(--ok)}.res.fail{color:#a9b3ad}.res.crit{color:var(--crit)}.res.fumble{color:var(--fumble)}
.critfx{inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;background:radial-gradient(circle at center,rgba(255,214,120,.35),rgba(30,20,0,.75) 60%,rgba(0,0,0,.9));transition:opacity .3s}
.critfx.on{opacity:1}
.critfx .big{font-family:var(--font-serif);font-weight:800;font-size:clamp(40px,10vw,120px);letter-spacing:.2em;color:#ffe9a8;text-shadow:0 0 40px #ffb300,0 0 4px #000;transform:scale(2.2);opacity:0;transition:transform .5s cubic-bezier(.2,1.4,.3,1),opacity .3s}
.critfx.on .big{transform:scale(1);opacity:1}
.critfx .sub{margin-top:10px;font-family:var(--font-serif);color:#fff3cf;font-size:clamp(14px,2.2vw,22px);letter-spacing:.15em;text-shadow:0 0 10px #000}
.critfx .rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(255,220,130,.16) 0 6deg,transparent 6deg 18deg);animation:spin 9s linear infinite;mask-image:radial-gradient(circle,#000 10%,transparent 60%);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.critfx.fum{background:radial-gradient(circle at center,rgba(120,0,10,.55),rgba(10,0,0,.94) 70%)}

.sanfx{inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .5s;background:radial-gradient(circle,rgba(40,0,0,.2),rgba(0,0,0,.85))}
.sanfx.on{opacity:1}
.sanfx .big{font-family:var(--font-serif);font-size:clamp(36px,8vw,96px);font-weight:800;color:#e9dccd;letter-spacing:.3em;text-shadow:0 0 30px #a00010;animation:jit .12s infinite}

@keyframes jit{0%{transform:translate(1px,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,2px)}}

.hoPaper{width:min(560px,90vw);max-height:80vh;overflow:auto;background:#e8dcbc;color:#2a2116;padding:30px 30px 24px;border-radius:2px;box-shadow:0 30px 80px rgba(0,0,0,.9),inset 0 0 60px rgba(120,80,30,.35);font-family:var(--font-serif);transform:rotateX(70deg) translateY(40px);opacity:0;transition:transform .9s cubic-bezier(.2,.9,.2,1),opacity .6s;transform-origin:top center}

/* ---------- chat ---------- */

#chatLog{flex:1;overflow-y:auto;padding:8px 10px;min-height:0;overscroll-behavior:contain;scroll-behavior:auto}
.msg{display:flex;gap:9px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.03)}
.msg .av{width:36px;height:36px;border-radius:50%;flex:none;background:#1a2420 center/cover no-repeat;border:1px solid var(--line2)}
.msg .bd{min-width:0;flex:1}
.msg .hd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.msg .nm{font-weight:700;font-size:13px}
.msg .tm{font-size:10.5px;color:var(--dim)}
.msg .tx{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.msg.sys{opacity:.9}
.msg.sys .tx{color:var(--ink2);font-size:12.5px}
.msg.secret .tx{color:var(--secret)}
.dres{margin-top:4px;border:1px solid var(--line2);border-left:3px solid var(--mute);border-radius:4px;padding:5px 8px;background:#0c1210;font-family:var(--font-mono);font-size:12.5px;word-break:break-all}
.dres.success{border-left-color:var(--ok)}
.dres.fail{border-left-color:#6c756f}
.dres.crit{border-left-color:var(--crit);background:linear-gradient(90deg,rgba(239,203,107,.16),#0c1210 60%)}
.dres.fumble{border-left-color:var(--fumble);background:linear-gradient(90deg,rgba(224,69,82,.18),#0c1210 60%)}
.dres .out{font-family:var(--font-ui);font-weight:800;margin-left:4px}
.out.success{color:var(--ok)}.out.fail{color:#9aa49e}.out.crit{color:var(--crit)}.out.fumble{color:var(--fumble)}
.dres .big{font-size:18px;font-weight:800;color:#fff;margin:0 2px}
.msg.secretHidden .dres{color:var(--secret);border-left-color:var(--secret)}
#composer{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;flex:none;background:#0f1513}
#composer .who{display:flex;gap:6px;align-items:center}
#composer select{min-height:30px;padding:3px 6px;font-size:12.5px}
#chatInput{min-height:40px;max-height:140px;height:42px;resize:none;font-size:14px}
#palette{max-height:34vh;overflow:auto;border-top:1px solid var(--line);padding:6px;flex:none;display:none;background:#0d1210}
#palette.on{display:block}
#palette button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;font-size:12.5px;border-radius:4px;cursor:pointer;font-family:var(--font-mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#palette button:hover,#palette button:focus-visible{background:var(--panel3);color:var(--ink)}
.typing{font-size:11px;color:var(--mute);padding:0 10px 3px;min-height:16px}

/* ---------- characters ---------- */
.charcard{display:flex;gap:10px;padding:9px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);margin-bottom:8px;align-items:flex-start}

.stat{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;font-size:12px;margin-top:3px}
.stat .bar{height:8px}

.stat .pm{display:flex;gap:2px}

.facegrid .f{border:1px solid var(--line2);border-radius:var(--r);padding:4px;text-align:center;font-size:11px;background:#0b100e}
.facegrid img{width:100%;height:80px;object-fit:contain;display:block}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -12px 10px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:0;background:transparent;padding:8px 10px;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer;font-size:12.5px;white-space:nowrap}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r2);padding:14px;text-align:center;color:var(--mute);font-size:12.5px;transition:all .15s;cursor:pointer;background:#0b100e}
.drop.over{border-color:var(--accent);color:var(--ink);background:#10201a}

/* ---------- assets ---------- */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.aitem{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0b100e;display:flex;flex-direction:column;min-width:0}

.chips button.on{background:var(--accent2);color:#fff;border-color:var(--accent)}

/* ---------- scenes / seq ---------- */
.scene{display:flex;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--panel2)}
.scene.on{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.scene .th{width:72px;height:44px;border-radius:4px;background:#000 center/cover no-repeat;flex:none;border:1px solid var(--line)}
.step{border:1px solid var(--line);border-radius:var(--r);padding:7px;margin-bottom:6px;background:#0d1311}
.step .sh2{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.step .no{font-family:var(--font-mono);font-size:11px;color:var(--brass);width:20px}
.step .ty{font-weight:700;font-size:12.5px;flex:1}

.step .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.step input,.step select,.step textarea{min-height:28px;padding:4px 6px;font-size:12.5px}
.step textarea{min-height:50px}
.fxgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.fxk .row{justify-content:space-between}
.preset{display:flex;gap:8px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--panel2)}
.preset .n{font-family:var(--font-serif);font-weight:600;flex:1;min-width:0}
.preset .d{font-size:11px;color:var(--mute)}

/* ---------- modal & toast ---------- */
#modalWrap{position:fixed;inset:0;background:rgba(2,4,3,.72);z-index:80;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#modalWrap.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(640px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{width:min(880px,100%)}
.modal.narrow{width:min(420px,100%)}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-family:var(--font-serif);font-size:17px;letter-spacing:.08em;color:var(--brass);flex:1;min-width:0}
.modal .mb{padding:14px;overflow:auto;min-height:0}
.modal .mf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--topbar) + 10px);z-index:95;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{pointer-events:none!important;opacity:.97;background:#18221e;border:1px solid var(--line2);border-left:3px solid var(--accent);padding:8px 14px;border-radius:6px;box-shadow:var(--shadow);font-size:13px;animation:tin .25s ease-out;pointer-events:auto;max-width:100%}
.toast.err{border-left-color:var(--fumble)}
.toast.warn{border-left-color:var(--crit)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#audioGate{position:absolute;right:10px;top:10px;z-index:8}

.lobby{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lobby .card h4{margin:0 0 10px;font-family:var(--font-serif);color:var(--brass);letter-spacing:.1em}

.peers{display:flex;flex-direction:column;gap:4px}
.peer{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 6px;border-radius:4px;background:var(--panel2)}
.peer .rl{font-size:10.5px;padding:0 6px;border-radius:3px;background:#22302a;color:var(--ink2)}

.gmonly{}

<script>
"use strict";
/* claude.ai Artifact として公開する場合の capabilities 宣言例:
   { room: { topics: { m: "interact" } }, db: {}, assets: {}, downloads: {} }
   （同期メッセージは topic "m" のみを使用。room 未許可時は BroadcastChannel / ソロにフォールバック） */
/* =====================================================================
   深淵卓 — CoC6版オンラインセッションツール
   構成: Util / Store(IDB) / Dice(純粋関数) / CoC(キャラ) / Iachara(取込)
         / Demo / State(reducer) / Transport(Artifact|PeerJS|BroadcastChannel)
         / Sync / Audio / FX / Sequencer / UI / Broadcast / Boot
   ===================================================================== */

/* ------------------------------ Util ------------------------------ */
const U = {
  uid(n = 10) { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; const r = crypto.getRandomValues(new Uint8Array(n)); for (const x of r) s += a[x % a.length]; return s; },
  esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); },
  $(s, r = document) { return r.querySelector(s); },
  $$(s, r = document) { return Array.from(r.querySelectorAll(s)); },
  sleep(ms) { return new Promise(r => setTimeout(r, ms)); },
  fmtTime(ms) { ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return [h, m, x].map(v => String(v).padStart(2, '0')).join(':'); },
  clock(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); },
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  throttle(fn, ms) { let last = 0, t = null, la; return (...a) => { la = a; const now = Date.now(); if (now - last >= ms) { last = now; fn(...la); } else if (!t) { t = setTimeout(() => { t = null; last = Date.now(); fn(...la); }, ms - (now - last)); } }; },
  icon(name) { return `<svg class="i" aria-hidden="true"><use href="#i-${name}"/></svg>`; },
  bytes(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; },
  b64FromBytes(u8) { let s = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); },
  bytesFromB64(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; },
  utf8b64(str) { return U.b64FromBytes(new TextEncoder().encode(str)); },
  b64utf8(b) { return new TextDecoder().decode(U.bytesFromB64(b)); },
  dataUrlToBlob(du) { const m = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(du); if (!m) return null; const mime = m[1] || 'application/octet-stream'; const bytes = m[2] ? U.bytesFromB64(m[3]) : new TextEncoder().encode(decodeURIComponent(m[3])); return new Blob([bytes], { type: mime }); },
  blobToDataUrl(b) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); }); },
  async copyText(text) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* fallthrough */ }
    try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
  },
  hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; },
  rngSeed(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  cryptoRng() { const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] / 4294967296; },
  normRoomId(s) { return String(s || '').normalize('NFKC').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40); },
};

/* ------------------------------ Store (IndexedDB) ------------------------------ */
const Store = (() => {
  let dbp = null; const mem = { rooms: new Map(), blobs: new Map(), kv: new Map() };
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        if (!('indexedDB' in window)) return res(null);
        const rq = indexedDB.open('shinentaku', 2);
        rq.onupgradeneeded = () => { const d = rq.result; for (const s of ['rooms', 'blobs', 'kv']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => res(null);
        rq.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const d = await open();
    if (!d) return fn(null);
    try {
      return await new Promise((res, rej) => {
        const t = d.transaction(store, mode); const os = t.objectStore(store);
        let out; const r = fn(os); if (r && 'onsuccess' in r) { r.onsuccess = () => { out = r.result; }; }
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      });
    } catch (e) { return fn(null); }
  }
  return {
    async get(store, key) { try { const v = await tx(store, 'readonly', os => os ? os.get(key) : null); return v !== undefined && v !== null ? v : mem[store].get(key); } catch (e) { return mem[store].get(key); } },
    async set(store, key, val) { mem[store].set(key, val); try { await tx(store, 'readwrite', os => os ? os.put(val, key) : null); } catch (e) { /* memory only */ } },
    async del(store, key) { mem[store].delete(key); try { await tx(store, 'readwrite', os => os ? os.delete(key) : null); } catch (e) { } },
    async keys(store) { try { const k = await tx(store, 'readonly', os => os ? os.getAllKeys() : null); return k || [...mem[store].keys()]; } catch (e) { return [...mem[store].keys()]; } },
  };
})();

/* ------------------------------ Dice (純粋関数) ------------------------------ */
const Dice = (() => {
  const MAXN = 200, MAXS = 10000;
  function norm(s) {
    return String(s ?? '').normalize('NFKC').replace(/[≦]/g, '<=').replace(/[≧]/g, '>=').replace(/[‐−–ー](?=\d)/g, '-').replace(/[×]/g, '*').replace(/[÷]/g, '/').trim();
  }
  // 式評価: 数値, NdM, + - * / (), 小数切り捨て
  function evalExpr(src, rng) {
    const s = String(src).replace(/\s+/g, '');
    let i = 0; const dice = []; let hasDice = false;
    function peek() { return s[i]; }
    function num() { const m = /^\d+/.exec(s.slice(i)); if (!m) return null; i += m[0].length; return parseInt(m[0], 10); }
    function factor() {
      const c = peek();
      if (c === '-') { i++; const f = factor(); return { v: -f.v, t: '-' + f.t }; }
      if (c === '+') { i++; return factor(); }
      if (c === '(') { i++; const e = expr(); if (peek() !== ')') throw new Error('括弧が閉じていません'); i++; return { v: e.v, t: '(' + e.t + ')' }; }
      let n = num();
      if (peek() === 'D' || peek() === 'd') {
        i++; let sides;
        if (peek() === '%') { i++; sides = 100; } else { sides = num(); }
        if (sides == null) throw new Error('ダイスの面数がありません');
        if (n == null) n = 1;
        if (n < 1 || n > MAXN || sides < 1 || sides > MAXS) throw new Error('ダイスの数・面数が範囲外です');
        const rolls = []; for (let k = 0; k < n; k++) rolls.push(1 + Math.floor(rng() * sides));
        const sum = rolls.reduce((a, b) => a + b, 0);
        dice.push({ n, sides, rolls }); hasDice = true;
        return { v: sum, t: n > 1 ? `${sum}[${rolls.join(',')}]` : String(sum), dt: `${n}D${sides}` };
      }
      if (n == null) throw new Error('式が不正です');
      return { v: n, t: String(n) };
    }
    function term() {
      let l = factor();
      while (peek() === '*' || peek() === '/') {
        const op = s[i++]; const r = factor();
        if (op === '*') l = { v: l.v * r.v, t: l.t + '*' + r.t };
        else { if (r.v === 0) throw new Error('0で割れません'); l = { v: Math.floor(l.v / r.v), t: l.t + '/' + r.t }; }
      }
      return l;
    }
    function expr() {
      let l = term();
      while (peek() === '+' || peek() === '-') { const op = s[i++]; const r = term(); l = op === '+' ? { v: l.v + r.v, t: l.t + '+' + r.t } : { v: l.v - r.v, t: l.t + '-' + r.t }; }
      return l;
    }
    if (!s) throw new Error('式が空です');
    const r = expr();
    if (i < s.length) throw new Error('解釈できない文字: ' + s.slice(i));
    return { value: r.v, detail: r.t, dice, hasDice, expr: s.toUpperCase() };
  }
  function maxOf(src) { return evalExpr(src, () => 0.999999).value; }
  function judge(v, target, cfg) {
    const crit = cfg.crit ?? 5, fum = cfg.fumble ?? 96;
    if (v >= 100) return 'fumble'; // 出目100は目標値に関わらず失敗（致命的失敗）
    if (v <= target) {
      if (v <= crit) return 'crit';
      if (cfg.special && v <= Math.floor(target / 5)) return 'special';
      return 'success';
    }
    if (v >= fum) return 'fumble';
    return 'fail';
  }
  const OUT_LABEL = { success: '成功', fail: '失敗', crit: '決定的成功', fumble: '致命的失敗', special: 'スペシャル' };
  function cmpTest(a, op, b) { switch (op) { case '<=': return a <= b; case '>=': return a >= b; case '<': return a < b; case '>': return a > b; case '=': case '==': return a === b; case '!=': case '<>': return a !== b; } return false; }
  function splitComment(rest) { const m = /^([^\s【「]+)\s*([\s\S]*)$/.exec(rest); return m ? { cmd: m[1], comment: (m[2] || '').trim() } : { cmd: rest, comment: '' }; }

  // 1コマンドを評価（secret/repeat 除く）
  function rollOne(raw, cfg) {
    const rng = cfg.rng || U.cryptoRng;
    let s = raw;
    let m;
    // choice
    if ((m = /^choice\s*[\[(（]([\s\S]*?)[\])）]\s*([\s\S]*)$/i.exec(s)) || (m = /^choice\s+(\S[\s\S]*)$/i.exec(s))) {
      let items, comment = '';
      if (m.length > 2 && m[2] !== undefined && /[\[(（]/.test(s.slice(6, 8))) { items = m[1].split(/[,、，]/); comment = (m[2] || '').trim(); }
      else items = m[1].split(/\s+/);
      items = items.map(x => x.trim()).filter(Boolean);
      if (!items.length) return null;
      const k = Math.floor(rng() * items.length);
      return { kind: 'choice', cmd: `choice[${items.join(',')}]`, comment, value: items[k], items, text: `(choice[${items.join(',')}]) ＞ ${items[k]}` };
    }

/* ------------------------------ Assets（素材データの所在管理） ------------------------------ */
const Assets = {

  // 画像縮小
  async prepareImage(file, tag) {

/* ------------------------------ Transports ------------------------------ */
const Chunker = {
  split(msg, max, b64) {

    const size = b64 ? payload.length : json.length * (b64 ? 1 : 1);

    const n = Math.ceil(payload.length / max), cid = U.uid(10), out = [];
    for (let i = 0; i < n; i++) out.push({ k: 'chunk', id: cid + ':' + i, cid, i, n, b: b64 ? 1 : 0, d: payload.slice(i * max, (i + 1) * max), room: msg.room, from: msg.from, to: msg.to, exclude: msg.exclude });

/* Artifact db 永続化（ホストのみ書き込み） */
const ArtifactPersist = {

  schedule: U.debounce(() => ArtifactPersist.save(), 3000),
  async save() {

    if (this.busy) { this.dirty = true; return; }
    this.busy = true;
    try {
      const S = App.S; const rid = App.roomId;
      const pub = State.viewFor(S, '__public__', 'PUBLIC');
      const core = Object.assign({}, pub, { chat: [] });
      const pages = Math.ceil(pub.chat.length / 150);
      await db.doc(this.docPath(rid)).set({ rev: S.rev, saved: Date.now(), state: JSON.stringify(core), chatPages: pages });
      for (let p = 0; p < pages; p++) {
        const slice = pub.chat.slice(p * 150, (p + 1) * 150); const key = rid + ':' + p; const sig = slice.length + ':' + (slice[slice.length - 1]?.id || '');
        if (this.lastChatPages[key] === sig) continue;
        await db.doc(this.docPath(rid) + '/chat/p' + p).set({ msgs: JSON.stringify(slice) });
        this.lastChatPages[key] = sig;

      for (let p = 0; p < (d.chatPages || 0); p++) { const c = await db.doc(this.docPath(rid) + '/chat/p' + p).get(); if (c.exists) st.chat.push(...JSON.parse(c.data().msgs)); }

/* ------------------------------ Sync（トランスポート抽象化） ------------------------------ */

      if ((msg.to && ![].concat(msg.to).includes(App.me.pid)) || (msg.exclude && msg.exclude.includes(App.me.pid))) return;

      if (c.parts[msg.i] == null) { c.parts[msg.i] = msg.d; c.got++; }
      if (c.got === c.n) { this.chunks.delete(msg.cid); try { const s = c.parts.join(''); this.receive(JSON.parse(c.b ? U.b64utf8(s) : s), via); } catch (e) { } }
      if (this.chunks.size > 50) { const now = Date.now(); for (const [k, v] of this.chunks) if (now - v.t > 60000) this.chunks.delete(k); }
      return;
    }
    if (msg.room !== App.roomId || !msg.id || this.seen.has(msg.id) || msg.from === App.me.pid) return;
    this.mark(msg.id);
    if (msg.from) { const p = this.peers.get(msg.from); if (p) p.last = Date.now(); }
    if (msg.to && ![].concat(msg.to).includes(App.me.pid)) return;
    if (msg.exclude && msg.exclude.includes(App.me.pid)) return;
    try { this.handle(msg); } catch (e) { console.warn('sync handle', e); }
  },
  handle(m) {
    switch (m.k) {
      case 'op': App.applyOp(m.op, true); break;
      case 'fx': FX.handleRemote(m.fx, m.from); break;
      case 'pres': this.touch(m); break;
      case 'bye': this.peers.delete(m.from); UI.renderConn(); break;
      case 'hello': {
        this.touch(m);
        const settled = !this.awaiting || Date.now() - this.joinedAt > 1500;
        if (App.S && settled && (m.any || this.isResponder(m.from))) this.send({ k: 'snap', to: m.from, state: State.viewFor(App.S, m.from, m.role), fresh: this.awaiting, prov: App.provisional, role: App.me.role });
        this.presence();
        break;
      }
      case 'snap': {
        if (!this.awaiting && !App.provisional) break;
        if (m.fresh && !(m.from < App.me.pid)) break;
        if (m.prov && App.S && !App.emptyFallback && App.S.rev >= (m.state?.rev || 0)) break;
        this.awaiting = false;
        App.adoptSnapshot(m.state, m.role);
        break;
      }
      case 'aget': {
        for (const id of (m.ids || [])) { const meta = App.S?.assets[id]; if (Assets.has(id) && meta && !meta.gen && (this.isHost() || meta.by === App.me.pid || m.any)) Assets.push(id, m.from); }
        break;
      }
      case 'adata': {
        if (!Assets.has(m.aid) && typeof m.data === 'string') { const b = U.dataUrlToBlob(m.data); if (b) Assets.put(m.aid, b); }
        break;
      }
      case 'typing': UI.showTyping(m.name); break;
      case 'push': if (m.role === 'GM' && m.state) { this.awaiting = false; App.adoptSnapshot(m.state, 'push'); } break;
    }
  },
  touch(m) {
    const was = this.peers.get(m.from);
    this.peers.set(m.from, { pid: m.from, name: String(m.name || '?').slice(0, 40), role: m.role, last: Date.now(), bcast: !!m.bcast, hasState: m.hasState !== false, jt: m.jt || 0 });
    if (!was && App.provisional && !this.awaiting && m.hasState !== false && !m.bcast) setTimeout(() => this.hello(true), 50);
    if (!was || was.name !== m.name || was.role !== m.role) { UI.renderConn(); if (App.S) { UI.invalidate('room'); UI.invalidate('ho'); } }
    if (!App.bcast && !m.bcast && m.name === App.me.name && m.from !== App.me.pid) this.dedupeName();
  },
  // 同名参加者がいれば、後から来た側が自動で連番を付ける
  dedupeName() {
    if (App.bcast) return;
    const mine = App.joinedAt || 0;
    const clash = [...this.peers.values()].find(p => !p.bcast && p.name === App.me.name && ((p.jt || 0) < mine || ((p.jt || 0) === mine && p.pid < App.me.pid)));
    if (!clash) return;
    const base = App.me.name.replace(/\(\d+\)$/, ''); const used = new Set([...this.peers.values()].map(p => p.name));
    let n = 2; while (used.has(`${base}(${n})`)) n++;
    const old = App.me.name; App.me.name = `${base}(${n})`;
    UI.toast(`同じ名前の参加者がいるため「${App.me.name}」として参加します`, 'warn');
    for (const c of Object.values(App.S?.chars || {})) if (c.owner === App.me.pid && c.ownerName === old) App.dispatch('char.update', { id: c.id, patch: { ownerName: App.me.name } });
    this.presence(); try { Session.save(); } catch (e) { } UI.renderTop && Chat.renderSpeakers(); UI.invalidate('room');
  },
  gmPids(othersOnly) { const out = [...this.peers.values()].filter(p => p.role === 'GM' && !p.bcast).map(p => p.pid); if (!othersOnly && App.me.role === 'GM' && !App.bcast) out.push(App.me.pid); return out; },
  expire() { const now = Date.now(); let ch = false; for (const [k, p] of this.peers) if (now - p.last > 13000) { this.peers.delete(k); ch = true; } if (ch) UI.renderConn(); },
  presence() { this.send({ k: 'pres', name: App.me.name, role: App.me.role, bcast: App.bcast, hasState: !!App.S, rev: App.S?.rev || 0, jt: App.joinedAt || 0 }); },
  candidates(exclude) { const c = [{ pid: App.me.pid, role: App.me.role, bcast: App.bcast }]; for (const p of this.peers.values()) if (p.pid !== exclude && p.hasState) c.push(p); return c.sort((a, b) => ((b.role === 'GM') - (a.role === 'GM')) || ((a.bcast ? 1 : 0) - (b.bcast ? 1 : 0)) || (a.pid < b.pid ? -1 : 1)); },
  isResponder(exclude) { return this.candidates(exclude)[0].pid === App.me.pid; },
  isHost() { return this.candidates()[0].pid === App.me.pid; },
  hello(again) {
    if (!App.roomId) return;
    const self = this;
    const mk = (x) => Object.assign({ k: 'hello', name: App.me.name, role: App.me.role, bcast: App.bcast, hasState: !self.awaiting, jt: App.joinedAt || 0 }, x || {});
    if (again && !(App.provisional && !this.awaiting && this.peers.size === 0)) { this.send(mk({ any: this.awaiting || App.provisional })); return; }
    this.helloTimers.forEach(clearTimeout); this.helloTimers = [];
    this.awaiting = true; this.joinedAt = Date.now();
    this.send(mk());
    this.helloTimers.push(setTimeout(() => { if (this.awaiting) this.send(mk()); }, 1200));
    // 誰も応答しない（ピア不在）なら早めに確定する。接続準備中のトランスポートがあれば待つ
    const aloneCheck = () => {
      if (!this.awaiting) return;
      const pending = this.transports.some(t => t.status() === 'wait');
      if (this.peers.size === 0 && !pending) { this.awaiting = false; App.onNoSnapshot(); return; }
      if (Date.now() - this.joinedAt < 6000) this.helloTimers.push(setTimeout(aloneCheck, 500));
    };
    this.helloTimers.push(setTimeout(aloneCheck, 1500));
    this.helloTimers.push(setTimeout(() => { if (this.awaiting) this.send(mk({ any: true })); }, 3200));
    this.helloTimers.push(setTimeout(() => { if (this.awaiting) { this.awaiting = false; App.onNoSnapshot(); } }, 6500));
  },
  status() {
    const act = this.transports.filter(t => t.ok);
    const names = act.map(t => t.name);
    const n = [...this.peers.values()].filter(p => !p.bcast).length;
    let level = 'warn', text = 'ソロ';
    if (names.includes('artifact')) { level = 'ok'; text = 'Artifactルーム同期'; }
    else if (names.includes('p2p')) { level = 'ok'; text = 'P2P同期'; }
    else if (names.includes('bc')) { level = n ? 'ok' : 'warn'; text = n ? 'タブ間同期' : 'ソロ'; }
    else { level = 'bad'; text = 'オフライン'; }
    return { level, text: text + (n ? `・${n + 1}人` : ''), peers: n };
  },
};

/* ------------------------------ App（状態・アクション・同期の中枢） ------------------------------ */
const App = {
  S: null, roomId: null, provisional: false, emptyFallback: false, bcast: false, joinMode: null, gmMemo: '',
  me: { pid: U.uid(8), name: 'GM', role: 'GM' },
  prefs: { master: .8, bgm: .7, se: .85, fx: 1, diceFx: true, novel: false, safe: false, sanFx: true, reduce: false, chroma: '' },
  async loadPrefs() { try { const p = await Store.get('kv', 'prefs'); if (p && typeof p === 'object') Object.assign(this.prefs, p); } catch (e) { } try { if (matchMedia('(prefers-reduced-motion: reduce)').matches && !(await Store.get('kv', 'prefsTouched'))) { this.prefs.reduce = true; this.prefs.fx = .4; } } catch (e) { } },
  savePrefs: U.debounce(() => { Store.set('kv', 'prefs', App.prefs); Store.set('kv', 'prefsTouched', true); }, 300),
  isGM() { return this.me.role === 'GM'; },
  canEditChar(c) { return !!c && (this.isGM() || (!!c.owner && c.owner === this.me.pid)); },
  ownsChar(c) { return !!c && !!c.owner && c.owner === this.me.pid; },
  fxLevel() { return this.prefs.reduce ? Math.min(.35, this.prefs.fx) : this.prefs.fx; },
  dispatch(type, p, opts = {}) {
    if (!this.S) return;
    const op = { id: U.uid(12), type, p, ts: Date.now(), by: this.me.pid };
    this.applyOp(op, false);
    const route = opts.route !== undefined ? opts.route : this.route(type);
    if (route === 'local') return;
    Sync.send(Object.assign({ k: 'op', op }, route || {}));
    if (type === 'ho.add' || type === 'ho.update') this.pushHandout(p.ho ? p.ho.id : p.id);
  },
  // GM専用データ（シーケンス・未配布ハンドアウト）は GM にのみ送る
  route(type) {
    if (type.startsWith('seq.') || type === 'ho.add' || type === 'ho.update') return { to: Sync.gmPids(true) };
    return null;
  },
  recipients(h) {
    const out = new Set(Array.isArray(h.to) ? h.to : []);
    for (const cid of (h.toChars || [])) { const c = this.S.chars[cid]; if (c && c.owner) out.add(c.owner); }
    return [...out];
  },
  pushHandout(id) {
    const h = this.S?.handouts.find(x => x.id === id); if (!h || !h.revealed) return;
    const op = { id: U.uid(12), type: 'ho.put', p: { ho: U.clone(h) }, ts: Date.now(), by: this.me.pid };
    if (h.to === 'all') Sync.send({ k: 'op', op, exclude: Sync.gmPids(false) });
    else { const to = this.recipients(h).filter(x => x !== this.me.pid); if (to.length) Sync.send({ k: 'op', op, to }); }
  },
  // 秘匿操作: allow（本人+GM）には完全版、それ以外には公開版（pPub が null なら送らない）
  dispatchPrivate(type, pFull, pPub, allow) {
    if (!this.S) return;
    const op = { id: U.uid(12), type, p: pFull, ts: Date.now(), by: this.me.pid };
    this.applyOp(op, false);
    const others = allow.filter(x => x !== this.me.pid);
    if (others.length) Sync.send({ k: 'op', op, to: others });
    if (pPub) Sync.send({ k: 'op', op: Object.assign({}, op, { id: op.id + 'p', p: pPub }), exclude: allow });
  },
  secretAllow() { return [...new Set([this.me.pid, ...Sync.gmPids(false)])]; },
  applyOp(op, remote) {
    if (!this.S || !op) return;
    if (!State.apply(this.S, op)) return;
    this.afterOp(op, remote);
    this.persist();
  },
  afterOp(op, remote) {
    const t = op.type;
    if (t === 'chat.add') Chat.onChat(op.p.msg, remote);
    if (t === 'chat.reveal') { Chat.renderAll(); if (remote) for (const m of op.p.msgs) if (m.dice && !m.rel) DiceFx.show(m); }
    if (t === 'view.set') Board.renderBg();
    if (t === 'fx.set') FX.applyState();
    if (t === 'bgm.set') Snd.syncBgm();
    if (t === 'brk.set') Overlay.renderBreak();
    if (t === 'asset.add' && remote) { const m = op.p.meta; if (!m.gen && !m.url) setTimeout(() => { if (!Assets.has(m.id)) Assets.load(m.id); }, m.dbChunks ? 10 : 2500); }
    if (t === 'char.move' || t === 'char.update' || t === 'char.add' || t === 'char.del' || t === 'char.stat') Board.renderTokens();
    if (t === 'room.set') { Board.renderGrid(); UI.renderTop(); }
    UI.invalidate(t.split('.')[0]);
  },
  persist: U.debounce(() => {
    if (!App.S || !App.roomId) return;
    Store.set('rooms', App.roomId + '@' + App.me.pid, { state: App.S, pid: App.me.pid, role: App.me.role, at: Date.now() });
    ArtifactPersist.schedule();
  }, 700),
  async loadLocal(rid) {
    try {
      const mine = await Store.get('rooms', rid + '@' + this.me.pid);
      if (mine && mine.state && mine.state.room) return State.migrate(mine.state);
      const keys = (await Store.keys('rooms')).filter(k => String(k).startsWith(rid + '@'));
      let best = null;
      for (const k of keys) { const v = await Store.get('rooms', k); if (!v || !v.state) continue; const score = (v.role === 'GM' ? 1e13 : 0) + (v.at || 0); if (!best || score > best.score) best = { v, score }; }
      if (!best) return null;
      const st = State.migrate(best.v.state);
      // 別タブ（別の参加者）が保存した状態は、自分の立場で見える範囲に絞る
      return this.isGM() && best.v.role === 'GM' ? st : State.viewFor(st, this.me.pid, this.me.role);
    } catch (e) { return null; }
  },
  saveLast() { if (this.bcast) return; Store.set('kv', 'last', { roomId: this.roomId, name: this.me.name, role: this.me.role, p2p: Sync.p2pWanted }); },
  async join(o) {
    const rid = U.normRoomId(o.roomId) || U.uid(6);
    Sync.disconnect(); Seq.stop(); Overlay.clear();
    this.roomId = rid; this.joinMode = o.mode; this.warnedEmpty = false;
    this.me.pid = Session.pidFor(rid); this.joinedAt = Session.joinedAt(rid);
    this.me.name = String(o.name || '名無し').slice(0, 30); this.me.role = ['GM', 'PL', 'VIEW'].includes(o.role) ? o.role : 'PL';
    let st = null; this.emptyFallback = false;
    if (o.mode === 'create' || o.mode === 'auto') { st = o.demo ? Demo.state(rid, o.roomName) : State.empty(rid, o.roomName); this.provisional = false; }
    else { st = await this.loadLocal(rid); this.provisional = true; }
    if (!st) { st = State.empty(rid, o.roomName || rid); this.emptyFallback = true; }
    if (o.mode === 'create' || o.mode === 'auto') st.timer = { running: true, start: Date.now(), acc: 0 };
    if (o.mode === 'create' && !o.demo) { st.scenes.push({ id: 's_' + U.uid(6), name: 'シーン1', bg: null, fg: null, fgOpacity: .6, bgm: null, fx: State.FX0() }); st.view.sceneId = st.scenes[0].id; st.seqs = Demo.presets().map(p => Object.assign({}, p, { id: 'q_' + U.uid(6) })); }
    this.S = st;
    this.gmMemo = (await Store.get('kv', 'memo:' + rid)) || '';
    Sync.autoDemo = o.mode === 'auto' || !!o.autoDemo;
    UI.fullRender();
    // Artifact内ではケイパビリティの解決を待ってから接続・同期する（描画は先に行う）
    if (Caps.inArtifact && !Caps.ready) { try { await Caps.init(); } catch (e) { } if (this.roomId !== rid) return; }
    Sync.connect(rid, { p2p: !!o.p2p && !Caps.inArtifact });
    Sync.hello();
    this.saveLast();
    this.persist();
    if (!this.bcast) { try { history.replaceState(null, '', '#room=' + rid); } catch (e) { } }
  },
  // 受信したスナップショットに、手元にだけある秘匿データ（自分の秘匿発言・GM専用データ）を戻す
  mergeLocal(snap, local) {
    if (!local || !local.room || local.room.id !== snap.room.id) return snap;
    const loc = new Map((local.chat || []).map(m => [m.id, m]));
    snap.chat = snap.chat.map(m => { const l = loc.get(m.id); return m.redacted && l && !l.redacted ? l : m; });
    if (this.isGM()) {
      const qs = new Set(snap.seqs.map(q => q.id)); for (const q of (local.seqs || [])) if (!qs.has(q.id)) snap.seqs.push(q);
      const hs = new Set(snap.handouts.map(h => h.id)); for (const h of (local.handouts || [])) if (!hs.has(h.id)) snap.handouts.push(h);
      for (const c of Object.values(local.chars || {})) { const t = snap.chars[c.id]; if (c.secretStat && t && !t.secretStat) { t.status = c.status; t.madness = c.madness; t.secretStat = c.secretStat; } }
    }
    return snap;
  },
  adoptSnapshot(state, fromRole) {
    if (!state || !state.room) return;
    const local = this.S;
    const switchPL = Sync.autoDemo && this.me.role === 'GM' && fromRole === 'GM' && !this.bcast;
    if (switchPL) { this.me.role = 'PL'; this.me.name = '探索者'; }
    this.S = this.mergeLocal(State.migrate(U.clone(state)), switchPL ? null : local); this.provisional = false; this.emptyFallback = false;
    if (switchPL) {

      UI.toast(`既に開いているタブ（GM）のデモルームに「${this.me.name}」(PL) として参加しました。名前と役割はルーム設定で変更できます。`);
      Sync.presence(); this.saveLast();
    } else if (!this.bcast) UI.toast('ルームの最新状態を同期しました');

  },
  async onNoSnapshot() {

    }

  },
  onCapsReady() {

    UI.invalidate('room'); UI.invalidate('assets');
  },
  elapsed() { const t = this.S?.timer; if (!t) return 0; return (t.acc || 0) + (t.running ? Date.now() - t.start : 0); },
  addMarker(label, auto) {
    if (!this.S) return;
    const m = { id: 'k_' + U.uid(6), t: this.elapsed(), ts: Date.now(), label: String(label || '見どころ').slice(0, 80), auto: !!auto };

  },
  resolveAsset(ref) {
    if (!ref || !this.S) return null;
    if (ref[0] === '@') { const key = ref.slice(1); const a = Object.values(this.S.assets).find(x => x.gen === key); return a ? a.id : null; }

  canSeeSecret(msg) { if (msg.redacted) return false; if (this.bcast) return false; if (this.prefs.safe) return false; if (this.isGM()) return true; return !!msg.from && msg.from.pid === this.me.pid; },
};

/* ------------------------------ Snd（BGM/SE） ------------------------------ */
const Snd = {
  unlocked: false, cur: null, curId: null, ctxOk: false,
  vol(kind) { const p = App.prefs; return U.clamp(p.master * (kind === 'bgm' ? p.bgm : p.se), 0, 1); },
  unlock() {
    this.unlocked = true;
    try { const a = new window.Audio(); a.muted = true; a.play().catch(() => { }); } catch (e) { }
    UI.renderAudioGate(); this.syncBgm(true); UI.toast('音声を有効化しました');
  },
  syncBgm(force) {
    const b = App.S?.bgm; const want = b && b.id && App.S.assets[b.id] ? b.id : null;
    if (!this.unlocked) { UI.renderAudioGate(); return; }
    if (want === this.curId && !force) { this.updateVolumes(); return; }
    if (want === this.curId && this.cur) { this.updateVolumes(); return; }
    this.crossfade(want, b?.fade ?? 1500);
  },
  crossfade(id, ms) {
    const old = this.cur;
    if (old) { this.fade(old, 0, ms).then(() => { try { old.pause(); old.src = ''; } catch (e) { } }); }
    this.cur = null; this.curId = null;
    if (!id) { UI.invalidate('fx'); return; }
    const url = Assets.url(id);
    if (!url) { this.pendingId = id; return; }
    const a = new window.Audio(url); a.loop = true; a.volume = 0; a.preload = 'auto';
    // 後から参加した人も、再生開始時刻(ts)から経過した位置で同期再生
    const ts = App.S.bgm.ts || 0;
    a.addEventListener('loadedmetadata', () => { try { if (ts && isFinite(a.duration) && a.duration > 1) { const off = ((Date.now() - ts) / 1000) % a.duration; if (off > .8) a.currentTime = off; } } catch (e) { } }, { once: true });
    a.play().then(() => { }).catch(() => { this.unlocked = false; UI.renderAudioGate(); });
    this.cur = a; this.curId = id; this.pendingId = null;
    this.fade(a, this.vol('bgm') * (App.S.bgm.vol ?? .7), ms);
    UI.invalidate('fx');
  },
  fade(a, to, ms) {
    return new Promise(res => {
      const from = a.volume, t0 = performance.now(); ms = Math.max(1, ms || 1);
      a._fadeTok = (a._fadeTok || 0) + 1; const tok = a._fadeTok;
      const step = (now) => { if (a._fadeTok !== tok) return res(); const k = U.clamp((now - t0) / ms, 0, 1); try { a.volume = U.clamp(from + (to - from) * k, 0, 1); } catch (e) { } if (k < 1) requestAnimationFrame(step); else res(); };
      requestAnimationFrame(step);
    });
  },

/* ------------------------------ FX（盤面エフェクト：Canvas/CSS） ------------------------------ */
const FX = {
  cv: null, g: null, raf: 0, w: 0, h: 0, drops: [], fogs: [], bloods: [], noiseC: null, last: 0, fogSprite: null,
  init() {
    this.cv = U.$('#fxCanvas'); this.g = this.cv.getContext('2d');
    this.noiseC = document.createElement('canvas'); this.noiseC.width = 160; this.noiseC.height = 90;
    const fs = document.createElement('canvas'); fs.width = fs.height = 256; const fg = fs.getContext('2d'); const r = fg.createRadialGradient(128, 128, 0, 128, 128, 128); r.addColorStop(0, 'rgba(210,222,218,.55)'); r.addColorStop(.6, 'rgba(210,222,218,.18)'); r.addColorStop(1, 'rgba(210,222,218,0)'); fg.fillStyle = r; fg.fillRect(0, 0, 256, 256); this.fogSprite = fs;

  },
  resize() { const b = U.$('#fxBoard').getBoundingClientRect(); this.w = Math.max(1, Math.round(b.width)); this.h = Math.max(1, Math.round(b.height)); this.cv.width = this.w; this.cv.height = this.h; },
  eff() { const f = App.S?.fx || State.FX0(); const L = App.fxLevel(); return { rain: f.rain * L, fog: f.fog * Math.max(.5, L), noise: f.noise * L, blood: f.blood * L, glitch: App.prefs.reduce ? 0 : f.glitch * L, heartbeat: f.heartbeat * L, tone: f.tone, letterbox: f.letterbox }; },
  applyState() {
    if (!App.S) return;
    const e = this.eff(), main = U.$('#main');
    for (const c of ['tone-mono', 'tone-sepia', 'tone-red', 'tone-cold']) main.classList.remove(c);
    const tone = this.localTone || e.tone; if (tone && tone !== 'none') main.classList.add('tone-' + tone);
    main.classList.toggle('glitchy', e.glitch > .05 || !!this.localGlitch);
    const v = U.$('#vign'); const hb = Math.max(e.heartbeat, this.localHb || 0); v.classList.toggle('beat', hb > .02); v.style.setProperty('--hb', String(U.clamp(hb, 0, 1)));
    U.$('#lboxT').classList.toggle('on', !!e.letterbox); U.$('#lboxB').classList.toggle('on', !!e.letterbox);
    this.ensureLoop();
  },
  ensureLoop() { const e = this.eff(); const need = e.rain > .01 || e.fog > .01 || e.noise > .01 || e.blood > .01 || this.bloods.length || (this.localNoise || 0) > 0; if (need && !this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(t => this.frame(t)); } if (!need && !this.raf) { this.g.clearRect(0, 0, this.w, this.h); } },
  frame(now) {
    this.raf = 0;
    const dt = Math.min(64, now - this.last); this.last = now;
    const e = this.eff(); const g = this.g, W = this.w, H = this.h;
    g.clearRect(0, 0, W, H);
    // fog
    const nf = Math.round(e.fog * 14);
    while (this.fogs.length < nf) this.fogs.push({ x: Math.random() * W, y: H * (.3 + Math.random() * .7), r: 180 + Math.random() * 320, v: (Math.random() * .5 + .2) * (Math.random() < .5 ? -1 : 1) });
    if (this.fogs.length > nf) this.fogs.length = nf;

    for (const f of this.fogs) { f.x += f.v * dt * .02; if (f.x < -f.r) f.x = W + f.r; if (f.x > W + f.r) f.x = -f.r; g.drawImage(this.fogSprite, f.x - f.r, f.y - f.r * .45, f.r * 2, f.r * .9); }

    // blood drips
    const nb = Math.round(e.blood * 26);

      const gr = g.createLinearGradient(0, 0, 0, b.len); gr.addColorStop(0, `rgba(90,0,6,${.85 * b.a})`); gr.addColorStop(1, `rgba(150,8,16,${.9 * b.a})`);
      g.fillStyle = gr; g.fillRect(b.x - b.w / 2, 0, b.w, b.len); g.beginPath(); g.arc(b.x, b.len, b.w * .75, 0, 7); g.fill();

  send(fx) { Sync.send({ k: 'fx', fx }); },
  handleRemote(fx, from) {

      case 'se': Snd.se(fx.id); break;

/* ------------------------------ FxQ（演出キュー：全演出を直列再生） ------------------------------ */
const FxQ = {
  q: Promise.resolve(), gen: 0, len: 0,
  ok(g) { return g === this.gen; },
  add(fn) {
    const g = this.gen; this.len++;
    const run = () => { if (g !== this.gen) return; return Promise.race([Promise.resolve().then(() => fn(g)), U.sleep(60000)]).catch(e => console.warn('fx', e)); };
    this.q = this.q.then(run, run).then(() => { this.len = Math.max(0, this.len - 1); });
    return this.q;
  },
  // Esc / 停止ボタン: 再生中・待機中の演出をすべて即停止
  stopAll(quiet) {
    this.gen++; this.q = Promise.resolve(); this.len = 0;
    Seq.token = null; Seq.playingId = null; Seq.step = -1;
    Overlay.clear(); FX.localNoise = 0; FX.localHb = 0; FX.localTone = null; FX.localGlitch = false; FX.applyState();
    const r = U.$('#appRoot'); if (r) { r.style.filter = ''; r.classList.remove('wobble'); } U.$('#app')?.classList.remove('shake');
    UI.markStep(); if (!quiet) UI.toast('演出を停止しました');
  },
};

/* ------------------------------ Seq（演出シーケンサー） ------------------------------ */
const Seq = {
  token: null, playingId: null, step: -1,
  STEP_TYPES: {
    wait: { label: '待機', f: [['ms', 'number', 'ミリ秒', 1000]] },

    title: { label: '章タイトルカード', f: [['chapter', 'text', '章'], ['title', 'text', 'タイトル'], ['sub', 'text', 'サブ'], ['ms', 'number', '表示(ms)', 4500]] },
    telop: { label: 'テロップ', f: [['text', 'text', '文言'], ['ms', 'number', '表示(ms)', 3000]] },

    whisper: { label: '囁き文字', f: [['text', 'textarea', '行ごとに表示'], ['ms', 'number', '時間(ms)', 4000]] },
    fx: { label: '環境エフェクト', f: [['key', 'select:rain,fog,noise,blood,glitch,heartbeat', '種類', 'rain'], ['value', 'number', '強さ(0-1)', .5]] },

  playAll(seq) {
    if (!App.isGM()) { UI.toast('演出の全体再生はGMのみ可能です', 'warn'); return; }
    const payload = { id: seq.id, name: seq.name, steps: seq.steps };
    FX.send({ t: 'seq', seq: payload });
    this.playQueued(payload, true);
  },
  playQueued(seq, init) { return FxQ.add(() => this.play(seq, init)); },
  async play(seq, init) {
    if (!seq || !Array.isArray(seq.steps)) return;

      if (this.token !== tok) break;
      this.step = i; UI.markStep();
      try { await this.run(seq.steps[i], init, tok); } catch (e) { console.warn('step', e); }
    }
    if (this.token === tok) { this.token = null; this.playingId = null; this.step = -1; UI.markStep(); }
  },
  stop(broadcast) { this.token = null; this.playingId = null; this.step = -1; Overlay.clear(); UI.markStep(); if (broadcast) FX.send({ t: 'stop' }); },
  async run(st, init, tok) {
    const A = (r) => App.resolveAsset(r);
    switch (st.t) {
      case 'wait': await U.sleep(+st.ms || 0); break;
      case 'bg': { const id = A(st.asset); if (init && id) App.dispatch('view.set', { bg: id }); await U.sleep(Math.min(+st.fade || 0, 1500)); break; }
      case 'fg': { if (init) App.dispatch('view.set', { fg: A(st.asset), fgOpacity: st.opacity != null ? +st.opacity : .6 }); break; }

      case 'bgm': { if (init) App.dispatch('bgm.set', { id: A(st.asset), fade: +st.fade || 1500, ts: Date.now() }); break; }
      case 'se': Snd.se(A(st.asset)); break;
      case 'blackout': Overlay.blackout(st.on !== false && st.on !== 'false', +st.ms || 800); await U.sleep(+st.ms || 800); break;
      case 'flash': Overlay.flash(st.color, +st.ms || 600); await U.sleep((+st.ms || 600) * .5); break;
      case 'shake': Overlay.shake(+st.ms || 800, +st.power || 12); await U.sleep(+st.ms || 800); break;
      case 'novel': await Overlay.novel(st.speaker, st.text, +st.speed || 45, +st.hold || 2000); break;
      case 'title': await Overlay.title(st.chapter, st.title, st.sub, +st.ms || 4500); break;
      case 'telop': await Overlay.telop(st.text, +st.ms || 3000); break;
      case 'cutin': await Overlay.cutin(Assets.url(A(st.asset)), st.text, +st.ms || 2500); break;
      case 'whisper': Overlay.whisper(st.text, +st.ms || 4000); break;
      case 'fx': if (init && st.key) App.dispatch('fx.set', { [st.key]: U.clamp(+st.value || 0, 0, 1) }); break;
      case 'tone': if (init) App.dispatch('fx.set', { tone: st.mode || 'none' }); break;
      case 'letterbox': if (init) App.dispatch('fx.set', { letterbox: st.on !== false && st.on !== 'false' }); await U.sleep(300); break;
    }
    void tok;
  },
  describe(st) {
    const T = this.STEP_TYPES[st.t]; if (!T) return st.t;
    const an = (r) => { const id = App.resolveAsset(r); return id ? (App.S.assets[id]?.name || '素材') : (r ? '（素材なし）' : 'なし'); };
    switch (st.t) {
      case 'wait': return `${st.ms}ms 待機`;
      case 'bg': case 'cutin': case 'se': return `${T.label}：${an(st.asset)}${st.text ? '「' + st.text + '」' : ''}`;

/* ------------------------------ SanFx（SAN値連動演出） ------------------------------ */
const SanFx = {
  WHISPERS: ['見ている', 'みている', 'いあ　いあ', "ph'nglui mglw'nafh", 'うしろ', 'かえってこい', 'おまえも', 'ふかきところへ', '……', '目を閉じても見える'],
  shouldShow(fx) {
    if (!App.prefs.sanFx && !App.bcast) return false;
    const scope = App.S?.room.settings.sanFxScope || 'self';
    if (scope === 'all' || App.bcast) return true;
    const ch = App.S?.chars[fx.charId];
    return fx.by === App.me.pid || (ch && ch.owner === App.me.pid);
  },
  show(fx) {
    if (!this.shouldShow(fx)) return;
    // ダイス演出の後に直列で再生
    FxQ.add(() => this.play(fx));
  },
  play(fx) {
    const L = App.fxLevel(); const loss = fx.loss || 0;
    const sev = fx.madness ? 3 : loss >= 6 ? 2.5 : loss >= 3 ? 2 : loss >= 1 ? 1 : 0;
    if (!sev) return Promise.resolve();
    // 歪み
    this.distort(sev * 9 * Math.max(.3, L), sev >= 2 ? 3200 : 1800);
    // 囁き
    const n = Math.round(sev * 2 + 1); const lines = []; for (let i = 0; i < n; i++) lines.push(this.WHISPERS[(Math.random() * this.WHISPERS.length) | 0]);
    Overlay.whisper(lines.join('\n'), 3500);
    if (sev >= 2) { FX.localNoise = .35 * sev / 3; FX.localHb = .7; FX.applyState(); setTimeout(() => { FX.localNoise = 0; FX.localHb = 0; FX.applyState(); }, 4200); }
    if (fx.madness) {
      FX.localTone = 'red'; FX.localGlitch = true; FX.applyState();
      const label = fx.madness === 'indef' ? '不定の狂気' : fx.madness === 'perm' ? '永久的狂気' : '一時的狂気';
      const el = Overlay.add('sanfx', `<div class="big">${label}</div><div class="sub">${U.esc(fx.name || '')}${fx.detail ? '<br>' + U.esc(fx.detail) : ''}</div>`);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
      setTimeout(() => { el.classList.remove('on'); setTimeout(() => el.remove(), 600); FX.localTone = null; FX.localGlitch = false; FX.applyState(); }, 5200);
      return U.sleep(5900);
    }
    return U.sleep(sev >= 2 ? 3400 : 2000);
  },
  distort(scale, ms) {
    if (App.prefs.reduce) { const r = U.$('#appRoot'); r.classList.remove('wobble'); void r.offsetWidth; r.classList.add('wobble'); setTimeout(() => r.classList.remove('wobble'), 3000); return; }
    const root = U.$('#appRoot'), disp = U.$('#distortF feDisplacementMap'), turb = U.$('#distortT');
    if (!disp) return;
    root.style.filter = 'url(#distortF)';
    const t0 = performance.now();
    const step = (now) => { const k = (now - t0) / ms; if (k >= 1) { root.style.filter = ''; disp.setAttribute('scale', '0'); return; } const env = Math.sin(Math.PI * k); disp.setAttribute('scale', String((scale * env).toFixed(1))); turb.setAttribute('baseFrequency', `${(.01 + .006 * Math.sin(now / 300)).toFixed(4)} ${(.03 + .01 * Math.cos(now / 410)).toFixed(4)}`); requestAnimationFrame(step); };
    requestAnimationFrame(step);
  },
};

/* ------------------------------ Modal ------------------------------ */
const Modal = {
  cur: null,
  open({ title, body, foot, cls = '', onMount, onClose }) {
    const w = U.$('#modalWrap');
    w.innerHTML = `<div class="modal ${cls}"><div class="mh"><h3>${U.esc(title)}</h3><button class="btn ghost icon" type="button" data-act="modalClose" aria-label="閉じる">${U.icon('x')}</button></div><div class="mb">${body || ''}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
    w.classList.add('on'); this.cur = { onClose, prevFocus: document.activeElement };
    w.onclick = (e) => { if (e.target === w) this.close(); };
    const m = w.querySelector('.modal');
    if (onMount) onMount(m);
    setTimeout(() => { const f = m.querySelector('[autofocus]') || m.querySelector('input,textarea,select,button.pri') || m.querySelector('button'); f && f.focus(); }, 30);
    return m;
  },
  close(val) {
    const w = U.$('#modalWrap'); if (!w.classList.contains('on')) return;
    w.classList.remove('on'); w.innerHTML = ''; const c = this.cur; this.cur = null;
    if (c && c.onClose) c.onClose(val);
    if (c && c.prevFocus && c.prevFocus.focus) try { c.prevFocus.focus({ preventScroll: true }); } catch (e) { }
  },
  confirm(text, { ok = 'OK', danger = false, title = '確認' } = {}) {
    return new Promise(res => {
      let done = false;
      this.open({ title, cls: 'narrow', body: `<p style="margin:0;white-space:pre-wrap">${U.esc(text)}</p>`, foot: `<button class="btn" type="button" data-act="modalClose">キャンセル</button><button class="btn ${danger ? 'danger' : 'pri'}" type="button" id="mOk">${U.esc(ok)}</button>`, onMount: (m) => { m.querySelector('#mOk').onclick = () => { done = true; Modal.close(true); }; }, onClose: (v) => res(done || v === true) });
    });
  },
};

  },
  onResize() { if (this.fitted || App.bcast) this.fit(this.fitMode); },
  applyT() { const t = `translate(${this.px}px,${this.py}px) scale(${this.z})`; const w = U.$('#world'); w.style.transform = t; w.style.setProperty('--wt', t); },
  // 既定: 駒を中心に大きめに表示（駒がなければ盤面全体）。mode==='all' で全体表示
  fit(mode) {
    if (!App.S) return; const b = U.$('#board').getBoundingClientRect(); if (b.width < 10) return;
    this.fitMode = mode || 'tokens';
    const v = App.S.view; const W = v.w || 1600, H = v.h || 1000;
    let box = { x: 0, y: 0, w: W, h: H };
    const gs = App.S.room.settings.gridSize || 50;
    const toks = App.S.order.map(id => App.S.chars[id]).filter(c => c && c.board && c.board.on !== false && (!c.invisible || App.isGM()));
    if (this.fitMode === 'tokens' && toks.length && !App.bcast) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const c of toks) { const sz = (c.size || 2) * gs; x0 = Math.min(x0, c.board.x); y0 = Math.min(y0, c.board.y); x1 = Math.max(x1, c.board.x + sz); y1 = Math.max(y1, c.board.y + sz * 1.45); }

  // 配信画面の自動カメラワーク：発言者の駒へ寄って、しばらくして戻る

    const b = U.$('#board').getBoundingClientRect(); const gs = App.S.room.settings.gridSize || 50; const sz = (c.size || 2) * gs;
    const base = Math.max(b.width / (App.S.view.w || 1600), b.height / (App.S.view.h || 1000));
    const z = base * 1.6; const cx = c.board.x + sz / 2, cy = c.board.y + sz / 2;

  toWorld(cx, cy) { const r = U.$('#board').getBoundingClientRect(); return { x: (cx - r.left - this.px) / this.z, y: (cy - r.top - this.py) / this.z }; },

/* ------------------------------ Chat ------------------------------ */
const Chat = {

  init() {
    const inp = U.$('#chatInput');

    U.$('#speakerSel').addEventListener('change', (e) => { L.speaker = e.target.value; L.face = 0; this.renderSpeakers(); this.renderPalette(); });

      const q = b.dataset.quick; const inp2 = U.$('#chatInput');

      else inp2.value = q;
      inp2.focus(); const pos = q === 'choice[,]' ? 7 : inp2.value.length; inp2.setSelectionRange(pos, pos);
    }));
    U.$('#palette').addEventListener('click', (e) => { const b = e.target.closest('button[data-cmd]'); if (!b) return; if (e.shiftKey) { U.$('#chatInput').value = b.dataset.cmd; U.$('#chatInput').focus(); return; } this.send(b.dataset.cmd); });
  },

  },
