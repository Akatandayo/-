    const p = U.$('#palette'); p.classList.toggle('on', L.palOpen); U.$('#palBtn').classList.toggle('on', L.palOpen);
    if (!L.palOpen) return;
    const ch = this.speakerChar();
    if (!ch) { p.innerHTML = '<div class="small muted" style="padding:6px">発言者にキャラクターを選ぶと、チャットパレットが表示されます。</div>'; return; }
    const lines = String(ch.commands || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const res = CoC.resolver(ch);
    p.innerHTML = `<div class="tiny muted" style="padding:2px 8px 4px">${U.esc(ch.name)} のチャットパレット（クリックで送信 / Shift+クリックで入力欄へ）</div>` + lines.map(l => { const shown = l.replace(/\{([^{}]+)\}/g, (a, k) => { const v = res(k); return v == null ? a : `${a}(${v})`; }); return `<button type="button" data-cmd="${U.esc(l)}" title="${U.esc(shown)}">${U.esc(shown)}</button>`; }).join('');
  },
  cfg(ch) { const s = App.S.room.settings; const san = ch ? CoC.getStatus(ch, 'SAN') : null; return { crit: s.crit, fumble: s.fumble, ccCrit: s.ccCrit, ccFumble: s.ccFumble, special: s.special, sanFumbleMax: s.sanFumbleMax, san: san ? san.value : undefined, resolve: ch ? CoC.resolver(ch) : null }; },
  send(text) {
    if (!App.S) return;
    const inp = U.$('#chatInput'); const fromInput = text == null;
    let raw = (fromInput ? inp.value : text).replace(/\s+$/, ''); if (!raw.trim()) return;
    if (App.me.role === 'VIEW' && L.chatTab !== 'other') { UI.toast('見学者は雑談タブでのみ発言できます', 'warn'); return; }
    const ch = this.speakerChar();
    const lines = raw.split('\n');
    const r = Dice.roll(lines[0], this.cfg(ch));
    if (r && r.ok === false) { UI.toast(r.error, 'err'); return; }
    const from = { pid: App.me.pid, player: App.me.name, name: ch ? ch.name : App.me.name, charId: ch ? ch.id : null, color: ch ? ch.color : (App.isGM() ? '#c9a766' : '#86aecb'), face: ch ? L.face : null };
    const msg = { id: 'm_' + U.uid(10), ts: Date.now(), tab: L.chatTab, from, text: raw };
    if (r) { msg.dice = r; msg.secret = !!r.secret; }
    if (msg.secret) App.dispatchPrivate('chat.add', { msg }, { msg: State.redactMsg(msg) }, App.secretAllow());
    else App.dispatch('chat.add', { msg });
    if (fromInput) { this.lastSent = raw; inp.value = ''; inp.style.height = ''; }
    if (r) this.postRoll(msg, ch);
  },
  sys(text, tab = 'main', extra) {
    const msg = Object.assign({ id: 'm_' + U.uid(10), ts: Date.now(), tab, sys: true, text }, extra || {});
    if (msg.secret) App.dispatchPrivate('chat.add', { msg }, { msg: State.redactMsg(msg) }, App.secretAllow());
    else App.dispatch('chat.add', { msg });
  },
  postRoll(msg, ch) {
    const r = msg.dice; const who = msg.from.name; const secret = !!r.secret;
    if (!secret) {
      if (r.outcome === 'crit') App.addMarker(`決定的成功：${who} ${r.comment || r.cmd}`, true);
      if (r.outcome === 'fumble') App.addMarker(`致命的失敗：${who} ${r.comment || r.cmd}`, true);
    }
    if (!(r.kind === 'san' && r.hasFormula && ch)) return;
    const st = CoC.getStatus(ch, 'SAN'); if (!st) return;
    const before = st.value, after = Math.max(0, before - r.loss);
    const lossTotal = (ch.sanLossSession || 0) + r.loss;
    const sysx = secret ? { secret: true, rel: msg.id, from: { pid: App.me.pid, name: who } } : null;
    // 1) SAN値の変化を先に表示
    this.sys(r.loss > 0 ? `${ch.name} のSAN値 ${before} → ${after}（-${r.loss}）` : `${ch.name} のSAN値 ${before}（減少なし）`, msg.tab, sysx);
    let madness = null, detail = '';
    if (after <= 0) { madness = 'perm'; detail = 'SAN値が0になった。探索者は永久に正気を失った…'; }
    else if (ch.sanStart && lossTotal >= Math.ceil(ch.sanStart / 5) && ch.madness !== 'indef') { madness = 'indef'; const k = 1 + Math.floor(U.cryptoRng() * 10); detail = `不定の狂気表(1D10=${k})：${CoC.INDEF_INSANITY[k - 1]}`; }
    else if (r.loss >= 5) {
      // 2) 5以上の減少 → アイデアロール
      const ab = CoC.abilMap(ch); const idea = ab.INT * 5 || CoC.resolver(ch)('アイデア') || 50;
      const cmd = `${secret ? 'S' : ''}CCB<=${idea} 【アイデア（一時的狂気判定）】`;
      const ir = Dice.roll(cmd, this.cfg(ch));
      if (ir && ir.ok) {
        const im = { id: 'm_' + U.uid(10), ts: Date.now() + 1, tab: msg.tab, from: msg.from, text: cmd, dice: ir, secret, rel: secret ? msg.id : undefined };
        if (secret) App.dispatchPrivate('chat.add', { msg: im }, { msg: State.redactMsg(im) }, App.secretAllow()); else App.dispatch('chat.add', { msg: im });
        if (['success', 'crit', 'special'].includes(ir.outcome)) { madness = 'temp'; const k = 1 + Math.floor(U.cryptoRng() * 10); detail = `一時的狂気表(1D10=${k})：${CoC.TEMP_INSANITY[k - 1]}（1D10+4ラウンド）`; }
        else this.sys('アイデアロールに失敗――理解が追いつかず、正気を保った。', msg.tab, sysx);
      }
    }
    // 3) ステータス更新（秘匿時は本人とGMのみ）
    const stP = { id: ch.id, label: 'SAN', value: after, sanLoss: r.loss, madness: madness || ch.madness || null };
    if (secret) { stP.secretPub = ch.secretStat || { SAN: before, madness: ch.madness || null, loss: ch.sanLossSession || 0 }; App.dispatchPrivate('char.stat', stP, null, App.secretAllow()); }
    else App.dispatch('char.stat', stP);
    const mlabel = madness === 'temp' ? '一時的狂気' : madness === 'indef' ? '不定の狂気' : '永久的狂気';
    if (madness) this.sys(`【${mlabel}】${ch.name}　${detail}`, msg.tab, sysx);
    if (r.loss > 0 && !secret) App.addMarker(`SAN減少 -${r.loss}：${ch.name}${madness ? '（' + mlabel + '）' : ''}`, true);
    const fx = { t: 'san', charId: ch.id, by: App.me.pid, name: ch.name, loss: r.loss, madness, detail };
    if (!secret) FX.send(fx);
    else { const others = App.secretAllow().filter(x => x !== App.me.pid); if (others.length) Sync.send({ k: 'fx', fx, to: others }); }
    SanFx.show(fx);
  },
  // GMによる秘匿ロールの公開
  reveal(id) {
    if (!App.isGM()) return;
    const S = App.S; const msgs = S.chat.filter(m => (m.id === id || m.rel === id) && m.secret && !m.redacted).map(m => Object.assign(U.clone(m), { secret: false, revealed: true, dice: m.dice ? Object.assign({}, m.dice, { secret: false }) : m.dice }));
    if (!msgs.length) return;
    App.dispatch('chat.reveal', { msgs });
    const main = msgs.find(m => m.id === id);
    if (main && main.dice && main.dice.kind === 'san' && main.from?.charId) {
      const c = S.chars[main.from.charId];
      if (c) { const st = CoC.getStatus(c, 'SAN'); App.dispatch('char.stat', { id: c.id, label: 'SAN', value: st ? st.value : undefined, madness: c.madness || null, clearSecret: true }); const fx = { t: 'san', charId: c.id, by: main.from.pid, name: c.name, loss: main.dice.loss, madness: c.madness || null }; FX.send(fx); }
    }
    this.sys(`GMがシークレットダイスを公開しました`, main ? main.tab : 'main');
  },
  renderTabs() {
    U.$$('#ctabs button').forEach(b => { const t = b.dataset.t; b.classList.toggle('on', t === L.chatTab); b.setAttribute('aria-selected', String(t === L.chatTab)); const bd = b.querySelector('.badge'); const n = L.unread[t] || 0; bd.textContent = n > 99 ? '99+' : String(n); bd.classList.toggle('hidden', !n); });
  },
  renderAll() {
    if (!App.S) return; this.renderTabs();
    const log = U.$('#chatLog'); const msgs = App.S.chat.filter(m => m.tab === L.chatTab);
    const show = msgs.slice(-400);
    log.innerHTML = (msgs.length > show.length ? `<div class="small muted" style="text-align:center;padding:6px">（古い ${msgs.length - show.length} 件はログ出力で確認できます）</div>` : '') + show.map(m => this.html(m)).join('') || '<div class="empty" style="margin-top:20px">まだ発言がありません</div>';
    this.scrollBottom();
  },
  scrollBottom() { const log = U.$('#chatLog'); log.scrollTop = log.scrollHeight; },
  refreshAvatars: U.debounce(() => { if (App.S) Chat.renderAll(); }, 300),
  onChat(msg, remote) {
    const log = U.$('#chatLog');
    if (msg.tab === L.chatTab) {
      const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80 || !remote;
      const emp = log.querySelector('.empty'); if (emp) emp.remove();
      log.insertAdjacentHTML('beforeend', this.html(msg));
      if (atBottom) this.scrollBottom();
    }
    const chatVisible = !UI.isMobile() || U.$('#app').dataset.m === 'chat';
    if (msg.tab !== L.chatTab || !chatVisible) { L.unread[msg.tab] = (L.unread[msg.tab] || 0) + 1; this.renderTabs(); }
    // 演出
    const hidden = msg.secret && !App.canSeeSecret(msg);
    if (msg.dice && msg.dice.ok && !hidden) DiceFx.show(msg);
    if (!msg.secret && !msg.sys) Board.noteSpeaker(msg);
    if (!msg.secret && !msg.sys && !msg.dice && msg.tab === 'main' && (App.prefs.novel || App.S.room.settings.novel)) Overlay.novelQueued(msg.from?.name || '', msg.text, 28, Math.min(5000, 1500 + msg.text.length * 40));
    if (!msg.secret && !msg.sys && !msg.dice) KwFx.check(msg);
    if (App.bcast && !msg.secret && msg.tab === 'main' && msg.from?.charId) Board.focusChar(msg.from.charId);
    if (App.bcast) Broadcast.sub(msg);
  },
  avatar(m) {
    const ch = m.from?.charId ? App.S.chars[m.from.charId] : null;
    return Icon.html(ch ? Icon.urls(ch) : [], m.from?.name || '・', m.from?.color, 'av');
  },
  diceHtml(d) {
    if (!d || !d.ok) return '';
    const parts = String(d.text).split('\n').map(line => {
      const esc = U.esc(line).replace(/＞ (\d+)(?= ＞|$)/g, '＞ <span class="big">$1</span>').replace(/(決定的成功|致命的失敗|スペシャル|成功|失敗)$/, (w) => { const k = { '決定的成功': 'crit', '致命的失敗': 'fumble', 'スペシャル': 'crit', '成功': 'success', '失敗': 'fail' }[w]; return `<span class="out ${k}">${w}</span>`; });

  },
  html(m) {
    if (m.sys) {
      if (m.secret && !App.canSeeSecret(m)) return `<div class="msg sys secretHidden" data-mid="${U.esc(m.id)}"><div class="bd"><div class="tx">（シークレット）</div></div></div>`;
      return `<div class="msg sys" data-mid="${U.esc(m.id)}"><div class="bd"><div class="tx">${U.esc(m.text)}</div></div></div>`;
    }
    const name = m.from?.name || '?'; const col = m.from?.color || 'var(--ink)';
    const hidden = m.secret && !App.canSeeSecret(m);
    let body;
    if (hidden) body = `<div class="dres">シークレットダイス</div>`;
    else if (m.dice) { const lines = String(m.text).split('\n'); body = `<div class="tx">${U.esc(lines[0])}${m.secret ? ' <span class="tag gmsecret" style="color:var(--secret)">シークレット</span>' : ''}</div>${this.diceHtml(m.dice)}${lines.length > 1 ? `<div class="tx">${U.esc(lines.slice(1).join('\n'))}</div>` : ''}`; }
    else body = `<div class="tx">${U.esc(m.text)}</div>`;
    if (m.secret && !hidden && App.isGM() && !App.bcast && !m.rel && m.dice) { const lines = String(m.text).split('\n'); body = `<div class="tx">${U.esc(lines[0])} <span class="tag" style="color:var(--secret)">シークレット</span> <button type="button" class="btn xs" data-act="revealMsg" data-id="${U.esc(m.id)}">全員に公開</button></div>${this.diceHtml(m.dice)}`; }

    return `<div class="msg${hidden ? ' secretHidden' : ''}${m.secret && !hidden ? ' gmsecret' : ''}" data-mid="${U.esc(m.id)}">${this.avatar(m)}<div class="bd"><div class="hd"><span class="nm" style="color:${U.esc(col)}">${U.esc(name)}</span>${face}<span class="tm">${U.clock(m.ts)}</span></div>${body}</div></div>`;
  },
};

// 参加者一覧（pid基準）
function participants() {
  const m = new Map([[App.me.pid, { pid: App.me.pid, name: App.me.name, role: App.me.role, me: true }]]);
  for (const p of Sync.peers.values()) if (!p.bcast) m.set(p.pid, { pid: p.pid, name: p.name, role: p.role });

  /* ---------- 素材 ---------- */
  assets() {
    const f = L.assetFilter; const all = Object.values(App.S.assets).sort((a, b) => (b.ts || 0) - (a.ts || 0));
    const list = all.filter(a => (f === 'all' || a.tag === f) && (App.isGM() || !['handout', 'cutin'].includes(a.tag) || a.by === App.me.pid));
    const chip = (k, l) => `<button type="button" class="${f === k ? 'on' : ''}" data-act="afilter" data-f="${k}">${l}</button>`;
    const item = (a) => {
      const u = a.kind === 'image' ? Assets.url(a.id) : ''; const isBgm = App.S.bgm.id === a.id;
      const acts = [];
      if (a.kind === 'image' && App.isGM()) { if (a.tag === 'bg') acts.push(`<button class="btn xs" type="button" data-act="useBg" data-id="${E(a.id)}">背景に</button>`); if (a.tag === 'fg') acts.push(`<button class="btn xs" type="button" data-act="useFg" data-id="${E(a.id)}">前景に</button>`); if (a.tag === 'cutin') acts.push(`<button class="btn xs" type="button" data-act="useCutin" data-id="${E(a.id)}">カットイン</button>`); }
      if (a.kind === 'audio') { acts.push(`<button class="btn xs" type="button" data-act="preview" data-id="${E(a.id)}" title="自分だけ試聴">試聴</button>`); if (App.isGM()) acts.push(a.tag === 'se' ? `<button class="btn xs" type="button" data-act="playSe" data-id="${E(a.id)}">全員に鳴らす</button>` : `<button class="btn xs ${isBgm ? 'on' : ''}" type="button" data-act="playBgm" data-id="${E(a.id)}">${isBgm ? 'BGM再生中' : 'BGM再生'}</button>`); }
      if (App.isGM() || a.by === App.me.pid) acts.push(`<button class="btn xs ghost" type="button" data-act="delAsset" data-id="${E(a.id)}" aria-label="削除">${U.icon('trash')}</button>`);
      return `<div class="aitem"><div class="th" style="${u ? `background-image:url('${E(u)}')` : ''}">${a.kind === 'audio' ? U.icon('music') : (u ? '' : '<span class="tiny">読込中…</span>')}</div><div class="meta"><span class="n" title="${E(a.name)}">${E(a.name)}</span>
        <select data-bind="asset:${E(a.id)}:tag" style="min-height:24px;padding:1px 4px;font-size:11px" aria-label="種別"${App.isGM() || a.by === App.me.pid ? '' : ' disabled'}>${Object.entries(TAGS).filter(([k]) => (a.kind === 'audio') === (k === 'bgm' || k === 'se')).map(([k, l]) => `<option value="${k}"${a.tag === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
        <div class="acts">${acts.join('')}</div></div></div>`;
    };
    return `<div class="pscroll">
      <h2 class="ph">素材ライブラリ</h2>
      <div class="row nw" style="margin-bottom:6px"><span class="small muted">追加する種別</span><select id="upTag" class="grow" data-bind="ui:uploadTag" aria-label="追加する種別">${Object.entries(TAGS).map(([k, l]) => `<option value="${k}"${L.uploadTag === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="drop" id="assetDrop" data-act="pickFiles" role="button" tabindex="0">${U.icon('upload')}<br>画像・音源をドロップ / クリックして選択<br><span class="tiny">画像は自動で縮小（背景1920px・駒384px）。音源は20MBまで。</span></div>
      <div class="chips" style="margin-top:10px">${chip('all', 'すべて')}${Object.entries(TAGS).map(([k, l]) => chip(k, l)).join('')}</div>
      ${Caps.inArtifact ? `<p class="tiny muted">${Caps.assets ? 'Artifact素材ストレージに保存し、全員に共有します。' : Caps.ready ? 'このビューでは素材アップロード権限がありません（データは接続中の参加者に直接送信）。' : 'ケイパビリティを確認中…'}</p>` : ''}
      ${list.length ? `<div class="agrid">${list.map(item).join('')}</div>` : '<div class="empty">素材がありません</div>'}

  },
  after_assets(el) { const d = el.querySelector('#assetDrop'); if (d) Drop.bind(d, (files) => Drop.files(files, L.uploadTag)); },

  /* ---------- シーン ---------- */
  scenes() {
    const S = App.S; const gm = App.isGM(); const s = S.room.settings;
    const sel = S.scenes.find(x => x.id === L.sceneEdit);
    const list = S.scenes.map((sc, i) => { const u = sc.bg ? Assets.url(sc.bg) : ''; return `<div class="scene${S.view.sceneId === sc.id ? ' on' : ''}"><div class="th" style="${u ? `background-image:url('${E(u)}')` : ''}"></div><div class="grow" style="min-width:0"><div style="font-family:var(--font-serif);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(sc.name)}</div><div class="tiny muted">${sc.bgm ? '♪ ' + E(S.assets[sc.bgm]?.name || '') : 'BGMなし'}</div></div>${gm ? `<div class="col" style="gap:3px"><button class="btn xs pri" type="button" data-act="sceneGo" data-id="${E(sc.id)}">切替</button><div class="row nw" style="gap:2px"><button class="btn xs ghost" type="button" data-act="sceneMove" data-id="${E(sc.id)}" data-d="-1" aria-label="上へ"${i === 0 ? ' disabled' : ''}>${U.icon('up')}</button><button class="btn xs ghost" type="button" data-act="sceneMove" data-id="${E(sc.id)}" data-d="1" aria-label="下へ"${i === S.scenes.length - 1 ? ' disabled' : ''}>${U.icon('down')}</button><button class="btn xs ghost" type="button" data-act="sceneEdit" data-id="${E(sc.id)}" aria-label="編集">${U.icon('edit')}</button></div></div>` : ''}</div>`; }).join('');

      const B = (k) => `data-bind="scene:${E(sel.id)}:${k}" data-fk="s:${k}"`;
      ed = `<div class="card" style="margin-top:10px"><h3 class="sh" style="margin-top:0">シーン編集</h3>
        <label class="field"><span>名前</span><input type="text" value="${E(sel.name)}" ${B('name')}></label>
        <label class="field"><span>背景</span><select ${B('bg')}>${assetOptions('image', sel.bg, ['bg'])}</select></label>
        <div class="row nw"><label class="field grow"><span>前景</span><select ${B('fg')}>${assetOptions('image', sel.fg, ['fg'])}</select></label><label class="field" style="width:96px"><span>不透明度</span><input type="number" min="0" max="1" step="0.05" value="${sel.fgOpacity ?? .6}" ${B('fgOpacity')} data-type="num"></label></div>
        <label class="field"><span>BGM</span><select ${B('bgm')}>${assetOptions('audio', sel.bgm, ['bgm'])}</select></label>
        <div class="small muted">演出：${Object.entries(sel.fx || {}).filter(([k, v]) => v && v !== 'none').map(([k, v]) => `${Seq.FXNAME[k] || k}${typeof v === 'number' ? ' ' + Math.round(v * 100) + '%' : v === true ? '' : ' ' + (Seq.FXNAME[v] || v)}`).join('、') || 'なし'}</div>

    }
    return `<div class="pscroll">
      <h2 class="ph">シーン</h2>
      <p class="small muted" style="margin-top:0">シーン切替で背景・前景・BGM・環境演出を一括で全員に反映します。</p>
      ${gm ? `<div class="row" style="margin-bottom:10px"><button class="btn sm" type="button" data-act="sceneNew">${U.icon('plus')}現在の状態から新規シーン</button></div>` : ''}
      ${list || '<div class="empty">シーンがありません</div>'}
      ${ed}
      ${gm ? `<h3 class="sh">盤面設定</h3>

    </div>`;
  },

  fx() {
    const S = App.S, f = S.fx, gm = App.isGM(), p = App.prefs;

    const sel = S.seqs.find(q => q.id === L.seqSel);

      html += `<h3 class="sh" style="margin-top:0">環境エフェクト（全員）</h3>
      <div class="fxgrid">${['rain', 'fog', 'noise', 'blood', 'glitch', 'heartbeat'].map(k => `<div class="fxk">${slider('fx:' + k, f[k], Seq.FXNAME[k])}</div>`).join('')}</div>

      <label class="chk"><input type="checkbox" ${p.novel ? 'checked' : ''} data-bind="pref:novel">ノベル表示（キャラ発言をメッセージウィンドウで表示）</label>
      <label class="chk"><input type="checkbox" ${p.stand !== false ? 'checked' : ''} data-bind="pref:stand">立ち絵を表示</label></div>`;

      <label class="field"><span>SAN演出の対象</span><select data-bind="set:sanFxScope"><option value="self"${S.room.settings.sanFxScope === 'self' ? ' selected' : ''}>本人の画面のみ（+配信画面）</option><option value="all"${S.room.settings.sanFxScope === 'all' ? ' selected' : ''}>全員の画面</option></select></label>
      <label class="chk"><input type="checkbox" ${S.room.settings.novel ? 'checked' : ''} data-bind="set:novel">ノベルモードを全員に強制</label>`;

  },
  seqEditor(q) {
    const B = (i, k) => `data-bind="step:${E(q.id)}:${i}:${k}" data-fk="st:${i}:${k}"`;
    const field = (st, i, [k, type, label, def]) => {
      const v = st[k] ?? def ?? '';
      if (type === 'number') return `<label class="field" style="margin:0"><span class="tiny">${label}</span><input type="number" step="any" value="${E(v)}" ${B(i, k)} data-type="num"></label>`;
      if (type === 'text') return `<label class="field" style="margin:0"><span class="tiny">${label}</span><input type="text" value="${E(v)}" ${B(i, k)}></label>`;
      if (type === 'textarea') return `<label class="field" style="margin:0;grid-column:1/-1"><span class="tiny">${label}</span><textarea rows="2" ${B(i, k)}>${E(v)}</textarea></label>`;
      if (type === 'bool') return `<label class="chk" style="margin-top:14px"><input type="checkbox" ${v === true || v === 'true' ? 'checked' : ''} ${B(i, k)}>${label}</label>`;
      if (type === 'color') return `<label class="field" style="margin:0"><span class="tiny">${label}</span><input type="color" value="${E(v)}" ${B(i, k)} style="height:28px;padding:1px"></label>`;
      if (type.startsWith('asset:')) { const kind = type.slice(6); const id = App.resolveAsset(v); return `<label class="field" style="margin:0"><span class="tiny">${label}</span><select ${B(i, k)}>${assetOptions(kind, id, null)}</select></label>`; }
      if (type === 'scene') return `<label class="field" style="margin:0"><span class="tiny">${label}</span><select ${B(i, k)}>${App.S.scenes.map(s => `<option value="${E(s.id)}"${s.id === v ? ' selected' : ''}>${E(s.name)}</option>`).join('')}</select></label>`;
      if (type.startsWith('select:')) return `<label class="field" style="margin:0"><span class="tiny">${label}</span><select ${B(i, k)}>${type.slice(7).split(',').map(o => `<option value="${o}"${o === v ? ' selected' : ''}>${Seq.FXNAME[o] || o}</option>`).join('')}</select></label>`;
      return '';
    };
    return `<div class="card" style="margin-top:10px">
      <div class="row nw"><input type="text" value="${E(q.name)}" data-bind="seq:${E(q.id)}:name" data-fk="q:name" class="grow" aria-label="シーケンス名"><button class="btn xs ghost" type="button" data-act="seqClose">閉じる</button></div>
      <div style="margin-top:8px">${q.steps.map((st, i) => { const T = Seq.STEP_TYPES[st.t]; return `<div class="step${Seq.playingId === q.id && Seq.step === i ? ' playing' : ''}" data-seq="${E(q.id)}" data-stepi="${i}"><div class="sh2"><span class="no">${i + 1}</span><span class="ty">${E(T ? T.label : st.t)}</span><button class="btn xs ghost" type="button" data-act="stepMove" data-id="${E(q.id)}" data-i="${i}" data-d="-1" aria-label="上へ"${i ? '' : ' disabled'}>${U.icon('up')}</button><button class="btn xs ghost" type="button" data-act="stepMove" data-id="${E(q.id)}" data-i="${i}" data-d="1" aria-label="下へ"${i < q.steps.length - 1 ? '' : ' disabled'}>${U.icon('down')}</button><button class="btn xs ghost" type="button" data-act="stepDel" data-id="${E(q.id)}" data-i="${i}" aria-label="削除">${U.icon('x')}</button></div>${T ? `<div class="g2">${T.f.map(fd => field(st, i, fd)).join('')}</div>` : ''}</div>`; }).join('') || '<div class="empty">ステップがありません</div>'}</div>
      <div class="row nw" style="margin-top:6px"><select id="stepType" class="grow" aria-label="追加するステップ">${Object.entries(Seq.STEP_TYPES).map(([k, t]) => `<option value="${k}">${t.label}</option>`).join('')}</select><button class="btn sm" type="button" data-act="stepAdd" data-id="${E(q.id)}">${U.icon('plus')}追加</button></div>
      <div class="row" style="margin-top:8px"><button class="btn pri sm" type="button" data-act="seqPlay" data-id="${E(q.id)}">${U.icon('play')}全員に再生</button><button class="btn sm" type="button" data-act="seqPreview" data-id="${E(q.id)}">自分だけ確認</button><span class="grow"></span><button class="btn xs" type="button" data-act="seqDup" data-id="${E(q.id)}">複製</button><button class="btn xs danger" type="button" data-act="seqDel" data-id="${E(q.id)}">削除</button></div>
    </div>`;
  },

  /* ---------- ハンドアウト ---------- */
  handouts() {
    const S = App.S, gm = App.isGM();
    const vis = S.handouts.filter(h => gm || (App.visibleHandout(h) && h.revealed));
    const ed = gm && S.handouts.find(h => h.id === L.hoEdit);
    const pl = participants().filter(p => p.role !== 'GM' && p.role !== 'VIEW');
    const toLabel = (h) => [...(Array.isArray(h.to) ? h.to : []).map(pname), ...(h.toChars || []).map(cid => (App.S.chars[cid]?.name || '?') + 'の担当者')].join('、') || '未指定';
    let html = `<div class="pscroll"><h2 class="ph">ハンドアウト</h2>`;
    if (gm) html += `<div class="row" style="margin-bottom:10px"><button class="btn sm" type="button" data-act="hoNew">${U.icon('plus')}新規ハンドアウト</button></div>`;
    html += vis.length ? vis.map(h => {
      const secret = h.to !== 'all';
      return `<div class="preset ${secret ? 'gmsecret' : ''}"><div class="grow" style="min-width:0"><div class="n">${E(h.title)}</div><div class="d">${secret ? '秘匿：' + E(gm ? toLabel(h) : 'あなた宛て') : '全体公開'}${gm ? (h.revealed ? '・配布済み' : '・未配布') : ''}</div></div>
      <button class="btn xs" type="button" data-act="hoView" data-id="${E(h.id)}">見る</button>
      ${gm ? `<button class="btn xs pri" type="button" data-act="hoReveal" data-id="${E(h.id)}">公開演出で配布</button><button class="btn xs ghost" type="button" data-act="hoEdit" data-id="${E(h.id)}" aria-label="編集">${U.icon('edit')}</button>` : ''}</div>`;
    }).join('') : '<div class="empty">公開されたハンドアウトはありません</div>';
    if (ed) {
      const B = (k) => `data-bind="ho:${E(ed.id)}:${k}" data-fk="h:${k}"`;
      const isAll = ed.to === 'all'; const tos = Array.isArray(ed.to) ? ed.to : []; const tcs = ed.toChars || [];
      html += `<div class="card" style="margin-top:10px"><h3 class="sh" style="margin-top:0">ハンドアウト編集</h3>
        <label class="field"><span>タイトル</span><input type="text" value="${E(ed.title)}" ${B('title')}></label>
        <label class="field"><span>本文</span><textarea rows="6" ${B('body')}>${E(ed.body)}</textarea></label>
        <label class="field"><span>画像</span><select ${B('image')}>${assetOptions('image', ed.image, ['handout'])}</select></label>
        <div class="field"><span>公開先</span><div class="col" style="gap:4px"><label class="chk"><input type="radio" name="hoTo" ${isAll ? 'checked' : ''} data-act="hoToAll" data-id="${E(ed.id)}">全体公開</label>
        <div class="small muted">個別（秘匿HO）— 参加者：</div>${pl.map(p => `<label class="chk"><input type="checkbox" ${!isAll && tos.includes(p.pid) ? 'checked' : ''} data-act="hoToggle" data-id="${E(ed.id)}" data-pid="${E(p.pid)}">${E(p.name)}</label>`).join('') || '<div class="tiny muted">PLが参加すると表示されます</div>'}
        <div class="small muted">— キャラクターの担当者（後から参加しても届きます）：</div>${App.S.order.map(id => App.S.chars[id]).filter(c => c && !c.npc).map(c => `<label class="chk"><input type="checkbox" ${!isAll && tcs.includes(c.id) ? 'checked' : ''} data-act="hoToggle" data-id="${E(ed.id)}" data-cid="${E(c.id)}">${E(c.name)}</label>`).join('')}</div></div>
        <div class="row"><button class="btn xs" type="button" data-act="hoClose">閉じる</button><span class="grow"></span><button class="btn xs danger" type="button" data-act="hoDel" data-id="${E(ed.id)}">削除</button></div></div>`;
    }
    return html + '</div>';
  },

  /* ---------- ルーム ---------- */
  room() {

    const st = Sync.status();
    const tr = Sync.transports.map(t => `<div class="peer"><span class="pill ${t.status() === 'ok' ? 'ok' : t.status() === 'wait' ? 'warn' : 'bad'}"><span class="dot"></span>${E(t.label)}</span><span class="tiny muted">${t.name === 'p2p' ? (t.mode === 'host' ? 'ホスト' : t.mode === 'client' ? 'クライアント' : t.mode === 'failed' ? '失敗: ' + E(t.err) : '接続中…') + (t.peerCount ? `・接続${t.peerCount()}` : '') : t.status() === 'ok' ? '有効' : '待機'}</span></div>`).join('');
    const peers = [{ pid: App.me.pid, name: App.me.name + '（あなた）', role: App.me.role }, ...[...Sync.peers.values()].filter(x => !x.bcast)].map(x => `<div class="peer"><span class="rl ${E(x.role)}">${x.role === 'GM' ? 'GM' : x.role === 'VIEW' ? '見学' : 'PL'}</span><span class="grow">${E(x.name)}</span></div>`).join('');

    const mk = S.markers.slice().sort((a, b) => a.t - b.t);
    return `<div class="pscroll">
      <h2 class="ph">ルーム</h2>
      <div class="card">
        ${gm ? `<label class="field"><span>ルーム名</span><input type="text" value="${E(S.room.name)}" data-bind="room:name" data-fk="rn"></label>` : `<div style="font-family:var(--font-serif);font-size:16px">${E(S.room.name)}</div>`}
        <div class="row small"><span class="muted">ルームID</span><span class="kbd" style="font-size:13px">${E(App.roomId)}</span><span class="grow"></span><button class="btn xs" type="button" data-act="copyInvite">${U.icon('copy')}招待リンク</button></div>
      </div>
      <h3 class="sh">接続（${E(st.text)}）</h3>
      <div class="peers">${tr}</div>
      ${!Sync.transports.some(t => t.name === 'p2p') && !Caps.inArtifact ? `<button class="btn xs" type="button" data-act="p2pOn" style="margin-top:6px">インターネット越しP2P接続を開始（PeerJS）</button>` : ''}
      ${Caps.inArtifact ? `<p class="tiny muted">claude.ai Artifact内で実行中：${Caps.ready ? (Caps.room ? 'ルーム同期 有効' : 'ルーム同期 なし') + ' / ' + (Caps.db ? '保存 有効' : '保存 なし') + ' / ' + (Caps.assets ? '素材 有効' : '素材 なし') : 'ケイパビリティ確認中…'}</p>` : '<p class="tiny muted">同一ブラウザの別タブは自動で同期します。別端末とはP2P（https配信時は自動）で同期します。</p>'}
      <h3 class="sh">参加者</h3><div class="peers">${peers}</div>${bc ? `<div class="tiny muted" style="margin-top:4px">配信画面 ${bc} 件接続中</div>` : ''}
      <h3 class="sh">あなた</h3>
      <div class="row nw"><input type="text" id="meName" value="${E(App.me.name)}" class="grow" aria-label="名前" data-fk="me"><select id="meRole" style="width:96px" aria-label="役割"><option value="GM"${App.me.role === 'GM' ? ' selected' : ''}>GM</option><option value="PL"${App.me.role === 'PL' ? ' selected' : ''}>PL</option><option value="VIEW"${App.me.role === 'VIEW' ? ' selected' : ''}>見学</option></select><button class="btn sm" type="button" data-act="meSave">変更</button></div>
      <h3 class="sh">セッションタイマー・休憩</h3>
      <div class="row"><span class="kbd" style="font-size:15px" id="roomTimer">${U.fmtTime(App.elapsed())}</span>${gm ? `<button class="btn xs" type="button" data-act="timer" data-v="${S.timer.running ? 'pause' : 'start'}">${S.timer.running ? '一時停止' : '開始'}</button><button class="btn xs ghost" type="button" data-act="timer" data-v="reset">リセット</button>` : ''}</div>
      ${gm ? `<div class="row nw" style="margin-top:8px"><input type="text" id="brkMsg" placeholder="休憩メッセージ" class="grow" value="${E(S.brk.msg || '')}" data-fk="bm"><input type="number" id="brkMin" value="10" min="0" style="width:64px" aria-label="分"><span class="small">分</span><button class="btn xs ${S.brk.on ? 'on' : ''}" type="button" data-act="brk">${S.brk.on ? '休憩終了' : '休憩開始'}</button></div>` : ''}
      <h3 class="sh">見どころマーカー</h3>
      <div class="markers"><ul>${mk.map(m => `<li><span>${U.fmtTime(m.t)}</span><span class="grow" style="font-family:var(--font-ui)">${E(m.label)}${m.auto ? ' <span class="tag">自動</span>' : ''}</span>${gm ? `<button class="btn xs ghost" type="button" data-act="mkDel" data-id="${E(m.id)}" aria-label="削除">${U.icon('x')}</button>` : ''}</li>`).join('') || '<li class="muted">まだありません（M キーで記録）</li>'}</ul></div>
      <div class="row" style="margin-top:6px"><button class="btn xs" type="button" data-act="mkAdd">${U.icon('star')}記録</button><button class="btn xs" type="button" data-act="mkCopy">${U.icon('copy')}タイムスタンプをコピー</button>${gm ? '<button class="btn xs ghost" type="button" data-act="mkClear">全消去</button>' : ''}</div>
      <p class="tiny muted">タイマー開始からの経過時間で記録。クリティカル・ファンブル・SAN減少は自動で記録されます。</p>
      <h3 class="sh">配信</h3>

      <p class="tiny muted">配信画面にはシークレットダイス・秘匿ハンドアウト・GMメモは一切表示されません。配信セーフ表示をONにすると、自分の画面でも秘匿情報を隠します（画面共有時用）。</p>
      <h3 class="sh">サウンド（自分の音量）</h3>
      ${Snd.unlocked ? '' : `<button class="btn sm brass" type="button" data-act="unlockAudio" style="margin-bottom:8px">${U.icon('vol')}音声を有効化</button>`}
      ${slider('pref:master', p.master, 'マスター', true)}${slider('pref:bgm', p.bgm, 'BGM', true)}${slider('pref:se', p.se, '効果音', true)}
      ${gm ? `<h3 class="sh">ダイス設定（CoC6版）</h3>
      <div class="row nw"><label class="field grow"><span>クリティカル上限（1〜）</span><input type="number" min="0" max="20" value="${s.crit}" data-bind="set:crit" data-type="num" data-fk="crit"></label><label class="field grow"><span>ファンブル下限（〜100）</span><input type="number" min="80" max="101" value="${s.fumble}" data-bind="set:fumble" data-type="num" data-fk="fum"></label></div>
      <label class="chk"><input type="checkbox" ${s.special ? 'checked' : ''} data-bind="set:special">スペシャル判定（技能値の1/5以下）</label><br>
      <label class="chk"><input type="checkbox" ${s.sanFumbleMax ? 'checked' : ''} data-bind="set:sanFumbleMax">SANチェックのファンブルで失敗時最大値を減少</label>` : ''}
      <h3 class="sh">データ</h3>
      <div class="row" style="margin-bottom:6px"><button class="btn sm" type="button" data-act="diceHelp">ダイスコマンド一覧</button><button class="btn sm" type="button" data-act="selfTest">自己テスト</button></div>
      <div class="row"><button class="btn sm" type="button" data-act="exportRoom">JSONエクスポート</button><button class="btn sm" type="button" data-act="importRoom"${gm ? '' : ' disabled title="GMのみ"'}>JSONインポート</button><button class="btn sm" type="button" data-act="logModal">ログ出力(HTML)</button></div>
      ${gm ? `<div class="row" style="margin-top:6px"><button class="btn xs danger" type="button" data-act="chatClear">チャットを全消去</button></div>` : ''}
      ${gm && !App.bcast ? `<h3 class="sh">GMメモ（この端末のみ・非共有）</h3><textarea class="memo gmsecret" id="gmMemo" data-fk="gmmemo" placeholder="シナリオメモ。配信画面や他の参加者には送信されません。">${E(App.gmMemo)}</textarea>` : ''}
      <div class="sep"></div>
      <div class="row"><button class="btn sm" type="button" data-act="lobby">${U.icon('door')}ルームを作成・切り替え</button></div>
    </div>`;
  },
  after_room(el) { const m = el.querySelector('#gmMemo'); if (m) m.addEventListener('input', U.debounce(() => { App.gmMemo = m.value; Store.set('kv', 'memo:' + App.roomId, m.value); }, 400)); },
  more() {
    const b = (p, l, ic) => `<button class="btn" type="button" data-act="panel" data-p="${p}" style="justify-content:flex-start;min-height:48px">${U.icon(ic)}${l}</button>`;
    return `<div class="pscroll"><h2 class="ph">メニュー</h2><div class="col">${b('assets', '素材ライブラリ', 'image')}${b('scenes', 'シーン', 'scene')}${b('handouts', 'ハンドアウト', 'doc')}${b('room', 'ルーム・設定・配信', 'gear')}
      <button class="btn" type="button" data-act="bcastModal" style="justify-content:flex-start;min-height:48px">${U.icon('cast')}配信画面</button><button class="btn" type="button" data-act="lobby" style="justify-content:flex-start;min-height:48px">${U.icon('door')}ルーム作成・参加</button></div></div>`;
  },

  /* ---------- モーダル類 ---------- */

    const httpsP2P = location.protocol === 'https:' && !Caps.inArtifact && !/^(localhost|127\.)/.test(location.hostname);
    const rid = U.uid(6);
    Modal.open({
      title: 'ルーム作成・参加', cls: 'wide',

        <div class="card"><h4>新しいルームを作る</h4>
          <label class="field"><span>ルーム名</span><input type="text" id="lbRoomName" value="新しい卓" maxlength="40"></label>

          <label class="field"><span>役割</span><select id="lbJRole"><option value="PL" selected>PL（探索者）</option><option value="GM">GM</option><option value="VIEW">見学</option></select></label>

/* ------------------------------ ファイル出力 ------------------------------ */
const FileOut = {
  async save(filename, text, mime) {
    if (Caps.inArtifact) {
      await Caps.init();
      if (Caps.downloads) { try { await Caps.downloads.save({ filename, data: text }); UI.toast('保存しました'); return; } catch (e) { if (e && e.code === 'declined') return; } }
      const ok = await U.copyText(text); UI.toast(ok ? 'この環境ではファイル保存できないため、クリップボードにコピーしました' : 'コピーに失敗しました', ok ? 'warn' : 'err'); return;
    }
    try { const blob = new Blob([text], { type: mime || 'text/plain' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 8000); UI.toast('ダウンロードしました'); }
    catch (e) { const ok = await U.copyText(text); UI.toast(ok ? 'クリップボードにコピーしました' : '保存に失敗しました', ok ? '' : 'err'); }
  },
  async exportRoom() {
    UI.toast('エクスポートを準備中…');
    const blobs = {};
    for (const id of Object.keys(App.S.assets)) { const m = App.S.assets[id]; if (m.gen) continue; const du = await Assets.dataUrl(id); if (du) blobs[id] = du; }
    const out = { app: 'shinentaku', version: 1, exportedAt: new Date().toISOString(), roomId: App.roomId, state: App.S, blobs };
    await this.save(`room_${App.roomId}_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(out), 'application/json');
  },
  importRoom() {
    Modal.open({ title: 'ルームJSONをインポート', body: `<p class="small" style="margin-top:0">エクスポートしたJSON（画像・音源込み）を読み込み、現在のルームを置き換えて全員に配信します。</p><div class="drop" id="imDrop" data-act="noop">${U.icon('upload')}<br>JSONファイルをドロップ / クリックして選択</div><label class="field" style="margin-top:10px"><span>またはJSONを貼り付け</span><textarea id="imText" rows="5" style="font-family:var(--font-mono);font-size:11px"></textarea></label>`, foot: `<button class="btn" type="button" data-act="modalClose">キャンセル</button><button class="btn pri" type="button" id="imGo">読み込む</button>`, onMount: (m) => {
      const ta = m.querySelector('#imText'); const d = m.querySelector('#imDrop');
      Drop.bind(d, async (files) => { if (files[0]) ta.value = await files[0].text(); UI.toast('ファイルを読み込みました。「読み込む」を押してください'); });
      d.onclick = () => Drop.pick('.json,application/json', false, async (files) => { if (files[0]) ta.value = await files[0].text(); });
      m.querySelector('#imGo').onclick = async () => { try { await FileOut.applyImport(ta.value); Modal.close(); } catch (e) { UI.toast('読み込めません: ' + e.message, 'err'); } };
    } });
  },
  async applyImport(text) {
    const o = JSON.parse(text); if (!o || o.app !== 'shinentaku' || !o.state || !o.state.room) throw new Error('深淵卓のエクスポート形式ではありません');
    const ok = await Modal.confirm(`ルーム「${o.state.room.name}」を読み込み、現在のルーム内容を置き換えます。よろしいですか？`, { ok: '置き換える', danger: true }); if (!ok) return;
    for (const [id, du] of Object.entries(o.blobs || {})) { const b = U.dataUrlToBlob(du); if (b) await Assets.put(id, b); }
    const st = State.migrate(o.state); st.room.id = App.roomId;
    App.S = st; App.persist(); UI.fullRender();
    for (const p of Sync.peers.values()) Sync.send({ k: 'push', to: p.pid, state: State.viewFor(st, p.pid, p.role), role: App.me.role });
    for (const id of Object.keys(o.blobs || {})) Assets.push(id);
    UI.toast('インポートして全員に配信しました');
  },
};

/* ------------------------------ ドラッグ&ドロップ / ファイル選択 ------------------------------ */
const Drop = {
  bind(el, onFiles, onText) {
    el.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', (e) => { e.preventDefault(); e.stopPropagation(); el.classList.remove('over'); const fs = [...(e.dataTransfer?.files || [])]; if (fs.length) onFiles(fs); else if (onText) { const t = e.dataTransfer.getData('text/plain'); if (t) onText(t); } });
  },
  pick(accept, multiple, cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = !!multiple; i.style.display = 'none'; document.body.appendChild(i); i.onchange = () => { cb([...i.files]); i.remove(); }; i.click(); setTimeout(() => { if (document.body.contains(i) && !i.files.length) { /* keep until change */ } }, 0); },
  isAudio(f) { return /^audio\//.test(f.type) || /\.(mp3|ogg|wav|m4a|aac|flac|opus|webm)$/i.test(f.name); },
  async files(files, tag) {
    let n = 0; const audios = []; const bad = [];
    for (const f of files) {
      if (/\.json$|^application\/json/.test(f.name + ' ' + f.type) || /^text\//.test(f.type) || /\.txt$/i.test(f.name)) { const t = await f.text(); this.text(t, f.name); continue; }
      if (this.isAudio(f)) { audios.push(f); continue; }
      if (!/^image\/(png|jpe?g|gif|webp|svg\+xml|bmp|avif)$/.test(f.type)) { bad.push(f.name); continue; }
      let tg = tag; if (['bgm', 'se'].includes(tg)) tg = 'bg';
      try { const m = await Assets.addFile(f, tg); if (m) n++; } catch (e) { UI.toast(`${f.name}: ${e.message}`, 'err'); }
    }
    if (bad.length) UI.toast(`未対応のファイル形式です：${bad.join('、')}（画像：PNG/JPEG/GIF/WebP、音源：MP3/OGG/WAV/M4A、テキスト：JSON/TXT）`, 'err');
    if (n) UI.toast(`${n}件の素材を追加しました`);
    if (audios.length) Panels.audioTagModal(audios, ['bgm', 'se'].includes(tag) ? tag : null);
  },
  text(t, fname) {
    const s = String(t || '').trim(); if (!s) { if (fname) UI.toast(`${fname} は空のファイルです`, 'err'); return; }
    if (/"app"\s*:\s*"shinentaku"/.test(s.slice(0, 200))) { if (App.isGM()) FileOut.applyImport(s).catch(e => UI.toast(e.message, 'err')); else UI.toast('ルームのインポートはGMのみ可能です', 'warn'); return; }
    if (/"kind"\s*:\s*"character"/.test(s) || /キャラクター名|STR\s+CON\s+POW|《.+》\s*\d+/.test(s)) { Panels.importModal(s); return; }
    if (fname) UI.toast(`${fname}：キャラクターデータ（いあきゃら駒JSON／テキスト）またはルームJSONとして認識できませんでした`, 'err');
  },
};

/* ------------------------------ QR（配信画面URL用・cdnjs の qrcodejs を遅延読込） ------------------------------ */
const QR = {
  p: null,
  load() { if (window.QRCode) return Promise.resolve(true); if (this.p) return this.p; this.p = new Promise(res => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload = () => res(!!window.QRCode); sc.onerror = () => res(false); document.head.appendChild(sc); setTimeout(() => res(!!window.QRCode), 8000); }); return this.p; },
  async render(el, text) { if (!el) return; const ok = await this.load(); if (!ok) { el.style.display = 'none'; return; } el.innerHTML = ''; try { new window.QRCode(el, { text, width: 148, height: 148, correctLevel: window.QRCode.CorrectLevel.L }); el.title = 'スマホやタブレットの配信アプリで読み取れます'; } catch (e) { el.style.display = 'none'; } },
};

/* ------------------------------ Bind（入力→アクション） ------------------------------ */
const Bind = {
  val(el) { if (el.type === 'checkbox') return el.checked; if (el.dataset.type === 'num' || el.type === 'range') { const n = parseFloat(el.value); return isNaN(n) ? 0 : n; } return el.value; },
  setPath(obj, parts, v) { let o = obj; for (let i = 0; i < parts.length - 1; i++) { const k = parts[i]; if (o[k] == null) o[k] = {}; o = o[k]; } o[parts[parts.length - 1]] = v; },
  apply(el) {
    const b = el.dataset.bind; const i0 = b.indexOf(':'); const kind = b.slice(0, i0); const rest = b.slice(i0 + 1).split(':'); const v = this.val(el); const S = App.S; if (!S) return;
    switch (kind) {
      case 'char': {
        const [id, path] = rest; const c = S.chars[id]; if (!c || !App.canEditChar(c)) return;
        let patch;
        if (path.startsWith('params.')) { const k = path.slice(7); const params = U.clone(c.params || []); const p = params.find(x => x.label === k); if (p) p.value = String(v); else params.push({ label: k, value: String(v) }); patch = { params }; }
        else { const parts = path.split('.'); const top = parts[0]; const val = (top === 'icon' && !v) ? null : v; if (parts.length === 1) patch = { [top]: val }; else { const obj = U.clone(c[top] ?? (/^\d/.test(parts[1]) ? [] : {})); this.setPath(obj, parts.slice(1), (parts[2] === 'asset' && !v) ? null : val); patch = { [top]: obj }; } }
        App.dispatch('char.update', { id, patch });
        if (path === 'name' || path.startsWith('faces') || path === 'commands') { Chat.renderSpeakers(); Chat.renderPalette(); }
        break;
      }
      case 'asset': App.dispatch('asset.update', { id: rest[0], patch: { [rest[1]]: v } }); break;
      case 'scene': App.dispatch('scene.update', { id: rest[0], patch: { [rest[1]]: (['bg', 'fg', 'bgm'].includes(rest[1]) && !v) ? null : v } }); break;
      case 'set': if (App.isGM()) App.dispatch('room.set', { settings: { [rest[0]]: v } }); break;
      case 'room': if (App.isGM()) App.dispatch('room.set', { [rest[0]]: v }); UI.renderTop(); break;
      case 'fx': if (App.isGM()) App.dispatch('fx.set', { [rest[0]]: v }); break;
      case 'bgm': if (!App.isGM()) return; if (rest[0] === 'id') App.dispatch('bgm.set', { id: v || null, fade: 1500, ts: Date.now() }); else App.dispatch('bgm.set', { [rest[0]]: v }); break;
      case 'pref': {
        App.prefs[rest[0]] = v; App.savePrefs();
        if (['master', 'bgm', 'se'].includes(rest[0])) Snd.updateVolumes();
        if (['fx', 'reduce'].includes(rest[0])) FX.applyState();
        if (rest[0] === 'stand') Board.renderStands();
        break;
      }
      case 'seq': App.dispatch('seq.update', { id: rest[0], patch: { [rest[1]]: v } }); break;
      case 'step': {
        const [id, i, k] = rest; const q = S.seqs.find(x => x.id === id); if (!q) return;
        const steps = U.clone(q.steps); if (!steps[+i]) return; steps[+i][k] = (k === 'asset' && !v) ? null : v;
        App.dispatch('seq.update', { id, patch: { steps } }); break;
      }
      case 'ho': App.dispatch('ho.update', { id: rest[0], patch: { [rest[1]]: (rest[1] === 'image' && !v) ? null : v } }); break;
      case 'ui': L[rest[0]] = v; break;
    }
  },
  liveT: null,
  live(el) { const lab = el.closest('label')?.querySelector('.tiny'); if (lab && el.type === 'range') lab.textContent = Math.round(el.value * 100) + '%'; clearTimeout(this.liveT); this.liveT = setTimeout(() => this.apply(el), 90); },
};

  toggleBoard(t) { const c = App.S.chars[t.dataset.id]; if (!App.canEditChar(c)) return; App.dispatch('char.update', { id: c.id, patch: { board: Object.assign({}, c.board, { on: c.board?.on === false }) } }); },
  arrDel(t) { const c = App.S.chars[t.dataset.id]; if (!App.canEditChar(c)) return; const arr = U.clone(c[t.dataset.arr] || []); arr.splice(+t.dataset.i, 1); App.dispatch('char.update', { id: c.id, patch: { [t.dataset.arr]: arr } }); },
  arrAdd(t) { const c = App.S.chars[t.dataset.id]; if (!App.canEditChar(c)) return; const k = t.dataset.arr; const arr = U.clone(c[k] || []); arr.push(k === 'status' ? { label: '新規', value: 0, max: 0 } : k === 'skills' ? { name: '新しい技能', value: 1 } : { label: '表情' + (arr.length + 1), asset: null }); App.dispatch('char.update', { id: c.id, patch: { [k]: arr } }); },
  uploadFor(t) {
    const c = App.S.chars[t.dataset.id]; if (!App.canEditChar(c)) return; const target = t.dataset.target;

      for (const f of files) { const m = await Assets.addFile(f, target === 'icon' ? 'token' : 'stand'); if (!m) continue; if (target === 'icon') App.dispatch('char.update', { id: c.id, patch: { icon: m.id } }); else faces.push({ label: m.name.slice(0, 12) || '表情' + (faces.length + 1), asset: m.id }); }

/* ------------------------------ Broadcast（配信画面） ------------------------------ */
const Broadcast = {
  waitT: null,
  status(kind) {
    const el = U.$('#bcastStatus'); if (!el) return;
    if (kind === 'ok') { el.classList.add('hidden'); return; }
    const p2p = Sync.transports.find(t => t.name === 'p2p');
    const fail = p2p && p2p.mode === 'failed';
    el.classList.remove('hidden');
    el.innerHTML = `<div class="box"><h4>${kind === 'help' ? '配信画面：GMの画面に接続できません' : '配信画面：接続待機中…'}</h4><div class="small muted">ルーム #${U.esc(App.roomId)}（閲覧専用・秘匿情報は表示されません）</div>${kind === 'help' ? `<ol>
      <li>GMの画面で「配信画面」ボタン →「<b>OBS配信接続を有効化</b>」を押してください。</li>
      <li>このURLに <b>&amp;p2p=1</b> が含まれているか確認してください${Sync.p2pWanted ? '（含まれています）' : '（<b>含まれていません</b>）'}。</li>
      <li>${fail ? `P2P接続に失敗しました（${U.esc(p2p.err)}）。社内ネットワーク等でWebRTCが制限されている場合は、GMのPCで「新しいウィンドウで開く」を使いウィンドウキャプチャしてください。` : 'GMと同じブラウザなら別ウィンドウで開くだけで自動接続します。'}</li>
      <li>claude.ai 上のルームはOBSから直接接続できません。GMの画面で「このタブを配信画面にする」を使ってください。</li></ol>` : '<div style="margin-top:10px">GMの画面と同期しています。しばらくお待ちください。</div>'}</div>`;
  },
  watch() { this.status('wait'); clearTimeout(this.waitT); this.waitT = setTimeout(() => { if (!this.ok) this.status('help'); }, 9000); },
  connected() { this.ok = true; clearTimeout(this.waitT); this.status('ok'); },
  setChroma(c) { const col = { green: '#00ff00', blue: '#0000ff', magenta: '#ff00ff' }[c]; document.body.classList.toggle('chroma', !!col); if (col) document.body.style.setProperty('--chroma', col); },
  enterInTab(chroma) { App.bcast = true; App.bcastInTab = true; document.body.classList.add('bcast'); this.setChroma(chroma); Modal.close(); U.$('#subs').innerHTML = ''; setTimeout(() => { Board.fit(); Board.renderGrid(); Board.renderTokens(); }, 50); Sync.presence(); UI.toast('配信画面モード（Escで戻る）'); },
  exit() { App.bcast = false; App.bcastInTab = false; document.body.classList.remove('bcast', 'chroma'); setTimeout(() => { Board.fit(); UI.fullRender(); }, 50); Sync.presence(); },
  sub(msg) {
    if (msg.tab !== 'main' || msg.secret || msg.sys && !/^― シーン/.test(msg.text)) return;
    const box = U.$('#subs'); const d = document.createElement('div'); d.className = 'sub'; d.style.setProperty('--c', msg.from?.color || '#c9a766');
    if (msg.sys) d.innerHTML = `<span>${U.esc(msg.text)}</span>`;
    else if (msg.dice && msg.dice.ok) d.innerHTML = `<b>${U.esc(msg.from?.name || '')}</b><span class="d">${U.esc(String(msg.dice.text).split('\n').slice(-1)[0])}</span>${msg.dice.comment ? ' ' + U.esc(msg.dice.comment) : ''}`;
    else d.innerHTML = `<b>${U.esc(msg.from?.name || '')}</b>${U.esc(msg.text)}`;
    box.appendChild(d); while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { d.style.transition = 'opacity .8s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 900); }, 14000);
  },
};

/* ------------------------------ グローバル入力（貼り付け・D&D） ------------------------------ */
function installGlobalInput() {
  document.addEventListener('paste', (e) => {
    const t = e.target; const inField = t && /INPUT|TEXTAREA/.test(t.tagName);
    const txt = e.clipboardData?.getData('text/plain') || '';
    if (inField && t.id === 'iaText') return;
    if (/^\s*\{[\s\S]*"kind"\s*:\s*"character"/.test(txt)) { e.preventDefault(); Panels.importModal(txt.trim()); return; }
    if (inField) return;
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) { e.preventDefault(); Drop.files(files, L.uploadTag); return; }
    if (txt) Drop.text(txt);
  });
  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); if (App.bcast) return;
    const fs = [...(e.dataTransfer?.files || [])];
    const onBoard = e.target.closest && e.target.closest('#board'); const onChars = e.target.closest && e.target.closest('#p-chars');
    if (fs.length) { Drop.files(fs, onChars ? 'token' : onBoard ? 'bg' : L.uploadTag); return; }
    const t = e.dataTransfer?.getData('text/plain'); if (t) Drop.text(t);
  });
}

      ['SAN 1/1d6 成功で1減少', () => R('SAN<=55 1/1d6', { rng: F([0.1]) }).loss === 1],
      ['SANファンブルは最大値', () => R('SAN 1/1d10', { rng: F([0.99]), san: 50 }).loss === 10],
      ['{SAN} 参照の展開', () => R('CCB<={SAN}', { rng: F(0.1), resolve: k => k === 'SAN' ? 65 : undefined }).target === 65],
      ['{STR}*5 の展開', () => R('CCB<={STR}*5', { rng: F(0.1), resolve: k => k === 'STR' ? 12 : undefined }).target === 60],
      ['未定義パラメータはエラー', () => R('CCB<={謎}', { resolve: () => undefined }).ok === false],
      ['空白なしのコメント CCB<=60【目星】', () => { const r = R('CCB<=60【目星】', { rng: F(0.3) }); return r.target === 60 && r.comment === '【目星】'; }],
      ['全角コマンドも解釈', () => R('ＣＣＢ＜＝５０', { rng: F(0.1) }).target === 50],
      ['通常の文章はダイスにならない', () => R('こんにちは') === null && R('Sorry') === null && R('SAN値ピンチ') === null && R('3人で行こう') === null],
      ['いあきゃらJSON取込', () => { const c = Iachara.parseAny(Iachara.SAMPLE_JSON); return c.name.startsWith('神代') && c.status.length === 3 && c.skills.some(s => s.name === '目星' && s.value === 75); }],
      ['いあきゃらテキスト取込', () => { const c = Iachara.parseAny(Iachara.SAMPLE_TEXT); return CoC.abilMap(c).STR === 13 && c.skills.length >= 10; }],
      ['ココフォリア駒形式へ往復変換', () => { const c = Iachara.parseAny(Iachara.SAMPLE_JSON); const o = Iachara.toCcfolia(c); const c2 = Iachara.fromCcfolia(JSON.parse(JSON.stringify(o))); return o.kind === 'character' && c2.name === c.name && c2.params.length === c.params.length; }],
      ['6版派生値', () => { const d = CoC.derived({ STR: 12, CON: 11, POW: 13, DEX: 10, APP: 10, SIZ: 14, INT: 15, EDU: 20 }); return d.HP === 13 && d.SAN === 65 && d.知識 === 99 && d.DB === '+1D4'; }],
    ];
    const results = cases.map(([name, f]) => { let ok = false, err = ''; try { ok = !!f(); } catch (e) { err = e.message; } return { name, ok, err }; });
    return { passed: results.filter(r => r.ok).length, total: results.length, results };
  },
};

/* ------------------------------ Boot ------------------------------ */
function parseHash() { const h = location.hash.replace(/^#/, ''); const o = {}; for (const part of h.split('&')) { if (!part) continue; const [k, v] = part.split('='); o[decodeURIComponent(k)] = v == null ? true : decodeURIComponent(v); } return o; }
(async function boot() {
  try { await App.loadPrefs(); } catch (e) { }
  Icon.install(); UI.init(); FX.init(); Board.init(); installGlobalInput();
  Caps.init();
  window.addEventListener('pagehide', () => { try { Sync.send({ k: 'bye' }); } catch (e) { } });
  const hp = parseHash();
  const sess = Session.get();
  if (hp.broadcast) {
    App.bcast = true; document.body.classList.add('bcast'); Broadcast.setChroma(hp.chroma || '');
    let last = null; try { last = await Store.get('kv', 'last'); } catch (e) { }
    const rid = U.normRoomId(hp.room) || last?.roomId || 'demo';
    Broadcast.noCam = hp.cam === '0'; Board.noCam = hp.cam === '0';
    await App.join({ roomId: rid, name: '配信画面', role: 'VIEW', mode: 'join', p2p: !!(hp.p2p || last?.p2p) });
    Broadcast.watch();
    UI.renderAudioGate(); U.$('#audioGate').innerHTML = `<button class="btn brass" type="button" data-act="unlockAudio">${U.icon('vol')}配信音声を有効化（OBSでは「ページ操作」で1回クリック）</button>`;
    return;
  }
  if (sess && sess.roomId) {
    await App.join({ roomId: sess.roomId, name: sess.name, role: sess.role, mode: 'join', p2p: sess.p2p });
  } else if (hp.room) {
    await App.join({ roomId: hp.room, name: '見学者', role: 'VIEW', mode: 'join', p2p: !!hp.p2p });
    Panels.lobby({ room: U.normRoomId(hp.room), p2p: !!hp.p2p });
  } else {
    let demo = false; try { demo = (await Store.keys('rooms')).some(k => String(k).startsWith('demo@')); } catch (e) { }
    if (demo) await App.join({ roomId: 'demo', name: 'GM', role: 'GM', mode: 'join', autoDemo: true });
    else await App.join({ roomId: 'demo', roomName: '霧笛の夜（デモ）', name: 'GM', role: 'GM', mode: 'auto', demo: true });
    setTimeout(() => { if (App.roomId === 'demo') UI.toast('デモルームを開きました。右上の扉アイコンから自分のルームを作成・参加できます。'); }, 900);
  }
  Session.save();
  const origSave = App.saveLast.bind(App); App.saveLast = function () { origSave(); Session.save(); };
})();
</script>
