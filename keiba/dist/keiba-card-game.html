<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>馬主カード - 競馬×カードゲーム</title>
<style>
/* 馬主カード - 競馬×カードゲーム */
:root {
  --turf: #0f3d2e;
  --turf2: #165c43;
  --bg: #0b2a20;
  --paper: #fffaf0;
  --paper2: #f4ecd8;
  --ink: #2a2118;
  --muted: #7a6d5c;
  --line: #e2d6bd;
  --accent: #e8552d;
  --accent2: #f5b301;
  --ok: #1f8a4c;
  --warn: #c2410c;
  --danger: #c0262d;
  --sire: #2f6fd1;
  --mare: #d24a8a;
  --skill: #7a4fd6;
  --item: #2c9a7d;
  --r-N: #8f8f8f;
  --r-R: #3b82f6;
  --r-SR: #a855f7;
  --r-SSR: #e0a100;
  --r-UR: #ff4f8b;
  --radius: 14px;
  --nav-h: 64px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, system-ui, sans-serif;
  background: radial-gradient(ellipse at top, var(--turf2), var(--bg) 70%) fixed;
  color: var(--ink);
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }

/* ── レイアウト ── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; color: #fff;
  background: rgba(10, 40, 30, .92); backdrop-filter: blur(6px);
  border-bottom: 2px solid var(--accent2);
}
.brand { font-weight: 900; font-size: 18px; cursor: pointer; white-space: nowrap; }
.brand span { color: var(--accent2); }
.wallet { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { background: rgba(255,255,255,.12); border-radius: 99px; padding: 3px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }

.main { max-width: 860px; margin: 0 auto; padding: 14px 12px calc(var(--nav-h) + 90px); }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: #0a241b; border-top: 2px solid var(--accent2);
}
.nav-btn {
  background: none; border: 0; color: #cfe3d8; font-size: 11px; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.nav-btn span { font-size: 24px; line-height: 1; }
.nav-btn.active { color: var(--accent2); background: rgba(245,179,1,.1); }

.screen-title { color: #fff; margin: 4px 2px 12px; font-size: 22px; }
.screen-title small { font-size: 14px; opacity: .8; }

.panel {
  background: var(--paper); border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
.panel h3 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.panel h3 .link { margin-left: auto; }
.panel summary { font-weight: 700; cursor: pointer; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.center { text-align: center; }
.ok { color: var(--ok); font-weight: 700; }
.warn { color: var(--warn); font-weight: 700; }
.notice { background: #fff3c4; border: 2px solid var(--accent2); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-weight: 700; }
.empty { background: var(--paper); border-radius: var(--radius); padding: 28px 16px; text-align: center; font-size: 40px; }
.empty p { font-size: 15px; }

/* ── ボタン ── */
.btn {
  border: 2px solid var(--ink); background: #fff; color: var(--ink);
  border-radius: 12px; padding: 8px 14px; font-weight: 800;
  box-shadow: 0 3px 0 var(--ink); transition: transform .05s;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.big { display: block; width: 100%; padding: 12px; font-size: 17px; margin: 8px 0; }
.btn.small { padding: 4px 10px; font-size: 13px; box-shadow: 0 2px 0 var(--ink); }
.btn.glow:not(:disabled) { animation: glow 1.4s infinite; }
@keyframes glow { 50% { box-shadow: 0 3px 0 var(--ink), 0 0 18px var(--accent2); } }
.btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.btn-row .btn.big { width: auto; flex: 1; }
.link { background: none; border: 0; color: var(--turf2); font-weight: 700; font-size: 13px; padding: 0 4px; }
.back { background: none; border: 0; color: #fff; font-weight: 700; padding: 0 0 8px; }
.help {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0;
  background: var(--turf2); color: #fff; font-size: 11px; font-weight: 900; margin-left: 4px; vertical-align: middle;
}

/* ── バッジ・タグ ── */
.rar {
  display: inline-block; min-width: 32px; text-align: center; font-weight: 900; font-size: 11px;
  border-radius: 6px; padding: 1px 6px; color: #fff; letter-spacing: .5px;
}
.rar-N { background: var(--r-N); }
.rar-R { background: var(--r-R); }
.rar-SR { background: var(--r-SR); }
.rar-SSR { background: linear-gradient(135deg, #f7c948, #c98a00); }
.rar-UR { background: linear-gradient(135deg, #ff4f8b, #ffb84f, #4fd1ff, #a855f7); }
.grade { display: inline-block; font-weight: 900; font-size: 11px; border-radius: 4px; padding: 1px 6px; color: #fff; background: #6b7280; margin-right: 4px; }
.grade-op { background: #0f766e; }
.grade-cond { background: #4b5563; }
.grade-g3 { background: #15803d; }
.grade-g2 { background: #b91c1c; }
.grade-g1 { background: linear-gradient(135deg, #1d4ed8, #0b1f66); }
.tag { display: inline-block; background: var(--paper2); border-radius: 99px; padding: 1px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }

/* ── バー ── */
.bar { position: relative; height: 12px; background: #e9dfc8; border-radius: 99px; overflow: visible; }
.bar.thin { height: 6px; margin-top: 4px; }
.bar-fill { height: 100%; border-radius: 99px; background: var(--turf2); transition: width .4s; }
.bar-cap { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--ink); border-radius: 2px; }
.stat-speed { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
.stat-stamina { background: linear-gradient(90deg, #fb7185, #e11d48); }
.stat-power { background: linear-gradient(90deg, #fb923c, #c2410c); }
.stat-guts { background: linear-gradient(90deg, #f87171, #b91c1c); }
.stat-intelligence { background: linear-gradient(90deg, #60a5fa, #1d4ed8); }
.bar-fill.exp { background: linear-gradient(90deg, #a78bfa, #7c3aed); }
.bar-fill.fatigue { background: linear-gradient(90deg, #94a3b8, #475569); }
.mission-fill { background: linear-gradient(90deg, var(--accent2), var(--accent)); }

.stat-row { display: grid; grid-template-columns: 112px 1fr 92px; align-items: center; gap: 8px; margin: 9px 0; }
.stat-label { font-weight: 700; font-size: 14px; white-space: nowrap; }
.stat-val { text-align: right; font-size: 13px; }
.stat-val b { font-size: 16px; }
.stat-val .g { display: inline-block; min-width: 24px; text-align: center; font-weight: 900; background: var(--ink); color: #fff; border-radius: 4px; font-size: 11px; }

.apt-title { font-weight: 700; font-size: 13px; margin: 8px 0 4px; }
.apt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.apt { background: var(--paper2); border-radius: 10px; padding: 5px 8px; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.apt span { flex: 1; font-weight: 700; }
.apt b { color: var(--accent2); letter-spacing: -1px; text-shadow: 0 0 1px #7a5600; }
.apt small { font-weight: 900; }

/* ── カード ── */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.gcard {
  position: relative; background: #fff; border-radius: 14px; padding: 8px;
  border: 4px solid var(--r-N); box-shadow: 0 4px 10px rgba(0,0,0,.3);
  display: flex; flex-direction: column; gap: 4px; font-size: 12px; cursor: default;
}
.gcard[onclick] { cursor: pointer; }
.gcard[onclick]:hover { transform: translateY(-2px); }
.gcard.selected { outline: 4px solid var(--accent2); }
.rcard-N { border-color: var(--r-N); }
.rcard-R { border-color: var(--r-R); }
.rcard-SR { border-color: var(--r-SR); }
.rcard-SSR { border-color: var(--r-SSR); box-shadow: 0 0 14px rgba(224,161,0,.6); }
.rcard-UR { border-color: transparent; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, #ff4f8b, #ffb84f, #4fd1ff, #a855f7) border-box; box-shadow: 0 0 18px rgba(255,79,139,.6); }
.gcard-head { display: flex; align-items: center; gap: 4px; }
.gtype { font-weight: 800; font-size: 11px; }
.count { margin-left: auto; font-weight: 900; background: var(--ink); color: #fff; border-radius: 99px; padding: 0 7px; }
.gcard-art { position: relative; height: 66px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 42px; background: linear-gradient(135deg, #d9f2e4, #9bd3b4); }
.gcard.sire .gcard-art { background: linear-gradient(135deg, #dbe8ff, #8db4f2); }
.gcard.mare .gcard-art { background: linear-gradient(135deg, #ffe0ef, #f29dc6); }
.gcard.skill .gcard-art { background: linear-gradient(135deg, #ece3ff, #b79cf2); }
.gcard.item .gcard-art { background: linear-gradient(135deg, #d7f5ec, #84d5bd); }
.gcard.silhouette { filter: grayscale(1); opacity: .55; }
.legend { position: absolute; top: 2px; right: 6px; font-size: 18px; }
.gcard-name { font-weight: 900; font-size: 14px; line-height: 1.25; }
.gcard-desc { color: #4b4034; }
.gcard-foot { color: var(--muted); font-size: 11px; margin-top: auto; }
.mini-stats { display: grid; grid-template-columns: 1fr; gap: 0; }
.mini-stat { display: flex; justify-content: space-between; font-size: 11px; }
.mini-stat b { color: #c98a00; letter-spacing: -1px; }
.apt-chips { display: flex; flex-wrap: wrap; gap: 2px; }
.apt-chip { background: var(--paper2); border-radius: 4px; padding: 0 4px; font-size: 10px; font-weight: 700; }
.gcard .btn { margin-top: 4px; }

/* 競走馬カード */
.hcard {
  background: var(--paper); border-radius: 14px; padding: 10px; cursor: pointer;
  border: 4px solid var(--r-N); box-shadow: 0 4px 10px rgba(0,0,0,.3); font-size: 12px;
}
.hcard:hover { transform: translateY(-2px); }
.hcard-top { display: flex; align-items: center; gap: 5px; }
.hname { font-weight: 900; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ovr { font-weight: 900; font-size: 18px; background: var(--ink); color: var(--accent2); border-radius: 8px; padding: 0 7px; }
.hcard-art { font-size: 44px; text-align: center; background: linear-gradient(180deg, #bfe3c9, #5fae7c); border-radius: 10px; margin: 6px 0; }
.hcard-info { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin: 3px 0; font-weight: 700; }
.hcard-rec { color: var(--muted); font-weight: 700; margin-top: 4px; }
.c-best { color: #d9480f; } .c-good { color: var(--ok); } .c-normal { color: #5c5c5c; } .c-bad { color: #2563eb; } .c-worst { color: #6d28d9; }
.f-low { color: var(--ok); } .f-mid { color: #a16207; } .f-high { color: var(--warn); } .f-max { color: var(--danger); }

/* ── ホーム ── */
.hero { background: linear-gradient(135deg, #fff6dc, #ffe7a8); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.hero-name { font-weight: 900; font-size: 18px; display: flex; align-items: center; }
.hero-name .link { margin-left: auto; }
.hero-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-top: 8px; }
.hero-stats > div { background: rgba(255,255,255,.7); border-radius: 10px; padding: 6px 8px; }
.hero-stats small { display: block; color: var(--muted); font-size: 11px; }
.hero-stats b { font-size: 16px; }
.guide {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  background: var(--accent2); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px;
  box-shadow: 0 4px 0 #a37700; animation: bob 2s infinite;
}
.guide p { margin: 2px 0 0; font-size: 13px; }
.guide b { font-size: 16px; }
.guide-icon { font-size: 30px; }
.guide-go { margin-left: auto; font-size: 20px; }
@keyframes bob { 50% { transform: translateY(-2px); } }
.mission-title { font-weight: 900; font-size: 17px; margin-bottom: 6px; }
.mission p { margin: 6px 0; font-size: 13px; }
.mission-reward { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.rec-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px; border-radius: 10px; background: var(--paper2); margin-bottom: 6px; cursor: pointer; }
.rec-horse { font-weight: 900; }
.news ul { margin: 0; padding-left: 18px; font-size: 13px; }
.help.static { display: inline-flex; }
.retired-row { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }

/* ── 馬詳細 ── */
.horse-head {
  display: flex; gap: 12px; background: var(--paper); border-radius: var(--radius); padding: 12px; margin-bottom: 12px;
  border: 4px solid var(--r-N); box-shadow: 0 4px 14px rgba(0,0,0,.3);
}
.hh-art { font-size: 56px; background: linear-gradient(180deg, #bfe3c9, #5fae7c); border-radius: 12px; display: flex; align-items: center; justify-content: center; width: 86px; flex-shrink: 0; }
.hh-main { flex: 1; min-width: 0; }
.hh-name { font-size: 20px; font-weight: 900; }
.hh-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.hh-grades { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 6px; margin: 6px 0; }
.hh-grades > div { background: var(--paper2); border-radius: 8px; padding: 3px 8px; }
.hh-grades small { display: block; font-size: 11px; color: var(--muted); }
.hh-grades b { font-size: 20px; }
.hh-cond { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; font-size: 13px; }
.seg { display: flex; background: rgba(0,0,0,.3); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: none; color: #e5f3eb; padding: 8px 4px; border-radius: 9px; font-weight: 800; font-size: 13px; }
.seg button.active { background: var(--paper); color: var(--ink); }
.sticky-actions { position: sticky; bottom: calc(var(--nav-h) + 8px); z-index: 5; }
.style-box { display: flex; gap: 12px; align-items: center; }
.style-box p { margin: 2px 0 0; }
.style-big { font-size: 36px; }
.rec { background: #fff3c4; border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
.route-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.route-pick button, .chips button {
  border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-weight: 700; font-size: 13px;
}
.route-pick button.active, .chips button.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.pedigree { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ped { border-radius: 10px; padding: 8px 10px; color: #fff; }
.ped.sire { background: var(--sire); }
.ped.mare { background: var(--mare); }
.ped .rar { margin-left: 4px; }
.auto-train p { margin: 4px 0; }
.train-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.train-btn {
  border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 8px; text-align: left;
  display: grid; grid-template-columns: 34px 1fr; grid-template-rows: auto auto; column-gap: 6px; align-items: center;
}
.train-btn .ti { grid-row: span 2; font-size: 26px; text-align: center; }
.train-btn small { color: var(--muted); font-size: 11px; }
.train-btn.suggest { border-color: var(--accent2); background: #fff8e1; }
.train-btn:active { transform: scale(.97); }
.item-list { display: grid; gap: 6px; }
.item-btn { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px; text-align: left; }
.item-btn small { display: block; color: var(--muted); }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border: 3px solid var(--r-N); border-radius: 12px; padding: 8px; text-align: center; font-size: 12px; display: flex; flex-direction: column; gap: 2px; align-items: center; background: #fff; }
.slot b { font-size: 13px; }
.slot-icon { font-size: 26px; }
.empty-slot { border-style: dashed; color: var(--muted); justify-content: center; min-height: 100px; background: var(--paper2); }
.record-big { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
.record-big b { color: var(--accent); font-size: 28px; }
.hist { width: 100%; border-collapse: collapse; font-size: 13px; }
.hist th { text-align: left; font-size: 11px; color: var(--muted); border-bottom: 2px solid var(--line); padding: 4px; }
.hist td { border-bottom: 1px solid var(--line); padding: 5px 4px; }
.hist tr.win td { background: #fff3c4; font-weight: 700; }
.hist tr.me td { background: #ffe1d6; font-weight: 900; }
.danger-zone { border: 2px dashed #e7b4b4; }

/* ── カード画面 ── */
.filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chips button { white-space: nowrap; }
.search { border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; width: 100%; }
.dex-progress { color: #fff; margin: 0 0 8px; }

/* ── 配合 ── */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px; }
.steps div { background: rgba(255,255,255,.15); color: #cfe3d8; border-radius: 8px; padding: 6px; font-size: 12px; font-weight: 700; text-align: center; }
.steps .active { background: var(--accent2); color: var(--ink); }
.steps .done { background: var(--turf2); color: #fff; }
.breed-slots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.breed-slot { border: 3px dashed rgba(255,255,255,.6); border-radius: 14px; padding: 12px 8px; text-align: center; color: #fff; font-weight: 900; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
.breed-slot.filled { border-style: solid; cursor: pointer; color: #fff; }
.breed-slot.filled.sire { background: var(--sire); }
.breed-slot.filled.mare { background: var(--mare); }
.breed-slot small { font-weight: 400; opacity: .85; }
.breed-slot.pulse { animation: pulse 1.2s infinite; border-color: var(--accent2); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(245,179,1,.35); } }
.x { color: #fff; font-size: 22px; font-weight: 900; }
.breed-hint { color: #fff; font-weight: 800; font-size: 16px; text-align: center; margin: 4px 0 12px; }
.preview { border: 3px solid var(--accent2); }
.pv-score b { color: #c98a00; font-size: 20px; }
.pv-comment { font-weight: 700; }
.pv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.pv-grid div { background: var(--paper2); border-radius: 8px; padding: 6px 10px; display: flex; justify-content: space-between; font-weight: 700; }
.pv-grid b { color: var(--accent); }
.fee { font-size: 15px; margin-top: 8px; }

/* ── レース選択 ── */
.horse-pick { margin-bottom: 10px; }
.race-horse p.rec { margin-bottom: 0; }
.routes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
.route-btn {
  position: relative; border: 3px solid transparent; background: var(--paper); border-radius: 12px; padding: 8px 2px; font-weight: 800; font-size: 11px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.route-btn .ri { font-size: 24px; }
.route-btn.active { border-color: var(--accent); background: #fff1e8; }
.route-btn em { position: absolute; top: -8px; right: -4px; background: var(--accent); color: #fff; font-style: normal; font-size: 9px; border-radius: 99px; padding: 1px 5px; }
.route-desc p { margin: 4px 0 0; font-size: 13px; }
.race-list { display: grid; gap: 8px; margin-bottom: 8px; }
.race-row { background: var(--paper); border-radius: 12px; padding: 10px 12px; box-shadow: 0 3px 8px rgba(0,0,0,.25); display: grid; gap: 4px; }
.race-row.locked { opacity: .65; }
.rr-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 15px; }
.rr-info, .rr-apt { font-size: 12px; color: var(--muted); }
.rr-apt b { color: #c98a00; }
.race-row .btn { justify-self: end; }
.lock { font-size: 12px; font-weight: 700; color: var(--muted); }

/* ── レース再生 ── */
.race-live { background: #082018; color: #fff; border-radius: var(--radius); padding: 12px; margin-bottom: 12px; border: 2px solid var(--accent2); }
.rl-title { font-size: 18px; font-weight: 900; }
.rl-info { font-size: 13px; opacity: .85; }
.rl-progress { height: 8px; background: rgba(255,255,255,.15); border-radius: 99px; margin: 8px 0; overflow: hidden; }
.rl-progress .bar-fill { background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .3s; }
.rl-controls { display: flex; gap: 6px; }
.rl-controls button { border: 1px solid rgba(255,255,255,.4); background: none; color: #fff; border-radius: 8px; padding: 3px 10px; font-weight: 700; }
.rl-controls button.active { background: var(--accent2); color: var(--ink); }
.race-split { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }
.standings ol { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.standings li { padding: 3px 4px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 4px; }
.standings li small { margin-left: auto; color: var(--muted); font-size: 10px; }
.standings li.me { background: #ffe1d6; font-weight: 900; border-radius: 6px; }
.pos { display: inline-block; width: 20px; text-align: center; font-weight: 900; }
.log #rl-log { max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.ev { padding: 6px 8px; background: var(--paper2); border-radius: 8px; font-size: 13px; animation: pop .25s; }
.ev.cp { background: #e8f4ec; }
.cp-label { font-weight: 900; color: var(--turf2); }
.ev.skill { background: #efe7ff; font-weight: 800; }
.ev.me { border-left: 5px solid var(--accent); background: #fff1e8; }
.ev.skill.me { background: linear-gradient(90deg, #ffe08a, #fff1e8); font-size: 15px; }
@keyframes pop { from { transform: scale(.95); opacity: 0; } }
.result { border: 3px solid var(--accent2); }
.result-big { font-size: 40px; font-weight: 900; text-align: center; }
.result-big.win { color: #c98a00; text-shadow: 0 2px 0 #7a5600; animation: pop .5s; }
.result-big.place { color: var(--r-R); }
.rewards { display: grid; gap: 4px; font-size: 15px; }
.reveal { position: relative; animation: flip .6s backwards; }
@keyframes flip { from { transform: rotateY(90deg) scale(.8); opacity: 0; } }
.new { position: absolute; z-index: 2; top: -8px; left: -6px; background: var(--accent); color: #fff; font-weight: 900; font-size: 11px; border-radius: 99px; padding: 1px 8px; }

/* ── 殿堂 ── */
.hof-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.legend-card {
  background: linear-gradient(160deg, #2b2110, #4a3714); color: #fbe9b7; border-radius: 16px; padding: 14px;
  border: 3px solid #e0a100; box-shadow: 0 0 18px rgba(224,161,0,.5); font-size: 13px;
}
.lc-top { font-weight: 900; letter-spacing: 2px; color: #ffd66b; border-bottom: 1px solid #e0a10066; padding-bottom: 4px; }
.lc-name { font-size: 22px; font-weight: 900; margin: 6px 0; color: #fff; }
.lc-rec, .lc-wins, .lc-title, .lc-ped { margin-top: 8px; }
.lc-wins small, .lc-title small { display: block; opacity: .7; }
.lc-title { color: #ffd66b; font-weight: 800; }

/* ── モーダル・トースト ── */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; }
.modal.open { display: flex; }
.modal-box {
  position: relative; background: var(--paper); border-radius: 18px; padding: 18px; width: 100%; max-width: 520px;
  max-height: 88vh; overflow-y: auto; animation: pop .2s; box-shadow: 0 10px 40px rgba(0,0,0,.5);
}
.modal-box.small { max-width: 400px; }
.modal-box h2, .modal-box h3 { margin-top: 0; }
.modal-box label { display: block; font-weight: 700; margin: 10px 0; }
.modal-box input { display: block; width: 100%; margin-top: 4px; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.modal-x { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 20px; }
.help-body { font-size: 15px; }
.welcome, .birth { text-align: center; }
.welcome .flow { text-align: left; display: inline-block; margin: 6px auto; padding-left: 20px; }
.big-emoji, .sparkle { font-size: 48px; }
.birth .hcard { max-width: 240px; margin: 8px auto; cursor: default; }
.birth .gcard { max-width: 200px; margin: 8px auto; }
.birth .cgrid { justify-content: center; }
.entry-list { columns: 2; font-size: 13px; padding-left: 22px; }
.entry-list li.me { font-weight: 900; color: var(--accent); }
.card-detail { display: grid; grid-template-columns: 180px 1fr; gap: 12px; }
.card-detail .stat-row { grid-template-columns: 96px 1fr 70px; }

.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px); display: flex; flex-direction: column; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
.toast { background: rgba(20,20,20,.92); color: #fff; padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 14px; animation: pop .2s; transition: opacity .4s, transform .4s; text-align: center; }
.toast.out { opacity: 0; transform: translateY(10px); }
.toast.error { background: rgba(176,30,30,.95); }
.toast.ok { background: rgba(31,138,76,.95); }
.toast.skill-toast { background: linear-gradient(90deg, #f59e0b, #e8552d); font-size: 18px; }
.toast.mission-toast { background: linear-gradient(90deg, #7c3aed, #2563eb); }

/* ── スマホ ── */
@media (max-width: 560px) {
  .race-split { grid-template-columns: 1fr; }
  .log #rl-log { max-height: 260px; }
  .routes { grid-template-columns: repeat(3, 1fr); }
  .stat-row { grid-template-columns: 92px 1fr 78px; gap: 6px; }
  .stat-label { font-size: 12px; }
  .card-detail { grid-template-columns: 1fr; }
  .card-detail .gcard { max-width: 220px; margin: 0 auto; }
  .cgrid { grid-template-columns: repeat(2, 1fr); }
  .hgrid { grid-template-columns: repeat(2, 1fr); }
  .horse-head { flex-direction: column; }
  .hh-art { width: 100%; height: 70px; }
  .entry-list { columns: 1; }
  .brand span { display: none; }
}

/* ── 2Dレース ── */
.track {
  position: relative; height: 230px; margin: 10px 0 6px; border-radius: 12px; overflow: hidden;
  background: repeating-linear-gradient(90deg, #2f8a4e 0 40px, #2b8148 40px 80px);
  border: 3px solid #f5f5f5; box-shadow: inset 0 0 0 2px #1d5c34;
}
.track.dirt { background: repeating-linear-gradient(90deg, #a87943 0 40px, #9d703d 40px 80px); box-shadow: inset 0 0 0 2px #6e4b25; }
.lane { position: absolute; left: 0; right: 0; border-bottom: 1px dashed rgba(255,255,255,.18); }
.lane.me { background: rgba(255, 213, 79, .22); }
.runner {
  position: absolute; top: 50%; transform: translate(-100%, -50%); display: flex; align-items: center; gap: 1px;
  white-space: nowrap; will-change: left; font-size: 12px;
}
.runner .horse { display: inline-block; font-size: 15px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
.runner .gate { order: 2; display: inline-block; min-width: 14px; text-align: center; font-size: 9px; font-weight: 900; background: #fff; color: #222; border-radius: 3px; padding: 0 2px; }
.lane.me .runner .gate { background: var(--accent); color: #fff; }
.runner .me-tag { order: 3; margin-left: 3px; background: var(--accent); color: #fff; font-weight: 900; font-size: 10px; border-radius: 99px; padding: 0 6px; }
.runner.behind { opacity: .45; }
.runner.boost .horse { animation: boost 1.4s ease-out; }
.runner.boost::after {
  content: attr(data-skill); position: absolute; left: 100%; top: -2px; margin-left: 4px; font-size: 10px; font-weight: 900;
  background: #ffe08a; color: #6b3d00; border-radius: 6px; padding: 0 4px; animation: skilltag 1.6s forwards;
}
@keyframes boost { 0%, 60% { filter: drop-shadow(0 0 6px #ffd54f) drop-shadow(0 0 10px #ff9800); } }
@keyframes skilltag { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.track-goal { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: repeating-linear-gradient(0deg, #fff 0 6px, #c0262d 6px 12px); z-index: 1; }
.track-post { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.35); }
.track-remain { position: absolute; z-index: 2; top: 4px; left: 6px; background: rgba(0,0,0,.6); color: #fff; font-weight: 900; font-size: 12px; border-radius: 6px; padding: 1px 8px; }
.standings li.ghost { background: #e7f0ff; border-radius: 6px; }

/* ── 血統表・特殊配合 ── */
.ptree { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, auto); grid-auto-flow: column; gap: 4px; }
.ptree .pt { border-radius: 8px; padding: 4px 8px; color: #fff; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; font-size: 13px; }
.ptree .pt small { width: 100%; opacity: .85; font-size: 10px; }
.ptree .p1 { grid-row: span 2; font-size: 15px; }
.ptree .p2 { opacity: .9; }
.ptree .sire { background: var(--sire); }
.ptree .mare { background: var(--mare); }
.ptree .pt .muted { color: #fff; opacity: .6; }
.special-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.special { display: inline-block; background: linear-gradient(90deg, #ffe08a, #ffc2d6); border-radius: 99px; padding: 2px 10px; font-weight: 800; font-size: 12px; }
.specials { display: grid; gap: 6px; margin: 8px 0; }
.special-box { background: linear-gradient(90deg, #fff4c2, #ffe3ef); border: 2px solid var(--accent2); border-radius: 10px; padding: 6px 10px; }
.special-box small { display: block; color: var(--muted); }
.nick-list summary { font-weight: 800; }
.nick { padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.nick.found { font-weight: 700; }

/* ── ショップ（パック） ── */
.sub-title { color: #fff; margin: 14px 2px 8px; }
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.pack { background: linear-gradient(160deg, #fff, #fff1d0); border: 3px solid var(--accent2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 4px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,.3); }
.pack-icon { font-size: 40px; }
.pack small { color: var(--muted); }

/* ── ホームのリンク ── */
.home-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.link-card { border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 0; cursor: pointer; }
.link-card span { font-size: 28px; }
.link-card small { color: var(--muted); }

/* ── 対戦 ── */
.rating { font-size: 15px; }
.rating b { font-size: 26px; color: var(--accent); }
.rating small { color: var(--muted); margin-left: 6px; }
.league-list { display: grid; gap: 8px; margin-bottom: 12px; }
.league { display: flex; gap: 10px; align-items: center; background: var(--paper); border: 3px solid transparent; border-radius: 12px; padding: 10px 12px; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
.league small { display: block; font-size: 12px; color: var(--muted); }
.league.active { border-color: var(--accent); background: #fff1e8; }
.league.locked { opacity: .6; cursor: not-allowed; }
.league-icon { font-size: 34px; }
.code-box { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; word-break: break-all; resize: vertical; margin-bottom: 8px; }
.ghost-list { display: grid; gap: 6px; }
.ghost { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; }
.ghost.on { border-color: var(--accent); background: #fff1e8; }
.ghost-main { flex: 1; font-size: 13px; }
.ghost-main small { color: var(--muted); }
.rating-change { text-align: center; font-size: 18px; font-weight: 800; margin: 6px 0; }
.rating-change.up b { color: var(--ok); }
.rating-change.down b { color: var(--danger); }
.vs-list { display: grid; gap: 2px; margin: 8px 0; text-align: center; }
.entry-list.wide { columns: 1; }
.entry-list small { margin-left: 6px; }

/* ── 記録 ── */
.hist td.num { text-align: right; font-weight: 800; white-space: nowrap; }
.hist td.rank { font-weight: 900; text-align: center; width: 28px; }
.hist td.r1 { color: #c98a00; } .hist td.r2 { color: #8a8a8a; } .hist td.r3 { color: #a0522d; }

@media (max-width: 560px) {
  .track { height: 200px; }
  .packs { grid-template-columns: 1fr 1fr; }
}

/* ── カレンダー ── */
.date-chip { cursor: pointer; background: rgba(245,179,1,.25); }
.date-panel { border: 3px solid var(--accent2); background: linear-gradient(160deg, #fffaf0, #fff1cf); }
.date-big { font-size: 20px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.date-big span { font-size: 28px; font-weight: 900; color: var(--accent); }
.date-big small { color: var(--muted); }
.week-races { margin: 6px 0; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.wr { background: #fff; border-radius: 8px; padding: 2px 8px; border: 1px solid var(--line); font-weight: 700; }
.wr.g1 { border-color: #1d4ed8; background: #e8efff; }
.upcoming { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; }
.upcoming span { font-weight: 700; color: var(--ink); }
.acted-count { font-size: 13px; margin-top: 4px; }
.tag.acted { background: #dcfce7; }
.tag.free { background: #fef3c7; }
.tag.right { background: #fde68a; }
.rec-target { font-size: 12px; font-weight: 700; color: var(--turf2); }
.sub-title .link.light, .muted.light { color: #d9eadf; }
.screen-title small { font-size: 13px; opacity: .85; margin-left: 6px; }
.race-row.g1row { border: 3px solid #1d4ed8; }
.months { flex-wrap: wrap; }
.months button.cur:not(.active) { border-color: var(--accent2); }
.cal { display: grid; gap: 10px; }
.cal-week { background: var(--paper); border-radius: 12px; padding: 10px 12px; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
.cal-week.now { border: 3px solid var(--accent); }
.cal-head { font-weight: 900; font-size: 15px; margin-bottom: 4px; }
.cal-head em { font-style: normal; background: var(--accent); color: #fff; border-radius: 99px; padding: 0 8px; font-size: 12px; margin-left: 4px; }
.cal-head small { color: var(--muted); font-weight: 400; }
.cal-race { padding: 6px 0; border-top: 1px dashed var(--line); display: grid; gap: 2px; }
.cal-race.g1 b { color: #1d4ed8; }
.newyear h3 { margin: 12px 0 6px; }
.awards { display: grid; gap: 4px; text-align: left; }
.award { background: linear-gradient(90deg, #fff4c2, #fffaf0); border-radius: 8px; padding: 6px 10px; }
.award small { color: var(--ok); font-weight: 800; }
.big-note { font-size: 16px; }

/* ── 3Dレース ── */
.hidden { display: none !important; }
.race-live.is3d { padding: 10px; }
.r3-wrap {
  position: relative; width: 100%; aspect-ratio: 16 / 9; margin: 8px 0 6px; border-radius: 10px; overflow: hidden;
  background: #8ec5f0; border: 2px solid #f5f5f5; user-select: none;
}
.r3-wrap:fullscreen { aspect-ratio: auto; border: 0; border-radius: 0; }
.r3-wrap canvas { display: block; }
.r3-hud { position: absolute; inset: 0; pointer-events: none; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.r3-title {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
  background: rgba(10,30,22,.72); border-radius: 8px; padding: 3px 10px; font-size: 13px; white-space: nowrap; max-width: 70%; overflow: hidden;
}
.r3-title small { font-weight: 700; opacity: .85; }
.r3-remain {
  position: absolute; top: 8px; right: 10px; background: linear-gradient(#ffffff, #dfe5ea); color: #222; text-shadow: none;
  border-radius: 6px 6px 6px 18px; padding: 4px 14px; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.4);
}
.r3-time { position: absolute; top: 40px; right: 12px; font-size: 22px; font-variant-numeric: tabular-nums; }
.r3-map { position: absolute; top: 40px; left: 10px; bottom: 74px; width: 120px; }
.r3-map-line { position: absolute; left: 9px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.7); }
.r3-dot {
  position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9);
  font-size: 11px; line-height: 16px; text-align: center; text-shadow: none; transition: transform .25s linear; box-shadow: 0 1px 3px rgba(0,0,0,.5);
}
.r3-dot.me { outline: 3px solid #ff7a1a; z-index: 2; }
.r3-bar {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 2px; padding: 4px 6px 6px;
  background: linear-gradient(transparent, rgba(0,0,0,.55)); overflow: hidden;
}
.r3-item { position: relative; flex: 0 0 auto; width: 64px; text-align: center; font-size: 10px; }
.r3-item img { width: 40px; height: 40px; display: block; margin: 0 auto -2px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.r3-item .r3-pos { position: absolute; top: 0; left: 2px; font-size: 11px; }
.r3-item .r3-num { position: absolute; top: 12px; right: 4px; min-width: 18px; border-radius: 4px; font-size: 12px; text-shadow: none; border: 1px solid rgba(0,0,0,.3); }
.r3-item .r3-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r3-item.me .r3-name { background: #ff7a1a; border-radius: 4px; }
.r3-banner {
  position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%) scale(.7); opacity: 0; transition: all .25s;
  background: rgba(0,0,0,.6); border-radius: 12px; padding: 8px 22px; text-align: center; font-size: 26px; white-space: nowrap;
}
.r3-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.r3-banner small { display: block; font-size: 13px; }
.r3-banner.skill { background: linear-gradient(90deg, rgba(245,158,11,.9), rgba(232,85,45,.9)); }
.r3-banner.skill .sk { font-size: 24px; }
.r3-banner.start { font-size: 34px; letter-spacing: 4px; }
.r3-banner.goal { background: rgba(20,20,20,.75); border: 2px solid #f5b301; }
.r3-banner .gw { display: inline-flex; align-items: center; gap: 8px; font-size: 26px; }
.r3-banner .num { display: inline-block; min-width: 30px; border-radius: 6px; text-shadow: none; border: 1px solid rgba(0,0,0,.3); }
.r3-cams { position: absolute; right: 8px; bottom: 74px; display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
.r3-cams button { border: 0; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 8px; text-align: left; }
.r3-cams button.active { background: #f5b301; color: #222; }

@media (max-width: 560px) {
  .r3-wrap { aspect-ratio: 4 / 3.4; }
  .r3-title { font-size: 11px; top: 4px; max-width: 64%; }
  .r3-title small { display: none; }
  .r3-remain { font-size: 11px; padding: 3px 8px; top: 4px; right: 6px; }
  .r3-time { font-size: 16px; top: 30px; right: 8px; }
  .r3-map { top: 30px; bottom: 62px; left: 6px; }
  .r3-dot { width: 17px; height: 17px; font-size: 9px; line-height: 13px; }
  .r3-item { width: 52px; font-size: 9px; }
  .r3-item img { width: 32px; height: 32px; }
  .r3-cams { bottom: 62px; right: 4px; }
  .r3-cams button { font-size: 10px; padding: 3px 6px; }
  .r3-banner { font-size: 20px; padding: 6px 14px; }
  .r3-banner .gw { font-size: 20px; }
}
.race-live.is3d > .rl-title, .race-live.is3d > .rl-info { display: none; }
.r3-bar { pointer-events: auto; overflow-x: auto; scrollbar-width: none; }
.r3-bar::-webkit-scrollbar { display: none; }
@media (max-width: 560px) {
  .r3-cams .lbl { display: none; }
  .r3-cams button { font-size: 14px; padding: 2px 5px; text-align: center; }
}
.r3-replay { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); display: none; background: #d32f2f; color: #fff; border-radius: 4px; padding: 1px 10px; font-size: 13px; letter-spacing: 3px; animation: blink 1s infinite; }

<script>
// セーブ処理。ゲームロジックから分離し、将来サーバー保存へ差し替えられるようにする。
'use strict';

const Save = {
  KEY: 'keibaCardGame.save.v1',
  VERSION: 1,

  // ストレージ実装（差し替えポイント）
  storage: {
    get(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; } },
    remove(key) { try { window.localStorage.removeItem(key); } catch (e) { /* noop */ } }
  },

  load() {
    const raw = this.storage.get(this.KEY);
    if (!raw) return null;
    try {
      const data = JSON.parse(raw);
      return this.migrate(data);
    } catch (e) {
      console.warn('セーブデータの読み込みに失敗しました', e);
      return null;
    }
  },

  save(player) {
    return this.storage.set(this.KEY, JSON.stringify({ version: this.VERSION, savedAt: Date.now(), player }));
  },

  reset() {
    this.storage.remove(this.KEY);
  },

  // バージョン差分を吸収する
  migrate(data) {
    if (!data || !data.player) return null;
    return data.player;
  }
};

<script>
// カード定義の検索・抽選・表示用ヘルパー
'use strict';

const Util = {
  rand(min, max) { return min + Math.random() * (max - min); },
  randInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); },
  clamp(v, min, max) { return Math.max(min, Math.min(max, v)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  gauss() { // 標準正規分布（Box-Muller）
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  },
  weighted(table) { // { key: weight }
    const entries = Object.entries(table).filter(([, w]) => w > 0);
    const total = entries.reduce((s, [, w]) => s + w, 0);
    let r = Math.random() * total;
    for (const [k, w] of entries) { if ((r -= w) < 0) return k; }
    return entries[entries.length - 1][0];
  },
  uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },
  esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  money(n) { return Math.round(n).toLocaleString('ja-JP') + ' G'; },
  stars(v, max = 5) { // 0〜100 → ★1〜5
    const n = Util.clamp(Math.round(v / 20), 1, max);
    return '★'.repeat(n) + '☆'.repeat(max - n);
  },
  aptMark(v) { // 適性記号
    if (v >= 85) return '◎';
    if (v >= 65) return '○';
    if (v >= 45) return '△';
    return '×';
  },
  grade(v) { // 総合評価
    const table = [[100, 'SS'], [92, 'S'], [85, 'A'], [78, 'B'], [71, 'C'], [64, 'D'], [57, 'E'], [50, 'F']];
    for (const [min, g] of table) if (v >= min) return g;
    return 'G';
  }
};

const Cards = {
  types: {
    sire: { label: '種牡馬', icon: '♂', color: 'sire' },
    mare: { label: '繁殖牝馬', icon: '♀', color: 'mare' },
    skill: { label: 'スキル', icon: '🎴', color: 'skill' },
    item: { label: 'アイテム', icon: '🎒', color: 'item' }
  },

  _index: null,
  index() {
    if (this._index) return this._index;
    const idx = {};
    GAME_DATA.sires.forEach(c => { idx[c.id] = Object.assign({ type: 'sire' }, c); });
    GAME_DATA.mares.forEach(c => { idx[c.id] = Object.assign({ type: 'mare' }, c); });
    GAME_DATA.skills.forEach(c => { idx[c.id] = Object.assign({ type: 'skill' }, c); });
    GAME_DATA.items.forEach(c => { idx[c.id] = Object.assign({ type: 'item' }, c); });
    this._index = idx;
    return idx;
  },

  // 殿堂馬などプレイヤー固有のカードも含めて検索
  get(id) {
    const base = this.index()[id];
    if (base) return base;
    if (typeof Player !== 'undefined' && Player.data && Player.data.customCards) return Player.data.customCards[id] || null;
    return null;
  },

  all(includeCustom = true) {
    const list = Object.values(this.index());
    if (includeCustom && Player.data && Player.data.customCards) list.push(...Object.values(Player.data.customCards));
    return list;
  },

  rarityIndex(r) { return GAME_DATA.rarities.indexOf(r); },

  // 指定タイプ・レアリティのカードをランダムに選ぶ。無ければ近いレアリティから。
  randomOf(type, rarity) {
    const pool = this.all(false).filter(c => c.type === type && !(c.type === 'item' && c.price === undefined));
    const target = this.rarityIndex(rarity);
    for (let d = 0; d < GAME_DATA.rarities.length; d++) {
      for (const dir of [-1, 1]) {
        const r = GAME_DATA.rarities[target + d * dir];
        const cands = pool.filter(c => c.rarity === r);
        if (cands.length) return Util.pick(cands);
      }
    }
    return Util.pick(pool);
  },

  // レース報酬のカード抽選
  drawReward(grade) {
    const rarity = Util.weighted(GAME_DATA.dropTable[grade] || GAME_DATA.dropTable.cond);
    const type = Util.weighted(GAME_DATA.dropTypeWeights);
    return this.randomOf(type, rarity);
  },

  // カードパックを開ける（所持金の処理は呼び出し側）
  openPack(pack) {
    const cards = [];
    for (let i = 0; i < pack.count; i++) {
      const rarity = Util.weighted(GAME_DATA.dropTable[pack.table]);
      const type = pack.types ? Util.pick(pack.types) : Util.weighted(GAME_DATA.dropTypeWeights);
      cards.push(this.randomOf(type, rarity));
    }
    // レア度保証：最後の1枚を保証レア以上に差し替え
    if (pack.guarantee && !cards.some(c => this.rarityIndex(c.rarity) >= this.rarityIndex(pack.guarantee))) {
      const pool = GAME_DATA.rarities.slice(this.rarityIndex(pack.guarantee));
      const type = pack.types ? Util.pick(pack.types) : Util.weighted(GAME_DATA.dropTypeWeights);
      cards[cards.length - 1] = this.randomOf(type, Util.pick(pool));
    }
    return cards;
  }
};
</script>
<script>
// ゲーム内カレンダー（全馬共通の日付）と、年明け（1月1週）の処理
'use strict';

const Calendar = {
  W: 48,

  get() {
    const p = Player.data;
    if (!p.calendar) p.calendar = { year: 1, week: GAME_DATA.startWeek };
    return p.calendar;
  },

  // 通算週（何年目・何週目を1つの数にしたもの）。行動済み判定に使う
  abs() { const c = this.get(); return c.year * this.W + c.week; },

  month(week) { return Math.floor(week / 4) + 1; },
  wom(week) { return (week % 4) + 1; },
  weekOf(m, w) { return (m - 1) * 4 + (w - 1); },
  label(week) { return `${this.month(week)}月${this.wom(week)}週`; },
  now() { const c = this.get(); return { year: c.year, week: c.week, month: this.month(c.week), wom: this.wom(c.week) }; },
  fullLabel() { const c = this.get(); return `${c.year}年目 ${this.label(c.week)}`; },

  // 今週から target 週まであと何週か（0〜47）
  until(targetWeek) { return (targetWeek - this.get().week + this.W) % this.W; },

  // 1週すすめる。年が明けたら true
  advance() {
    const c = this.get();
    c.week++;
    if (c.week >= this.W) {
      c.week = 0;
      c.year++;
      return true;
    }
    return false;
  }
};

// 年度表彰（JRA賞）。年明けに前年の成績から選ぶ
const Awards = {
  BONUS: 3000,
  BEST_BONUS: 10000,

  yearHistory(h, year) { return h.history.filter(x => x.year === year); },

  // 前年の成績まとめと受賞
  evaluate(year) {
    const horses = Player.data.horses;
    const awards = [];
    const g1Wins = h => this.yearHistory(h, year).filter(x => x.place === 1 && x.grade === 'g1');
    const give = (h, title, bonus) => {
      awards.push({ horse: h, title, bonus });
      h.titles = h.titles || [];
      h.titles.push(`${year}年目 ${title}`);
      Player.addMoney(bonus);
    };

    // 年度代表馬：その年GⅠを2勝以上した中で、GⅠ勝利数→賞金の多い馬
    const candidates = horses.filter(h => g1Wins(h).length >= 2)
      .sort((a, b) => g1Wins(b).length - g1Wins(a).length || this.prize(b, year) - this.prize(a, year));
    if (candidates.length) give(candidates[0], '年度代表馬', this.BEST_BONUS);

    horses.forEach(h => {
      const wins = g1Wins(h);
      if (!wins.length) return;
      const age = wins[0].age;
      const sex = h.gender === 'male' ? '牡馬' : '牝馬';
      if (age === 2) give(h, `最優秀2歳${sex}`, this.BONUS);
      else if (age === 3) give(h, `最優秀3歳${sex}`, this.BONUS);
      else give(h, `最優秀4歳以上${sex}`, this.BONUS);
      if (wins.some(x => x.distance <= 1400 && x.surface === 'turf')) give(h, '最優秀短距離馬', this.BONUS);
      if (wins.some(x => x.surface === 'dirt')) give(h, '最優秀ダートホース', this.BONUS);
    });

    const summary = { races: 0, wins: 0, g1Wins: 0, prize: 0 };
    horses.forEach(h => this.yearHistory(h, year).forEach(x => {
      summary.races++;
      if (x.place === 1) summary.wins++;
      if (x.place === 1 && x.grade === 'g1') summary.g1Wins++;
      summary.prize += x.prize || 0;
    }));
    return { year, awards, summary };
  },

  prize(h, year) { return this.yearHistory(h, year).reduce((s, x) => s + (x.prize || 0), 0); }
};

<script>
// プレイヤーデータ（所持金・カード・馬・ミッション進行）
'use strict';

const Player = {
  data: null,

  createNew(name) {
    return {
      name: name || 'オーナー',
      money: 10000,
      cards: Object.assign({}, GAME_DATA.starterCards), // { cardId: 枚数 }
      seenCards: Object.keys(GAME_DATA.starterCards),   // 図鑑用（一度でも入手したカード）
      customCards: {},                                  // 殿堂馬から生まれた配合カード
      horses: [],
      retired: [],
      hallOfFame: [],
      missions: { index: 0, claimable: false },
      stats: {
        breedCount: 0, trainCount: 0, equipCount: 0, raceCount: 0, winCount: 0,
        gradedRaceCount: 0, g1RaceCount: 0, g1WinCount: 0, hofCount: 0
      },
      settings: { raceSpeed: 1 },
      calendar: { year: 1, week: GAME_DATA.startWeek },  // ゲーム内の日付（全馬共通）
      records: {},                                      // コースレコード { raceId: { time, name } }
      pvp: { rating: 1000, best: 1000, matches: 0, wins: 0, leagueWins: {} },
      ghosts: [],                                       // フレンドから受け取った対戦コードの馬
      nicksFound: [],                                   // 発見した黄金配合
      tutorialDone: false,
      createdAt: Date.now()
    };
  },

  init() {
    this.data = Save.load() || this.createNew();
    this.normalize();
  },

  // 古いセーブや欠損キーを補完
  normalize() {
    const fresh = this.createNew(this.data.name);
    for (const k of Object.keys(fresh)) if (this.data[k] === undefined) this.data[k] = fresh[k];
    for (const k of Object.keys(fresh.stats)) if (this.data.stats[k] === undefined) this.data.stats[k] = 0;
    this.data.horses.forEach(h => {
      if (!h.rights) h.rights = [];
      if (!h.titles) h.titles = [];
      if (h.actedAt === undefined) h.actedAt = -1;
    });
  },

  save() { Save.save(this.data); },

  reset() {
    Save.reset();
    this.data = this.createNew();
    this.save();
  },

  // ── お金 ──
  canAfford(n) { return this.data.money >= n; },
  addMoney(n) { this.data.money = Math.max(0, Math.round(this.data.money + n)); },

  // ── カード ──
  count(cardId) { return this.data.cards[cardId] || 0; },
  addCard(cardId, n = 1) {
    this.data.cards[cardId] = this.count(cardId) + n;
    if (!this.data.seenCards.includes(cardId)) this.data.seenCards.push(cardId);
  },
  removeCard(cardId, n = 1) {
    if (this.count(cardId) < n) return false;
    this.data.cards[cardId] -= n;
    if (this.data.cards[cardId] <= 0) delete this.data.cards[cardId];
    return true;
  },
  ownedCards(type) {
    return Object.keys(this.data.cards)
      .map(id => Cards.get(id))
      .filter(c => c && (!type || c.type === type));
  },
  hasRarityAtLeast(rarity) {
    const min = Cards.rarityIndex(rarity);
    return this.data.seenCards.some(id => { const c = Cards.get(id); return c && Cards.rarityIndex(c.rarity) >= min; });
  },

  // ── 馬 ──
  horse(id) { return this.data.horses.find(h => h.id === id) || null; },
  stableFull() { return this.data.horses.length >= GAME_DATA.maxStable; },

  bump(stat, n = 1) { this.data.stats[stat] = (this.data.stats[stat] || 0) + n; }
};

// ミッション進行
const Missions = {
  current() { return GAME_DATA.missions[Player.data.missions.index] || null; },

  progress(m) {
    if (m.check === 'srCount') return Player.hasRarityAtLeast('SR') ? 1 : 0;
    return Player.data.stats[m.check] || 0;
  },

  isComplete(m) { return m && this.progress(m) >= m.target; },

  claim() {
    const m = this.current();
    if (!this.isComplete(m)) return null;
    Player.addMoney(m.reward.money || 0);
    (m.reward.cards || []).forEach(id => Player.addCard(id));
    Player.data.missions.index++;
    Player.save();
    return m;
  }
};
</script>
<script>
// 競走馬データと共通ロジック
'use strict';

const STAT_KEYS = ['speed', 'stamina', 'power', 'guts', 'intelligence'];
const DIST_KEYS = ['sprint', 'mile', 'classic', 'long'];

const Horse = {
  // 競走馬オブジェクトを作成（配合・NPC共通）
  create(opts) {
    const gender = opts.gender || (Math.random() < 0.5 ? 'male' : 'female');
    return {
      id: opts.id || Util.uid('h_'),
      name: opts.name || this.randomName(gender),
      rarity: opts.rarity || 'N',
      gender,
      age: opts.age || 2,
      week: 0,
      level: 1,
      exp: 0,
      stats: Object.assign({ speed: 50, stamina: 50, power: 50, guts: 50, intelligence: 50 }, opts.stats),
      caps: Object.assign({}, opts.caps || opts.stats),
      aptitude: Object.assign({ sprint: 50, mile: 50, classic: 50, long: 50, turf: 50, dirt: 50 }, opts.aptitude),
      runningStyle: opts.runningStyle || 'senko',
      growthType: opts.growthType || 'normal',
      condition: opts.condition !== undefined ? opts.condition : 70,
      fatigue: opts.fatigue || 0,
      skills: opts.skills || [],
      rights: [],           // 優先出走権（レースID）
      titles: [],           // JRA賞などの称号
      actedAt: -1,
      route: opts.route || null,
      fatherId: opts.fatherId || '',
      motherId: opts.motherId || '',
      record: { races: 0, wins: 0, seconds: 0, thirds: 0, prizeMoney: 0, g1Wins: 0, gradedWins: 0 },
      history: [],
      bornAt: Date.now(),
      hallOfFame: false
    };
  },

  // gender を渡すと、性別に合わない語（レディ・キングなど）を避ける
  randomName(gender) {
    const avoid = gender === 'male' ? GAME_DATA.nameFemaleOnly : gender === 'female' ? GAME_DATA.nameMaleOnly
      : GAME_DATA.nameFemaleOnly.concat(GAME_DATA.nameMaleOnly);
    const ok = w => !avoid.includes(w);
    return Util.pick(GAME_DATA.namePrefix.filter(ok)) + Util.pick(GAME_DATA.nameSuffix.filter(ok));
  },

  // 血統表（古いセーブには pedigree が無いので親カードから組み立てる）
  pedigree(h) {
    if (h.pedigree) return h.pedigree;
    const f = Cards.get(h.fatherId), m = Cards.get(h.motherId);
    return f && m ? Breeding.pedigreeOf(f, m) : { f: null, m: null, ff: null, fm: null, mf: null, mm: null };
  },

  distCat(distance) {
    return GAME_DATA.distances.find(d => distance <= d.max).key;
  },

  overall(h) {
    return Math.round(STAT_KEYS.reduce((s, k) => s + h.stats[k], 0) / STAT_KEYS.length);
  },
  potential(h) {
    return Math.round(STAT_KEYS.reduce((s, k) => s + h.caps[k], 0) / STAT_KEYS.length);
  },

  bestDistance(h) {
    return DIST_KEYS.reduce((a, b) => (h.aptitude[b] > h.aptitude[a] ? b : a));
  },
  bestSurface(h) { return h.aptitude.turf >= h.aptitude.dirt ? 'turf' : 'dirt'; },

  mainAptText(h) {
    const d = GAME_DATA.distances.find(x => x.key === this.bestDistance(h));
    const s = GAME_DATA.surfaces.find(x => x.key === this.bestSurface(h));
    return `${s.icon}${s.label}・${d.label}`;
  },

  conditionInfo(h) {
    const c = h.condition;
    if (c >= 90) return { label: '絶好調', icon: '😆', cls: 'c-best' };
    if (c >= 70) return { label: '好調', icon: '😊', cls: 'c-good' };
    if (c >= 45) return { label: '普通', icon: '🙂', cls: 'c-normal' };
    if (c >= 25) return { label: '不調', icon: '😟', cls: 'c-bad' };
    return { label: '絶不調', icon: '😫', cls: 'c-worst' };
  },

  fatigueInfo(h) {
    const f = h.fatigue;
    if (f >= 80) return { label: 'ヘトヘト', cls: 'f-max' };
    if (f >= 60) return { label: 'かなり疲れ', cls: 'f-high' };
    if (f >= 35) return { label: '少し疲れ', cls: 'f-mid' };
    return { label: '元気', cls: 'f-low' };
  },

  genderLabel(h) { return h.gender === 'male' ? '♂ 牡' : '♀ 牝'; },

  // 年齢と成長タイプによる成長倍率
  growthMult(h) {
    const table = GAME_DATA.growthTypes[h.growthType].mult;
    return table[Util.clamp(h.age - 2, 0, table.length - 1)];
  },

  expToNext(h) { return 80 + h.level * 40; },

  // 経験値を加え、レベルアップ時は全能力+1（限界まで）
  addExp(h, n) {
    h.exp += n;
    let ups = 0;
    while (h.exp >= this.expToNext(h)) {
      h.exp -= this.expToNext(h);
      h.level++;
      ups++;
      STAT_KEYS.forEach(k => { h.stats[k] = Math.min(h.caps[k], h.stats[k] + 1); });
    }
    return ups;
  },

  // 1週進める（調教・レース・休養のたびに呼ぶ）。誕生日なら true
  // 1週に1回だけ行動できる（調教・レース・休養）
  acted(h) { return h.actedAt === Calendar.abs(); },
  act(h) { h.actedAt = Calendar.abs(); },

  // 週が終わるときの自然な変化（疲労が少し抜け、調子が揺れる）
  weekPass(h) {
    h.fatigue = Util.clamp(h.fatigue - 4, 0, 100);
    h.condition = Util.clamp(h.condition + Util.randInt(-5, 4), 0, 100);
  },

  mustRetire(h) { return h.age >= GAME_DATA.retireAge; },

  // おすすめ路線
  recommendRoute(h) {
    const best = this.bestDistance(h);
    if (best === 'sprint') return 'sprint';
    if (best === 'mile') {
      if (h.gender === 'female' && h.age <= 3 && h.aptitude.turf >= 60) return 'filly';
      return 'mile';
    }
    if (h.age <= 3) return h.gender === 'female' && h.aptitude.mile >= 60 ? 'filly' : 'classic';
    return 'senior';
  },

  routeInfo(id) { return GAME_DATA.routes.find(r => r.id === id); },

  // 素質（限界値の平均）から競走馬のレアリティを決める
  rarityFromPotential(p) {
    if (p >= 90) return 'UR';
    if (p >= 83) return 'SSR';
    if (p >= 75) return 'SR';
    if (p >= 66) return 'R';
    return 'N';
  }
};

<script>
// 配合システム：種牡馬カード＋繁殖牝馬カード → 競走馬
'use strict';

const Breeding = {
  VARIANCE: 5,       // 個体差（標準偏差）
  TRAIT_BONUS: 4,    // 遺伝傾向の能力ボーナス

  fee(father, mother) {
    return GAME_DATA.breedingFee[father.rarity] + GAME_DATA.breedingFee[mother.rarity];
  },

  // 親の得意距離が同じなら相性ボーナス
  compatibility(father, mother) {
    const best = c => DIST_KEYS.reduce((a, b) => (c.apt[b] > c.apt[a] ? b : a));
    let bonus = 0;
    if (best(father) === best(mother)) bonus += 2;
    if ((father.apt.turf >= 80 && mother.apt.turf >= 80) || (father.apt.dirt >= 80 && mother.apt.dirt >= 80)) bonus += 1;
    return bonus;
  },

  // 先祖（自分を含む）のID一覧。殿堂馬カードは先祖情報を持つ。
  lineage(card) { return [card.id, ...(card.ancestors || [])]; },

  // 特殊配合の判定
  specials(father, mother) {
    const list = [];
    const nick = GAME_DATA.nicks.find(n => n.sire === father.id && n.mare === mother.id);
    if (nick) list.push({ key: 'nick', id: nick.sire + '+' + nick.mare, name: `黄金配合「${nick.name}」`, desc: `全能力+${nick.bonus}`, bonus: nick.bonus });
    const shared = this.lineage(father).filter(id => this.lineage(mother).includes(id));
    if (shared.length) {
      const anc = Cards.get(shared[0]);
      list.push({ key: 'inbreed', name: '奇跡の血量（インブリード）', desc: `共通の先祖${anc ? `「${anc.name}」` : ''}の力が濃く出る。得意な能力+6・得意距離の適性アップ`, bonus: 0 });
    }
    if (father.style === mother.style) list.push({ key: 'style', name: '脚質一致', desc: `子は必ず${GAME_DATA.styles[father.style].label}に。スキルも受け継ぎやすい`, bonus: 0 });
    if (father.custom && mother.custom) list.push({ key: 'legend', name: '名馬の結晶', desc: '自家生産の名馬同士。全能力+2', bonus: 2 });
    return list;
  },

  // ランダムを含まない期待値
  expected(father, mother) {
    const specials = this.specials(father, mother);
    const has = k => specials.some(x => x.key === k);
    const specialBonus = specials.reduce((sum, x) => sum + x.bonus, 0);
    const compat = this.compatibility(father, mother);
    const rarityBonus = (Cards.rarityIndex(father.rarity) + Cards.rarityIndex(mother.rarity)) * 0.5;
    const stats = {};
    STAT_KEYS.forEach(k => {
      let wf = 0.5, wm = 0.5, bonus = rarityBonus + compat + specialBonus;
      if (father.trait === k) { wf += 0.1; wm -= 0.1; bonus += this.TRAIT_BONUS; }
      if (mother.trait === k) { wm += 0.1; wf -= 0.1; bonus += this.TRAIT_BONUS; }
      if (father.trait === 'balance') bonus += 2;
      if (mother.trait === 'balance') bonus += 2;
      // 親の高い方の能力が少し引き継がれやすい
      const hi = Math.max(father.stats[k], mother.stats[k]);
      stats[k] = (father.stats[k] * wf + mother.stats[k] * wm) * 0.85 + hi * 0.15 + bonus;
    });
    if (has('inbreed')) {
      const top = STAT_KEYS.reduce((a, b) => (stats[b] > stats[a] ? b : a));
      stats[top] += 6;
    }
    const aptitude = {};
    [...DIST_KEYS, 'turf', 'dirt'].forEach(k => {
      const a = father.apt[k], b = mother.apt[k];
      aptitude[k] = Math.max(a, b) * 0.6 + Math.min(a, b) * 0.4;
    });
    if (has('inbreed')) {
      const best = DIST_KEYS.reduce((a, b) => (aptitude[b] > aptitude[a] ? b : a));
      aptitude[best] = Math.min(100, aptitude[best] + 8);
    }
    return { stats, aptitude, specials };
  },

  // 初心者向けの配合予想
  preview(father, mother) {
    const exp = this.expected(father, mother);
    const avg = STAT_KEYS.reduce((s, k) => s + exp.stats[k], 0) / STAT_KEYS.length;
    const arrows = {};
    STAT_KEYS.forEach(k => {
      const v = exp.stats[k];
      arrows[k] = v >= 82 ? '↑↑↑' : v >= 72 ? '↑↑' : v >= 62 ? '↑' : '→';
    });
    const bestDist = DIST_KEYS.reduce((a, b) => (exp.aptitude[b] > exp.aptitude[a] ? b : a));
    const distOrder = DIST_KEYS.filter(k => exp.aptitude[k] >= exp.aptitude[bestDist] - 8);
    const distLabels = distOrder.map(k => GAME_DATA.distances.find(d => d.key === k).label);
    const surface = exp.aptitude.turf >= exp.aptitude.dirt ? '芝' : 'ダート';
    const compat = this.compatibility(father, mother);
    const score = Util.clamp(Math.round((avg - 45) / 9) + (compat >= 2 ? 1 : 0) + (exp.specials.length ? 1 : 0), 1, 5);

    const topStat = STAT_KEYS.reduce((a, b) => (exp.stats[b] > exp.stats[a] ? b : a));
    const statInfo = GAME_DATA.stats.find(s => s.key === topStat);
    let comment = `${statInfo.label}の高い子供が生まれやすい組み合わせです。`;
    if (compat >= 2) comment += ' 得意距離が同じで相性バツグン！';

    return {
      score, arrows, comment, compat, specials: exp.specials,
      distText: distLabels.length > 1 ? `${distLabels[0]}～${distLabels[distLabels.length - 1]}` : distLabels[0],
      surface,
      fee: this.fee(father, mother)
    };
  },

  // 配合を実行して新しい競走馬を作る（所持金・カード消費は呼び出し側）
  breed(father, mother) {
    const exp = this.expected(father, mother);
    const caps = {};
    STAT_KEYS.forEach(k => {
      caps[k] = Math.round(Util.clamp(exp.stats[k] + Util.gauss() * this.VARIANCE, 30, 110));
    });
    const stats = {};
    const startRate = Util.rand(0.66, 0.74);
    STAT_KEYS.forEach(k => { stats[k] = Math.round(caps[k] * (startRate + Util.rand(-0.03, 0.03))); });

    const aptitude = {};
    Object.keys(exp.aptitude).forEach(k => {
      aptitude[k] = Math.round(Util.clamp(exp.aptitude[k] + Util.gauss() * 7, 10, 100));
    });

    const styleKeys = Object.keys(GAME_DATA.styles);
    const r = Math.random();
    const sameStyle = exp.specials.some(x => x.key === 'style');
    const runningStyle = sameStyle ? father.style : r < 0.4 ? father.style : r < 0.8 ? mother.style : Util.pick(styleKeys);
    const g = Math.random();
    const growthKeys = Object.keys(GAME_DATA.growthTypes);
    const growthType = g < 0.45 ? father.growth : g < 0.9 ? mother.growth : Util.pick(growthKeys);

    const potential = STAT_KEYS.reduce((s, k) => s + caps[k], 0) / STAT_KEYS.length;
    const horse = Horse.create({
      stats, caps, aptitude, runningStyle, growthType,
      rarity: Horse.rarityFromPotential(potential),
      condition: Util.randInt(60, 85),
      fatherId: father.id, motherId: mother.id
    });
    horse.route = Horse.recommendRoute(horse);
    horse.pedigree = this.pedigreeOf(father, mother);
    horse.specials = exp.specials.map(x => x.name);

    // 親のスキルを受け継ぐことがある（スキルカードとして入手）
    let inherited = null;
    if (Math.random() < (sameStyle ? 0.85 : 0.6)) {
      inherited = Math.random() < 0.5 ? father.skill : mother.skill;
      if (!Cards.get(inherited)) inherited = null;
    }
    return { horse, inherited, specials: exp.specials };
  },

  // 3代血統表（父・母・祖父母）のスナップショット
  pedigreeOf(father, mother) {
    const node = c => (c ? { id: c.id, name: c.name, rarity: c.rarity } : null);
    const pp = c => (c.pedigree || {});
    return {
      f: node(father), m: node(mother),
      ff: pp(father).f || null, fm: pp(father).m || null,
      mf: pp(mother).f || null, mm: pp(mother).m || null
    };
  }
};

<script>
// 調教・休養・アイテム使用
'use strict';

const Training = {
  menus: {
    // 1年＝48週なので、1回あたりの伸びは控えめ
    speed: { label: 'スピード調教', icon: '⚡', gains: { speed: 2, power: 0.5 }, fatigue: 13, exp: 10 },
    stamina: { label: 'スタミナ調教', icon: '❤️', gains: { stamina: 2, guts: 0.5 }, fatigue: 13, exp: 10 },
    power: { label: 'パワー調教', icon: '💪', gains: { power: 2, speed: 0.5 }, fatigue: 13, exp: 10 },
    guts: { label: '根性調教', icon: '🔥', gains: { guts: 2, stamina: 0.5 }, fatigue: 11, exp: 10 },
    intelligence: { label: '賢さ調教', icon: '🧠', gains: { intelligence: 2, speed: 0.5 }, fatigue: 7, exp: 10 },
    light: { label: '軽め調教', icon: '🚶', gains: { speed: 0.5, stamina: 0.5, power: 0.5 }, fatigue: 3, condition: 4, exp: 6,
      desc: '少しだけ鍛える。疲れにくく調子をキープ。' },
    rest: { label: '休養', icon: '💤', gains: {}, fatigue: -45, condition: 12, exp: 0, desc: '疲労を大きく回復する。' }
  },

  // 路線ごとに重視する能力
  routeWeights: {
    sprint: { speed: 3, power: 2.5, guts: 1, stamina: 0.6, intelligence: 1 },
    mile: { speed: 3, stamina: 2, power: 1.5, guts: 1, intelligence: 1 },
    classic: { stamina: 2.5, speed: 2.5, power: 1.8, guts: 1.2, intelligence: 1 },
    filly: { speed: 2.8, stamina: 2.2, power: 1.5, guts: 1, intelligence: 1 },
    senior: { stamina: 3, speed: 2.2, guts: 1.8, power: 1.5, intelligence: 1 }
  },

  canTrain(h) {
    if (Horse.mustRetire(h)) return { ok: false, reason: '引退の時期です。' };
    if (Horse.acted(h)) return { ok: false, reason: '今週はもう行動しました。「次の週へ」で進めよう' };
    return { ok: true };
  },

  // 調教効果の倍率（成長タイプ・調子・疲労）
  efficiency(h) {
    const cond = 0.8 + 0.4 * h.condition / 100;
    const fat = h.fatigue >= 80 ? 0.35 : h.fatigue >= 60 ? 0.6 : h.fatigue >= 35 ? 0.85 : 1;
    return Horse.growthMult(h) * cond * fat;
  },

  // 確率的に丸める（小さな値でも成長の可能性を残す）
  roundRandom(v) {
    const f = Math.floor(v);
    return f + (Math.random() < v - f ? 1 : 0);
  },

  train(h, menuKey, itemMult = 1) {
    const menu = this.menus[menuKey];
    const eff = this.efficiency(h);
    const gains = {};
    Object.entries(menu.gains).forEach(([k, base]) => {
      const raw = base * eff * Util.rand(0.8, 1.2) * (k === menuKey ? itemMult : 1);
      const add = Math.min(this.roundRandom(raw), h.caps[k] - h.stats[k]);
      if (add > 0) { h.stats[k] += add; gains[k] = add; }
    });

    let conditionDelta = menu.condition || 0;
    if (menu.fatigue > 0 && h.fatigue >= 70) conditionDelta -= 10; // 疲れているのに追い込むと調子が落ちる
    h.fatigue = Util.clamp(h.fatigue + menu.fatigue, 0, 100);
    Horse.act(h);
    const birthday = false;
    h.condition = Util.clamp(h.condition + conditionDelta, 0, 100);
    const levelUps = Horse.addExp(h, menu.exp);
    Player.bump('trainCount');
    return { menu, gains, levelUps, birthday, capped: Object.keys(menu.gains).length > 0 && Object.keys(gains).length === 0 && eff > 0.5 };
  },

  // おまかせ調教：路線・次のレース・疲労から自動で決める
  autoPlan(h) {
    if (h.fatigue >= 60) return { menu: 'rest', reason: '疲れがたまっているので、休ませます。' };
    if (h.fatigue >= 40 || h.condition < 30) return { menu: 'light', reason: '疲れ気味なので、軽めに調整します。' };

    const route = h.route || Horse.recommendRoute(h);
    const target = Race.targetRace(h);
    const next = target ? target.race : null;
    let weights = Object.assign({}, this.routeWeights[route]);
    let lead = `目標は${Horse.routeInfo(route).name}路線です。`;
    if (target && target.weeks <= 1) {
      return { menu: 'light', reason: `「${next.name}」が${target.weeks === 0 ? '今週' : '来週'}です。レースに向けて軽めに調整します。` };
    }
    if (next) {
      const cat = Horse.distCat(next.distance);
      const catLabel = GAME_DATA.distances.find(d => d.key === cat).label;
      lead = `目標は${Calendar.label(next.week)}の「${next.name}」（${catLabel}・${next.distance}m・あと${target.weeks}週）。`;
      if (cat === 'sprint') { weights.speed += 1; weights.power += 0.5; }
      if (cat === 'long') { weights.stamina += 1.5; }
      if (cat === 'classic') { weights.stamina += 0.7; }
      if (next.surface === 'dirt') weights.power += 0.8;
    }
    // 伸びしろ（限界との差）× 重要度 が一番大きい能力を鍛える
    let best = null, bestScore = -1;
    STAT_KEYS.forEach(k => {
      const room = h.caps[k] - h.stats[k];
      const score = room > 0 ? weights[k] * (room + 3) : 0;
      if (score > bestScore) { bestScore = score; best = k; }
    });
    if (bestScore <= 0) return { menu: 'light', reason: `${lead} 能力が限界に近いので、軽めに調整します。` };
    const label = GAME_DATA.stats.find(s => s.key === best).label;
    return { menu: best, reason: `${lead} ${label}中心に調整します。` };
  },

  // アイテム使用
  useItem(h, itemId) {
    const item = Cards.get(itemId);
    if (!item || item.type !== 'item') return null;
    if (item.use.train && !this.canTrain(h).ok) return null;
    if (!Player.removeCard(itemId)) return null;
    const u = item.use;
    let result;
    if (u.train) {
      result = this.train(h, u.train, u.mult);
    } else {
      result = { gains: {}, levelUps: 0 };
      if (u.fatigue) h.fatigue = Util.clamp(h.fatigue + u.fatigue, 0, 100);
      if (u.condition) h.condition = Util.clamp(h.condition + u.condition, 0, 100);
      if (u.exp) result.levelUps = Horse.addExp(h, u.exp);
      if (u.allCaps) STAT_KEYS.forEach(k => { h.caps[k] += u.allCaps; });
      if (u.allStats) STAT_KEYS.forEach(k => {
        const add = Math.min(u.allStats, h.caps[k] - h.stats[k]);
        if (add > 0) { h.stats[k] += add; result.gains[k] = add; }
      });
    }
    result.item = item;
    return result;
  }
};

<script>
// スキル：装備と、レース中の自動発動判定
'use strict';

const Skills = {
  MAX_SLOTS: 3,
  STYLE_MISMATCH: 0.6, // 脚質が合わないスキルの効果倍率

  get(id) { const c = Cards.get(id); return c && c.type === 'skill' ? c : null; },

  // 優先順位：レアリティが高いほど先に判定
  priority(skill) { return Cards.rarityIndex(skill.rarity); },

  equip(h, skillId) {
    if (h.skills.length >= this.MAX_SLOTS) return { ok: false, reason: 'スキル枠がいっぱいです（最大3つ）。' };
    if (h.skills.includes(skillId)) return { ok: false, reason: '同じスキルは装備できません。' };
    if (!Player.removeCard(skillId)) return { ok: false, reason: 'スキルカードを持っていません。' };
    h.skills.push(skillId);
    Player.bump('equipCount');
    return { ok: true };
  },

  unequip(h, skillId) {
    const i = h.skills.indexOf(skillId);
    if (i < 0) return false;
    h.skills.splice(i, 1);
    Player.addCard(skillId);
    return true;
  },

  isMatch(skill, style) { return !skill.style || skill.style === style; },

  // レース中の状態 ctx がスキル条件を満たすか
  // ctx: { phase, remain, rank, distCat, ground, close }
  conditionMet(skill, ctx) {
    const c = skill.cond;
    if (c.phase && c.phase !== ctx.phase) return false;
    if (c.remainMax !== undefined && !(ctx.remain <= c.remainMax && ctx.remain > 0)) return false;
    if (c.rankMin !== undefined && ctx.rank < c.rankMin) return false;
    if (c.rankMax !== undefined && ctx.rank > c.rankMax) return false;
    if (c.distCat && c.distCat !== ctx.distCat) return false;
    if (c.groundMin !== undefined && ctx.ground < c.groundMin) return false;
    if (c.close && !ctx.close) return false;
    return true;
  },

  // 条件を満たしている間、毎秒この確率で発動判定（賢さで上がる）
  activationChance(intelligence) {
    return Util.clamp(0.18 + intelligence * 0.003, 0.18, 0.6);
  },

  // 効果（脚質が合わなければ弱くなる）
  effectFor(skill, style) {
    const m = this.isMatch(skill, style) ? 1 : this.STYLE_MISMATCH;
    return {
      speed: (skill.effect.speed || 0) * m,
      hp: (skill.effect.hp || 0) * m,
      duration: skill.effect.duration || 1
    };
  }
};
</script>
<script>
// レースシステム
// 「結果計算（simulate）」は表示から完全に分離した純粋な計算。
// 返り値の events（実況）と frames（毎秒の位置）を使って、UI側がログ表示や将来の2Dアニメーションを行う。
'use strict';

const Race = {
  DT: 0.5,             // シミュレーション刻み（秒）
  FRAME_INTERVAL: 0.5, // frames を記録する間隔（秒）
  NPC_VARIANCE: 4,
  SKILL_SCALE: 0.5,     // スキル効果（データ上の数値）を実際の速度補正に変換する係数

  // 脚質ごとの区間速度補正
  styleMult: {
    nige: { start: 1.025, mid: 1.01, corner: 0.998, final: 0.988 },
    senko: { start: 1.015, mid: 1.005, corner: 1.002, final: 0.995 },
    sashi: { start: 0.993, mid: 0.997, corner: 1.008, final: 1.018 },
    oikomi: { start: 0.982, mid: 0.992, corner: 1.012, final: 1.03 }
  },

  // 脚質ごとの体力消費（前に行くほど消耗する）
  styleCost: { nige: 1.05, senko: 1.02, sashi: 1.0, oikomi: 0.98 },

  gradeInfo(race) { return GAME_DATA.grades[race.grade]; },

  AGE_LABEL: { '2': '2歳', '3': '3歳', '3+': '3歳以上', '4+': '4歳以上' },
  FIELD: { g1: 16, g2: 16, g3: 16, op: 14, c3: 14, c2: 14, cond: 14, maiden: 14, debut: 12 },

  // ── レース一覧（カレンダー） ──
  routeOf(r) {
    const young = r.ages === '2' || r.ages === '3';
    if (r.f && young) return 'filly';
    if (young && r.distance >= 1800 && r.surface === 'turf') return 'classic';
    if (r.distance <= 1400) return 'sprint';
    if (r.distance <= 1900) return 'mile';
    return 'senior';
  },

  // 重賞データに週・路線・頭数などを付けたもの（キャッシュ）
  _graded: null,
  gradedAll() {
    if (this._graded) return this._graded;
    this._graded = GAME_DATA.races.map(r => Object.assign({
      kind: 'graded', week: Calendar.weekOf(r.m, r.w), female: !!r.f,
      field: this.FIELD[r.grade], route: this.routeOf(r),
      prize: r.prize || GAME_DATA.grades[r.grade].prize
    }, r));
    return this._graded;
  },
  gradedOn(week) { return this.gradedAll().filter(r => r.week === week); },

  // 平場の条件戦（毎週開催。週ごとに距離・コースが変わる）
  conditionRaces(week) {
    const m = Calendar.month(week);
    const venues = GAME_DATA.venuesByMonth[m - 1];
    const list = [];
    let n = 0;
    const pick = (arr, salt) => arr[(week * 7 + salt * 3) % arr.length];
    const add = (ages, grade, surface, distance, label) => {
      const g = GAME_DATA.grades[grade];
      const r = {
        kind: 'cond', id: `${ages.replace('+', 'p')}_${grade}_${surface}_${distance}`,
        name: `${this.AGE_LABEL[ages]}${label || g.label}`,
        grade, ages, surface, distance, week, m, w: Calendar.wom(week),
        venue: venues[n++ % 2], female: false, field: this.FIELD[grade], prize: g.prize
      };
      r.route = this.routeOf(r);
      list.push(r);
    };
    const T2 = [1200, 1400, 1600, 1800, 2000], D2 = [1200, 1400, 1800];
    const T = [1200, 1400, 1600, 1800, 2000, 2200, 2400], D = [1200, 1400, 1700, 1800, 1900];
    if (m >= 6) { add('2', 'debut', 'turf', pick(T2, 1)); add('2', 'debut', 'dirt', pick(D2, 2)); }
    if (m >= 7) { add('2', 'maiden', 'turf', pick(T2, 3)); add('2', 'maiden', 'dirt', pick(D2, 4)); }
    if (m >= 7) add('2', 'cond', 'turf', pick(T2, 5));
    if (m >= 8) add('2', 'op', 'turf', pick(T2, 6), 'オープン');
    if (m <= 3) { add('3', 'debut', 'turf', pick(T, 7)); add('3', 'debut', 'dirt', pick(D, 8)); }
    if (m <= 9) { add('3', 'maiden', 'turf', pick(T, 9)); add('3', 'maiden', 'dirt', pick(D, 10)); }
    if (m <= 5) { add('3', 'cond', 'turf', pick(T, 11)); add('3', 'cond', 'dirt', pick(D, 12)); add('3', 'op', 'turf', pick(T, 13), 'オープン'); }
    const older = m <= 5 ? '4+' : '3+';
    [['cond', 14], ['c2', 16], ['c3', 18]].forEach(([g, salt]) => { add(older, g, 'turf', pick(T, salt)); add(older, g, 'dirt', pick(D, salt + 1)); });
    add(older, 'op', 'turf', pick(T, 20), 'オープン');
    add(older, 'op', 'dirt', pick(D, 21), 'オープン');
    return list;
  },

  weekRaces(week = Calendar.get().week) { return [...this.gradedOn(week), ...this.conditionRaces(week)]; },

  get(id) { return this.gradedAll().find(r => r.id === id) || this.weekRaces().find(r => r.id === id) || null; },

  // ── 出走条件 ──
  isOpen(h) { return h.record.wins >= 4 || h.record.gradedWins >= 1; },

  ageOk(h, r) {
    if (r.ages === '2') return h.age === 2;
    if (r.ages === '3') return h.age === 3;
    if (r.ages === '3+') return h.age >= 3;
    return h.age >= 4;
  },

  // 重賞の出走に必要な勝利数（優先出走権があれば不要）
  gradedMinWins(r) {
    if (r.ages === '2') return 1;
    if (r.ages === '3') return r.grade === 'g1' ? 2 : 1;
    return r.grade === 'g1' ? 4 : 3;
  },

  eligibility(h, race, opts = {}) {
    const w = h.record.wins;
    if (Horse.mustRetire(h)) return { ok: false, reason: '引退の時期です' };
    if (!opts.ignoreActed && Horse.acted(h)) return { ok: false, reason: '今週は行動済み' };
    if (race.female && h.gender !== 'female') return { ok: false, reason: '牝馬限定' };
    if (!this.ageOk(h, race)) return { ok: false, reason: `${this.AGE_LABEL[race.ages]}限定` };
    if (race.kind === 'graded') {
      const need = this.gradedMinWins(race);
      const right = (h.rights || []).includes(race.id);
      const olderG1 = race.ages !== '2' && race.ages !== '3' && race.grade === 'g1';
      const open = olderG1 ? this.isOpen(h) : w >= need || this.isOpen(h);
      if (!right && !open) {
        return { ok: false, reason: `${need}勝以上${race.ages === '3' && race.grade === 'g1' ? 'か優先出走権' : ''}が必要（あと${Math.max(1, need - w)}勝）`, needWins: true };
      }
    } else {
      const g = race.grade;
      if (g === 'debut' && h.record.races > 0) return { ok: false, reason: 'デビュー前の馬だけ' };
      if (g === 'maiden' && w > 0) return { ok: false, reason: '勝ち上がり済み' };
      const max = { cond: 1, c2: 2, c3: 3 }[g];
      if (max !== undefined && (w > max || this.isOpen(h))) return { ok: false, reason: 'クラスが上です' };
      if (g === 'op' && w < 2 && !this.isOpen(h)) return { ok: false, reason: '2勝以上で出走可' };
    }
    if (!opts.ignoreFatigue && h.fatigue >= 80) return { ok: false, reason: '疲れすぎ。休ませよう' };
    return { ok: true, right: (h.rights || []).includes(race.id) };
  },

  // 適性（距離＋馬場）
  fit(h, race) { return h.aptitude[Horse.distCat(race.distance)] + h.aptitude[race.surface]; },

  // 今週出られるレースの中のおすすめ（適性の合うものから格の高いもの）
  nextRace(h) {
    const ok = this.weekRaces().filter(r => this.eligibility(h, r, { ignoreActed: true, ignoreFatigue: true }).ok);
    if (!ok.length) return null;
    const bestFit = Math.max(...ok.map(r => this.fit(h, r)));
    const suitable = ok.filter(r => this.fit(h, r) >= bestFit - 25);
    return suitable.reduce((a, b) => {
      const d = this.gradeInfo(b).order - this.gradeInfo(a).order;
      return d > 0 || (d === 0 && this.fit(h, b) > this.fit(h, a)) ? b : a;
    });
  },

  // 目標レース：今後 horizon 週の重賞から、出走できて適性の合うもの
  targetRace(h, horizon = 12) {
    const list = this.gradedAll()
      .map(r => ({ race: r, weeks: Calendar.until(r.week) }))
      .filter(x => x.weeks <= horizon && this.fit(h, x.race) >= 130)
      .filter(x => {
        // 年をまたぐ場合は年齢が1つ上がる
        const age = h.age + (Calendar.get().week + x.weeks >= Calendar.W ? 1 : 0);
        return this.eligibility(Object.assign({}, h, { age }), x.race, { ignoreActed: true, ignoreFatigue: true }).ok;
      });
    if (!list.length) return null;
    return list.reduce((a, b) => {
      const sa = this.gradeInfo(a.race).order * 10 + this.fit(h, a.race) / 20 - a.weeks * 0.4;
      const sb = this.gradeInfo(b.race).order * 10 + this.fit(h, b.race) / 20 - b.weeks * 0.4;
      return sb > sa ? b : a;
    });
  },

  // 若い馬限定のレースは相手も若い（少し弱い）
  ageAdjust(race) {
    if (race.kind !== 'graded' && race.grade !== 'op') return 0;
    if (race.ages === '2') return -8;
    if (race.ages === '3') return race.m <= 5 ? -4 : -2;
    return 0;
  },

  // ── 出走馬を作る ──
  makeNpc(race) {
    const base = this.gradeInfo(race).npc + this.ageAdjust(race);
    const cat = Horse.distCat(race.distance);
    const stats = {};
    STAT_KEYS.forEach(k => { stats[k] = base + Util.gauss() * this.NPC_VARIANCE; });
    if (cat === 'sprint') { stats.speed += 3; stats.power += 3; stats.stamina -= 6; }
    if (cat === 'long') { stats.stamina += 8; stats.speed -= 2; }
    if (cat === 'classic') { stats.stamina += 4; }
    STAT_KEYS.forEach(k => { stats[k] = Math.round(Util.clamp(stats[k], 25, 120)); });

    const aptitude = {};
    DIST_KEYS.forEach(k => { aptitude[k] = Util.randInt(20, 80); });
    aptitude.turf = Util.randInt(20, 80);
    aptitude.dirt = Util.randInt(20, 80);
    aptitude[cat] = Util.randInt(70, 100);
    aptitude[race.surface] = Util.randInt(70, 100);

    const runningStyle = Util.weighted({ nige: 18, senko: 32, sashi: 32, oikomi: 18 });
