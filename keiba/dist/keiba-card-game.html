<script>
// スキル：装備と、レース中の自動発動判定
'use strict';

const Skills = {
  MAX_SLOTS: 3,
  STYLE_MISMATCH: 0.6, // 脚質が合わないスキルの効果倍率

  get(id) { const c = Cards.get(id); return c && c.type === 'skill' ? c : null; },

  // 優先順位：レアリティが高いほど先に判定
  priority(skill) { return Cards.rarityIndex(skill.rarity); },

  equip(h, skillId) {
    if (h.skills.length >= this.MAX_SLOTS) return { ok: false, reason: 'スキル枠がいっぱいです（最大3つ）。' };
    if (h.skills.includes(skillId)) return { ok: false, reason: '同じスキルは装備できません。' };
    if (!Player.removeCard(skillId)) return { ok: false, reason: 'スキルカードを持っていません。' };
    h.skills.push(skillId);
    Player.bump('equipCount');
    return { ok: true };
  },

  unequip(h, skillId) {
    const i = h.skills.indexOf(skillId);
    if (i < 0) return false;
    h.skills.splice(i, 1);
    Player.addCard(skillId);
    return true;
  },

  isMatch(skill, style) { return !skill.style || skill.style === style; },

  // レース中の状態 ctx がスキル条件を満たすか
  // ctx: { phase, remain, rank, distCat, ground, close }
  conditionMet(skill, ctx) {
    const c = skill.cond;
    if (c.phase && c.phase !== ctx.phase) return false;
    if (c.remainMax !== undefined && !(ctx.remain <= c.remainMax && ctx.remain > 0)) return false;
    if (c.rankMin !== undefined && ctx.rank < c.rankMin) return false;
    if (c.rankMax !== undefined && ctx.rank > c.rankMax) return false;
    if (c.distCat && c.distCat !== ctx.distCat) return false;
    if (c.groundMin !== undefined && ctx.ground < c.groundMin) return false;
    if (c.close && !ctx.close) return false;
    return true;
  },

  // 条件を満たしている間、毎秒この確率で発動判定（賢さで上がる）
  activationChance(intelligence) {
    return Util.clamp(0.18 + intelligence * 0.003, 0.18, 0.6);
  },

  // 効果（脚質が合わなければ弱くなる）
  effectFor(skill, style) {
    const m = this.isMatch(skill, style) ? 1 : this.STYLE_MISMATCH;
    return {
      speed: (skill.effect.speed || 0) * m,
      hp: (skill.effect.hp || 0) * m,
      duration: skill.effect.duration || 1
    };
  }
};
</script>
<script>
// レースシステム
// 「結果計算（simulate）」は表示から完全に分離した純粋な計算。
// 返り値の events（実況）と frames（毎秒の位置）を使って、UI側がログ表示や将来の2Dアニメーションを行う。
'use strict';

const Race = {
  DT: 0.5,             // シミュレーション刻み（秒）
  FRAME_INTERVAL: 0.5, // frames を記録する間隔（秒）
  NPC_VARIANCE: 4,
  SKILL_SCALE: 0.5,     // スキル効果（データ上の数値）を実際の速度補正に変換する係数

  // 脚質ごとの区間速度補正
  styleMult: {
    nige: { start: 1.025, mid: 1.01, corner: 0.998, final: 0.988 },
    senko: { start: 1.015, mid: 1.005, corner: 1.002, final: 0.995 },
    sashi: { start: 0.993, mid: 0.997, corner: 1.008, final: 1.018 },
    oikomi: { start: 0.982, mid: 0.992, corner: 1.012, final: 1.03 }
  },

  // 脚質ごとの体力消費（前に行くほど消耗する）
  styleCost: { nige: 1.05, senko: 1.02, sashi: 1.0, oikomi: 0.98 },

  get(id) { return GAME_DATA.races.find(r => r.id === id); },
  routeRaces(route) { return GAME_DATA.races.filter(r => r.route === route); },
  gradeInfo(race) { return GAME_DATA.grades[race.grade]; },

  // ── 出走条件 ──
  eligibility(h, race) {
    const w = h.record.wins;
    if (Horse.mustRetire(h)) return { ok: false, reason: '引退の時期です' };
    if (race.female && h.gender !== 'female') return { ok: false, reason: '牝馬限定' };
    if (race.ageMin && h.age < race.ageMin) return { ok: false, reason: `${race.ageMin}歳から` };
    if (race.ageMax && h.age > race.ageMax) return { ok: false, reason: `${race.ageMax}歳まで` };
    if (race.minWins && w < race.minWins) return { ok: false, reason: `${race.minWins}勝以上で出走可（あと${race.minWins - w}勝）` };
    if (race.maxWins !== undefined && w > race.maxWins) return { ok: false, reason: race.maxWins === 0 ? '勝ち上がり済み' : `${race.maxWins}勝以下限定` };
    if (h.fatigue >= 80) return { ok: false, reason: '疲れすぎ。休ませよう' };
    return { ok: true };
  },

  available(h, route) {
    return this.routeRaces(route).map(race => ({ race, elig: this.eligibility(h, race) }));
  },

  // 適性の合うレースの中で、一番格の高いレースをすすめる
  fit(h, race) { return h.aptitude[Horse.distCat(race.distance)] + h.aptitude[race.surface]; },

  nextRace(h, route) {
    const ok = this.available(h, route).filter(x => x.elig.ok || x.elig.reason === '疲れすぎ。休ませよう').map(x => x.race);
    if (!ok.length) return null;
    const bestFit = Math.max(...ok.map(r => this.fit(h, r)));
    const suitable = ok.filter(r => this.fit(h, r) >= bestFit - 25);
    return suitable.reduce((a, b) => {
      const d = this.gradeInfo(b).order - this.gradeInfo(a).order;
      return d > 0 || (d === 0 && this.fit(h, b) > this.fit(h, a)) ? b : a;
    });
  },

  // ── 出走馬を作る ──
  makeNpc(race) {
    const base = this.gradeInfo(race).npc;
    const cat = Horse.distCat(race.distance);
    const stats = {};
    STAT_KEYS.forEach(k => { stats[k] = base + Util.gauss() * this.NPC_VARIANCE; });
    if (cat === 'sprint') { stats.speed += 3; stats.power += 3; stats.stamina -= 6; }
    if (cat === 'long') { stats.stamina += 8; stats.speed -= 2; }
    if (cat === 'classic') { stats.stamina += 4; }
    STAT_KEYS.forEach(k => { stats[k] = Math.round(Util.clamp(stats[k], 25, 120)); });

    const aptitude = {};
    DIST_KEYS.forEach(k => { aptitude[k] = Util.randInt(20, 80); });
    aptitude.turf = Util.randInt(20, 80);
    aptitude.dirt = Util.randInt(20, 80);
    aptitude[cat] = Util.randInt(70, 100);
    aptitude[race.surface] = Util.randInt(70, 100);

    const runningStyle = Util.weighted({ nige: 18, senko: 32, sashi: 32, oikomi: 18 });
    const skillCount = { debut: 0, maiden: Math.random() < 0.4 ? 1 : 0, cond: 1, op: 1, g3: Util.randInt(1, 2), g2: 2, g1: Util.randInt(2, 3) }[race.grade];
    const pool = GAME_DATA.skills.filter(s => (!s.style || s.style === runningStyle) && s.rarity !== 'UR');
    const skills = [];
    while (skills.length < skillCount && pool.length) {
      const s = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      skills.push(s.id);
    }
    return {
      id: Util.uid('npc_'), name: Horse.randomName(), isPlayer: false,
      stats, aptitude, runningStyle, skills,
      condition: Util.randInt(55, 100), fatigue: Util.randInt(0, 20)
    };
  },

  buildField(h, race) {
    const entrants = [{
      id: h.id, name: h.name, isPlayer: true,
      stats: Object.assign({}, h.stats), aptitude: Object.assign({}, h.aptitude),
      runningStyle: h.runningStyle, skills: h.skills.slice(),
      condition: h.condition, fatigue: h.fatigue
    }];
    const used = new Set([h.name]);
    while (entrants.length < race.field) {
      const npc = this.makeNpc(race);
      if (used.has(npc.name)) continue;
      used.add(npc.name);
      entrants.push(npc);
    }
    // 枠順をシャッフル
    for (let i = entrants.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [entrants[i], entrants[j]] = [entrants[j], entrants[i]];
    }
    return entrants;
  },

  rollGround(race) {
    const table = {};
    GAME_DATA.grounds.forEach(g => { table[g.key] = race.surface === 'dirt' ? g.weight + (g.key ? 5 : 0) : g.weight; });
    return Number(Util.weighted(table));
  },

  // ── レース計算（表示とは独立） ──
  simulate(race, entrants, ground) {
    const D = race.distance;
    const distCat = Horse.distCat(D);
    if (ground === undefined) ground = this.rollGround(race);
    const finalStart = D - Math.min(400, D * 0.3);
    const cornerStart = finalStart - Math.max(300, D * 0.15);
    const startEnd = Math.max(200, D * 0.15);
    const phaseAt = pos => (pos < startEnd ? 'start' : pos < cornerStart ? 'mid' : pos < finalStart ? 'corner' : 'final');
    // 脚質補正は距離に依存しないよう、進んだ割合で区間を決める
    const stylePhaseAt = pos => {
      const p = pos / D;
      return p < 0.15 ? 'start' : p < 0.6 ? 'mid' : p < 0.75 ? 'corner' : 'final';
    };

    const runners = entrants.map((e, gate) => {
      const s = e.stats;
      const aptMul = (0.93 + 0.07 * e.aptitude[distCat] / 100) * (0.96 + 0.04 * e.aptitude[race.surface] / 100);
      const groundMul = 1 - ground * 0.006 * (1 - Math.min(s.power, 120) / 130);
      const condMul = (0.98 + 0.02 * e.condition / 100) * (1 - 0.025 * e.fatigue / 100);
      const form = 1 + Util.gauss() * 0.004 * (1.2 - s.intelligence / 250);
      const skills = e.skills.map(id => Skills.get(id)).filter(Boolean)
        .sort((a, b) => Skills.priority(b) - Skills.priority(a));
      const maxHp = 300 + s.stamina * 22 + s.guts * 4;
      return {
        e, gate, pos: 0, v: 0, hp: maxHp, maxHp,
        mul: aptMul * groundMul * condMul * form,
        skills, usedSkills: new Set(), active: [],
        finished: false, time: null, exhaustedLogged: false
      };
    });

    const events = [];
    const frames = [];
    const say = (t, text, extra) => events.push(Object.assign({ t: Math.round(t * 10) / 10, type: 'text', text }, extra));
    const order = () => runners.slice().sort((a, b) => (a.finished && b.finished ? a.time - b.time : b.pos - a.pos));
    const snapshot = () => order().map(r => r.e.id);
    const lengthsBehind = (lead, r) => Math.max(0, (lead.pos - r.pos) / 2.4);
    const checkpointsDone = new Set();
    const checkpoint = (key, label, t, text) => {
      if (checkpointsDone.has(key)) return;
      checkpointsDone.add(key);
      const o = order();
      events.push({
        t: Math.round(t * 10) / 10, type: 'checkpoint', key, label, text,
        order: o.map(r => r.e.id),
        gaps: o.map(r => Math.round(lengthsBehind(o[0], r) * 10) / 10)
      });
    };
    const name = r => r.e.name;

    checkpoint('start', 'スタート', 0, `${race.name}、各馬いっせいにスタート！`);
    let t = 0, lastLeader = null, nextFrame = 0;
    const maxT = D / 8;
    while (runners.some(r => !r.finished) && t < maxT) {
      const ranked = order();
      const leaderPos = ranked[0].pos;

      // ── 実況のチェックポイント（先頭の位置で判定） ──
      if (leaderPos >= Math.min(150, D * 0.1)) {
        const r0 = ranked[0];
        checkpoint('early', '序盤', t, `${name(r0)}がハナを切りました。2番手に${name(ranked[1])}。`);
      }
      if (leaderPos >= cornerStart * 0.6 && D >= 1400) {
        checkpoint('mid', '中盤', t, `中盤に入って先頭は${name(ranked[0])}、2番手に${name(ranked[1])}。`);
      }
      if (D - leaderPos <= 800 && D >= 1400) {
        checkpoint('r800', '残り800m', t, `残り800m！ 各馬が動き始めた！`);
      }
      if (leaderPos >= cornerStart) {
        const movers = ranked.filter(r => (r.e.runningStyle === 'sashi' || r.e.runningStyle === 'oikomi')).slice(0, 2);
        checkpoint('corner', '第4コーナー', t, movers.length
          ? `第4コーナー！ ${movers.map(name).join('、')}が外から進出！`
          : '第4コーナーを回って直線へ！');
      }
      if (D - leaderPos <= 400) checkpoint('r400', '残り400m', t, `残り400m！ 最後の直線！`);
      if (D - leaderPos <= 200) {
        const a = ranked[0], b = ranked[1];
        const close = a.pos - b.pos < 2.4;
        checkpoint('r200', '残り200m', t, close ? `残り200m！ ${name(a)}と${name(b)}の叩き合い！` : `残り200m！ ${name(a)}が抜け出した！`);
      }

      // 最終直線での先頭交代
      if (lastLeader && ranked[0] !== lastLeader && phaseAt(leaderPos) === 'final' && !ranked[0].finished) {
        say(t, `${name(ranked[0])}が先頭に立った！`, { horseId: ranked[0].e.id });
      }
      lastLeader = ranked[0];

      // ── 各馬の移動 ──
      ranked.forEach((r, idx) => {
        if (r.finished) return;
        const s = r.e.stats;
        const phase = phaseAt(r.pos);
        const rank = idx + 1;
        const remain = D - r.pos;

        // スキル判定（1刻みにつき1つまで、優先順位順）
        const neighbor = ranked.some(o => o !== r && !o.finished && Math.abs(o.pos - r.pos) < 1.5);
        const ctx = { phase, remain, rank, distCat, ground, close: phase === 'final' && neighbor };
        for (const sk of r.skills) {
          if (r.usedSkills.has(sk.id) || !Skills.conditionMet(sk, ctx)) continue;
          if (Math.random() > Skills.activationChance(s.intelligence) * this.DT) continue;
          r.usedSkills.add(sk.id);
          const eff = Skills.effectFor(sk, r.e.runningStyle);
          if (eff.hp) r.hp = Math.min(r.maxHp, r.hp + eff.hp);
          if (eff.speed) r.active.push({ speed: eff.speed, until: t + eff.duration });
          events.push({
            t: Math.round(t * 10) / 10, type: 'skill', horseId: r.e.id, isPlayer: r.e.isPlayer,
            skillId: sk.id, text: `${sk.icon}「${sk.name}」発動！`, sub: `${name(r)} ${eff.speed ? '加速！' : '体力回復！'}`,
            matched: Skills.isMatch(sk, r.e.runningStyle)
          });
          break;
        }
        r.active = r.active.filter(a => a.until > t);
        const skillMul = 1 + this.SKILL_SCALE * r.active.reduce((sum, a) => sum + a.speed, 0);

        // 目標速度
        let base = 16 + s.speed * 0.012;
        if (phase === 'final') base = 16 + s.speed * 0.0135 + s.guts * 0.0015;
        let target = base * this.styleMult[r.e.runningStyle][stylePhaseAt(r.pos)] * r.mul * skillMul;
        target *= 1 + Util.gauss() * 0.002;
        let costMul = 1;
        if (phase === 'final' && r.hp > 0) {
          target *= 1.02 + s.guts * 0.0001; // ラストスパート
          costMul = 1.4;
        }
        if (r.hp <= 0) {
          target *= 0.93 + s.guts * 0.0003; // バテた
          if (!r.exhaustedLogged && phase !== 'start') {
            r.exhaustedLogged = true;
            if (r.e.isPlayer || rank <= 3) say(t, `${name(r)}、苦しくなった！`, { horseId: r.e.id, isPlayer: r.e.isPlayer });
          }
        }

        // 加速（パワー）
        const accel = Math.min(1, (0.3 + s.power * 0.004) * this.DT);
        r.v += (target - r.v) * accel;
        const move = r.v * this.DT;
        r.hp -= move * 0.75 * Math.pow(r.v / 16.5, 2) * costMul * this.styleCost[r.e.runningStyle];
        const prev = r.pos;
        r.pos += move;
        if (r.pos >= D) {
          r.finished = true;
          r.time = t + this.DT * ((D - prev) / (r.pos - prev));
          r.pos = D;
        }
      });

      t += this.DT;
      if (t >= nextFrame) {
        frames.push({ t, pos: runners.map(r => Math.round(r.pos * 10) / 10) });
        nextFrame += this.FRAME_INTERVAL;
      }
    }

    // ── 着順 ──
    const final = runners.slice().sort((a, b) => (a.time ?? 1e9) - (b.time ?? 1e9));
    const winner = final[0];
    const finish = final.map((r, i) => {
      const prev = final[i - 1];
      return {
        id: r.e.id, name: r.e.name, isPlayer: r.e.isPlayer, place: i + 1,
        style: r.e.runningStyle,
        time: r.time,
        margin: prev ? this.marginText((r.time - prev.time) * r.v / 2.4) : ''
      };
    });
    const second = final[1];
    const goalText = second && second.time - winner.time < 0.08
      ? `${name(winner)}、${name(second)}をわずかに抑えてゴール！`
      : `${name(winner)}、先頭でゴールイン！`;
    checkpoint('goal', 'ゴール', winner.time, goalText);

    return {
      raceId: race.id, name: race.name, grade: race.grade, distance: D, surface: race.surface,
      distCat, ground,
      entrants: runners.map(r => ({ id: r.e.id, name: r.e.name, owner: r.e.owner || '', isPlayer: r.e.isPlayer, isGhost: !!r.e.isGhost, style: r.e.runningStyle, gate: r.gate + 1 })),
      finish, events: events.sort((a, b) => a.t - b.t), frames,
      phases: { startEnd, cornerStart, finalStart }
    };
  },

  marginText(lengths) {
    if (lengths < 0.08) return 'ハナ';
    if (lengths < 0.2) return 'アタマ';
    if (lengths < 0.35) return 'クビ';
    if (lengths > 10) return '大差';
    const half = Math.round(lengths * 4) / 4;
    const whole = Math.floor(half);
    const frac = { 0: '', 0.25: '1/4', 0.5: '1/2', 0.75: '3/4' }[half - whole];
    return whole ? `${whole}${frac ? ' ' + frac : ''}馬身` : `${frac}馬身`;
  },

  timeText(sec) {
    const m = Math.floor(sec / 60);
    const s = (sec - m * 60).toFixed(1);
    return `${m}:${s.padStart(4, '0')}`;
  },

  // ── 報酬（結果をプレイヤーデータへ反映） ──
  PRIZE_RATE: [1, 0.4, 0.25, 0.15, 0.1],

  applyResult(h, race, result) {
    const me = result.finish.find(f => f.isPlayer);
    const place = me.place;
    const g = this.gradeInfo(race);
    const prize = Math.round(g.prize * (this.PRIZE_RATE[place - 1] || 0));
    const exp = Math.round(g.exp * (place === 1 ? 1.5 : place <= 3 ? 1.1 : 0.7));

    const rec = h.record;
    rec.races++;
    if (place === 1) rec.wins++;
    if (place === 2) rec.seconds++;
    if (place === 3) rec.thirds++;
    rec.prizeMoney += prize;
    const graded = ['g3', 'g2', 'g1'].includes(race.grade);
    if (place === 1 && graded) rec.gradedWins++;
    if (place === 1 && race.grade === 'g1') rec.g1Wins++;
    h.history.unshift({
      raceId: race.id, name: race.name, grade: race.grade, distance: race.distance, surface: race.surface,
      place, field: result.finish.length, age: h.age, ground: result.ground
    });
    if (h.history.length > 40) h.history.length = 40;

    Player.addMoney(prize);
    Player.bump('raceCount');
    if (place === 1) Player.bump('winCount');
    if (graded) Player.bump('gradedRaceCount');
    if (race.grade === 'g1') Player.bump('g1RaceCount');
    if (race.grade === 'g1' && place === 1) Player.bump('g1WinCount');

    // カード報酬：1着は確定（GⅠは2枚）、2〜3着は50%（ひとつ下の格の確率表）
    const cards = [];
    const drawCount = place === 1 ? (race.grade === 'g1' ? 2 : 1) : place <= 3 && Math.random() < 0.5 ? 1 : 0;
    const gradeKeys = Object.keys(GAME_DATA.grades);
    const dropGrade = place === 1 ? race.grade : gradeKeys[Math.max(0, gradeKeys.indexOf(race.grade) - 1)];
    for (let i = 0; i < drawCount; i++) {
      const c = Cards.drawReward(dropGrade);
      const isNew = !Player.data.seenCards.includes(c.id);
      Player.addCard(c.id);
      cards.push({ card: c, isNew });
    }

    // 疲労・調子・成長
    h.fatigue = Util.clamp(h.fatigue + 18 + race.distance / 200, 0, 100);
    const birthday = Horse.advanceWeek(h);
    h.condition = Util.clamp(h.condition + (place === 1 ? 10 : place <= 3 ? 3 : -4), 0, 100);
    const levelUps = Horse.addExp(h, exp);

    // コースレコード（自分の馬の最速タイム）
    const records = Player.data.records;
    const prevRec = records[race.id];
    const newRecord = !prevRec || me.time < prevRec.time;
    if (newRecord) records[race.id] = { time: me.time, name: h.name, place, at: Date.now() };

    return { place, prize, exp, cards, levelUps, birthday, field: result.finish.length, newRecord: newRecord && !!prevRec };
  }
};
</script>
<script>
// 対戦：リーグ戦（CPU馬主との対戦・レーティング）と、対戦コードによるフレンド対戦
// どちらもレース計算は Race.simulate を使い、オートで決着する。
'use strict';

const Pvp = {
  FIELD: 8,
  FATIGUE: 10,

  league(id) { return GAME_DATA.leagues.find(l => l.id === id); },

  isUnlocked(league) { return Player.data.pvp.rating >= league.minRating; },

  canEnter(h) {
    if (Horse.mustRetire(h)) return { ok: false, reason: '引退の時期です' };
    if (h.fatigue >= 80) return { ok: false, reason: '疲れすぎ。休ませよう' };
    return { ok: true };
  },

  // リーグの能力上限を適用
  capStats(stats, cap) {
    const out = {};
    STAT_KEYS.forEach(k => { out[k] = cap ? Math.min(stats[k], cap) : stats[k]; });
    return out;
  },

  playerEntrant(h, cap) {
    return {
      id: h.id, name: h.name, owner: Player.data.name, isPlayer: true,
      stats: this.capStats(h.stats, cap), aptitude: Object.assign({}, h.aptitude),
      runningStyle: h.runningStyle, skills: h.skills.slice(),
      condition: h.condition, fatigue: h.fatigue
    };
  },

  // CPUのライバル馬主の馬（スキル3つ持ち）
  makeRival(level, course, cap, usedNames, allowUR) {
    const cat = Horse.distCat(course.distance);
    const stats = {};
    STAT_KEYS.forEach(k => { stats[k] = Math.round(Util.clamp(level + Util.gauss() * 5, 30, 125)); });
    if (cat === 'long') stats.stamina += 6;
    if (cat === 'sprint') stats.power += 4;
    const aptitude = {};
    DIST_KEYS.forEach(k => { aptitude[k] = Util.randInt(30, 85); });
    aptitude.turf = Util.randInt(30, 85);
    aptitude.dirt = Util.randInt(30, 85);
    aptitude[cat] = Util.randInt(75, 100);
    aptitude[course.surface] = Util.randInt(75, 100);
    const runningStyle = Util.pick(Object.keys(GAME_DATA.styles));
    const pool = GAME_DATA.skills.filter(s => (!s.style || s.style === runningStyle) && (allowUR || s.rarity !== 'UR'));
    const skills = [];
    while (skills.length < 3 && pool.length) skills.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0].id);
    let name;
    do { name = Horse.randomName(); } while (usedNames.has(name));
    usedNames.add(name);
    return {
      id: Util.uid('rv_'), name, owner: Util.pick(GAME_DATA.rivalOwners) + '厩舎', isPlayer: false,
      stats: this.capStats(stats, cap), aptitude, runningStyle, skills,
      condition: Util.randInt(60, 100), fatigue: Util.randInt(0, 15)
    };
  },

  makeRace(id, name, grade, course) {
    return { id, name, grade, distance: course.distance, surface: course.surface, field: this.FIELD };
  },

  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  },

  // ── リーグ戦 ──
  buildLeagueMatch(h, leagueId) {
    const league = this.league(leagueId);
    const course = Util.pick(GAME_DATA.leagueCourses);
    const label = `${course.surface === 'turf' ? '芝' : 'ダート'}${course.distance}m`;
    const race = this.makeRace('league_' + league.id, `${league.name}（${label}）`, league.grade, course);
    const used = new Set([h.name]);
    const field = [this.playerEntrant(h, league.statCap)];
    while (field.length < this.FIELD) field.push(this.makeRival(league.npc, course, league.statCap, used, league.id === 'gold'));
    return { kind: 'league', league, race, field: this.shuffle(field), ground: Race.rollGround(race) };
  },

  applyLeague(h, match, result) {
    const me = result.finish.find(f => f.isPlayer);
    const place = me.place;
    const pvp = Player.data.pvp;
    const delta = GAME_DATA.ratingDelta[place - 1] ?? -16;
    const before = pvp.rating;
    pvp.rating = Math.max(800, pvp.rating + delta);
    pvp.best = Math.max(pvp.best, pvp.rating);
    pvp.matches++;
    if (place === 1) {
      pvp.wins++;
      pvp.leagueWins[match.league.id] = (pvp.leagueWins[match.league.id] || 0) + 1;
    }
    const prize = Math.round(match.league.prize * (Race.PRIZE_RATE[place - 1] || 0));
    Player.addMoney(prize);
    const cards = [];
    if (place === 1) {
      const c = Cards.drawReward(match.league.grade);
      const isNew = !Player.data.seenCards.includes(c.id);
      Player.addCard(c.id);
      cards.push({ card: c, isNew });
    }
    const exp = place === 1 ? 60 : place <= 3 ? 40 : 25;
    const levelUps = Horse.addExp(h, exp);
    h.fatigue = Util.clamp(h.fatigue + this.FATIGUE, 0, 100);
    // 新しいリーグ解放の判定
    const unlocked = GAME_DATA.leagues.filter(l => before < l.minRating && pvp.rating >= l.minRating);
    return { place, prize, exp, cards, levelUps, field: result.finish.length, rating: pvp.rating, delta, unlocked };
  },

  // ── 対戦コード（フレンド対戦） ──
  PREFIX: 'UMA1.',

  toB64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  fromB64(b64) {
    const s = b64.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(s + '='.repeat((4 - s.length % 4) % 4));
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  },
  checksum(str) {
    let h = 7;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 999983;
    return h.toString(36);
  },

  exportCode(h) {
    const data = {
      n: h.name, o: Player.data.name, r: h.rarity, g: h.gender === 'male' ? 1 : 0,
      s: STAT_KEYS.map(k => h.stats[k]),
      a: [...DIST_KEYS, 'turf', 'dirt'].map(k => h.aptitude[k]),
      st: h.runningStyle, k: h.skills.slice(0, 3),
      w: h.record.wins, rc: h.record.races, g1: h.record.g1Wins
    };
    const body = this.toB64(JSON.stringify(data));
    return this.PREFIX + body + '.' + this.checksum(body);
  },

  importCode(code) {
    const text = String(code || '').trim().replace(/\s+/g, '');
    if (!text.startsWith(this.PREFIX)) throw new Error('対戦コードの形式が違います（UMA1. で始まるコードを貼り付けてね）');
    const rest = text.slice(this.PREFIX.length);
    const dot = rest.lastIndexOf('.');
    const body = rest.slice(0, dot), sum = rest.slice(dot + 1);
    if (dot < 0 || this.checksum(body) !== sum) throw new Error('コードが壊れています。最後まで正しくコピーできているか確認してね');
    let d;
    try { d = JSON.parse(this.fromB64(body)); } catch (e) { throw new Error('コードを読み取れませんでした'); }
    if (!Array.isArray(d.s) || d.s.length !== 5 || !Array.isArray(d.a) || d.a.length !== 6) throw new Error('コードの中身が正しくありません');
    const num = (v, lo, hi) => Util.clamp(Math.round(Number(v) || 0), lo, hi);
    const stats = {}, aptitude = {};
    STAT_KEYS.forEach((k, i) => { stats[k] = num(d.s[i], 1, 140); });
    [...DIST_KEYS, 'turf', 'dirt'].forEach((k, i) => { aptitude[k] = num(d.a[i], 0, 100); });
    return {
      id: Util.uid('gh_'),
      name: String(d.n || '名無しの馬').slice(0, 12),
      owner: String(d.o || 'フレンド').slice(0, 12),
      rarity: GAME_DATA.rarities.includes(d.r) ? d.r : 'N',
      gender: d.g ? 'male' : 'female',
      stats, aptitude,
      runningStyle: GAME_DATA.styles[d.st] ? d.st : 'senko',
      skills: (Array.isArray(d.k) ? d.k : []).filter(id => Skills.get(id)).slice(0, 3),
      record: { wins: num(d.w, 0, 999), races: num(d.rc, 0, 999), g1Wins: num(d.g1, 0, 999) },
      vs: { win: 0, lose: 0 },
      addedAt: Date.now()
    };
  },

  addGhost(code) {
    const g = this.importCode(code);
    const list = Player.data.ghosts;
    const dup = list.find(x => x.name === g.name && x.owner === g.owner);
    if (dup) { Object.assign(dup, g, { id: dup.id, vs: dup.vs }); return dup; }
    list.unshift(g);
    if (list.length > 12) list.length = 12;
    return g;
  },

  ghostEntrant(g, cap) {
    return {
      id: 'e_' + g.id, ghostId: g.id, name: g.name, owner: g.owner + '厩舎', isPlayer: false, isGhost: true,
      stats: this.capStats(g.stats, cap), aptitude: Object.assign({}, g.aptitude),
      runningStyle: g.runningStyle, skills: g.skills.slice(), condition: 85, fatigue: 0
    };
  },

  buildFriendMatch(h, ghostIds, course, cap) {
    const label = `${course.surface === 'turf' ? '芝' : 'ダート'}${course.distance}m`;
    const race = this.makeRace('friend', `フレンド対戦（${label}）`, 'op', course);
    const field = [this.playerEntrant(h, cap)];
    const used = new Set([h.name]);
    ghostIds.slice(0, this.FIELD - 1).forEach(id => {
      const g = Player.data.ghosts.find(x => x.id === id);
      if (g) { field.push(this.ghostEntrant(g, cap)); used.add(g.name); }
    });
    // 足りない枠はCPUで埋める（参加馬の平均くらいの強さ）
    const avg = field.reduce((s, e) => s + STAT_KEYS.reduce((t, k) => t + e.stats[k], 0) / 5, 0) / field.length;
    while (field.length < this.FIELD) field.push(this.makeRival(avg - 3, course, cap, used, false));
    return { kind: 'friend', race, field: this.shuffle(field), ground: Race.rollGround(race), cap };
  },

  applyFriend(h, match, result) {
    const me = result.finish.find(f => f.isPlayer);
    const vs = [];
    result.finish.forEach(f => {
      const e = match.field.find(x => x.id === f.id);
      if (!e || !e.isGhost) return;
      const g = Player.data.ghosts.find(x => x.id === e.ghostId);
      if (!g) return;
      const won = me.place < f.place;
      g.vs[won ? 'win' : 'lose']++;
      vs.push({ name: g.name, owner: g.owner, won });
    });
    const exp = 20;
    const levelUps = Horse.addExp(h, exp);
    h.fatigue = Util.clamp(h.fatigue + this.FATIGUE, 0, 100);
    return { place: me.place, prize: 0, exp, cards: [], levelUps, field: result.finish.length, vs };
  }
};
</script>
<script>
// 引退・殿堂入り。名馬は配合カードになって血統を次の世代へつなぐ。
'use strict';

const HallOfFame = {
  qualifies(h) { return h.record.g1Wins >= 3 || h.record.wins >= 10; },

  wonAll(h, crown) {
    const crownRaces = GAME_DATA.races.filter(r => r.crown === crown).map(r => r.id);
    return crownRaces.every(id => h.history.some(x => x.raceId === id && x.place === 1));
  },

  titles(h) {
    const t = [];
    const g1Won = h.history.filter(x => x.place === 1 && x.grade === 'g1').map(x => Race.get(x.raceId)).filter(Boolean);
    if (this.wonAll(h, 'classic')) t.push('三冠馬');
    if (this.wonAll(h, 'tiara')) t.push('ティアラの女王');
    if (h.record.g1Wins >= 5) t.push('伝説の王者');
    if (h.record.wins >= 10) t.push(h.gender === 'female' ? '不屈の女王' : '不屈の名馬');
    if (g1Won.some(r => r.route === 'sprint')) t.push('スプリント王');
    if (g1Won.some(r => r.route === 'mile')) t.push('マイル王');
    if (g1Won.some(r => r.route === 'senior')) t.push('古馬の王者');
    if (g1Won.some(r => r.surface === 'dirt')) t.push('ダートの覇者');
    if (g1Won.some(r => r.distance >= 3000)) t.push('最強ステイヤー');
    return t;
  },

  mainWins(h) {
    const seen = new Set();
    return h.history
      .filter(x => x.place === 1 && ['g1', 'g2', 'g3'].includes(x.grade))
      .sort((a, b) => GAME_DATA.grades[b.grade].order - GAME_DATA.grades[a.grade].order)
      .filter(x => (seen.has(x.raceId) ? false : seen.add(x.raceId)))
      .slice(0, 4)
      .map(x => `${x.name}（${GAME_DATA.grades[x.grade].label}）`);
  },

  // 先祖ID（父母とその先祖）。インブリード判定に使う
  ancestorsOf(h) {
    const ids = [];
    [h.fatherId, h.motherId].forEach(id => {
      const c = Cards.get(id);
      if (c) ids.push(c.id, ...(c.ancestors || []));
    });
    return [...new Set(ids)].slice(0, 30);
  },

  // 引退馬から配合カードを作る（重賞を勝った馬のみ）
  makeBreedingCard(h, inHall) {
    const overall = Horse.overall(h);
    let ri = Cards.rarityIndex(Horse.rarityFromPotential(overall));
    if (h.record.g1Wins >= 1) ri++;
    if (inHall) ri++;
    const rarity = GAME_DATA.rarities[Util.clamp(ri, 0, 4)];
    const stats = {};
    STAT_KEYS.forEach(k => { stats[k] = Math.min(100, h.stats[k]); });
    const trait = STAT_KEYS.reduce((a, b) => (stats[b] > stats[a] ? b : a));
    return {
      id: 'c_' + h.id, type: h.gender === 'male' ? 'sire' : 'mare', custom: true,
      name: h.name, rarity, stats,
      apt: Object.assign({}, h.aptitude),
      style: h.runningStyle, growth: h.growthType, trait,
      skill: h.skills[0] || null,
      pedigree: { f: Horse.pedigree(h).f, m: Horse.pedigree(h).m },
      ancestors: this.ancestorsOf(h),
      desc: `${inHall ? '🏛 殿堂馬。' : ''}${h.record.races}戦${h.record.wins}勝（GⅠ ${h.record.g1Wins}勝）`
    };
  },

  retire(h) {
    const p = Player.data;
    p.horses = p.horses.filter(x => x.id !== h.id);
    h.skills.forEach(id => Player.addCard(id)); // 装備スキルは手元に戻る
    const inHall = this.qualifies(h);
    let card = null;
    if (inHall || h.record.gradedWins >= 1) {
      card = this.makeBreedingCard(h, inHall);
      if (!card.skill) delete card.skill;
      p.customCards[card.id] = card;
      Player.addCard(card.id);
    }
    const entry = {
      id: h.id, name: h.name, gender: h.gender, rarity: h.rarity,
      record: Object.assign({}, h.record),
      titles: this.titles(h), mainWins: this.mainWins(h),
      father: (Cards.get(h.fatherId) || {}).name || '不明',
      mother: (Cards.get(h.motherId) || {}).name || '不明',
      pedigree: Horse.pedigree(h),
      overall: Horse.overall(h), retiredAge: h.age, retiredAt: Date.now(),
      cardId: card ? card.id : null
    };
    if (inHall) {
      h.hallOfFame = true;
      p.hallOfFame.unshift(entry);
      Player.bump('hofCount');
    } else {
      p.retired.unshift(entry);
      if (p.retired.length > 30) p.retired.length = 30;
    }
    return { inHall, card, entry };
  }
};
</script>
<script>
// 画面描画（ゲームロジックは持たない。操作は App.* を呼ぶ）
'use strict';

const UI = {
  state: {
    screen: 'home',
    params: {},
    horseTab: 'status',
    breed: { father: null, mother: null },
    cardTab: 'owned',
    cardType: 'all',
    cardRarity: 'all',
    cardQuery: '',
    raceHorse: null,
    raceRoute: null,
    raceMode: 'route',
    league: 'bronze',
    friendPick: [],
    friendCourse: 1,
    friendCap: 0
  },

  el(id) { return document.getElementById(id); },

  show(screen, params = {}) {
    this.state.screen = screen;
    this.state.params = params;
    if (typeof RaceView !== 'undefined' && screen !== 'raceView') RaceView.stop();
    this.render();
    window.scrollTo(0, 0);
  },

  render() {
    const s = this.state.screen;
    this.renderHeader();
    const views = {
      home: () => this.homeView(),
      stable: () => this.stableView(),
      horse: () => this.horseView(this.state.params.id),
      cards: () => this.cardsView(),
      breed: () => this.breedView(),
      race: () => this.raceView(),
      hof: () => this.hofView(),
      records: () => this.recordsView(),
      raceView: () => RaceView.view()
    };
    this.el('main').innerHTML = (views[s] || views.home)();
    const navKey = { horse: 'stable', hof: 'home', records: 'home', raceView: 'race' }[s] || s;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === navKey));
    if (s === 'raceView') RaceView.mount();
  },

  renderHeader() {
    const p = Player.data;
    const cardCount = Object.values(p.cards).reduce((a, b) => a + b, 0);
    this.el('topbar').innerHTML = `
      <div class="brand" onclick="UI.show('home')">🐎🃏 <span>馬主カード</span></div>
      <div class="wallet">
        <span class="chip" title="所持金">💰 ${Util.money(p.money)}</span>
        <span class="chip" title="所持カード">🃏 ${cardCount}</span>
      </div>`;
  },

  // ─────────── 共通パーツ ───────────
  help(key) { return `<button class="help" onclick="event.stopPropagation();App.help('${key}')" aria-label="用語解説">？</button>`; },

  rarity(r) { return `<span class="rar rar-${r}">${r}</span>`; },

  gradeBadge(grade) {
    const g = GAME_DATA.grades[grade];
    return `<span class="grade grade-${grade}">${g.short}</span>`;
  },

  styleTag(style) {
    const s = GAME_DATA.styles[style];
    return `<span class="tag">${s.icon} ${s.label}</span>`;
  },

  statRow(key, value, cap) {
    const info = GAME_DATA.stats.find(s => s.key === key);
    const pct = Util.clamp(value / 120 * 100, 0, 100);
    const capPct = cap !== undefined ? Util.clamp(cap / 120 * 100, 0, 100) : null;
    return `<div class="stat-row">
      <div class="stat-label">${info.icon} ${info.label}${this.help(key)}</div>
      <div class="bar"><div class="bar-fill stat-${key}" style="width:${pct}%"></div>
        ${capPct !== null ? `<div class="bar-cap" style="left:${capPct}%" title="限界"></div>` : ''}</div>
      <div class="stat-val"><b>${value}</b>${cap !== undefined ? `<small>/${cap}</small>` : ''} <span class="g">${Util.grade(value)}</span></div>
    </div>`;
  },

  aptGrid(apt) {
    const d = GAME_DATA.distances.map(x => `<div class="apt"><span>${x.label}</span><b>${Util.stars(apt[x.key])}</b><small>${Util.aptMark(apt[x.key])}</small></div>`).join('');
    const s = GAME_DATA.surfaces.map(x => `<div class="apt"><span>${x.icon}${x.label}</span><b>${Util.stars(apt[x.key])}</b><small>${Util.aptMark(apt[x.key])}</small></div>`).join('');
    return `<div class="apt-title">距離${this.help('distance')}</div><div class="apt-grid">${d}</div>
      <div class="apt-title">馬場${this.help('surface')}</div><div class="apt-grid">${s}</div>`;
  },

  // 種牡馬・繁殖牝馬カード
  breedCard(c, opts = {}) {
    const t = Cards.types[c.type];
    const st = GAME_DATA.stats.map(s => `<div class="mini-stat"><span>${s.icon}</span><b>${Util.stars(c.stats[s.key])}</b></div>`).join('');
    const apt = [...GAME_DATA.surfaces, ...GAME_DATA.distances]
      .map(x => `<span class="apt-chip">${x.label || x.key}${Util.aptMark(c.apt[x.key])}</span>`).join('');
    const trait = c.trait === 'balance' ? 'バランス' : (GAME_DATA.stats.find(s => s.key === c.trait) || {}).label;
    const skill = c.skill ? Cards.get(c.skill) : null;
    return `<div class="gcard ${t.color} rcard-${c.rarity} ${opts.selected ? 'selected' : ''} ${opts.cls || ''}" ${opts.onclick ? `onclick="${opts.onclick}"` : ''}>
      <div class="gcard-head">${this.rarity(c.rarity)}<span class="gtype">${t.icon} ${t.label}</span>${opts.count ? `<span class="count">×${opts.count}</span>` : ''}</div>
      <div class="gcard-art">${c.type === 'sire' ? '🐎' : '🦄'}${c.custom ? '<span class="legend">🏛</span>' : ''}</div>
      <div class="gcard-name">${Util.esc(c.name)}</div>
      <div class="mini-stats">${st}</div>
      <div class="apt-chips">${apt}</div>
      <div class="gcard-foot">${GAME_DATA.styles[c.style].icon}${GAME_DATA.styles[c.style].label}・遺伝：${trait}${skill ? `<br>🎴 ${skill.name}` : ''}</div>
    </div>`;
  },

  skillCard(c, opts = {}) {
    const style = c.style ? `${GAME_DATA.styles[c.style].icon}${GAME_DATA.styles[c.style].label}向け` : '全脚質OK';
    return `<div class="gcard skill rcard-${c.rarity} ${opts.cls || ''}" ${opts.onclick ? `onclick="${opts.onclick}"` : ''}>
      <div class="gcard-head">${this.rarity(c.rarity)}<span class="gtype">🎴 スキル</span>${opts.count ? `<span class="count">×${opts.count}</span>` : ''}</div>
      <div class="gcard-art">${c.icon}</div>
      <div class="gcard-name">${Util.esc(c.name)}</div>
      <div class="gcard-desc"><b>条件：</b>${c.condText}<br>${c.desc}</div>
      <div class="gcard-foot">${style}</div>
      ${opts.extra || ''}
    </div>`;
  },

  itemCard(c, opts = {}) {
    return `<div class="gcard item rcard-${c.rarity} ${opts.cls || ''}" ${opts.onclick ? `onclick="${opts.onclick}"` : ''}>
      <div class="gcard-head">${this.rarity(c.rarity)}<span class="gtype">🎒 アイテム</span>${opts.count ? `<span class="count">×${opts.count}</span>` : ''}</div>
      <div class="gcard-art">${c.icon}</div>
      <div class="gcard-name">${Util.esc(c.name)}</div>
      <div class="gcard-desc">${c.desc}</div>
      ${opts.extra || ''}
    </div>`;
  },

  anyCard(c, opts) {
    if (c.type === 'skill') return this.skillCard(c, opts);
    if (c.type === 'item') return this.itemCard(c, opts);
    return this.breedCard(c, opts);
  },

  silhouette(c) {
    return `<div class="gcard silhouette rcard-${c.rarity}"><div class="gcard-head">${this.rarity(c.rarity)}<span class="gtype">${Cards.types[c.type].label}</span></div>
      <div class="gcard-art">❔</div><div class="gcard-name">？？？？</div><div class="gcard-desc">まだ見つけていないカード</div></div>`;
  },

  // 競走馬カード（厩舎一覧用）
  horseCard(h, opts = {}) {
    const cond = Horse.conditionInfo(h);
    const fat = Horse.fatigueInfo(h);
    const ov = Horse.overall(h);
    return `<div class="hcard rcard-${h.rarity}" onclick="${opts.onclick !== undefined ? opts.onclick : `UI.show('horse',{id:'${h.id}'})`}">
      <div class="hcard-top">${this.rarity(h.rarity)}<span class="hname">${Util.esc(h.name)}</span><span class="ovr" title="総合評価">${Util.grade(ov)}</span></div>
      <div class="hcard-art">🏇</div>
      <div class="hcard-info">
        <span>${Horse.genderLabel(h)}</span><span>${h.age}歳</span><span>Lv.${h.level}</span>
      </div>
      <div class="hcard-info">
        <span>${Horse.mainAptText(h)}</span>${this.styleTag(h.runningStyle)}
      </div>
      <div class="hcard-info">
        <span class="${cond.cls}">${cond.icon} ${cond.label}</span><span class="${fat.cls}">😓 ${fat.label}</span>
      </div>
      <div class="hcard-rec">${h.record.races}戦${h.record.wins}勝${h.record.g1Wins ? `・GⅠ ${h.record.g1Wins}勝` : ''}</div>
    </div>`;
  },

  modal(html, opts = {}) {
    const m = this.el('modal');
    m.innerHTML = `<div class="modal-box ${opts.cls || ''}" role="dialog">
      ${opts.noClose ? '' : '<button class="modal-x" onclick="UI.closeModal()" aria-label="閉じる">✕</button>'}${html}</div>`;
    m.classList.add('open');
    m.onclick = e => { if (e.target === m && !opts.noClose) UI.closeModal(); };
  },
  closeModal() { this.el('modal').classList.remove('open'); this.el('modal').innerHTML = ''; },

  toast(msg, type = '') {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = msg;
    const box = this.el('toasts');
    while (box.children.length >= 3) box.firstChild.remove();
    box.appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3100);
  },

      <div class="home-links">
        <button class="panel link-card" onclick="UI.show('hof')"><span>🏛</span><b>殿堂</b><small>${p.hallOfFame.length}頭</small></button>
        <button class="panel link-card" onclick="UI.show('records')"><span>📊</span><b>記録・ランキング</b><small>レコードと名馬</small></button>

  horseView(id) {

          <div class="hh-tags">

            <div><small>Lv.${h.level}</small><div class="bar thin"><div class="bar-fill exp" style="width:${h.exp / Horse.expToNext(h) * 100}%"></div></div></div>
          </div>

            <span class="${cond.cls}">${cond.icon} 調子：${cond.label}${this.help('condition')}</span>
            <span class="${fat.cls}">😓 疲労：${fat.label}${this.help('fatigue')}</span>

  horseStatus(h) {
    const rec = Horse.recommendRoute(h);
    const s = GAME_DATA.styles[h.runningStyle];
    return `
      <section class="panel"><h3>能力</h3>
        ${STAT_KEYS.map(k => this.statRow(k, h.stats[k], h.caps[k])).join('')}

      </section>
      <section class="panel"><h3>適性</h3>${this.aptGrid(h.aptitude)}</section>
      <section class="panel"><h3>脚質${this.help('style')}</h3>
        <div class="style-box"><span class="style-big">${s.icon}</span><div><b>${s.label}</b><p>${s.desc}</p></div></div>
      </section>
      <section class="panel"><h3>目標路線</h3>
        <p class="rec">💡 この馬は <b>${Horse.routeInfo(rec).icon}${Horse.routeInfo(rec).name}</b> 路線がおすすめ！</p>
        <div class="route-pick">${GAME_DATA.routes.map(r => `<button class="${h.route === r.id ? 'active' : ''}" onclick="App.setRoute('${h.id}','${r.id}')">${r.icon} ${r.name}</button>`).join('')}</div>
      </section>
      <section class="panel"><h3>🌳 血統表</h3>
        ${this.pedigreeTree(Horse.pedigree(h))}

      </section>
      <section class="panel"><h3>📤 対戦コード</h3>

        <button class="btn" onclick="App.showCode('${h.id}')">対戦コードを表示</button>
      </section>`;

  // 3代血統表（父・母とその両親）
  pedigreeTree(pd) {
    const cell = (n, cls, label) => `<div class="pt ${cls}"><small>${label}</small>${n ? `<b>${Util.esc(n.name)}</b>${this.rarity(n.rarity)}` : '<b class="muted">―</b>'}</div>`;
    return `<div class="ptree">
      ${cell(pd.f, 'sire p1', '父')}${cell(pd.m, 'mare p1', '母')}
      ${cell(pd.ff, 'sire p2', '父の父')}${cell(pd.fm, 'mare p2', '父の母')}${cell(pd.mf, 'sire p2', '母の父')}${cell(pd.mm, 'mare p2', '母の母')}
    </div>`;
  },

  horseTrain(h) {
    const plan = Training.autoPlan(h);
    const eff = Training.efficiency(h);
    const effLabel = eff >= 1.1 ? '◎ 絶好の伸び時' : eff >= 0.85 ? '○ よく伸びる' : eff >= 0.6 ? '△ 伸びにくい' : '× ほとんど伸びない';
    const items = Player.ownedCards('item');
    const menuBtn = (k, m) => {
      const gains = Object.keys(m.gains).map(s => GAME_DATA.stats.find(x => x.key === s).icon).join('');
      const fatTxt = m.fatigue > 0 ? `疲労+${m.fatigue}` : `疲労${m.fatigue}`;
      return `<button class="train-btn ${k === plan.menu ? 'suggest' : ''}" onclick="App.train('${h.id}','${k}')">
        <span class="ti">${m.icon}</span><b>${m.label}</b><small>${gains || '回復'}・${fatTxt}</small></button>`;
    };
    return `
      <section class="panel auto-train">
        <h3>🤖 おまかせ調教</h3>
        <p>${plan.reason}</p>
        <button class="btn primary big" onclick="App.autoTrain('${h.id}')">おまかせで1週すすめる</button>
        <button class="btn" onclick="App.autoTrain('${h.id}',4)">おまかせ×4週</button>
      </section>
      <section class="panel">
        <h3>🏋️ 調教メニュー <small class="muted">成長度：${effLabel}</small></h3>
        <div class="train-grid">${Object.entries(Training.menus).map(([k, m]) => menuBtn(k, m)).join('')}</div>
        ${h.fatigue >= 60 ? '<p class="warn">⚠ 疲れがたまっています。休養させよう！</p>' : ''}
      </section>
      <section class="panel">
        <h3>🎒 アイテムを使う</h3>
        ${items.length ? `<div class="item-list">${items.map(c => `<button class="item-btn" onclick="App.useItem('${h.id}','${c.id}')">
          ${this.rarity(c.rarity)} ${c.icon} <b>${c.name}</b> ×${Player.count(c.id)}<small>${c.desc}</small></button>`).join('')}</div>`
          : '<p class="muted">アイテムカードを持っていません。レースやショップで手に入ります。</p>'}
      </section>`;
  },

  horseSkills(h) {
    const owned = Player.ownedCards('skill').sort((a, b) => Number(Skills.isMatch(b, h.runningStyle)) - Number(Skills.isMatch(a, h.runningStyle)) || Cards.rarityIndex(b.rarity) - Cards.rarityIndex(a.rarity));
    const slots = [0, 1, 2].map(i => {
      const id = h.skills[i];
      if (!id) return `<div class="slot empty-slot">スロット${i + 1}<br><small>空き</small></div>`;
      const sk = Skills.get(id);
      const match = Skills.isMatch(sk, h.runningStyle);
      return `<div class="slot rcard-${sk.rarity}"><div class="slot-icon">${sk.icon}</div><b>${sk.name}</b>
        <small>${sk.condText}</small>${match ? '' : '<small class="warn">脚質不一致：効果ダウン</small>'}
        <button class="btn small" onclick="App.unequip('${h.id}','${id}')">外す</button></div>`;
    }).join('');
    return `
      <section class="panel"><h3>🎴 装備スキル（${h.skills.length}/3）${this.help('skill')}</h3>
        <div class="slots">${slots}</div>
        <p class="muted small">レース中、条件を満たすと自動で発動します（1レース1回）。賢さが高いと発動しやすい！</p>
      </section>
      <section class="panel"><h3>所持スキルカード</h3>
        ${owned.length ? `<div class="cgrid">${owned.map(c => {
          const match = Skills.isMatch(c, h.runningStyle);
          return this.skillCard(c, {
            count: Player.count(c.id),
            extra: `<div class="${match ? 'ok' : 'warn'} small">${match ? '✔ 脚質ぴったり' : '△ 脚質が違うので効果ダウン'}</div>
              <button class="btn small primary" ${h.skills.length >= 3 || h.skills.includes(c.id) ? 'disabled' : ''} onclick="App.equip('${h.id}','${c.id}')">装備する</button>`
          });
        }).join('')}</div>` : '<p class="muted">スキルカードがありません。レースで勝って手に入れよう！</p>'}
      </section>`;
  },

  horseRecord(h) {
    const r = h.record;
    return `
      <section class="panel"><h3>🏆 戦績</h3>
        <div class="record-big">${r.races}戦 <b>${r.wins}</b>勝 <small>[${r.wins}-${r.seconds}-${r.thirds}-${r.races - r.wins - r.seconds - r.thirds}]</small></div>
        <div class="hero-stats">
          <div><small>獲得賞金</small><b>${Util.money(r.prizeMoney)}</b></div>
          <div><small>重賞勝利</small><b>${r.gradedWins}</b></div>
          <div><small>GⅠ勝利</small><b>${r.g1Wins}</b></div>
        </div>
        ${HallOfFame.qualifies(h) ? '<p class="ok">🏛 殿堂入りの条件を満たしています！引退すると殿堂入りします。</p>' : `<p class="muted small">殿堂入り条件：GⅠ 3勝 or 通算10勝${this.help('hof')}</p>`}
      </section>
      <section class="panel"><h3>レース履歴</h3>
        ${h.history.length ? `<table class="hist"><tr><th>着</th><th>レース</th><th>条件</th></tr>
          ${h.history.map(x => `<tr class="${x.place === 1 ? 'win' : ''}"><td>${x.place}/${x.field}</td><td>${this.gradeBadge(x.grade)} ${x.name}</td><td>${x.surface === 'turf' ? '芝' : 'ダ'}${x.distance}・${x.age}歳</td></tr>`).join('')}
        </table>` : '<p class="muted">まだレースに出ていません。</p>'}
      </section>
      <section class="panel danger-zone"><h3>引退</h3>
        <p class="muted small">引退すると厩舎から外れます。重賞を勝った馬は配合カードになります。装備スキルは手元に戻ります。</p>
        <button class="btn danger" onclick="App.retire('${h.id}')">引退させる</button>
      </section>`;
  },

  // ─────────── カード ───────────
  cardsView() {
    const st = this.state;
    const tabs = [['owned', '所持カード'], ['dex', '📖 図鑑'], ['shop', '🛒 ショップ']];
    let body = '';
    if (st.cardTab === 'shop') body = this.shopView();
    else {
      const types = [['all', 'すべて'], ['sire', '♂ 種牡馬'], ['mare', '♀ 繁殖牝馬'], ['skill', '🎴 スキル'], ['item', '🎒 アイテム']];
      const rars = ['all', ...GAME_DATA.rarities];
      const q = st.cardQuery.trim();
      const match = c => (st.cardType === 'all' || c.type === st.cardType) && (st.cardRarity === 'all' || c.rarity === st.cardRarity)
        && (!q || c.name.includes(q) || (c.desc || '').includes(q));
      const filters = `<div class="filters">
        <div class="chips">${types.map(([k, l]) => `<button class="${st.cardType === k ? 'active' : ''}" onclick="UI.state.cardType='${k}';UI.render()">${l}</button>`).join('')}</div>
        <div class="chips">${rars.map(r => `<button class="${st.cardRarity === r ? 'active' : ''}" onclick="UI.state.cardRarity='${r}';UI.render()">${r === 'all' ? '全レア' : r}</button>`).join('')}</div>
        <input class="search" type="search" placeholder="🔍 カード名で検索" value="${Util.esc(st.cardQuery)}" oninput="UI.state.cardQuery=this.value;clearTimeout(UI._q);UI._q=setTimeout(()=>{UI.render();const i=document.querySelector('.search');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)">
      </div>`;
      const sortFn = (a, b) => Object.keys(Cards.types).indexOf(a.type) - Object.keys(Cards.types).indexOf(b.type) || Cards.rarityIndex(b.rarity) - Cards.rarityIndex(a.rarity);
      if (st.cardTab === 'owned') {
        const list = Player.ownedCards().filter(match).sort(sortFn);
        body = filters + (list.length ? `<div class="cgrid">${list.map(c => this.anyCard(c, { count: Player.count(c.id), onclick: `App.cardDetail('${c.id}')` })).join('')}</div>` : '<p class="muted">該当するカードがありません。</p>');
      } else {
        const all = Cards.all().filter(match).sort(sortFn);
        const seen = new Set(Player.data.seenCards);
        const got = Cards.all().filter(c => seen.has(c.id)).length;
        body = `<p class="dex-progress">収集率：<b>${got}</b> / ${Cards.all().length}</p>` + filters +
          `<div class="cgrid">${all.map(c => seen.has(c.id) ? this.anyCard(c, { onclick: `App.cardDetail('${c.id}')` }) : this.silhouette(c)).join('')}</div>`;
      }
    }
    return `<h2 class="screen-title">🃏 カード</h2>
      <div class="seg">${tabs.map(([k, l]) => `<button class="${st.cardTab === k ? 'active' : ''}" onclick="UI.state.cardTab='${k}';UI.render()">${l}</button>`).join('')}</div>
      ${body}`;
  },

  shopView() {
    const items = GAME_DATA.items.filter(i => i.price);
    return `<p class="muted">所持金：<b>${Util.money(Player.data.money)}</b></p>
      <h3 class="sub-title">🃏 カードパック</h3>
      <div class="packs">${GAME_DATA.packs.map(pk => `<div class="pack">
        <div class="pack-icon">${pk.icon}</div><b>${pk.name}</b><small>${pk.desc}</small>
        <button class="btn primary" ${Player.canAfford(pk.price) ? '' : 'disabled'} onclick="App.buyPack('${pk.id}')">💰 ${Util.money(pk.price)}</button>
      </div>`).join('')}</div>
      <h3 class="sub-title">🎒 アイテム</h3>
      <div class="cgrid">${items.map(c => this.itemCard(c, {
        count: Player.count(c.id),
        extra: `<button class="btn small primary" ${Player.canAfford(c.price) ? '' : 'disabled'} onclick="App.buy('${c.id}')">💰 ${Util.money(c.price)}</button>`
      })).join('')}</div>`;
  },

  // ─────────── 配合 ───────────
  breedView() {
    const b = this.state.breed;
    const father = b.father && Player.count(b.father) ? Cards.get(b.father) : null;
    const mother = b.mother && Player.count(b.mother) ? Cards.get(b.mother) : null;
    const step = !father ? 1 : !mother ? 2 : 3;
    const steps = ['父カードを選ぼう！', '母カードを選ぼう！', '配合開始！'];
    const slot = (c, label, kind) => c
      ? `<div class="breed-slot filled ${kind}" onclick="UI.state.breed.${kind === 'sire' ? 'father' : 'mother'}=null;UI.render()">${this.rarity(c.rarity)}<b>${Util.esc(c.name)}</b><small>タップで変更</small></div>`
      : `<div class="breed-slot ${kind} ${(step === 1 && kind === 'sire') || (step === 2 && kind === 'mare') ? 'pulse' : ''}">${label}<br><small>未選択</small></div>`;

    let body = '';
    if (step < 3) {
      const type = step === 1 ? 'sire' : 'mare';
      const list = Player.ownedCards(type).sort((a, b2) => Cards.rarityIndex(b2.rarity) - Cards.rarityIndex(a.rarity));
      body = `<div class="cgrid">${list.map(c => this.breedCard(c, { onclick: `App.pickParent('${type}','${c.id}')`, count: Player.count(c.id) })).join('')}</div>`;
    } else {
      const pv = Breeding.preview(father, mother);
      body = `<section class="panel preview">
        <h3>🔮 配合予想</h3>
        <div class="pv-score">おすすめ度：<b>${'★'.repeat(pv.score)}${'☆'.repeat(5 - pv.score)}</b></div>
        <p class="pv-comment">「${pv.comment}」</p>
        ${pv.specials.length ? `<div class="specials">${pv.specials.map(x => `<div class="special-box"><b>✨ ${x.name}</b><small>${x.desc}</small></div>`).join('')}</div>` : ''}
        <div class="pv-grid">${GAME_DATA.stats.map(s => `<div>${s.icon} ${s.label}<b>${pv.arrows[s.key]}</b></div>`).join('')}</div>
        <p>得意：<b>${pv.surface}・${pv.distText}</b></p>
        <p class="muted small">※ 同じ配合でも、生まれる馬には個体差があります。</p>
        <div class="fee">配合料：<b>${Util.money(pv.fee)}</b> ${Player.data.stats.breedCount === 0 ? '<span class="ok">（初回は無料！）</span>' : ''}</div>
        ${Player.stableFull() ? `<p class="warn">⚠ 厩舎がいっぱいです（最大${GAME_DATA.maxStable}頭）。馬を引退させてください。</p>` : ''}
        <button class="btn primary big glow" ${Player.stableFull() ? 'disabled' : ''} onclick="App.breed()">🧬 配合開始！</button>
      </section>
      <div class="cols2">${this.breedCard(father)}${this.breedCard(mother)}</div>`;
    }
    return `<h2 class="screen-title">🧬 配合</h2>
      <div class="steps">${steps.map((s, i) => `<div class="${i + 1 === step ? 'active' : i + 1 < step ? 'done' : ''}">${i + 1}. ${s}</div>`).join('')}</div>
      <div class="breed-slots">${slot(father, '♂ 父', 'sire')}<div class="x">✕</div>${slot(mother, '♀ 母', 'mare')}</div>
      <p class="breed-hint">${step === 1 ? '👇 まず父カード（種牡馬）を選ぼう！' : step === 2 ? '👇 次に母カード（繁殖牝馬）を選ぼう！' : '準備OK！ 配合して新しい馬を誕生させよう！'}</p>
      ${body}
      ${this.nickList()}`;
  },

  // 黄金配合リスト（発見すると名前と組み合わせが表示される）
  nickList() {
    const found = Player.data.nicksFound;
    return `<details class="panel nick-list"><summary>✨ 黄金配合リスト（発見 ${found.length}/${GAME_DATA.nicks.length}）</summary>
      <p class="muted small">特定の父と母を組み合わせると「黄金配合」になり、能力にボーナスがつきます。低レアの組み合わせもあるよ！</p>
      ${GAME_DATA.nicks.map(n => {
        const key = n.sire + '+' + n.mare;
        const f = Cards.get(n.sire), m = Cards.get(n.mare);
        return found.includes(key)
          ? `<div class="nick found">✨ <b>${n.name}</b>：${f.name} × ${m.name}（全能力+${n.bonus}）</div>`
          : `<div class="nick">❔ ？？？：${this.rarity(f.rarity)}の種牡馬 × ${this.rarity(m.rarity)}の繁殖牝馬</div>`;
      }).join('')}
    </details>`;
  },

  // ─────────── レース選択 ───────────
  raceView() {
    const p = Player.data;
    if (!p.horses.length) return `<h2 class="screen-title">🏇 レース</h2><div class="empty">🐣<p>出走できる馬がいません。<br>まずは配合で馬を作ろう！</p><button class="btn primary big" onclick="UI.show('breed')">🧬 配合へ</button></div>`;
    const st = this.state;
    if (!st.raceHorse || !Player.horse(st.raceHorse)) st.raceHorse = p.horses[0].id;
    const h = Player.horse(st.raceHorse);
    const modes = [['route', '🏇 路線レース'], ['league', '⚔ リーグ戦'], ['friend', '🤝 フレンド対戦']];
    const head = `<h2 class="screen-title">🏇 レース</h2>
      <div class="seg">${modes.map(([k, l]) => `<button class="${st.raceMode === k ? 'active' : ''}" onclick="UI.state.raceMode='${k}';UI.render()">${l}</button>`).join('')}</div>
      <div class="chips horse-pick">${p.horses.map(x => `<button class="${x.id === h.id ? 'active' : ''}" onclick="UI.state.raceHorse='${x.id}';UI.state.raceRoute=null;UI.render()">${Util.esc(x.name)}</button>`).join('')}</div>`;
    if (st.raceMode === 'league') return head + this.leagueView(h);
    if (st.raceMode === 'friend') return head + this.friendView(h);
    const rec = Horse.recommendRoute(h);
    if (!st.raceRoute) st.raceRoute = h.route || rec;
    const route = Horse.routeInfo(st.raceRoute);
    const races = Race.available(h, st.raceRoute);
    const cond = Horse.conditionInfo(h);
    const fat = Horse.fatigueInfo(h);

    return `${head}
      <section class="panel race-horse">
        <div><b>${Util.esc(h.name)}</b> ${Horse.genderLabel(h)} ${h.age}歳 ${this.styleTag(h.runningStyle)}</div>
        <div class="muted small">${Horse.mainAptText(h)}・${h.record.wins}勝・<span class="${cond.cls}">${cond.icon}${cond.label}</span>・<span class="${fat.cls}">😓${fat.label}</span></div>
        <p class="rec">💡 この馬は <b>${Horse.routeInfo(rec).icon}${Horse.routeInfo(rec).name}</b> 路線がおすすめ！</p>
      </section>
      <div class="routes">${GAME_DATA.routes.map(r => `<button class="route-btn ${r.id === st.raceRoute ? 'active' : ''}" onclick="UI.state.raceRoute='${r.id}';UI.render()">
        <span class="ri">${r.icon}</span>${r.name}${r.id === rec ? '<em>おすすめ</em>' : ''}</button>`).join('')}</div>
      <section class="panel route-desc"><b>${route.icon} ${route.name}</b>（${route.range}）<p class="muted">${route.desc}<br>重要能力：${route.key}</p></section>
      <div class="race-list">${races.map(({ race, elig }) => this.raceRow(h, race, elig)).join('')}</div>
      <p class="muted small">レースの格${this.help('grade')}：勝ち星を重ねると上のクラスに挑戦できます。</p>`;
  },

  raceRow(h, race, elig) {
    const cat = Horse.distCat(race.distance);
    const g = GAME_DATA.grades[race.grade];
    const dl = GAME_DATA.distances.find(d => d.key === cat);
    const sl = GAME_DATA.surfaces.find(s => s.key === race.surface);
    return `<div class="race-row ${elig.ok ? '' : 'locked'}">
      <div class="rr-head">${this.gradeBadge(race.grade)}<b>${race.name}</b>${race.female ? '<span class="tag">牝馬限定</span>' : ''}</div>
      <div class="rr-info">${sl.icon}${sl.label} ${race.distance}m（${dl.label}）・${race.field}頭・1着賞金 ${Util.money(g.prize)}</div>
      <div class="rr-apt">この馬の適性：距離 <b>${Util.stars(h.aptitude[cat])}</b> 馬場 <b>${Util.stars(h.aptitude[race.surface])}</b></div>
      ${elig.ok ? `<button class="btn primary" onclick="App.prepareRace('${h.id}','${race.id}')">出走する</button>` : `<div class="lock">🔒 ${elig.reason}</div>`}
    </div>`;

        <div class="legend-card">
          <div class="lc-top">🏛 LEGEND</div>

          ${e.titles.length ? `<div class="lc-title">称号：「${e.titles[0]}」${e.titles.length > 1 ? `<small>ほか ${e.titles.slice(1).join('・')}</small>` : ''}</div>` : ''}

        </div>`).join('')}</div>`
        : `<div class="empty">🏛<p>まだ殿堂馬はいません。<br>GⅠ 3勝、または通算10勝した馬を引退させると殿堂入り！</p></div>`}`;

        <p class="muted small">CPUのライバル馬主7人と8頭立てで対戦。順位でレーティングが上下し、上位リーグが解放されます。週は進みません（疲労+${Pvp.FATIGUE}）。</p>
      </section>
      <div class="league-list">${GAME_DATA.leagues.map(l => {
        const open = Pvp.isUnlocked(l);

        ${can.ok ? `<button class="btn primary big" onclick="App.prepareLeague('${h.id}')">⚔ 対戦相手を探す</button>` : `<p class="lock">🔒 ${can.reason}</p>`}

  league_capNote(h) {
    const l = Pvp.league(this.state.league);

    return over.length ? `<br><small class="muted">※ ${over.map(k => GAME_DATA.stats.find(x => x.key === k).label).join('・')}は${l.statCap}に制限されます</small>` : '';

  // ─────────── フレンド対戦 ───────────
  friendView(h) {
    const st = this.state;
    const ghosts = Player.data.ghosts;

    const can = Pvp.canEnter(h);
    return `<section class="panel">
        <h3>📥 対戦コードを追加</h3>
        <p class="muted small">フレンドの「対戦コード」（馬の詳細 → 能力タブ）を貼り付けると、その馬と対戦できます。</p>
        <textarea id="ghost-code" class="code-box" rows="3" placeholder="UMA1.xxxxx..."></textarea>
        <button class="btn primary" onclick="App.addGhost()">追加する</button>
        <button class="btn" onclick="App.showCode('${h.id}')">📤 ${Util.esc(h.name)}のコード</button>
      </section>
      <section class="panel">
        <h3>🤝 対戦する馬を選ぶ（最大7頭）</h3>
        ${ghosts.length ? `<div class="ghost-list">${ghosts.map(g => {
          const on = st.friendPick.includes(g.id);
          return `<div class="ghost ${on ? 'on' : ''}" onclick="App.toggleGhost('${g.id}')">
            <span class="check">${on ? '✅' : '⬜'}</span>
            <div class="ghost-main">${this.rarity(g.rarity)} <b>${Util.esc(g.name)}</b> ${GAME_DATA.styles[g.runningStyle].icon}<br>
              <small>${Util.esc(g.owner)}厩舎・${g.record.races}戦${g.record.wins}勝・総合 ${Util.grade(Math.round(STAT_KEYS.reduce((a, k) => a + g.stats[k], 0) / 5))}・対戦成績 ${g.vs.win}勝${g.vs.lose}敗</small></div>
