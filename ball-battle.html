<title>ボールバトル・アリーナ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;700;800&display=swap">
<style>
/* Layout: one narrow vertical column like a phone arena — loadout screen, then HUD / square arena / controls. Single dark arcade look by choice. */
:root{
  --bg:#0c0e18; --panel:#151827; --line:#2a2f48; --ink:#f4efe4; --muted:#9097b3;
  --red:#ff5a4e; --blue:#3fa9ff; --gold:#ffcf4a; --good:#5be3a1;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS 1p","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);margin:0;padding-block:16px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,7vw,36px);line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 .b{color:var(--gold)}
.lead{color:var(--muted);font-size:13px;margin:4px 0 0;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---- setup ---- */
.sides{display:grid;grid-template-columns:1fr;gap:12px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--tc)}
.side.red{--tc:var(--red)} .side.blue{--tc:var(--blue)}
.sideHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sideHead b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--tc)}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.charBtn{background:#0f1220;border:1px solid var(--line);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;min-width:0}
.charBtn .em{font-size:34px;line-height:1;height:64px;display:grid;place-items:center}
.charBtn .em img{height:64px;width:auto;display:block}
.charBtn .nm{font-weight:800;font-size:15px}
.charBtn .st{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.charBtn[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,#0f1220)}
.skills{display:flex;flex-direction:column;gap:6px}
.skillBtn{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:#0f1220;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left}
.skillBtn .ic{font-size:22px;text-align:center}
.skillBtn .sn{font-weight:800;font-size:14px}
.skillBtn .sd{font-size:11.5px;color:var(--muted);line-height:1.45}
.skillBtn .sq{font-size:11px;color:var(--ink);opacity:.75;font-style:italic;line-height:1.45}
.skillBtn .cd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.skillBtn[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,#0f1220)}
.skillBtn[aria-pressed="true"] .cd{color:var(--ink)}
.skillBtn:disabled{opacity:.4;cursor:not-allowed}
.skillBtn.passive{border-style:dashed;border-color:color-mix(in srgb,var(--gold) 55%,var(--line));cursor:default}
.skillBtn.passive small{font-size:10.5px;font-weight:800;color:var(--gold);margin-left:4px}
.primary{font-family:var(--display);font-weight:400;font-size:20px;background:var(--gold);color:#1b1505;border:0;border-radius:12px;padding:14px;letter-spacing:.06em}
.primary:disabled{opacity:.45}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
/* 開始ボタンは画面下に貼り付けて、長い編成画面でもすぐ押せるように */
.startBar{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;gap:6px;margin-top:12px;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* 顔アイコン（立ち絵の頭部を切り抜き。通常/攻撃は同時に出さず、クラスで完全に切り替える） */
.face{display:inline-block;width:1.35em;height:1.35em;border-radius:50%;background:#e9e6ef;overflow:hidden;vertical-align:-.32em;position:relative;flex:none}
.face i{position:absolute;inset:0;background-repeat:no-repeat}
.face .a{display:none}
.face.atk{background:#d9c2ff;box-shadow:0 0 0 2px #b46bff}
.face.atk .n{display:none}
.face.atk .a{display:block}

/* ---- battle ---- */
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;gap:6px;min-width:0;border-top:3px solid var(--tc)}
.hp.red{--tc:var(--red)} .hp.blue{--tc:var(--blue)}
.hpTop{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:800;min-width:0}
.hpTop .nm{color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;min-width:0}
.hpTop .v{font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.bar{height:11px;background:#07080f;border-radius:6px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--tc);border-radius:6px;transition:width .12s}
.bar u{position:absolute;inset:0 auto 0 0;background:#fff8;border-radius:6px;transition:width .6s .25s}
.hp.low .bar i{animation:low .5s steps(2) infinite}
@keyframes low{50%{filter:brightness(1.8)}}
.cds{display:flex;gap:5px}
.cdIc{--p:0;position:relative;width:34px;height:34px;border-radius:8px;background:#0b0d17;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;overflow:hidden}
.cdIc::after{content:"";position:absolute;inset:0;background:conic-gradient(#000b calc(var(--p)*1turn),transparent 0)}
.cdIc.ready{border-color:var(--tc);box-shadow:inset 0 0 8px color-mix(in srgb,var(--tc) 60%,transparent)}
.cdIc.fire{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.35);background:var(--tc)}100%{transform:scale(1)}}
.cdIc.used{opacity:.35}
.cdIc.wait{opacity:.55}
.cdIc.wait b{font-size:10px;right:0;left:0;text-align:center}
.cdIc b{position:absolute;right:2px;bottom:0;font-size:12px;font-weight:800;z-index:1;font-variant-numeric:tabular-nums;text-shadow:0 0 3px #000}
.arenaWrap{position:relative;width:100%;aspect-ratio:1/1;max-width:100%}
canvas{width:100%;height:100%;display:block;border-radius:14px;background:#090b14;touch-action:manipulation}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px}
.ctl[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.timer{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 10px;font-variant-numeric:tabular-nums}
.timer .el{font-family:var(--display);font-size:18px;color:var(--ink);min-width:4.2em}
.timer .sd{font-size:12px;font-weight:800;color:var(--muted);text-align:right}
.timer .sdbar{grid-column:1/-1;height:4px;background:#07080f;border-radius:3px;overflow:hidden}
.timer .sdbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red))}
.timer.hurry .sd,.timer.hurry .el{color:var(--red)}

/* ---- 決着リザルト（アリーナの上に重ねる） ---- */
.result{position:absolute;inset:0;border-radius:14px;background:rgba(6,7,14,.84);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;opacity:0;transition:opacity .4s}
.result.show{opacity:1}
.rcard{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
.rhead{display:flex;align-items:center;gap:12px}
.rport{width:76px;height:92px;flex:none;border-radius:12px;overflow:hidden;background:#e9e6ef;border:3px solid var(--tc);display:grid;place-items:center;font-size:56px}
.rport img{width:100%;height:auto;align-self:start;display:block}
.rhow{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em}
.rwin{font-family:var(--display);font-size:clamp(20px,6vw,28px);line-height:1.15;color:var(--tc)}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rcol{background:#0f1220;border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:10px;padding:7px 8px;min-width:0}
.rcol h3{margin:0 0 4px;font-size:12px;color:var(--tc);display:flex;justify-content:space-between;gap:4px}
.rcol h3 span{color:var(--ink);font-variant-numeric:tabular-nums}
.rrow{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:11px;line-height:1.5;position:relative}
.rrow span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow span:last-child{font-variant-numeric:tabular-nums;font-weight:800}
.rrow.self{color:var(--muted)}
.rrow::before{content:"";position:absolute;left:0;bottom:1px;height:2px;width:var(--w);background:var(--tc);opacity:.6;border-radius:2px}
.rbtns{display:flex;gap:8px;justify-content:center}
.rbtns .ctl{flex:1;max-width:160px}
.rbtns .go{background:var(--gold);color:#1b1505;border-color:var(--gold)}

@media (min-width:620px){.sides{grid-template-columns:1fr 1fr}.app.wide{max-width:900px}}
@media (prefers-reduced-motion:reduce){.bar i,.bar u{transition:none}.hp.low .bar i,.cdIc.fire{animation:none}.result{transition:none}}
</style>

<div class="app" id="app">
  <header>
    <h1>ボールバトル<span class="b">・</span>アリーナ</h1>
    <p class="lead">壁に跳ね返りながら自動で戦うオートバトル。キャラと技（最大3つ）を選んで観戦しよう。</p>
  </header>

  <section id="setup" class="setupScreen">
    <div class="sides" id="sides"></div>
    <p class="note" style="margin-top:12px">技はクールタイムが終わると自動で発動します。連続技はクールタイムがほぼありません。<br>45秒を過ぎるとサドンデス（与ダメージが時間とともに上昇）。</p>
    <div class="startBar">
      <button class="primary" id="startBtn">バトル開始</button>
    </div>
  </section>

  <section id="battle" hidden>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="hud" id="hud"></div>
      <div class="timer" id="timer"><span class="el">0.0秒</span><span class="sd"></span><span class="sdbar"><i></i></span></div>
      <div class="arenaWrap"><canvas id="cv" width="1200" height="1200" aria-label="バトルアリーナ"></canvas>
        <div class="result" id="result" hidden></div></div>
      <div class="controls">
        <button class="ctl" data-speed="1" aria-pressed="true">×1</button>
        <button class="ctl" data-speed="2" aria-pressed="false">×2</button>
        <button class="ctl" data-speed="4" aria-pressed="false">×4</button>
        <button class="ctl" id="pauseBtn">一時停止</button>
        <button class="ctl" id="sndBtn" aria-pressed="false">🔇 音 OFF</button>
        <button class="ctl" id="againBtn">もう一度</button>
        <button class="ctl" id="backBtn">編成に戻る</button>
      </div>
    </div>
  </section>
</div>

const SND={on:false,ac:null,out:null,last:{},
  toggle(){this.on=!this.on;

  play(n){if(!this.on||!this.ac||!SFX[n])return;const t=this.ac.currentTime;if(this.last[n]&&t-this.last[n]<.06)return;this.last[n]=t;try{SFX[n](this.ac,t,this.out)}catch(e){}}};
function tone(ac,out,t,{type='sine',f0=440,f1=f0,dur=.15,vol=.3,at=.005}){const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+at);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.02);}
let NOISE=null;
function noise(ac,out,t,{dur=.2,vol=.3,f0=1200,f1=f0,q=1,type='bandpass'}){
  if(!NOISE){NOISE=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=NOISE;fl.type=type;fl.Q.value=q;
  fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(out);s.start(t);s.stop(t+dur+.02);}
const SFX={
  hit:(a,t,o)=>{noise(a,o,t,{dur:.09,vol:.35,f0:1800,q:.8});tone(a,o,t,{type:'square',f0:220,f1:80,dur:.08,vol:.08});},
  big:(a,t,o)=>{noise(a,o,t,{dur:.3,vol:.6,f0:900,f1:120,type:'lowpass'});tone(a,o,t,{type:'triangle',f0:140,f1:40,dur:.3,vol:.35});},
  slash:(a,t,o)=>noise(a,o,t,{dur:.14,vol:.35,f0:6000,f1:1500,type:'highpass'}),
  dash:(a,t,o)=>noise(a,o,t,{dur:.3,vol:.3,f0:300,f1:2500,q:2}),
  shoot:(a,t,o)=>tone(a,o,t,{type:'triangle',f0:700,f1:260,dur:.14,vol:.18}),
  mebius:(a,t,o)=>{noise(a,o,t,{dur:.25,vol:.35,f0:500,f1:4000,q:3});tone(a,o,t,{type:'sawtooth',f0:180,f1:520,dur:.22,vol:.08});},
  charge:(a,t,o)=>tone(a,o,t,{type:'sine',f0:300,f1:1400,dur:.5,vol:.1}),
  thunder:(a,t,o)=>{noise(a,o,t,{dur:.6,vol:.7,f0:3000,f1:200,type:'lowpass'});},
  nova:(a,t,o)=>{noise(a,o,t,{dur:.4,vol:.3,f0:5000,f1:800,q:4});tone(a,o,t,{f0:1200,f1:900,dur:.3,vol:.08});},
  blink:(a,t,o)=>tone(a,o,t,{f0:400,f1:1800,dur:.18,vol:.12}),
  guard:(a,t,o)=>tone(a,o,t,{type:'triangle',f0:900,f1:900,dur:.25,vol:.12}),
  heal:(a,t,o)=>{tone(a,o,t,{f0:520,f1:780,dur:.25,vol:.12});tone(a,o,t+.1,{f0:780,f1:1040,dur:.3,vol:.1});},
  glitch:(a,t,o)=>{for(let i=0;i<7;i++)tone(a,o,t+i*.035,{type:'square',f0:rand(80,1600),f1:rand(80,1600),dur:.04,vol:.1});},
  aurora:(a,t,o)=>{for(const f of[392,494,587,740])tone(a,o,t,{f0:f,f1:f*1.01,dur:1.8,vol:.06,at:.5});},
  timestop:(a,t,o)=>{tone(a,o,t,{type:'triangle',f0:1600,f1:200,dur:.9,vol:.12});},
  cutin:(a,t,o)=>{noise(a,o,t,{dur:.28,vol:.3,f0:300,f1:5000,q:1.5});tone(a,o,t+.05,{type:'square',f0:880,f1:880,dur:.08,vol:.06});},
  ko:(a,t,o)=>{tone(a,o,t,{type:'sawtooth',f0:160,f1:30,dur:1.1,vol:.25});noise(a,o,t,{dur:.9,vol:.6,f0:1500,f1:60,type:'lowpass'});},
  ready:(a,t,o)=>tone(a,o,t,{type:'square',f0:440,dur:.12,vol:.08}),
  fight:(a,t,o)=>{tone(a,o,t,{type:'square',f0:660,dur:.1,vol:.09});tone(a,o,t+.1,{type:'square',f0:990,dur:.25,vol:.09});},
};

function makeFighter(team,L,x,y){

    castLock:0,rushT:0,rushTick:0,dashT:0,lungeT:0,glitchT:0,boundT:0,guardT:0,slowT:0,frozenT:0,flash:0,trail:[],calls:[],hitBy:0,

function newGame(){
  const a=makeFighter('red',loadout.red,150,450),b=makeFighter('blue',loadout.blue,450,150);
  a.foe=b;b.foe=a;
  G={glitchFx:[],f:[a,b],proj:[],strikes:[],rings:[],parts:[],pops:[],auroras:[],auroraBg:0,slashes:[],cutins:[],
    time:0,shake:0,timeStop:null,over:null,overT:0,
    // 以下は演出用（実時間で消化。BB.step によるシミュレーションには影響しない）

    stats:{red:{},blue:{}},sd:false,sdBanner:0,
    sdMul(){return G.time<SD_START?1:1+(G.time-SD_START)/12;},
    sfx(n){SND.play(n);},
    damage(t,d,src,o={}){
      if(G.over)return;
      if(src!==t&&t.evadeT>0&&!o.raw2){G.popup(t.x,t.y+t.r+20,'回避','#ffffff',false,t);G.burst(t.x,t.y,'#ffffff',6);return 'evade';}   // 鳥：必ず回避
      if(src!==t&&src.flowerT>0)d*=BAL.flower;   // 花：与ダメージ増
            if(src!==t){if(o.tag!=='aurora')d*=BAL.dmg;d*=G.sdMul();if(t.frozenT>0)d*=BAL.tsDmg;}   // 時間停止中の敵は被ダメージ増   // 全体倍率（ユーザー指定値のオーロラ100・Glitch自傷150は対象外）
      if(t.guardT>0&&!o.pierce){d*=1-BAL.guardCut;G.burst(t.x,t.y,'#ffffff',6);
        if(src!==t&&t.counterT<=0&&t.hp>0&&dist(t,src)<t.r+src.r+70){t.counterT=BAL.counterCd;G.slashFx(t,src,1);const dd=Math.round(BAL.counter*BAL.dmg*G.sdMul());   // 見切り：斬り返し（CTあり）
          src.hp=Math.max(0,src.hp-dd);src.flash=.12;G.stats[t.team].guard=(G.stats[t.team].guard||0)+dd;G.popup(src.x,src.y+src.r+18,String(dd),'#dfe6ff',false,src);
          G.sfx('slash');if(src.hp<=0){G.finish(t,'KO');return;}}}
      d=Math.round(d);t.hp=Math.max(0,t.hp-d);t.flash=.12;
      const tag=src===t?'self':(o.tag||'contact');const st=G.stats[src===t?t.team:src.team];st[tag]=(st[tag]||0)+d;
      const big=d>=120;
      // 大技の直後0.3秒は体当たりの小さな数字を出さない（ダメージは入る）。MISS の自傷は呼び出し側で1つにまとめて表示
      if(o.tag!=='contact'&&d>=60)t.bigHitT=.3;
      if(!o.noPop&&!(o.tag==='contact'&&t.bigHitT>0))G.popup(t.x+rand(-10,10),t.y+t.r+20,String(d),t.guardT>0?'#cfd6ff':big?'#ffcf4a':'#ffffff',big,t);
      G.shake=Math.min(12,G.shake+d*.05);G.burst(t.x,t.y,src.color,Math.min(22,4+d/9));
      if(d>=60){G.hitstop=Math.max(G.hitstop,Math.min(.13,.03+d/2600));G.rings.push({x:t.x,y:t.y,r:t.r,max:t.r+30+d/5,t:0,color:'#ffffffcc',speed:520});}
      G.sfx(big?'big':'hit');
      if(o.kb&&!stuck(t)){const[nx,ny]=norm(t.x-src.x,t.y-src.y);t.vx=nx*o.kb;t.vy=ny*o.kb;}
      if(t.hp<=0)G.finish(t.foe,'KO');   // 自傷で倒れた場合も相手の勝ち
    },
    heal(s,n,c){s.hp=Math.min(s.maxHp,s.hp+n);G.popup(s.x,s.y+s.r+20,'+'+n,'#5be3a1',true,s);G.burst(s.x,s.y,c,18);
      G.rings.push({x:s.x,y:s.y,r:s.r,max:s.r+40,t:0,color:c,speed:160});},
    shoot(s,f,o){let tx=f.x,ty=f.y;if(o.lead){const tt=dist(s,f)/o.speed,k=o.lead===true?.6:o.lead;tx+=f.vx*tt*k;ty+=f.vy*tt*k;}   // lead: 偏差射撃の強さ
      const[nx,ny]=norm(tx-s.x,ty-s.y);G.proj.push({owner:s,x:s.x+nx*s.r,y:s.y+ny*s.r,vx:nx*o.speed,vy:ny*o.speed,r:o.r,dmg:o.dmg,icon:o.icon,kind:o.kind,color:o.color,spin:o.spin,tag:o.tag,onHit:o.onHit,a:Math.atan2(ny,nx),life:3});},
    threatened(s,f){if(f.dashT>0||f.rushT>0)return dist(s,f)<200;
      return G.proj.some(p=>p.owner===f&&dist(p,s)<150)||G.strikes.some(k=>k.owner===f&&!k.done&&dist(k,s)<k.r+s.r);},
    slashFx(s,f,big){const a=Math.atan2(f.y-s.y,f.x-s.x);G.slashes.push({o:s,a,t:0,max:.22,big,color:s.color});},
    burst(x,y,c,n,sp=1){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(60,320)*sp;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,max:rand(.25,.6)*(sp>1?1.6:1),c,s:rand(2,4.5)*(sp>1?1.4:1)});}},
    // ダメージ数字は対象ボールごとに縦に積む（出たばかりの数字があれば、その下に出す）
    popup(x,y,txt,c,big,tg){if(G.over)return;
      if(tg){const v=+txt;   // 連撃などの小さい数字は、直前の同じ対象の小さい数字に合算して1つにする
        const m=!big&&v>0&&G.pops.find(p=>p.tg===tg&&p.sum&&p.t<.3&&p.c===c);
        if(m){m.sum+=v;m.txt=String(m.sum);m.t=0;return;}
        const side=tg.foe&&tg.x<tg.foe.x?-1:1;   // 相手と反対側に寄せて、隣のボールの数字と重ねない
        const below=tg.y+tg.r+20+2*26<H-12&&tg.y>130;   // 下に余白があり、技名の吹き出しも上に出ているとき
        if(below){x=tg.x+side*24;y=tg.y+tg.r+20;}
        else{let sx=side;if(tg.x+sx*(tg.r+46)<30||tg.x+sx*(tg.r+46)>W-30)sx=-sx;x=tg.x+sx*(tg.r+46);y=tg.y-14;}}   // 余白が無ければボールの横に出す
      // 表示中のほかの数字（どのボールの数字でも）と重なる間は、その下へずらしていく
      const hh=q=>q.big?20:14,ww=q=>String(q.txt).length*(q.big?11:7.5)+6;let yy=y;const me={txt,big};
      const boxes=()=>[...G.pops.map(p=>({x:p.x,y:p.y,hw:ww(p),hh:hh(p)})),...(G.callRects||[]).map(r=>({x:r.x,y:r.y,hw:r.w/2,hh:r.h/2}))];   // 吹き出しも避ける
      const find=yy=>boxes().find(q=>Math.abs(q.x-x)<q.hw+ww(me)&&Math.abs(q.y-yy)<q.hh+hh(me));
      for(let k=0;k<10;k++){const hit=find(yy);if(!hit)break;yy=hit.y+hit.hh+hh(me)+2;}
      if(yy>H-24){yy=y;for(let k=0;k<10;k++){const hit=find(yy);if(!hit)break;yy=hit.y-hit.hh-hh(me)-2;}}   // 下に入りきらなければ上へ積む
      G.pops.push({x,y:yy,txt,c,t:0,big,tg,sum:!big&&+txt>0?+txt:0});},
    // カットイン：full=大技（チーム側の帯が画面を横切る）／false=小カットイン（攻撃時立ち絵の顔窓）
    cutin(s,info,full){
      const cur=G.cutins.find(c=>c.s===s);
      if(cur&&cur.full&&!full&&cur.t<cur.dur-.25)return;

        G.burst(L.x,L.y,L.color,40,1.8);G.burst(L.x,L.y,'#ffffff',24,1.5);
        for(let i=0;i<3;i++)G.rings.push({x:L.x,y:L.y,r:L.r+i*24,max:420+i*120,t:0,color:i?L.color:'#ffffff',speed:900-i*200});

  buildHud();
}

// 技の発動（立ち絵の切替・カットイン・効果音もここで一括処理）
function cast(s,k,g,viaUpset){
  const d=k.def;g.cutinQuote=null;d.use(s,s.foe,g);k.fired=(k.fired||0)+1;
  if(d.sfx)g.sfx(d.sfx);
  if(d.atk&&s.char.imgAtk){if(s.poseT<=0)s.poseFlash=.18;s.poseT=Math.max(s.poseT,d.big||viaUpset?1.7:1.1);}
  const info={name:d.name,icon:d.icon,quote:d.big?(g.cutinQuote||d.quote):null,label:viaUpset?'{番狂わせ}発動！':null};   // 台詞は全面カットインの技だけ（Glitch の説明文は叫ばない）
  if(d.big||viaUpset)g.cutin(s,info,true);
  else if(d.atk&&s.char.imgAtk)g.cutin(s,info,false);
}
function useSkills(s,g){
  if(s.frozenT>0||s.boundT>0||s.sealT>0||s.castLock>0||s.rushT>0||s.glitchT>0||s.aimT>0)return;
  for(const k of s.skills){
    if(k.cd>0||k.used)continue;
    if(k.def.can(s,s.foe,g)){
      s.calls.push({txt:k.def.icon+' '+k.def.name,t:0});
      if(k.def.id==='upset'){k.fired++;k.def.use(s,s.foe,g);}else cast(s,k,g,false);
      k.cd=k.def.cdAfter?k.def.cdAfter(s):k.def.cd;if(k.def.once)k.used=true;s.castLock=.25;
      if(s.tuskT>0)s.tuskTick=0;   // 牙：技を使うたびに穴が回り、持続ダメージが即座に進む
      break;}
  }
}

// Glitch の判定距離・オーロラの漂う強さは BAL.reach / BAL.pull
const stuck=s=>s.frozenT>0||s.boundT>0;
function resolveGlitch(s,f,g){
  g.glitchFx.push({x:(s.x+f.x)/2,y:(s.y+f.y)/2,t:0});g.glitchScreen=.3;
  if(dist(s,f)<s.r+f.r+BAL.reach&&f.hp>0){g.damage(f,BAL.glitch,s,{tag:'glitch'});if(!g.over){f.boundT=BAL.bind;f.rushT=0;f.dashT=0;f.vx=f.vy=0;}}
  else{g.popup(s.x,s.y+s.r+20,'MISS -'+BAL.glitchSelf,'#ff5a4e',true,s);g.damage(s,BAL.glitchSelf,s,{noPop:true});}
}
function step(dt){
  const g=G;
  if(g.over)g.overT+=dt; else g.time+=dt;
  if(g.timeStop){g.timeStop.t-=dt;if(g.timeStop.t<=0)g.timeStop=null;}
  if(!g.over&&!g.sd&&g.time>=SD_START){g.sd=true;g.sdBanner=1.8;g.shake+=8;g.sfx('cutin');}
  g.sdBanner=Math.max(0,g.sdBanner-dt);
  if(!g.over&&g.time>=TIME_LIMIT){const[a,b]=g.f;const pa=a.hp/a.maxHp,pb=b.hp/b.maxHp;
    g.finish(pa===pb?null:pa>pb?a:b,'TIME');}

  g.tick=(g.tick||0)+1;   // 処理順を毎tick入れ替えて、赤→青の固定順による有利不利をなくす
  for(const s of (g.tick&1?[g.f[1],g.f[0]]:g.f)){

    ctx.save();ctx.globalCompositeOperation='saturation';ctx.fillStyle='#808080';ctx.fillRect(-20,-20,W+40,H+40);ctx.restore();
    ctx.fillStyle='rgba(70,30,120,.22)';ctx.fillRect(-20,-20,W+40,H+40);
    drawFighter(g.timeStop.by);
    ctx.font='800 20px "M PLUS 1p",sans-serif';ctx.textAlign='center';ctx.fillStyle='#e9dcff';
    ctx.fillText('⏳ '+g.timeStop.t.toFixed(1),W/2,26);
  }
  drawCalls(g);
  // ダメージ数字
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(!g.over)for(const p of g.pops){const sc=1+.7*(1-ease(p.t/.12));ctx.globalAlpha=clamp((.9-p.t)*3,0,1);
    ctx.font=`800 ${Math.round((p.big?34:23)*sc)}px "M PLUS 1p",sans-serif`;const x=clamp(p.x,30,W-30),y=clamp(p.y,20,H-20);
    ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(p.txt,x,y);ctx.fillStyle=p.c;ctx.fillText(p.txt,x,y);}
  ctx.globalAlpha=1;
  ctx.restore();

  // ここから先は画面固定（揺れ・ズームの影響を受けない）
  for(const c of g.cutins)drawCutin(c);
  if(g.glitchScreen>0&&!REDUCED){   // 画面全体のグリッチ（横ずれ＋色ずれ）
    const a=g.glitchScreen/.3;
    for(let i=0;i<7;i++){const y=rand(0,H-30),h=rand(4,28),dx=rand(-26,26)*a;ctx.drawImage(cv,0,y*2,W*2,h*2,dx,y,W,h);}
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.18*a;ctx.fillStyle='#ff00e6';ctx.fillRect(0,rand(0,H),W,rand(10,40));
    ctx.fillStyle='#00fff0';ctx.fillRect(0,rand(0,H),W,rand(10,40));ctx.restore();}
  if(g.flash>0){ctx.fillStyle=`rgba(255,255,255,${Math.min(1,g.flash/.35)*.8})`;ctx.fillRect(0,0,W,H);}

  if(g.sdBanner>0&&!g.over){const e=1.8-g.sdBanner;const a=clamp(e*6,0,1)*clamp(g.sdBanner*4,0,1);const sc=1+1.5*(1-ease(e/.2));
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(60,0,0,.55)';ctx.fillRect(0,H/2-64,W,128);
    ctx.translate(W/2,H/2-8);ctx.scale(sc,sc);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='54px "Dela Gothic One",sans-serif';
    ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText('SUDDEN DEATH',0,0,W-40);ctx.fillStyle='#ff5a4e';ctx.fillText('SUDDEN DEATH',0,0,W-40);
    ctx.font='800 20px "M PLUS 1p",sans-serif';ctx.fillStyle='#ffd9d5';ctx.fillText('ここから与ダメージがどんどん上がる！',0,44);ctx.restore();}
  // 開始カウント
  if(g.intro>0){const e=1.5-g.intro;ctx.fillStyle='rgba(5,6,12,.35)';ctx.fillRect(0,0,W,H);
    const fight=e>.85;const lt=fight?e-.85:e;const sc=1+1.2*(1-ease(lt/.2));
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='64px "Dela Gothic One",sans-serif';ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.globalAlpha=fight?clamp((1.5-e)*4,0,1):1;
    const txt=fight?'FIGHT!':'READY';ctx.strokeText(txt,0,0);ctx.fillStyle=fight?'#ffcf4a':'#f4efe4';ctx.fillText(txt,0,0);ctx.restore();}

  // 決着
  if(g.over){const a=Math.min(1,g.overT*3);ctx.fillStyle=`rgba(5,6,12,${.5*a})`;ctx.fillRect(0,0,W,H);
    const w=g.over.winner;const t=Math.max(0,g.overT-.06);const sc=1+2.2*(1-ease(t/.22));
    ctx.save();ctx.translate(W/2,H/2-30);ctx.scale(sc,sc);ctx.globalAlpha=clamp(t*6,0,1);ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='84px "Dela Gothic One",sans-serif';ctx.lineWidth=10;ctx.strokeStyle='#000';
    const txt=g.over.how==='KO'?'K.O.!':'TIME UP';const fade=1-clamp((g.overT-1.4)*3,0,1);ctx.globalAlpha*=fade;   // リザルト表示時は消す
    ctx.strokeText(txt,0,0);ctx.fillStyle=w?w.color:'#fff';ctx.fillText(txt,0,0);ctx.restore();
    ctx.globalAlpha=clamp((g.overT-.35)*4,0,1)*fade;ctx.textAlign='center';ctx.font='30px "Dela Gothic One",sans-serif';ctx.fillStyle='#f4efe4';
    ctx.lineWidth=6;ctx.strokeStyle='#000';const sub=w?`${TEAM[w.team].name}の${w.name} の勝利！`:'引き分け';
    ctx.strokeText(sub,W/2,H/2+42);ctx.fillText(sub,W/2,H/2+42);ctx.globalAlpha=1;}
}

// ボールの中の顔。攻撃中(poseT>0)は攻撃時立ち絵の顔、それ以外は通常立ち絵の顔。どちらか一方だけを描く
function drawFace(s,x,y,r){
  const atk=s.poseT>0&&ready(s.char.imgAtk);const img=atk?s.char.imgAtk:s.char.img;
  if(ready(img)){const h=atk?s.char.art.attack.head:s.char.art.head;
    ctx.save();ctx.beginPath();ctx.arc(x,y,r-2,0,7);ctx.clip();
    ctx.fillStyle=atk?(s.char.accentBg||'#2a1544'):(s.char.accentBg||'#e9e6ef');ctx.fillRect(x-r,y-r,r*2,r*2);
    const sz=r*2.3;
    if(atk&&s.team==='blue'){ctx.translate(x,y);ctx.scale(-1,1);ctx.translate(-x,-y);}   // 青側は左向きに反転
    ctx.drawImage(img,h.x,h.y,h.s,h.s,x-sz/2,y-sz/2+3,sz,sz);ctx.restore();return true;}
  return false;
}
function drawFighter(s){
  const dead=s.hp<=0;const atkPose=s.poseT>0&&s.char.imgAtk;
  const tc=s.color;   // 攻撃ポーズ中もリング・残像はチーム色（紫は外側オーラのみ）
  for(let i=0;i<s.trail.length;i++){const t=s.trail[i];ctx.globalAlpha=i/s.trail.length*(atkPose?.4:.25);ctx.fillStyle=tc;
    ctx.beginPath();ctx.arc(t.x,t.y,s.r*(.5+i/s.trail.length*.5),0,7);ctx.fill();}
  ctx.globalAlpha=dead?(G.over?Math.max(0,.6-G.overT*.6):.4):1;
  if(ctx.globalAlpha<=0){ctx.globalAlpha=1;return;}
  if(s.dashT>0||s.rushT>0){ctx.fillStyle=s.color+'44';ctx.beginPath();ctx.arc(s.x,s.y,s.r+10,0,7);ctx.fill();}
  if(s.upsetT>0&&!dead){const p=.5+.5*Math.sin(vt*18);ctx.strokeStyle=`rgba(255,207,74,${.5+.4*p})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.x,s.y,s.r+18+p*4,0,7);ctx.stroke();}
  if(atkPose){const p=.5+.5*Math.sin(vt*14);ctx.fillStyle=hexA(s.char.accent||'#b46bff',.25+.15*p);ctx.beginPath();ctx.arc(s.x,s.y,s.r+17+p*3,0,Math.PI*2);ctx.moveTo(s.x+s.r+9,s.y);ctx.arc(s.x,s.y,s.r+9,Math.PI*2,0,true);ctx.fill();}
  const r=s.r*(1+s.poseFlash*.9);
  const grd=ctx.createRadialGradient(s.x-8,s.y-10,4,s.x,s.y,r);grd.addColorStop(0,'#ffffff33');grd.addColorStop(1,s.color+'aa');
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(s.x,s.y,r,0,7);ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(!(s.char.art&&drawFace(s,s.x,s.y,r))){ctx.font=`${s.r*1.25}px serif`;ctx.fillText(s.face,s.x,s.y+2);}
  if(s.flash>0||s.poseFlash>0){ctx.fillStyle=`rgba(255,255,255,${Math.max(s.flash/.12,s.poseFlash/.18)*.75})`;ctx.beginPath();ctx.arc(s.x,s.y,r,0,7);ctx.fill();}
  ctx.strokeStyle=tc;ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,r,0,7);ctx.stroke();
  // HPリング
  ctx.strokeStyle='#00000088';ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.x,s.y,s.r+6,0,7);ctx.stroke();
  ctx.strokeStyle=s.hp/s.maxHp>.3?'#5be3a1':'#ff5a4e';ctx.beginPath();ctx.arc(s.x,s.y,s.r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*s.hp/s.maxHp);ctx.stroke();
  if(s.guardT>0){ctx.strokeStyle='#dfe6ff';ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(s.x,s.y,s.r+13,0,7);ctx.stroke();ctx.setLineDash([]);}
  if(s.slowT>0){ctx.fillStyle='#9be7ff44';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();ctx.font='16px serif';ctx.fillText('❄️',s.x+s.r-2,s.y-s.r+2);}
  if(s.frozenT>0){ctx.font='20px serif';ctx.fillText('⏸️',s.x,s.y-s.r-18);}
  if(s.boundT>0){ctx.strokeStyle='#ff00e6';ctx.lineWidth=3;for(let i=0;i<3;i++){const o=rand(-4,4);
    ctx.strokeRect(s.x-s.r-6+o,s.y-s.r-6-o,s.r*2+12,s.r*2+12);}   // 拘束：ボールの上に暗幕＋文字（他のラベルと重ならない）
    ctx.fillStyle='rgba(20,0,30,.6)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();ctx.font='800 17px "M PLUS 1p",sans-serif';ctx.lineWidth=4;ctx.strokeStyle='#000';
    ctx.strokeText(s.boundLabel,s.x,s.y);ctx.fillStyle=s.boundLabel==='スタン'?'#bfe8ff':'#ff9cf5';ctx.fillText(s.boundLabel,s.x,s.y);}
  if(s.sealT>0){ctx.strokeStyle='rgba(255,243,176,.8)';ctx.lineWidth=2;ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(s.x,s.y,s.r+11,vt*2,vt*2+7);ctx.stroke();ctx.setLineDash([]);
    ctx.font='18px serif';ctx.fillText('🌕',s.x-s.r+2,s.y-s.r+2);}
  if(s.evadeT>0){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;for(let i=0;i<3;i++){const a=vt*6+i*2.1;ctx.beginPath();ctx.arc(s.x,s.y,s.r+12,a,a+.9);ctx.stroke();}}
  if(s.flowerT>0)for(let i=0;i<5;i++){const a=vt*1.5+i*1.256;ctx.font='12px serif';ctx.fillText('🌸',s.x+Math.cos(a)*(s.r+12),s.y+Math.sin(a)*(s.r+12));}
  if(s.beastT>0){ctx.strokeStyle='rgba(255,176,112,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,s.r+9,0,7);ctx.stroke();}
  if(s.tuskT>0){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(-vt*(8+s.tuskN*3));ctx.strokeStyle='#ffcf4a';ctx.lineWidth=2.5;
    const R=8+s.tuskN*2.2;ctx.beginPath();for(let a=0;a<12;a+=.2){const rr=R*(1-a/12);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.stroke();ctx.restore();}
  ctx.globalAlpha=1;
  // 技名のコールアウト（スマホでも読める大きさ・暗い下地つき）
  ctx.globalAlpha=1;
}
// 技名の吹き出し：両ボールの吹き出しをまとめて配置し、互いに（縦横とも）重ならないようにずらす。相手のボールも避ける
function drawCalls(g){
  if(g.over)return;   // 決着後は出さない
  ctx.font='800 21px "M PLUS 1p",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const placed=[],items=[];
  const hitR=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2+4&&Math.abs(a.y-b.y)<(a.h+b.h)/2+2;
  const order=[...g.f].sort((a,b)=>a.y-b.y);   // 上にいるボールから順に配置
  for(const s of order){const vis=s.calls.filter(c=>c.t>=0).reverse();if(!vis.length)continue;   // 新しい順
    const f=s.foe;const near=f&&Math.abs(f.x-s.x)<150&&Math.abs(f.y-s.y)<170;
    const down=s.y-s.r-30-(vis.length-1)*32-15<4;const dir=down?1:-1;let y=down?s.y+s.r+64:s.y-s.r-30;
    const ball=f?[{x:f.x,y:f.y,w:f.r*2+8,h:f.r*2+8}]:[];
    const nums=g.pops.map(p=>({x:p.x,y:p.y,w:String(p.txt).length*(p.big?20:13)+8,h:p.big?36:26}));
    for(const c of vis){const w=ctx.measureText(c.txt).width+20;
      const x=clamp(near?s.x+(s.x<f.x?-1:1)*(w/2-s.r):s.x,w/2+4,W-w/2-4);
      // 置き場所の候補：同じ向きに積む → 反対側に積む → 左右にずらす。まず数字も避け、無理なら吹き出し同士だけは必ず避ける
      const out=r=>r.y<17||r.y>H-17||r.x<r.w/2||r.x>W-r.w/2;
      const y2=down?s.y-s.r-30:s.y+s.r+64;
      const mk=n=>{const c=[];for(let k=0;k<n;k++)c.push({x,y:y+dir*32*k},{x,y:y2-dir*32*k},{x:x-(w+8),y:y+dir*32*k},{x:x+(w+8),y:y+dir*32*k});return c;};
      let r=null;   // 数字を避けるのはボールの近く（3段以内）だけ。遠くへ飛ばすより、吹き出し同士だけ避けて近くに置く
      pick:for(const lv of[2,1])for(const c of mk(lv===2?3:10)){const q={...c,w,h:30};if(out(q)||placed.some(z=>hitR(z,q))||ball.some(z=>hitR(z,q))||(lv===2&&nums.some(z=>hitR(z,q))))continue;r=q;break pick;}
      if(!r)r={x,y:clamp(y,17,H-17),w,h:30};
      placed.push(r);items.push({s,c,r});y=r.y+dir*32;}}
  g.callRects=placed;   // 動作確認用
  for(const {s,c,r} of items){ctx.globalAlpha=Math.min(1,(1.1-c.t)*3);
    pill(r.x-r.w/2,r.y-15,r.w,30);ctx.fillStyle='rgba(8,10,20,.85)';ctx.fill();ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=c.sub?'#ffcf4a':'#ffffff';ctx.fillText(c.txt,r.x,r.y+1);}
  ctx.globalAlpha=1;
}
// カットイン描画
function drawCutin(c){
  const s=c.s,red=s.team==='red',dir=red?1:-1;
  const inP=ease(c.t/.16),outP=c.t>c.dur-.18?ease((c.t-(c.dur-.18))/.18):0;
  const art=s.char.imgAtk&&ready(s.char.imgAtk)?s.char.imgAtk:null;   // カットインは攻撃時立ち絵のみ（通常絵は使わない）
  const cy=c.full?(red?150:450):c.cy;
  ctx.save();ctx.textBaseline='middle';
  if(c.full){
    const bh=110*inP*(1-outP);if(bh<1){ctx.restore();return;}
    ctx.fillStyle=`rgba(0,0,0,${.3*inP*(1-outP)})`;ctx.fillRect(0,0,W,H);
    const sk=16;ctx.beginPath();ctx.moveTo(0,cy-bh/2+sk);ctx.lineTo(W,cy-bh/2-sk);ctx.lineTo(W,cy+bh/2-sk);ctx.lineTo(0,cy+bh/2+sk);ctx.closePath();
    const gr=ctx.createLinearGradient(red?0:W,0,red?W:0,0);gr.addColorStop(0,s.color);gr.addColorStop(.45,'#140c24');gr.addColorStop(1,'#07060d');
    ctx.fillStyle=gr;ctx.fill();ctx.save();ctx.clip();
    // 流れる集中線
    ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;
    for(let i=0;i<14;i++){const ly=cy-bh/2+((i*37)%bh);const lx=((i*97+c.t*1600*dir)%(W+200)+W+200)%(W+200)-100;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+90*dir,ly);ctx.stroke();}
    // 立ち絵（攻撃時）or 絵文字がスライドイン
    const ax=(red?140:W-140)+(1-ease(c.t/.22))*-360*dir+c.t*14*dir;
    if(art){const A=s.char.art.attack,sc=133/A.head.s;const hcx=(A.head.x+A.head.s/2)*sc,hcy=(A.head.y+A.head.s/2)*sc;
      ctx.save();ctx.translate(ax,cy-8);if(!red)ctx.scale(-1,1);ctx.drawImage(art,-hcx,-hcy,A.w*sc,A.h*sc);ctx.restore();}
    else if(s.char.art){/* 攻撃絵が未読込なら立ち絵は出さない */}
    else{ctx.font='110px serif';ctx.textAlign='center';ctx.fillText(s.face,ax,cy+4);}
    ctx.restore();
    ctx.strokeStyle='#ffffffcc';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,cy-bh/2+sk);ctx.lineTo(W,cy-bh/2-sk);ctx.moveTo(0,cy+bh/2+sk);ctx.lineTo(W,cy+bh/2-sk);ctx.stroke();
    // 技名
    const tx=(red?W-24:24)+(1-ease((c.t-.06)/.22))*200*dir;ctx.textAlign=red?'right':'left';
    ctx.globalAlpha=(1-outP)*clamp((c.t-.04)*8,0,1);
    let y=cy-(c.quote?18:2)+(c.label?12:0);
    if(c.label){ctx.font='800 20px "M PLUS 1p",sans-serif';ctx.fillStyle='#ffcf4a';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(c.label,tx,y-40);ctx.fillText(c.label,tx,y-40);}
    ctx.font=`${c.name.length>10?38:48}px "Dela Gothic One",sans-serif`;ctx.lineWidth=7;ctx.strokeStyle='#000';
    ctx.strokeText(c.name,tx,y,330);ctx.fillStyle='#fff';ctx.fillText(c.name,tx,y,330);
    if(c.quote){ctx.font='800 18px "M PLUS 1p",sans-serif';ctx.fillStyle='#e8dcff';ctx.lineWidth=4;
      const lines=c.quote.split(/(?<=。)/);lines.forEach((ln,i)=>{const ly=y+30+i*21;ctx.strokeText(ln,tx,ly,340);ctx.fillText(ln,tx,ly,340);});}
  }else if(art){
    // 小カットイン：チーム側の端から攻撃時立ち絵の顔窓がスライドイン
    const pw=150,ph=118;const x0=red?0:W-pw;const off=(1-inP+outP)*-(pw+30)*dir;
    const under=G.f.some(f=>Math.abs(f.x-(x0+pw/2))<pw/2+f.r&&Math.abs(f.y-cy)<ph/2+f.r+30);   // それでもボールに重なるときは半透明
    ctx.globalAlpha=under?.4:.95;ctx.translate(off,0);
    ctx.beginPath();if(red){ctx.moveTo(x0,cy-ph/2);ctx.lineTo(x0+pw,cy-ph/2);ctx.lineTo(x0+pw-26,cy+ph/2);ctx.lineTo(x0,cy+ph/2);}
    else{ctx.moveTo(x0+26,cy-ph/2);ctx.lineTo(x0+pw,cy-ph/2);ctx.lineTo(x0+pw,cy+ph/2);ctx.lineTo(x0,cy+ph/2);}ctx.closePath();
    ctx.fillStyle=s.char.accentBg||'#24113d';ctx.fill();ctx.save();ctx.clip();
    const h=s.char.art.attack.head;const sz=ph*1.25;const cx=x0+pw/2;
    ctx.translate(cx,cy+8);if(!red)ctx.scale(-1,1);ctx.drawImage(art,h.x,h.y,h.s,h.s,-sz/2,-sz/2,sz,sz);ctx.restore();
    ctx.strokeStyle=s.char.accent||'#b46bff';ctx.lineWidth=3;ctx.stroke();
    ctx.font='800 20px "M PLUS 1p",sans-serif';const label=c.icon+' '+c.name;const lw=ctx.measureText(label).width+18;
    const lx=red?x0+8:x0+pw-8-lw;pill(lx,cy+ph/2-4,lw,28);ctx.fillStyle=s.char.accent||'#b46bff';ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='left';ctx.fillText(label,lx+9,cy+ph/2+11);
  }
  ctx.restore();
}

// ================= HUD =================
let hudEls=[];
function buildHud(){
  const hud=$('#hud');hud.innerHTML='';hudEls=[];
  for(const s of G.f){
    const el=document.createElement('div');el.className='hp '+s.team;
    el.innerHTML=`<div class="hpTop"><span class="nm">${faceHTML(s.char)}<span>${s.name}</span></span><span class="v"></span></div>
      <div class="bar"><u></u><i></i></div>
      <div class="cds">${s.skills.map(k=>`<div class="cdIc" title="${k.def.name}">${k.def.icon}<b></b></div>`).join('')}</div>`;
    hud.appendChild(el);
    hudEls.push({s,el,face:el.querySelector('.face'),v:el.querySelector('.v'),i:el.querySelector('.bar i'),u:el.querySelector('u'),cds:[...el.querySelectorAll('.cdIc')],fired:s.skills.map(()=>0)});
  }
}
function updateHud(){
  for(const h of hudEls){const s=h.s;const p=(s.hp/s.maxHp*100)+'%';h.i.style.width=p;h.u.style.width=p;
    h.v.textContent=`${Math.ceil(s.hp)} / ${s.maxHp}`;h.el.classList.toggle('low',s.hp>0&&s.hp/s.maxHp<.3);
    if(h.face)h.face.classList.toggle('atk',s.poseT>0);
    s.skills.forEach((k,i)=>{const el=h.cds[i];el.style.setProperty('--p',k.def.cd?k.cd/k.def.cd:0);const wait=k.def.once&&!k.used&&!G.over&&!k.def.cond(s,s.foe,G);   // 番狂わせ：条件未達のときは待機表示
      el.classList.toggle('ready',k.cd<=0&&!k.used&&!wait);el.classList.toggle('wait',wait);
      if(k.fired!==h.fired[i]){h.fired[i]=k.fired;el.classList.remove('fire');void el.offsetWidth;el.classList.add('fire');}
      el.classList.toggle('used',k.used);if(k.used)el.style.setProperty('--p',1);
      el.querySelector('b').textContent=k.used?'済':wait?'待機':k.cd>0?k.cd.toFixed(1):'';});}
  // タイマーは経過時間で統一（決着で停止）。サドンデスまでの残りも表示
  const tm=$('#timer');tm.querySelector('.el').textContent=G.time.toFixed(1)+'秒';
  tm.querySelector('.sd').textContent=G.over?(G.over.how==='KO'?'決着':'時間切れ'):G.sd?`SUDDEN DEATH ×${G.sdMul().toFixed(1)}`:`サドンデスまで ${(SD_START-G.time).toFixed(1)}秒`;
  tm.querySelector('i').style.width=Math.min(100,G.time/SD_START*100)+'%';tm.classList.toggle('hurry',G.sd&&!G.over);
  if(G.over&&G.overT>1.5&&$('#result').hidden)showResult();
}
// リザルト：勝者の立ち絵（通常絵）と、両チームの与ダメージ内訳
function showResult(){
  const g=G,w=g.over.winner,el=$('#result');
  const port=c=>c.art?`<img src="${c.art.src}" alt="">`:c.face;
  const col=s=>{const st=g.stats[s.team];const rows=Object.entries(st).filter(([k])=>k!=='self').sort((a,b)=>b[1]-a[1]);
    const tot=rows.reduce((a,[,v])=>a+v,0),den=tot||1;
    return `<div class="rcol" style="--tc:${s.color}"><h3>${TEAM[s.team].name} ${s.name}<span>${tot}</span></h3>
      ${rows.slice(0,4).map(([k,v])=>{const t=tagInfo(k);return `<div class="rrow" style="--w:${v/den*100}%"><span>${t.icon} ${t.name}</span><span>${v}</span></div>`}).join('')||'<div class="rrow"><span>—</span><span></span></div>'}
      ${st.self?`<div class="rrow self" style="--w:0"><span>${TAGS.self.icon} ${TAGS.self.name}</span><span>-${st.self}</span></div>`:''}</div>`;};
  el.innerHTML=`<div class="rcard" style="--tc:${w?w.color:'#f4efe4'}">
    <div class="rhead"><div class="rport">${w?port(w.char):'🤝'}</div><div>
      <div class="rhow">${g.over.how==='KO'?'K.O.':'TIME UP'} ・ ${g.time.toFixed(1)}秒</div>
      <div class="rwin">${w?`${TEAM[w.team].name}の${w.name}<br>WIN!`:'DRAW'}</div></div></div>
    <div class="rstats">${g.f.map(col).join('')}</div>
    <div class="rbtns"><button class="ctl go" data-act="again">もう一度</button><button class="ctl" data-act="back">編成に戻る</button></div></div>`;
  el.hidden=false;requestAnimationFrame(()=>el.classList.add('show'));
}
$('#result').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='again')$('#againBtn').click();else $('#backBtn').click();});

// ================= ループ・操作 =================
function frame(t){
  const rdt=Math.min(.05,(t-last)/1000||0);last=t;
  if(G&&!paused){
    if(G.intro>0){const before=G.intro;G.intro-=rdt;if(before>.65&&G.intro<=.65)SND.play('fight');}
    else if(G.hitstop>0)G.hitstop-=rdt*Math.sqrt(speedMul);      // ヒットストップ（演出のみ）
    else{let m=speedMul;if(G.slowmo>0){G.slowmo-=rdt*Math.sqrt(speedMul);m*=G.slowF;}
      acc+=rdt*m;while(acc>=DT){step(DT);acc-=DT;}}
  }
  if(G){draw(paused?0:rdt);updateHud();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function start(){newGame();paused=false;acc=0;$('#pauseBtn').textContent='一時停止';SND.play('ready');}
function showBattle(on){$('#setup').hidden=on;$('#battle').hidden=!on;$('#app').classList.toggle('wide',!on);}
$('#startBtn').onclick=()=>{start();showBattle(true);window.scrollTo(0,0);};
$('#againBtn').onclick=start;
$('#backBtn').onclick=()=>{G=null;showBattle(false);renderSetup();};
$('#pauseBtn').onclick=e=>{paused=!paused;e.target.textContent=paused?'再開':'一時停止';};
$('#sndBtn').onclick=e=>{const on=SND.toggle();e.currentTarget.textContent=on?'🔊 音 ON':'🔇 音 OFF';e.currentTarget.setAttribute('aria-pressed',on);};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speedMul=+b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b));});

renderSetup();showBattle(false);
window.BB={newGame,step,draw:()=>draw(0),get G(){return G},loadout,SKILLS,CHARS,BAL,SD_START};   // 動作確認用
})();
</script>
