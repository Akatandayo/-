<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ポケモンTRPG KP補助ツール</title>
<meta name="description" content="へにポケ ポケモンTRPGルールブック(ver.β2.4)準拠のKP補助ツール。初代(赤緑)151匹・165技を収録。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 卓の横に置く「計器盤」。左に行動パネル(計算)、右に場のポケモンカード。ドット書体は見出しと数値の要所だけ。 */
:root{
  --bg:#eef1ea; --surface:#fbfcf8; --sunk:#e3e8df; --ink:#1b211d; --muted:#5b665f; --line:#cfd6cc;
  --accent:#c8372d; --accent-ink:#fff; --ally:#2c6fb7; --enemy:#b8452f;
  --ok:#2f8f46; --warn:#c98a00; --bad:#cf3c1d; --focus:#2c6fb7;
  --f-disp:"DotGothic16","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a1f1c; --sunk:#232a26; --ink:#e6ebe4; --muted:#9aa69e; --line:#333d37;
  --accent:#ef5a4c; --accent-ink:#1a0d0b; --ally:#6ea8ea; --enemy:#ec7a60;
  --ok:#5cc275; --warn:#e3b33b; --bad:#f06a4b; --focus:#6ea8ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1c; --sunk:#232a26; --ink:#e6ebe4; --muted:#9aa69e; --line:#333d37;
  --accent:#ef5a4c; --accent-ink:#1a0d0b; --ally:#6ea8ea; --enemy:#ec7a60;
  --ok:#5cc275; --warn:#e3b33b; --bad:#f06a4b; --focus:#6ea8ea; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
.brand{font-family:var(--f-disp);font-size:22px;letter-spacing:.04em;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
@media (max-width:520px){.brand{font-size:18px}}
.brand .ball{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:linear-gradient(var(--accent) 0 44%,var(--ink) 44% 56%,var(--surface) 56%);position:relative;flex:none}
.brand .ball::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip b{color:var(--ink);font-weight:700}
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:14px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 14px;font-family:var(--f-disp);font-size:15px;color:var(--muted);cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.grid-battle{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid-battle{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h2{font-family:var(--f-disp);font-weight:400;font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.panel h2 .sub{font-family:var(--f-body);font-size:12px;color:var(--muted)}
h3{font-size:13px;margin:12px 0 6px;color:var(--muted);letter-spacing:.06em}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:11px;color:var(--muted);letter-spacing:.05em}
input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
input[type=number]{width:64px;font-family:var(--f-num)}
input.w4{width:52px} input.w3{width:46px}
textarea{width:100%;font-family:var(--f-num);font-size:12px}
.btn{border:1px solid var(--line);background:var(--sunk);padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{padding:2px 7px;font-size:12px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.dice{display:inline-flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 2px 1px 6px}
.dice label{font-size:11px;color:var(--muted);white-space:nowrap}
.dice input{width:46px;border:0;background:none;text-align:right;font-family:var(--f-num);font-weight:700;padding:3px 2px}
.dice button{border:0;background:none;cursor:pointer;padding:2px 4px;font-size:15px;line-height:1}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.ally{color:var(--ally)} .pill.enemy{color:var(--enemy)}
.type{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;color:#fff;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.type.dk{color:#1b1b1b}
.cls{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
/* battle cards */
.side-h{font-family:var(--f-disp);font-size:15px;display:flex;align-items:center;gap:8px;margin:0 0 8px}
.side-h::before{content:"";width:10px;height:10px;border-radius:2px;background:currentColor}
.side-h.ally{color:var(--ally)} .side-h.enemy{color:var(--enemy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.ally{border-top:3px solid var(--ally)} .card.enemy{border-top:3px solid var(--enemy)}
.card.fainted{opacity:.6}
.card-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-h .nm{font-weight:700;font-size:16px}
.card-h .sp{font-size:12px;color:var(--muted)}
.hpbar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hpbar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.hpbar i.y{background:var(--warn)} .hpbar i.r{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.hpbar i{transition:none}}
.hpline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hpline .big{font-family:var(--f-disp);font-size:20px}
.bgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;text-align:center}
.bgrid div{background:var(--sunk);border-radius:4px;padding:2px 0}
.bgrid small{display:block;font-size:10px;color:var(--muted)}
.bgrid b{font-family:var(--f-num);font-size:14px}
.bgrid b.up{color:var(--ok)} .bgrid b.dn{color:var(--bad)}
.ranks{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.rk{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:4px;font-size:11px;padding:0 2px}
.rk button{border:0;background:none;cursor:pointer;width:18px;padding:0;font-size:13px;color:var(--muted)}
.rk b{font-family:var(--f-num);min-width:18px;text-align:center}
.rk b.up{color:var(--ok)} .rk b.dn{color:var(--bad)}
.mvlist{display:flex;flex-direction:column;gap:3px}
.mv{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:13px;background:var(--bg);border-radius:4px;padding:2px 6px}
.mv .pp{font-family:var(--f-num);font-size:12px}
.mv .pp.zero{color:var(--bad)}
details.more summary{cursor:pointer;font-size:12px;color:var(--muted)}
/* action panel */
.res{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.res.miss{opacity:.7}
.res .tt{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dmg{font-family:var(--f-disp);font-size:30px;line-height:1;color:var(--accent)}
.calc{font-family:var(--f-num);font-size:12px;color:var(--muted);word-break:break-all}
.note{font-size:12px;border-left:3px solid var(--warn);padding:4px 8px;background:var(--sunk);border-radius:0 4px 4px 0}
.note.ok{border-color:var(--ok)} .note.bad{border-color:var(--bad)}
.order{display:flex;flex-direction:column;gap:3px;counter-reset:o}
.order .o{display:grid;grid-template-columns:22px 1fr auto auto;gap:6px;align-items:center;background:var(--bg);border-radius:4px;padding:3px 6px;font-size:13px}
.order .o::before{counter-increment:o;content:counter(o);font-family:var(--f-disp);color:var(--muted)}
.order .o.tie{outline:1px dashed var(--warn)}
.log{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:12px}
.log div{padding:4px 6px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-all}
.log .t{color:var(--muted);font-family:var(--f-num);margin-right:6px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.tbl th{white-space:nowrap;font-size:11px;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--surface)}
table.tbl td.n{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.roster{display:flex;flex-direction:column;gap:4px}
.roster button.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer}
.roster button.item[aria-current="true"]{border-color:var(--ink);background:var(--sunk)}
.prose{max-width:70ch}
.prose p,.prose li{margin:.3em 0}
.prose h3{color:var(--ink);font-size:14px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:9;pointer-events:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.warnrow td{background:color-mix(in srgb,var(--warn) 12%,transparent)}
.big-t{font-family:var(--f-disp);font-size:26px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="ball" aria-hidden="true"></span>ポケモンTRPG KP補助ツール <small>ルールブック ver.β2.4 準拠</small></div>
    <div class="chips" id="chips"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="battle" aria-selected="true">戦闘</button>
    <button role="tab" data-tab="roster" aria-selected="false">ポケモン登録</button>
    <button role="tab" data-tab="capture" aria-selected="false">捕獲・逃走</button>
    <button role="tab" data-tab="ref" aria-selected="false">資料</button>
    <button role="tab" data-tab="settings" aria-selected="false">設定・保存</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

];

function clone(o){return JSON.parse(JSON.stringify(o))}
function save(){try{localStorage.setItem('pkkp_state',JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('pkkp_state'));if(s&&s.units){s.cfg={...DEF_CFG,...s.cfg};return s}}catch(e){}return null}
function cfg(){return S?S.cfg:DEF_CFG}

function baseStats(no,gen){const m=MON[no];gen=gen||cfg().gen;if(gen==='g1'){const g=m.g;return{hp:g[0],atk:g[1],def:g[2],spa:g[3],spd:g[3],spe:g[4]}}const b=m.b;return{hp:b[0],atk:b[1],def:b[2],spa:b[3],spd:b[4],spe:b[5]}}
function calcB(no){const b=baseStats(no);return Object.fromEntries(SK.map(k=>[k,Math.floor(b[k]/10)]))}
function calcHP(no){return Math.floor((baseStats(no).hp+75)/2)}
function monTypes(u){if(u.types&&u.types.length)return u.types;const m=MON[u.no];return cfg().gen==='g1'?m.t:m.mt}
function MV(id){const m=MOVE[id];if(!m)return null;if(cfg().gen==='modern'){const o=m.m;return{...m,t:o.t,c:o.c,pw:o.pw,acc:o.acc,pp:o.pp,pri:o.pri,e:o.e??m.e,sec:o.sec??m.sec,f:o.f??m.f}}return m}
function autoMoves(no,lv){const m=MON[no];const ids=[];m.lv.filter(x=>x[0]<=lv).forEach(x=>{const i=ids.indexOf(x[1]);if(i>=0)ids.splice(i,1);ids.push(x[1])});return ids.slice(-4)}
function newUnit(no,o={}){const B=calcB(no),hp=calcHP(no);const mv=(o.moves||autoMoves(no,o.lv||20)).map(id=>({id,pp:MV(id).pp,max:MV(id).pp}));
  return{uid:uid(),no,nick:o.nick||'',owner:o.owner||'',side:o.side||'ally',inBattle:o.inBattle??true,B,maxHp:hp,hp,status:'',toxN:1,slpN:0,conf:false,attract:false,leech:false,ranks:blankRanks(),moves:mv,enhanced:false,canEvo:null,memo:o.memo||'',types:null}}

function U(id){return S.units.find(u=>u.uid===id)}
function uname(u){if(!u)return'?';const sp=MON[u.no].n;return u.nick?`${u.nick}(${sp})`:sp}
function active(){return S.units.filter(u=>u.inBattle)}

/* ================= ルール計算 ================= */
function rankMul(r){r=Math.max(-6,Math.min(6,r));return r>=0?(2+r)/2:2/(2-r)}
function effB(u,k){let v=Math.floor(u.B[k]*(k==='hp'?1:rankMul(u.ranks[k]||0)));if(k==='atk'&&u.status==='brn')v=Math.floor(v/2);if(k==='spe'&&u.status==='par')v=Math.floor(v/2);return v}
function evadeB(def,att){let v=u_spe_noRank(def);const r=Math.max(-6,Math.min(6,(def.ranks.eva||0)-(att?att.ranks.acc||0:0)));return{v:Math.floor(v*rankMul(r)),r}}
function u_spe_noRank(u){let v=u.B.spe;if(u.status==='par')v=Math.floor(v/2);return v}
function typeEff(at,dts){let e=1;const g1=cfg().gen==='g1';for(const d of dts){let x=1;const c=CHART[at];if(c[0].includes(d))x=2;else if(c[1].includes(d))x=.5;else if(c[2].includes(d))x=0;
  if(g1){if(at==='bug'&&d==='poi')x=2;if(at==='poi'&&d==='bug')x=2;if(at==='ice'&&d==='fir')x=1;if(at==='gho'&&d==='psy')x=cfg().g1ghost?0:2}e*=x}return e}
function effText(e){return e===0?'効果がないようだ':e>=2?'効果は抜群だ':e<1?'効果はいまひとつのようだ':''}
function isStab(u,mv){return monTypes(u).includes(mv.t)}
function sheetPow(u,mv,pw){pw=pw??mv.pw;if(pw==null)return null;const p1=Math.floor(pw/cfg().div);return Math.floor(p1*(isStab(u,mv)?1.5:1))}
function critNeed(u,mv){const r=Math.min(3,(u.ranks.crit||0)+((mv.f&&mv.f.crit)||0));return 11-r}
function hitsFromRoll(v){if(v==null||v==='')return null;const x=cfg().ver==='excite'?[[6,2],[9,3],[11,4],[12,5]]:[[4,2],[7,3],[10,4],[12,5]];for(const [m,h] of x)if(v<=m)return h;return 5}
function psyPow(v){return v<=2?30:v<=4?50:70}
function p2d6ge(k){if(k<=2)return 1;if(k>12)return 0;let c=0;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a+b>=k)c++;return c/36}
function p2d6le(k){return 1-p2d6ge(k+1)}
function pct(p){return Math.round(p*1000)/10+'%'}
function rnd(n,s){let t=0;for(let i=0;i<n;i++)t+=1+Math.floor(Math.random()*s);return t}
function secTarget(ch){return 101-ch}
function hpColor(u){const r=u.hp/u.maxHp;return r<=.2?'r':r<=.5?'y':''}

/* ================= 描画ユーティリティ ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tchip(t){const x=TYPES[t];return `<span class="type${x[2]?' dk':''}" style="background:${x[1]}">${x[0]}</span>`}
function clsL(c){return c==='p'?'物理':c==='s'?'特殊':'変化'}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function copy(text){const done=()=>toast('コピーしました');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'コピーしました':'コピーできませんでした。手動で選択してください')}
function dice(key,label,sides,count,store){const v=store[key]??'';return `<span class="dice"><label for="d_${key}">${esc(label)}</label><input id="d_${key}" type="number" inputmode="numeric" data-dice="${key}" data-store="${store===UI.act.dice?'act':store===UI.cap.dice?'cap':'esc'}" value="${v}" min="${count}" max="${count*sides}"><button type="button" title="${count}d${sides}を振る" data-roll="${key}" data-n="${count}" data-s="${sides}" data-store="${store===UI.act.dice?'act':store===UI.cap.dice?'cap':'esc'}">🎲</button></span>`}
function addLog(x){S.log.push({t:'T'+S.turn,x});if(S.log.length>400)S.log.shift()}

  return `<div class="grid-battle">

    <section class="panel"><h2>行動順 <span class="sub">敏捷B(ランク・麻痺込み)順</span></h2>${renderOrder()}</section>
    <section class="panel"><h2>ログ <span class="sub">ココフォリアに貼れる形式</span></h2>
      <div class="row" style="margin-bottom:6px"><button class="btn sm" data-act="copylog">全ログをコピー</button><button class="btn sm" data-act="copylast">最新1件をコピー</button><button class="btn sm ghost danger" data-act="clearlog">ログ消去</button></div>
      <div class="log" id="log">${S.log.slice().reverse().map(l=>`<div><span class="t">${esc(l.t)}</span>${esc(l.x)}</div>`).join('')}</div></section>

      <span class="muted small">壁：</span>
      ${['ally','enemy'].map(sd=>`<label class="small"><input type="checkbox" data-wall="${sd}.p" ${S.walls[sd].p?'checked':''}> ${sd==='ally'?'味方':'相手'}リフレクター</label><label class="small"><input type="checkbox" data-wall="${sd}.s" ${S.walls[sd].s?'checked':''}> ${sd==='ally'?'味方':'相手'}ひかりのかべ</label>`).join('')}

    <section class="panel"><h2>控え・登録済み <span class="sub">クリックで場に出す</span></h2>
      <div class="row">${bench.map(u=>`<button class="btn sm" data-act="tobattle" data-u="${u.uid}"><span class="pill ${u.side}">${u.side==='ally'?'味方':'相手'}</span> ${esc(uname(u))} <span class="num">${u.hp}/${u.maxHp}</span></button>`).join('')||'<span class="muted small">控えはいません</span>'}</div>
      <div class="row" style="margin-top:10px"><span class="small muted">すぐ追加：</span>${quickAdd()}</div>
    </section>
  </div></div>`}
function quickAdd(){return `<input type="text" list="dl-mon" id="qa-mon" placeholder="No.か名前" style="width:140px"><select id="qa-side"><option value="enemy">相手(野生)</option><option value="ally">味方</option></select><span class="field" style="flex-direction:row;align-items:center;gap:4px"><span>技Lv目安</span><input type="number" id="qa-lv" value="20" class="w3"></span><button class="btn sm pri" data-act="quickadd">場に追加</button>`}
function monDatalist(){return `<datalist id="dl-mon">${DATA.mons.map(m=>`<option value="${String(m.no).padStart(3,'0')} ${m.n}">`).join('')}</datalist>`}
function parseMon(v){v=(v||'').trim();const n=parseInt(v,10);if(n>=1&&n<=151)return n;const m=DATA.mons.find(m=>m.n===v||v.endsWith(m.n));return m?m.no:null}

function renderCard(u){
  const tp=monTypes(u),r=Math.max(0,u.hp/u.maxHp);
  const bcells=SK.map(k=>{const e=k==='hp'?u.B.hp:effB(u,k);const cls=e>u.B[k]?'up':e<u.B[k]?'dn':'';return `<div><small>${SL[k].replace('B','')}</small><b class="${cls}">${e}</b></div>`}).join('');
  const ranks=RK.map(k=>{const v=u.ranks[k]||0;return `<div class="rk"><button data-rank="${u.uid}.${k}.-1" aria-label="${RL[k]}ランクを下げる">−</button><span>${RL[k]}</span><b class="${v>0?'up':v<0?'dn':''}">${v>0?'+'+v:v}</b><button data-rank="${u.uid}.${k}.1" aria-label="${RL[k]}ランクを上げる">＋</button></div>`}).join('');
  const mvs=u.moves.map((m,i)=>{const mv=MV(m.id);if(!mv)return'';const sp=sheetPow(u,mv);return `<div class="mv"><span>${tchip(mv.t)} ${esc(mv.n)} <span class="cls">${clsL(mv.c)}</span> ${sp!=null?`<span class="num small muted">威${sp}</span>`:''}</span><span class="pp num ${m.pp<=0?'zero':''}">${m.pp}/${m.max}</span><span><button class="btn sm" data-pp="${u.uid}.${i}.-1" aria-label="PPを1減らす">−</button><button class="btn sm" data-pp="${u.uid}.${i}.1" aria-label="PPを1増やす">＋</button></span></div>`}).join('');
  const fl=[];if(u.status)fl.push(`<span class="pill bad">${STATUS[u.status]}${u.status==='tox'?' n='+u.toxN:''}${u.status==='slp'?' n='+u.slpN:''}</span>`);if(u.conf)fl.push('<span class="pill warn">混乱</span>');if(u.attract)fl.push('<span class="pill warn">メロメロ</span>');if(u.leech)fl.push('<span class="pill warn">やどりぎ</span>');if(u.hp<=0)fl.push('<span class="pill bad">瀕死</span>');
  const canEvo=u.canEvo??MON[u.no].evo.length>0;
  return `<article class="card ${u.side} ${u.hp<=0?'fainted':''}">
   <div class="card-h"><span class="nm">${esc(u.nick||MON[u.no].n)}</span><span class="sp">No.${String(u.no).padStart(3,'0')} ${MON[u.no].n}${u.owner?' / '+esc(u.owner):''}</span>${tp.map(tchip).join('')}${fl.join('')}</div>
   <div class="hpline"><span class="big num">${u.hp}</span><span class="muted">/ ${u.maxHp}</span>
     <input type="number" id="hpd-${u.uid}" placeholder="増減" class="w4" aria-label="HPの増減量"><button class="btn sm" data-hp="${u.uid}.-1">ダメージ</button><button class="btn sm" data-hp="${u.uid}.1">回復</button></div>
   <div class="hpbar" role="img" aria-label="HP ${Math.round(r*100)}%"><i class="${hpColor(u)}" style="width:${r*100}%"></i></div>
   <div class="bgrid">${bcells}</div>
   <div class="row small">
     <select data-uf="${u.uid}.status" aria-label="状態異常">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${u.status===k?'selected':''}>${v}</option>`).join('')}</select>
     <label><input type="checkbox" data-uf="${u.uid}.conf" ${u.conf?'checked':''}>混乱</label>
     <label><input type="checkbox" data-uf="${u.uid}.attract" ${u.attract?'checked':''}>メロメロ</label>
     <label><input type="checkbox" data-uf="${u.uid}.leech" ${u.leech?'checked':''}>やどりぎ</label>
   </div>
   <div class="mvlist">${mvs}</div>
   <div class="row">
     <button class="btn sm pri" data-act="setatt" data-u="${u.uid}">このポケモンで行動</button>
     <button class="btn sm" data-act="after" data-u="${u.uid}" title="毒・猛毒・火傷・やどりぎのダメージ">行動後処理</button>
     <select data-item="${u.uid}" aria-label="道具を使う"><option value="">道具を使う…</option>${ITEMS.filter(i=>!i.ball).map(i=>`<option value="${i.k}">${i.n}</option>`).join('')}</select>
   </div>
   <details class="more"><summary>ランク変動・その他</summary>
     <div class="ranks" style="margin-top:6px">${ranks}</div>
     <div class="row" style="margin-top:6px">
      <button class="btn sm" data-act="resetrank" data-u="${u.uid}">ランクを戻す</button>
      <button class="btn sm" data-act="tobench" data-u="${u.uid}">控えに戻す(交代)</button>
      <button class="btn sm" data-act="edit" data-u="${u.uid}">編集</button>
      <button class="btn sm" data-act="coco" data-u="${u.uid}">ココフォリア駒をコピー</button>
      ${u.side==='enemy'?`<button class="btn sm" data-act="tocap" data-u="${u.uid}">捕獲判定へ</button>`:''}
      <span class="small muted">進化${canEvo?'可':'なし'}${cfg().ver==='excite'?` / 技の強化${u.enhanced?'済':'未'}`:''}</span>
     </div>
     ${u.memo?`<p class="small muted">${esc(u.memo)}</p>`:''}
   </details>
  </article>`}

function renderOrder(){
  const a=active().filter(u=>u.hp>0).map(u=>({u,s:effB(u,'spe')})).sort((x,y)=>y.s-x.s);
  if(!a.length)return '<p class="muted">場にポケモンがいません。</p>';
  return `<div class="order">${a.map((x,i)=>{const tie=a.some((y,j)=>j!==i&&y.s===x.s&&y.u.side!==x.u.side);return `<div class="o ${tie?'tie':''}"><span>${esc(uname(x.u))} <span class="pill ${x.u.side}">${x.u.side==='ally'?'味':'敵'}</span></span><span class="num">敏捷 ${x.s}</span><button class="btn sm" data-act="setatt" data-u="${x.u.uid}">行動</button></div>`}).join('')}</div>
  <p class="small muted" style="margin:6px 0 0">優先度のある技(でんこうせっか等)は先に宣言して先に動きます。点線は相手と同速：その都度<1d6>を振って大きい順。${a.some((x,i)=>a.some((y,j)=>j!==i&&y.s===x.s&&y.u.side!==x.u.side))?' <button class="btn sm" data-act="tieroll">同速の1d6を振る</button>':''}</p>`}

/* ---------- 行動パネル ---------- */
function renderAction(){
  const A=UI.act, act=active();
  const att=U(A.att);
  const opts=act.map(u=>`<option value="${u.uid}" ${A.att===u.uid?'selected':''}>${u.side==='ally'?'[味]':'[敵]'} ${esc(uname(u))}</option>`).join('');
  let h=`<div class="stack"><div class="row"><label class="field" style="flex:1"><span>行動するポケモン</span><select id="a-att" data-a="att"><option value="">選択…</option>${opts}</select></label></div>`;
  if(!att)return h+'<p class="muted small">カードの「このポケモンで行動」か、上で選択してください。</p></div>';
  // 行動前判定
  const pre=preChecks(att);
  if(pre.items.length){h+=`<div class="res"><div class="tt">行動前判定</div>${pre.items.map(x=>`<div class="row">${x.dice}<span class="small">${x.text}</span></div>`).join('')}${pre.canAct===false?`<div class="note bad">行動できません。</div>`:pre.canAct===true?'<div class="note ok">行動できます。</div>':''}</div>`}
  const own=att.moves.map(m=>m.id);
  const mvOpts=`<optgroup label="覚えている技">${att.moves.map(m=>{const mv=MV(m.id);return `<option value="${m.id}" ${A.mv==m.id?'selected':''}>${mv.n} (PP ${m.pp}/${m.max})</option>`}).join('')}</optgroup><optgroup label="その他の技">${MOVES_SORTED.filter(m=>!own.includes(m.id)).map(m=>`<option value="${m.id}" ${A.mv==m.id?'selected':''}>${m.n}</option>`).join('')}</optgroup>`;
  h+=`<label class="field"><span>技</span><select id="a-mv" data-a="mv"><option value="">選択…</option>${mvOpts}</select></label>`;
  const mv=MV(A.mv);
  if(!mv)return h+'</div>';
  const self=mv.sec.length&&mv.sec.every(s=>s.tg==='self')&&mv.c==='x';
  h+=`<div class="small">${tchip(mv.t)} <span class="cls">${clsL(mv.c)}</span> 威力 <b class="num">${mv.pw??'—'}</b> 命中 <b class="num">${mv.acc??'必中'}</b> PP <b class="num">${mv.pp}</b>${mv.pri?` 優先度 <b>${mv.pri>0?'+':''}${mv.pri}</b>`:''}<br><span class="muted">${esc(mv.e)}</span></div>`;
  if(!self){

function preChecks(u){

  if(u.status==='par'){const v=need('pre_par');items.push({dice:dice('pre_par','麻痺 2d6',6,2,D),text:v==null?'4以下で行動できない（行動不能率 '+pct(p2d6le(4))+'）':v<=4?'<b>しびれて動けない！</b>':'行動できる'});if(v!=null&&v<=4)can=false}
  if(u.status==='slp'){const t=7-2*u.slpN,v=need('pre_slp');items.push({dice:dice('pre_slp','眠り 1d6',6,1,D),text:v==null?`目標値 ${t} 以上で目を覚ます(n=${u.slpN})`:v>=t?'<b>目を覚ました！</b>行動できる':'ぐうぐう眠っている（n+1）'});if(v!=null&&v<t)can=false}
  if(u.status==='frz'){const v=need('pre_frz');items.push({dice:dice('pre_frz','氷 1d6',6,1,D),text:v==null?'5以上で氷がとける':v>=5?'<b>氷がとけた！</b>行動できる':'凍って動けない'});if(v!=null&&v<5)can=false}
  if(can&&u.conf){const v=need('pre_conf');items.push({dice:dice('pre_conf','混乱 1d6',6,1,D),text:v==null?'3以上で行動、5以上で混乱が解ける。2以下は自分に攻撃B分のダメージ':v>=5?'<b>混乱が解けた！</b>行動できる':v>=3?'混乱しているが行動できる':`わけもわからず自分を攻撃！ ${effB(u,'atk')}ダメージ`});if(v!=null&&v<3)can=false}
  if(can&&u.attract){const v=need('pre_att');items.push({dice:dice('pre_att','メロメロ 1d6',6,1,D),text:v==null?'3以上で行動できる':v>=3?'行動できる':'メロメロで技が出せない'});if(v!=null&&v<3)can=false}
  return{items,canAct:items.length?(can?(pending?null:true):false):true}}

function computeAction(att,mv,tgs,self){

    if(mainDie>=10&&canEvo){const v=need('evo');enh.evo=v==null?null:v>=t;eh+=`<div class="row">${dice('evo','進化 2d6',6,2,D)}<span class="small">目標値 ${t}（${pct(p2d6ge(t))}）${v==null?'':v>=t?' <b>成功！進化できる</b>':' 失敗'}</span></div>`}
    if(eh)html+=`<div class="res" style="border-color:var(--accent)"><div class="tt">強化フェイズ！ <span class="small muted">HP半分以下で出目${mainDie}</span></div>${eh}${enh.move?'<div class="note ok">元の技のダメージ計算後、GMが選んだ新しい技で再度ダメージ計算し合計を与えます。その後元の技を忘れ新技に書き換えます。</div>':''}${enh.evo?'<div class="note ok">進化先はGMが選択。新技のダメージは進化後のステータスで計算します(進化・習得はキャンセル可)。</div>':''}</div>`;
  }

  const list=self?[att]:tgs;
  for(const tg of list){
    const r={tg,dodged:false,dmg:0,eff:1,secs:[],text:''};
    let th=`<div class="res"><div class="tt">→ ${esc(uname(tg))} <span class="pill ${tg.side}">HP ${tg.hp}/${tg.maxHp}</span></div>`;
    // 回避

        th+=`<div class="row" style="align-items:baseline"><span class="dmg">${d}</span><span>ダメージ ${crit?'<span class="pill bad">急所</span>':''} ${e!==1?`<span class="pill ${e>1?'ok':'warn'}">${effText(e)}</span>`:''}</span><span class="small muted">残りHP ${Math.max(0,tg.hp-d)}</span></div><div class="calc">${esc(formula)}</div>${powNote?`<div class="small muted">${esc(powNote)}</div>`:''}`;
        r.text=`${uname(tg)}：${r.evText?r.evText+' 命中 / ':''}${d}ダメージ${crit?'(急所)':''}${effText(e)?'('+effText(e)+')':''} HP${tg.hp}→${Math.max(0,tg.hp-d)}　[${formula}]`;
      }else{th+=`<div class="calc">${SL[ak]}${AB} + 威力項${p3} − ${SL[dk]}${DB} + 2d6 ${multiT?'×2/3':''}${e!==1?'（'+effText(e)+'）':''}</div>`}

function secLabel(s){if(s.k==='stat')return Object.entries(s.st).map(([k,v])=>`${s.tg==='self'?'自分':'相手'}の${RL[k]}${v>0?'+':''}${v}`).join('・');return (s.tg==='self'?'':'相手を')+SEC_L[s.k]}
function afterDamage(u){if(u.hp<=0)return null;let d=0,l=[];const g1=cfg().gen==='g1';
  if(u.status==='psn'||u.status==='brn'){d+=Math.max(1,Math.floor(u.maxHp/16));l.push(STATUS[u.status])}
  if(u.status==='tox'){d+=Math.max(1,Math.floor(u.maxHp*u.toxN/16));l.push(`猛毒(${u.toxN}/16)`)}
  if(u.leech){const x=Math.max(1,Math.floor(u.maxHp/(g1?16:8)));d+=x;l.push('やどりぎ')}
  return d?{dmg:d,label:l.join('+')}:null}
function applyAfter(u,log){const a=afterDamage(u);if(!a)return'';const b=u.hp;u.hp=Math.max(0,u.hp-a.dmg);if(u.status==='tox')u.toxN++;const t=`${uname(u)}は${a.label}のダメージ −${a.dmg} (HP${b}→${u.hp})`;if(log)addLog(t);return t}

function applyAction(){
  const A=UI.act,att=U(A.att),R=UI.lastR;if(!att||!R)return;
  const pre=preChecks(att);const lines=[];const D=A.dice;
  // 行動前判定の反映
  if(att.status==='slp'&&D.pre_slp!=null&&D.pre_slp!==''){if(+D.pre_slp>=7-2*att.slpN){att.status='';att.slpN=0;lines.push(`${uname(att)}は目を覚ました`)}else{att.slpN++;lines.push(`${uname(att)}は眠っている`)}}
  if(att.status==='frz'&&D.pre_frz!=null&&D.pre_frz!==''){if(+D.pre_frz>=5){att.status='';lines.push(`${uname(att)}の氷がとけた`)}else lines.push(`${uname(att)}は凍って動けない`)}
  if(att.status==='par'&&D.pre_par!=null&&D.pre_par!==''&&+D.pre_par<=4)lines.push(`${uname(att)}はしびれて動けない`);
  if(att.conf&&D.pre_conf!=null&&D.pre_conf!==''){const v=+D.pre_conf;if(v>=5){att.conf=false;lines.push(`${uname(att)}の混乱が解けた`)}else if(v<3){const d=effB(att,'atk');const b=att.hp;att.hp=Math.max(0,att.hp-d);lines.push(`${uname(att)}は混乱して自分を攻撃 −${d} (HP${b}→${att.hp})`)}}
  if(att.attract&&D.pre_att!=null&&D.pre_att!==''&&+D.pre_att<3)lines.push(`${uname(att)}はメロメロで動けない`);
  if(R.cantAct||pre.canAct===false){const a=cfg().autoAfter?applyAfter(att,false):'';if(a)lines.push(a);addLog(`【${uname(att)}】\n　`+lines.join('\n　'));finishAct();return}
  const mv=R.mv,f=mv.f||{};
  const slot=att.moves.find(m=>m.id===mv.id);if(slot)slot.pp=Math.max(0,slot.pp-1);
  for(const r of R.res){if(r.dodged)continue;const tg=r.tg;
    if(r.dmg>0){tg.hp=Math.max(0,tg.hp-r.dmg)}
    for(const x of r.secs){if(!x.ok)continue;applySec(x.s,x.target,att,lines)}}
  if(f.drain&&R.totalDmg>0){const h=Math.floor(R.totalDmg/f.drain);att.hp=Math.min(att.maxHp,att.hp+h)}
  if(f.recoil!=null&&R.res.some(r=>!r.dodged&&r.dmg>0)){const d=f.recoil===0?Math.floor(att.maxHp/4):Math.max(1,Math.floor(R.totalDmg/f.recoil));att.hp=Math.max(0,att.hp-d)}
  if(f.selfko)att.hp=0;

  if(cfg().autoAfter){const a=applyAfter(att,false);if(a)text+='\n　'+a}
  R.res.forEach(r=>{if(!r.dodged&&r.tg.hp<=0&&r.dmg>0)text+=`\n　${uname(r.tg)}は倒れた！`});
  addLog(text);finishAct()}
function finishAct(){UI.act.dice={};UI.act.opt={};save();render();toast('反映しました')}
function applySec(s,t,att,lines){
  if(s.k==='stat'){for(const[k,v]of Object.entries(s.st))t.ranks[k]=Math.max(k==='crit'?0:-6,Math.min(k==='crit'?3:6,(t.ranks[k]||0)+v));return}
  if(['brn','par','frz','psn','tox','slp'].includes(s.k)){if(t.status){lines.push(`${uname(t)}は既に${STATUS[t.status]}のため${SEC_L[s.k]}にならない`);return}t.status=s.k;if(s.k==='tox')t.toxN=1;if(s.k==='slp')t.slpN=0;return}
  if(s.k==='conf'){t.conf=true;return} if(s.k==='leech'){t.leech=true;return}
  if(s.k==='flinch'){lines.push(`${uname(t)}はひるんだ(このターン行動不可)`);return}
  if(s.k==='tri'){const k=['brn','par','frz'][Math.floor(Math.random()*3)];if(!t.status){t.status=k}lines.push(`トライアタック：${STATUS[k]}`);return}
  if(s.k==='heal'){t.hp=Math.min(t.maxHp,t.hp+Math.floor(t.maxHp/2));return}
  if(s.k==='rest'){t.hp=t.maxHp;t.status='slp';t.slpN=0;return}
  if(s.k==='wall_p'){S.walls[att.side].p=true;return} if(s.k==='wall_s'){S.walls[att.side].s=true;return}
  if(s.k==='haze'){active().forEach(u=>u.ranks=blankRanks());return}}

function renderCapture(){
  const C=UI.cap,enemies=S.units.filter(u=>u.side==='enemy');
  const tg=U(C.tg)||enemies.find(u=>u.inBattle)||enemies[0];if(tg)C.tg=tg.uid;
  let cap='';
  if(tg){const m=MON[tg.no];const st=['psn','tox','par','brn'].includes(tg.status)?1.5:['slp','frz'].includes(tg.status)?2.5:1;
    const ball=+C.ball||1;const raw=12-(tg.maxHp*3-tg.hp*2)*m.cr*ball/(tg.maxHp*3)*st*12/255;const t=Math.floor(raw)-(+C.bonus||0);
    const v=C.dice.cap;const has=v!==''&&v!=null;
    cap=`<div class="kv"><dt>対象</dt><dd>${esc(uname(tg))} HP ${tg.hp}/${tg.maxHp}</dd><dt>捕捉率</dt><dd class="num">${m.cr}</dd><dt>状態補正</dt><dd>${st}（${STATUS[tg.status]}）</dd></div>
    <p class="calc">12 − (${tg.maxHp}×3 − ${tg.hp}×2) × ${m.cr} × ${ball} ÷ (${tg.maxHp}×3) × ${st} × 12/255 = ${raw.toFixed(2)} → ${Math.floor(raw)}${C.bonus?` − RPボーナス${C.bonus}`:''}</p>
    <div class="row"><span>目標値</span><span class="big-t num">${t}</span><span class="muted">成功率 ${pct(p2d6ge(t))}</span></div>
    <div class="row">${dice('cap','捕獲 2d6',6,2,C.dice)}${has?(+v>=t?'<span class="pill ok">捕まえた！</span> <button class="btn sm pri" data-act="captured">味方に加える</button>':'<span class="pill bad">ボールから出てしまった（ボールは失われる）</span>'):''}</div>`}
  // 逃走
  const allies=active().filter(u=>u.side==='ally'&&u.hp>0),foes=active().filter(u=>u.side==='enemy'&&u.hp>0);

  const ev=E.foe;const tgt=ev!==''&&ev!=null?maxSpe+(+ev):null;const avg=allies.length&&ok?sum/allies.length:null;
  const esc_=`<p class="small muted">戦闘中のPC全員が逃走を選んだ時に使います。相手の最大敏捷B＋2d6（目標値）に対し、PC側の[敏捷B＋2d6]の平均で対抗ロール。同値は受動側(相手)有利＝失敗。</p>
   <div class="row">${dice('foe','相手 2d6',6,2,E)}<span class="small">相手の最大敏捷B ${maxSpe}${tgt!=null?' → 目標値 <b>'+tgt+'</b>':''}</span></div>${rows||'<p class="muted small">場に味方がいません</p>'}
   ${avg!=null&&tgt!=null?`<div class="row"><span>平均 <b class="num">${Math.round(avg*100)/100}</b> vs 目標値 <b class="num">${tgt}</b></span>${avg>tgt?'<span class="pill ok">逃走成功！</span>':'<span class="pill bad">逃げられない！（このターン他の行動不可）</span>'}<button class="btn sm" data-act="esclog">ログに記録</button></div>`:''}
   <div class="row"><button class="btn sm" data-act="escroll">全部振る</button><button class="btn sm ghost" data-act="escclear">クリア</button></div>`;
  return `<div class="two"><section class="panel"><h2>捕獲判定 <span class="sub">09.ポケモンの捕獲</span></h2>
   <div class="row" style="margin-bottom:8px"><label class="field"><span>対象(相手)</span><select data-cap="tg">${enemies.map(u=>`<option value="${u.uid}" ${tg&&u.uid===tg.uid?'selected':''}>${esc(uname(u))} ${u.hp}/${u.maxHp}</option>`).join('')}</select></label>
   <label class="field"><span>ボール</span><select data-cap="ball">${ITEMS.filter(i=>i.ball).map(i=>`<option value="${i.ball}" ${+C.ball===i.ball?'selected':''}>${i.n} ×${i.ball}</option>`).join('')}</select></label>
   <label class="field"><span>RPボーナス(目標値を下げる)</span><input type="number" data-cap="bonus" value="${C.bonus}" class="w3"></label></div>
   ${cap||'<p class="muted">相手のポケモンがいません。</p>'}
   <p class="small muted">野生のポケモンが複数いる場合は狙いが定まらず捕獲できません。手持ちは基本3匹まで。</p></section>
   <section class="panel"><h2>逃走判定 <span class="sub">06.戦闘ルール</span></h2>${esc_}</section></div>`}

function rulesProse(){const c=cfg();return `<div class="prose">
<h3>ダメージ</h3><p>[攻撃側 攻撃B or 特攻B ＋ 威力項 − 防御側 防御B or 特防B ＋ 2d6]</p>
<p>威力項は ①威力÷${c.div}(切捨) → ②タイプ一致×1.5(切捨) → ③タイプ相性・壁(×2/3)・その他(切捨) の順。キャラシには②までの値を書く。範囲技で複数を対象にしたらダメージ×2/3(切捨)。</p>
<p>2d6が11以上で急所：もう一度2d6を振って加算し、11未満が出るまで繰り返す。急所ランク+1ごとに必要な出目が1下がる(最大+3)。</p>
<h3>回避</h3><p>技を受けた側が望めば、[敏捷B＋1d100]が命中率以上で回避。命中ランクと回避ランクは相殺し、その結果を敏捷Bに掛ける。敏捷のランクは回避に影響しない。</p>
<h3>追加効果</h3><p>目標値[101−発生率]で1d100、達成値が同値以上で発動。</p>
<h3>ランク</h3><p>2/2基準。上昇は分子、下降は分母を1ずつ増やす(±6まで)。各ボーナス値に掛け、ダメージには直接掛けない。</p>
<table class="tbl" style="max-width:520px"><tr>${[-6,-4,-2,-1,0,1,2,4,6].map(r=>`<th>${r>0?'+':''}${r}</th>`).join('')}</tr><tr>${[-6,-4,-2,-1,0,1,2,4,6].map(r=>`<td class="n">×${Math.round(rankMul(r)*100)/100}</td>`).join('')}</tr></table>
<h3>状態異常</h3><ul>
<li>毒：自分の行動後に最大HPの1/16。猛毒はn/16(nは1から増加、交代でリセット)</li>
<li>麻痺：敏捷B半分。行動時2d6で4以下なら行動不能</li><li>火傷：攻撃B半分。行動後に最大HPの1/16</li>
<li>眠り：行動時1d6が[7−2n]以上で回復(nは失敗ごとに+1)</li><li>氷：行動時1d6が5以上で回復</li>
<li>混乱：行動時1d6。3以上で行動、5以上で回復。失敗で自分の攻撃B分のダメージ</li><li>メロメロ：行動時1d6が3以上で行動</li>
<li>毒・猛毒・麻痺・火傷・眠り・氷は戦闘後も継続。その他は交代や戦闘後に消える</li></ul>
<h3>処理順</h3><p>④逃走 → ②道具 → ③交代 → ①ポケモンへの指示(→自分のポケモン以外への道具) → ⑤何もしない。ポケモンは敏捷B順、同速の敵味方は都度1d6。</p>
<h3>強化フェイズ(エキサイト版)</h3><p>要所の戦闘でHP半分以下の時、ダメージの2d6が8以上なら技の強化判定、10以上(進化可能なら)進化判定。目標値[(現在HP÷最大HP)×12]に対し2d6。技の強化は1戦闘に1回。</p>
<p class="small muted">※ルールブックでは進化の目標値が「(現在HP − 最大HP)×12」と書かれていますが、技の強化と同じ「÷」の誤記と判断して計算しています。</p>
<h3>連続技の回数(2d6)</h3><p>エキサイト版：2〜6で×2、7〜9で×3、10〜11で×4、12で×5／マスター版：2〜4で×2、5〜7で×3、8〜10で×4、11〜12で×5。当たった回数だけ威力を加算。</p>
<h3>初代(赤緑)データについて</h3><p>「初代」設定では、タイプ(フェアリー・はがね無し)、種族値(特攻・特防＝とくしゅ)、技の威力・命中・PP・追加効果を赤緑に合わせています。物理/特殊は技のタイプで決まります(ほのお・みず・くさ・でんき・エスパー・こおり・ドラゴンが特殊)。</p>
</div>`}

  return `<div class="two"><section class="panel"><h2>ルール設定</h2><div class="stack">
   <label class="field"><span>バージョン</span><select data-cfg="ver"><option value="excite" ${c.ver==='excite'?'selected':''}>エキサイト版(強化フェイズあり)</option><option value="master" ${c.ver==='master'?'selected':''}>マスター版</option></select></label>
   <label class="small"><input type="checkbox" data-cfg="climax" ${c.climax?'checked':''}> 物語の要所となる戦闘(強化フェイズを判定する)</label>
   <label class="field"><span>データ基準</span><select data-cfg="gen"><option value="g1" ${c.gen==='g1'?'selected':''}>初代(赤緑)：タイプ・種族値・技性能・相性</option><option value="modern" ${c.gen==='modern'?'selected':''}>最新世代の数値</option></select></label>
   <p class="small muted" style="margin:0">データ基準を変えても登録済みポケモンのBは自動では変わりません。必要なら編集画面の「再計算」を押してください。</p>
   <label class="small"><input type="checkbox" data-cfg="g1ghost" ${c.g1ghost?'checked':''}> 初代：ゴースト技→エスパーを「効果なし」にする(赤緑の挙動)</label>
   <label class="field"><span>威力の除数(①)</span><input type="number" data-cfg="div" value="${c.div}" class="w3"></label>
   <label class="field"><span>最低ダメージ(ルール記載なし・卓で決める)</span><input type="number" data-cfg="minDmg" value="${c.minDmg}" class="w3"></label>
   <label class="small"><input type="checkbox" data-cfg="autoAfter" ${c.autoAfter?'checked':''}> 行動パネルで反映する時、毒・火傷・やどりぎの行動後ダメージも自動で入れる</label>
  </div></section>
  <section class="panel"><h2>保存・読み込み</h2><div class="stack">
   <p class="small">データはこのブラウザに自動保存されます。別の端末へ移す時や念のための控えは、下のテキストをコピーしてメモ帳などに保存してください。</p>
   <div class="row"><button class="btn" data-act="exp">バックアップをコピー</button></div>
   <label class="field"><span>復元：バックアップのテキストを貼り付け</span><textarea id="imp" rows="5" placeholder='{"cfg":…}'></textarea></label>
   <div class="row"><button class="btn" data-act="imp">復元する</button></div>
   <h3>リセット</h3>
   <div class="row"><button class="btn danger" data-act="wipe">${UI.wipeArm?'本当に消去する(もう一度押す)':'全データを消去'}</button><button class="btn" data-act="sample">サンプルを読み込む</button></div>
   <h3>ココフォリアでの使い方</h3>
   <ol class="small prose"><li>各ポケモンの「ココフォリア駒をコピー」を押す</li><li>ココフォリアの盤面をクリックして Ctrl+V(貼り付け)。HP・PP・ボーナス値・チャットパレット入りの駒ができます</li><li>戦闘の計算結果は「結果テキストをコピー」やログのコピーでチャット欄に貼れます</li><li>PLが振ったダイスの値は、行動パネルのダイス欄に直接入力できます</li></ol>
  </div></section></div>`}

/* ================= ココフォリア ================= */
function cocoJSON(u){
  const params=SK.map(k=>({label:SL[k],value:String(u.B[k])}));
  const status=[{label:'HP',value:u.hp,max:u.maxHp},...u.moves.map(m=>({label:'PP:'+MV(m.id).n,value:m.pp,max:m.max}))];
  const cmd=['1d100+{敏捷B} 回避判定(達成値が技の命中率以上で回避)'];
  u.moves.forEach(m=>{const mv=MV(m.id);const sp=sheetPow(u,mv);const cn=critNeed(u,mv);
    if(mv.c!=='x'&&sp!=null)cmd.push(`2d6+{${mv.c==='p'?'攻撃B':'特攻B'}}+${sp} 【${mv.n}】ダメージ(相手の${mv.c==='p'?'防御B':'特防B'}を引く/タイプ相性は別/出目${cn}以上で急所)`);
    else if(mv.c!=='x'&&mv.f&&(mv.f.fixed||mv.f.psywave||mv.f.superfang))cmd.push(`2d6+{特攻B} 【${mv.n}】${mv.e}`);
    (mv.sec||[]).filter(s=>mv.c!=='x'&&s.ch<100).forEach(s=>cmd.push(`1d100>=${101-s.ch} 【${mv.n}】追加効果 ${secLabel(s)}(${s.ch}%)`))});
  cmd.push('2d6>=11 急所の追加ダイス','2d6 連続技の回数','2d6>=5 麻痺判定(4以下で行動不能)','1d6 眠り判定(7-2n以上で回復)','1d6>=5 氷判定','1d6 混乱判定(3以上行動/5以上回復)','1d6>=3 メロメロ判定','2d6 行為判定');
  const memo=`No.${u.no} ${MON[u.no].n} [${monTypes(u).map(t=>TYPES[t][0]).join('/')}]\n`+u.moves.map(m=>{const mv=MV(m.id);return `${mv.n}：${TYPES[mv.t][0]}/${clsL(mv.c)} 威力/10:${sheetPow(u,mv)??'-'} 命中:${mv.acc??'必中'} ${mv.e}`}).join('\n')+(u.memo?'\n'+u.memo:'');
  return JSON.stringify({kind:'character',data:{name:u.nick||MON[u.no].n,memo,initiative:effB(u,'spe'),externalUrl:'',status,params,commands:cmd.join('\n'),color:u.side==='ally'?'#2c6fb7':'#b8452f'}})}

/* ================= メイン描画 ================= */
function render(){
  renderChips();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===UI.tab));
  const f=document.activeElement&&document.activeElement.id;
  const m=$('#main');
  m.innerHTML=monDatalist()+(UI.tab==='battle'?renderBattle():UI.tab==='roster'?renderRoster():UI.tab==='capture'?renderCapture():UI.tab==='ref'?renderRef():renderSettings());
  if(f){const el=document.getElementById(f);if(el&&el!==document.body){el.focus();if(el.select&&el.type==='text'&&el.id==='refq'){const v=el.value;el.setSelectionRange(v.length,v.length)}}}
}

/* ================= イベント ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-tab]');if(!t)return;
  if(t.dataset.tab){UI.tab=t.dataset.tab;try{localStorage.setItem('pkkp_tab',UI.tab)}catch(e){}render();return}
  if(t.dataset.roll){const st=storeOf(t.dataset.store);st[t.dataset.roll]=rnd(+t.dataset.n,+t.dataset.s);render();return}
  if(t.dataset.rank){const[id,k,d]=t.dataset.rank.split('.');const u=U(id);u.ranks[k]=Math.max(k==='crit'?0:-6,Math.min(k==='crit'?3:6,(u.ranks[k]||0)+(+d)));save();render();return}
  if(t.dataset.pp){const[id,i,d]=t.dataset.pp.split('.');const m=U(id).moves[+i];m.pp=Math.max(0,Math.min(m.max,m.pp+(+d)));save();render();return}
  if(t.dataset.hp){const[id,d]=t.dataset.hp.split('.');const u=U(id);const v=Math.abs(+$('#hpd-'+id).value||0);if(!v){toast('増減量を入力してください');return}const b=u.hp;u.hp=Math.max(0,Math.min(u.maxHp,u.hp+(+d)*v));addLog(`${uname(u)} HP${b}→${u.hp} (${d>0?'+':'−'}${v})`);save();render();return}
  if(t.dataset.refk){UI.refk=t.dataset.refk;render();return}
  const a=t.dataset.act;if(!a)return;const u=U(t.dataset.u);
  switch(a){
   case 'setatt':UI.act={att:u.uid,mv:null,tg:[],dice:{},opt:{}};UI.tab='battle';break;
   case 'rollall':rollAll(false);break;
   case 'rerollall':rollAll(true);break;
   case 'apply':applyAction();return;
   case 'copyres':if(UI.lastR)copy(UI.lastR.text);return;
   case 'copylog':copy(S.log.map(l=>`[${l.t}] ${l.x}`).join('\n'));return;
   case 'copylast':if(S.log.length)copy(S.log[S.log.length-1].x);return;
   case 'clearlog':S.log=[];break;
   case 'turn+':S.turn++;addLog(`--- ${S.turn}ターン目 ---`);break;
   case 'endbattle':active().forEach(x=>{x.ranks=blankRanks();x.conf=false;x.attract=false;x.leech=false;x.toxN=1});S.walls={ally:{p:false,s:false},enemy:{p:false,s:false}};S.units.forEach(x=>x.enhanced=false);addLog('戦闘終了：ランク変動・混乱・メロメロ・やどりぎ・壁を解除（毒・麻痺・火傷・眠り・氷は継続）');S.turn=1;break;
   case 'tobattle':u.inBattle=true;break;
   case 'tobench':u.inBattle=false;u.ranks=blankRanks();u.conf=false;u.attract=false;u.leech=false;u.toxN=1;addLog(`${uname(u)}を控えに戻した`);if(UI.act.att===u.uid)UI.act.att=null;break;
   case 'after':{const x=applyAfter(u,true);if(!x)toast('行動後ダメージはありません');break}
   case 'resetrank':u.ranks=blankRanks();break;
   case 'edit':UI.sel=u.uid;UI.tab='roster';break;
   case 'coco':copy(cocoJSON(u));return;
   case 'tocap':UI.cap.tg=u.uid;UI.cap.dice={};UI.tab='capture';break;
   case 'quickadd':{const no=parseMon($('#qa-mon').value);if(!no){toast('ポケモンが見つかりません');return}const side=$('#qa-side').value;const nu=newUnit(no,{side,lv:+$('#qa-lv').value||20,owner:side==='enemy'?'野生':''});S.units.push(nu);addLog(`${side==='enemy'?'相手':'味方'}の${MON[no].n}が現れた！`);break}
   case 'tieroll':{const a2=active().filter(x=>x.hp>0);const txt=a2.map(x=>`${uname(x)}:${rnd(1,6)}`).join(' / ');addLog('同速判定1d6 '+txt);break}
   case 'newunit':{const no=parseMon($('#nw-mon').value);if(!no){toast('ポケモンが見つかりません');return}const nu=newUnit(no,{side:$('#nw-side').value,inBattle:false});S.units.push(nu);UI.sel=nu.uid;break}
   case 'select':UI.sel=u.uid;break;
   case 'learn':{const s=U(UI.sel);if(s.moves.length>=4){toast('技は4つまでです。先に忘れさせてください');return}const mv=MV(+t.dataset.m);s.moves.push({id:mv.id,pp:mv.pp,max:mv.pp});break}
   case 'forget':U(UI.sel).moves.splice(+t.dataset.i,1);break;
   case 'recalc':{const s=U(UI.sel);s.B=calcB(s.no);const h=calcHP(s.no);s.hp=Math.round(s.hp/s.maxHp*h);s.maxHp=h;break}
   case 'grow':{const s=U(UI.sel);const a1=rnd(1,6),a2=rnd(1,6);const k1=SK[a1-1],k2=SK[a2-1];addLog(`${uname(s)}の成長ダイス 1d6×2 → ${a1}(${SL[k1]}) / ${a2}(${SL[k2]})。どちらか1つを+1(体力BならHPも+5)`);toast(`${SL[k1]} か ${SL[k2]} を+1してください`);break}
   case 'dup':{const s=clone(U(UI.sel));s.uid=uid();S.units.push(s);UI.sel=s.uid;break}
   case 'delunit':S.units=S.units.filter(x=>x.uid!==UI.sel);UI.sel=null;break;
   case 'captured':{const tg=U(UI.cap.tg);tg.side='ally';tg.owner='';tg.inBattle=false;addLog(`${uname(tg)}を捕まえた！`);UI.cap.dice={};break}
   case 'escroll':{const E=UI.esc.dice;E.foe=rnd(2,6);active().filter(x=>x.side==='ally'&&x.hp>0).forEach(x=>E['e_'+x.uid]=rnd(2,6));break}
   case 'escclear':UI.esc.dice={};break;
   case 'esclog':{const E=UI.esc.dice;const al=active().filter(x=>x.side==='ally'&&x.hp>0);const foes=active().filter(x=>x.side==='enemy'&&x.hp>0);const mx=Math.max(0,...foes.map(x=>effB(x,'spe')));const tg=mx+(+E.foe);const avg=al.reduce((s,x)=>s+effB(x,'spe')+(+E['e_'+x.uid]),0)/al.length;addLog(`逃走判定：目標値${mx}+${E.foe}=${tg} / 味方平均 ${Math.round(avg*100)/100} → ${avg>tg?'逃走成功':'失敗'}`);toast('記録しました');break}
   case 'exp':copy(JSON.stringify(S));return;
   case 'imp':{try{const s=JSON.parse($('#imp').value);if(!s.units)throw 0;s.cfg={...DEF_CFG,...s.cfg};S=s;toast('復元しました')}catch(err){toast('読み込めませんでした。バックアップのテキスト全体を貼り付けてください');return}break}
   case 'wipe':if(!UI.wipeArm){UI.wipeArm=true;render();return}UI.wipeArm=false;S={cfg:{...S.cfg},units:[],walls:{ally:{p:false,s:false},enemy:{p:false,s:false}},turn:1,log:[]};UI.act={att:null,mv:null,tg:[],dice:{},opt:{}};UI.sel=null;toast('消去しました');break;
   case 'sample':S=sample();break;
  }
  save();render()});
function storeOf(k){return k==='act'?UI.act.dice:k==='cap'?UI.cap.dice:UI.esc.dice}
function rollAll(force){
  // 必要なダイスが出揃うまで繰り返し描画して埋める
  const D=UI.act.dice;if(force){for(const k in D)delete D[k]}
  for(let i=0;i<30;i++){render();const ins=[...document.querySelectorAll('#main input[data-store="act"][data-dice]')].filter(x=>x.value==='');if(!ins.length)break;ins.forEach(x=>{const b=x.nextElementSibling;D[x.dataset.dice]=rnd(+b.dataset.n,+b.dataset.s)})}
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.dice){const st=storeOf(t.dataset.store);st[t.dataset.dice]=t.value===''?'':+t.value;render();return}
  if(t.dataset.a==='att'){UI.act={att:t.value||null,mv:null,tg:[],dice:{},opt:{}};render();return}
  if(t.dataset.a==='mv'){UI.act.mv=t.value?+t.value:null;UI.act.dice=Object.fromEntries(Object.entries(UI.act.dice).filter(([k])=>k.startsWith('pre_')));const mv=MV(UI.act.mv);const att=U(UI.act.att);if(mv&&att&&!UI.act.tg.length){const foe=active().find(u=>u.side!==att.side&&u.hp>0);if(foe)UI.act.tg=[foe.uid]}render();return}
  if(t.dataset.tg){const id=t.dataset.tg;UI.act.tg=t.checked?[...UI.act.tg,id]:UI.act.tg.filter(x=>x!==id);render();return}
  if(t.dataset.opt){UI.act.opt[t.dataset.opt]=t.type==='checkbox'?t.checked:t.value;render();return}
  if(t.dataset.uf){const[id,k]=t.dataset.uf.split('.');const u=U(id);u[k]=t.type==='checkbox'?t.checked:t.value;if(k==='status'){u.toxN=1;u.slpN=0}addLog(`${uname(u)}：${k==='status'?'状態 '+STATUS[u.status]:({conf:'混乱',attract:'メロメロ',leech:'やどりぎ'}[k])+(t.checked?' ON':' OFF')}`);save();render();return}
  if(t.dataset.wall){const[sd,k]=t.dataset.wall.split('.');S.walls[sd][k]=t.checked;save();render();return}
  if(t.dataset.item){const u=U(t.dataset.item);useItem(u,t.value);save();render();return}
  if(t.dataset.ef){const u=U(UI.sel);const k=t.dataset.ef;
    if(k.startsWith('B.'))u.B[k.slice(2)]=+t.value||0;
    else if(k==='inBattle')u.inBattle=t.checked;
    else if(k==='no'){const no=parseMon(t.value);if(no)u.no=no;else toast('ポケモンが見つかりません')}
    else if(k==='canEvo')u.canEvo=t.value===''?null:t.value==='1';
    else if(k==='maxHp'||k==='hp'){u[k]=+t.value||0;u.hp=Math.min(u.hp,u.maxHp)}
    else u[k]=t.value;save();render();return}
  if(t.dataset.mpp){const[i,k]=t.dataset.mpp.split('.');U(UI.sel).moves[+i][k]=+t.value||0;save();render();return}
  if(t.dataset.lf){UI.lfilter=t.dataset.lf;render();return}
  if(t.dataset.cap){UI.cap[t.dataset.cap]=t.value;if(t.dataset.cap==='tg')UI.cap.dice={};render();return}
  if(t.dataset.cfg){const k=t.dataset.cfg;S.cfg[k]=t.type==='checkbox'?t.checked:(['div','minDmg'].includes(k)?(+t.value||0):t.value);if(k==='div'&&!S.cfg.div)S.cfg.div=10;save();render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='refq'){UI.refq=e.target.value;render()}});
function useItem(u,k){const it=ITEMS.find(i=>i.k===k);if(!it)return;const b=u.hp;
  if(it.revive){if(u.hp>0){toast('瀕死ではありません');return}u.hp=Math.floor(u.maxHp/2)}
  else if(it.heal){if(u.hp<=0){toast('瀕死のポケモンには使えません');return}u.hp=Math.min(u.maxHp,u.hp+it.heal)}
  if(it.cure){if(it.cure==='all'||it.cure.includes(u.status)){u.status='';u.toxN=1;u.slpN=0}if(it.cure==='all')u.conf=false}
  if(it.pp){const m=u.moves.reduce((a,x)=>(x.max-x.pp)>(a?a.max-a.pp:-1)?x:a,null);if(m){m.pp=Math.min(m.max,m.pp+10);addLog(`${uname(u)}に${it.n}：${MV(m.id).n}のPP+10`);return}}
  addLog(`${uname(u)}に${it.n}を使った${u.hp!==b?` HP${b}→${u.hp}`:''}`)}
render();
</script>
