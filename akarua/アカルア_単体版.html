<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Network // アカルア</title>
<style>
:root{
  --ink:#e8ecff;--muted:#8f98b8;--line:#3a4570;--panel:rgba(8,10,22,.9);
  --cyan:#5ff6ff;--pink:#ff5fb8;--violet:#b48cff;--gold:#ffd86b;--red:#ff5f7a;--green:#6dffb0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03040a;overflow:hidden;color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#game{position:relative;width:100%;height:100%;max-width:1200px;margin:0 auto;overflow:hidden;user-select:none}

/* ---------- 背景 ---------- */
#bg,#bgdeco{position:absolute;inset:0;transition:opacity .6s}
#bgdeco{pointer-events:none;overflow:hidden}
.bg-room{background:radial-gradient(ellipse at 50% 70%,#2a3a6a55,transparent 60%),linear-gradient(#070912,#10152a)}
.bg-shop{background:
  radial-gradient(circle at 20% 15%,#ff4fb233,transparent 35%),
  radial-gradient(circle at 80% 20%,#3ff0ff2a,transparent 35%),
  linear-gradient(180deg,#120a22 0%,#0b0c1c 60%,#151025 100%)}
.bg-shop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:32%;
  background:repeating-linear-gradient(90deg,#ffffff06 0 2px,transparent 2px 80px),linear-gradient(#0000,#1c1433)}
.bg-alley{background:radial-gradient(circle at 15% 30%,#ff2fa055,transparent 30%),radial-gradient(circle at 85% 25%,#29e8ff44,transparent 30%),linear-gradient(#0a0618,#170a26 70%,#06040c)}
.bg-park{background:linear-gradient(#04130f,#062419 60%,#03100a),repeating-linear-gradient(0deg,#33ff9915 0 1px,transparent 1px 40px)}
.bg-park::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#33ff9912 0 1px,transparent 1px 40px)}
.bg-archive{background:radial-gradient(ellipse at 50% 40%,#2b3d9a55,transparent 60%),linear-gradient(#050818,#0a1030)}
.bg-dark{background:radial-gradient(circle at 50% 80%,#ffcc4415,transparent 40%),linear-gradient(#020204,#07070c)}
.bg-tower{background:radial-gradient(circle at 70% 20%,#ffffff22,transparent 15%),linear-gradient(#060a1f,#141a40 70%,#2a1f45)}
.bg-roof{background:linear-gradient(#070b1c,#1a1638 70%,#3a2050)}
.bg-work{background:radial-gradient(circle at 50% 45%,#000 0 12%,#3b1a6a 30%,#0b0618 70%)}
.bg-edge{background:radial-gradient(circle at 50% 50%,#ffffff 0 4%,#9aa4c8 20%,#20243a 55%,#05060c)}
.bg-black{background:#000}
.bg-white{background:#f4f6ff}

.neon{position:absolute;font-weight:900;letter-spacing:.3em;white-space:nowrap;animation:flick 6s infinite}
.tube{position:absolute;border-radius:6px;animation:flick 7s infinite}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s infinite}
.page{position:absolute;width:46px;height:60px;border:1px solid #7fa0ff66;background:#6f8cff14;border-radius:3px;animation:floaty 6s ease-in-out infinite}
.rain{position:absolute;width:1px;height:60px;background:linear-gradient(#0000,#9ff5);animation:rain 1.1s linear infinite}
.lamp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd86b;box-shadow:0 0 18px 6px #ffd86b55}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.3}94%{opacity:1}96%{opacity:.5}97%{opacity:1}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}
@keyframes rain{from{transform:translateY(-80px)}to{transform:translateY(110vh)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 立ち絵 ---------- */
#stage{position:absolute;left:0;right:0;top:44px;bottom:var(--boxh,170px);pointer-events:none}
.slot{position:absolute;bottom:0;width:40%;height:100%;display:flex;align-items:flex-end;justify-content:center;transition:filter .3s,opacity .3s,transform .3s}
#slot-l{left:2%}#slot-c{left:30%}#slot-r{right:2%}
.slot img{height:min(94%,620px);width:auto;max-width:none;object-fit:contain;position:relative;z-index:1;
  filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 14px #9fb4ff88);animation:appear .35s ease-out}
.slot.has::before{content:"";position:absolute;bottom:2%;left:50%;width:78%;height:78%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 60%,#d8e0ff40,#8ea2ff14 45%,transparent 70%);border-radius:50%}
.slot.dim{filter:brightness(.55) saturate(.6)}
.slot.bob img{animation:appear .35s ease-out,bob 3s ease-in-out infinite}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:linear-gradient(#000c,#0000);font-size:12px;z-index:5;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#hud::-webkit-scrollbar{display:none}
#hud .chip{padding:3px 8px;border:1px solid #ffffff22;border-radius:99px;background:#0008}
#hud b{font-weight:800}
#hud .hp b{color:#ff8fa0}#hud .san b{color:#9fd8ff}#hud .mp b{color:#c6a8ff}#hud .noise b{color:#ffe07a}#hud .frag b{color:var(--cyan);letter-spacing:1px}
#menuBtn{margin-left:auto;border:1px solid #ffffff33;background:#0009;border-radius:8px;padding:4px 10px}

/* ---------- テキストボックス ---------- */
#box{position:absolute;left:10px;right:10px;bottom:10px;min-height:150px;background:var(--panel);border:1px solid #6f86ff55;
  border-radius:14px;padding:22px 18px 16px;box-shadow:0 0 0 1px #000,0 10px 40px #000c,inset 0 0 30px #4a5cff14;z-index:6}
#box::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px)}
#namebox{position:absolute;top:-14px;left:16px;padding:3px 14px;border-radius:8px;background:#0b0e1f;border:1px solid currentColor;
  font-weight:800;font-size:14px;display:none}
#text{font-size:16px;line-height:1.85;min-height:58px;white-space:pre-wrap}
#text.narr{color:#cfd6f5}
#next{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--cyan);animation:tw 1s infinite;display:none}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#choices:empty{display:none}
.choice{text-align:left;border:1px solid #6f86ff66;background:linear-gradient(90deg,#1a2250,#10142c);border-radius:10px;padding:10px 14px;transition:.15s}
.choice:hover,.choice:focus-visible{border-color:var(--cyan);background:linear-gradient(90deg,#22307a,#141a3a);outline:none}
.choice small{color:var(--muted);margin-left:6px}
.choice:disabled{opacity:.4;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* ---------- ノイズ ---------- */
#noise{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:20;image-rendering:pixelated;mix-blend-mode:screen}
#game.glitch #stage,#game.glitch #bgdeco{animation:glitch .25s steps(2) 3}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-6px,0) skewX(4deg)}50%{transform:translate(5px,1px)}75%{transform:translate(-2px,-1px) skewX(-3deg)}100%{transform:none}}

/* ---------- オーバーレイ ---------- */
#overlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:14px;background:#000a;backdrop-filter:blur(2px)}
#overlay.on{display:flex}
.panel{width:min(640px,100%);max-height:100%;overflow:auto;background:linear-gradient(160deg,#121733,#0a0d1e);border:1px solid #6f86ff66;border-radius:16px;padding:18px;box-shadow:0 20px 60px #000}
.panel h2{margin:0 0 10px;font-size:20px}.panel h3{margin:14px 0 8px;font-size:15px;color:var(--cyan)}
.btn{border:1px solid #6f86ff88;background:#1b2358;border-radius:10px;padding:9px 16px}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:linear-gradient(90deg,#3a3fd8,#9b3fd8);border-color:transparent;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:4px 6px;border-bottom:1px solid #ffffff10}
table.t td:last-child{text-align:right;font-weight:700}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 14px}
.kv{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid #ffffff0d;padding:3px 0}
.kv span:last-child{font-weight:700}
input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #6f86ff88;background:#070a18;color:var(--ink);font-size:16px}
.pick{border:1px solid #ffffff22;background:#0d1130;border-radius:10px;padding:8px 10px;text-align:left}
.pick.sel{border-color:var(--cyan);background:#163050}
.pick small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.card{border:1px solid #ffffff22;border-radius:12px;padding:12px;margin-bottom:8px;background:#0c1028}
.card.main{border-color:#5ff6ff66}.card.side{border-color:#ff5fb866}
.card .tt{font-weight:800}.card .cl{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#26305a;margin-right:4px}

details.card summary{cursor:pointer;font-weight:700;font-size:14px}
/* ダイス */
.dice{text-align:center}
.dice .lab{font-size:15px;color:var(--muted)}
.dice .num{font-size:64px;font-weight:900;letter-spacing:2px;margin:6px 0;font-variant-numeric:tabular-nums}
.dice .res{font-size:22px;font-weight:900;min-height:32px}
.ok{color:var(--green)}.ng{color:var(--red)}.crit{color:var(--gold)}

/* バトル */
.battle .enemy{text-align:center;padding:10px 0}
.battle .glyph{font-family:monospace;font-size:26px;line-height:1.05;white-space:pre;color:#cfd8ff;text-shadow:0 0 10px #8fa0ff,2px 0 #ff3b8a,-2px 0 #3bf0ff;animation:glitch 2s steps(2) infinite}
.battle .glyph.hit{animation:shake .3s}
.battle .ename{font-weight:900;font-size:18px;margin-top:6px}
.bar{height:8px;border-radius:9px;background:#000;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;transition:width .4s}
.bar.e i{background:linear-gradient(90deg,#ff5f7a,#ffb06b)}
.bar.p i{background:linear-gradient(90deg,#ff5f7a,#ff9fb0)}
.bar.s i{background:linear-gradient(90deg,#4fb0ff,#9fe8ff)}
.blog{height:150px;overflow:auto;background:#05070f;border:1px solid #ffffff18;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6;margin:10px 0}
.blog div{border-bottom:1px solid #ffffff08}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

/* タイトル */
.title{text-align:center}
.title h1{font-size:clamp(30px,7vw,54px);margin:0;letter-spacing:.08em;line-height:1.1;
  text-shadow:0 0 12px #ff5fb8,0 0 30px #b48cff,3px 0 #3bf0ff;animation:flick 5s infinite}
.title .sub{color:var(--cyan);letter-spacing:.4em;margin:10px 0 26px;font-size:13px}
.ending h2{font-size:26px;text-align:center;margin-bottom:4px}
.ending p{line-height:1.9;white-space:pre-wrap}

@media (max-width:640px){
  #text{font-size:15px}
  .slot{width:56%}#slot-l{left:-6%}#slot-c{left:22%}#slot-r{right:-6%}
  .slot img{height:min(80%,100vw)}
  #box{left:6px;right:6px;bottom:6px;padding:20px 14px 14px}
}
</style>
</head>
<body>
<div id="game">
  <div id="bg" class="bg-black"></div>
  <div id="bgdeco"></div>
  <div id="stage"><div class="slot" id="slot-l"></div><div class="slot" id="slot-c"></div><div class="slot" id="slot-r"></div></div>
  <div id="hud" style="display:none"></div>
  <div id="box" style="display:none">
    <div id="namebox"></div>
    <div id="text"></div>
    <div id="choices"></div>
    <div id="next">▼ クリック / タップ</div>
  </div>
  <canvas id="noise" width="160" height="100"></canvas>
  <div id="overlay"></div>
</div>

<script>
/* =========================================================
   Network // アカルア  — エンジン部
   シナリオ・依頼・会話は scenario.js に分けてあります
   ========================================================= */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n) + 1;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function dice(expr){
  expr = String(expr).replace(/\s/g,'').toUpperCase();
  let total = 0, m; const re = /([+-]?)(\d*)D(\d+)|([+-]?)(\d+)/g;
  while((m = re.exec(expr))){
    if(m[3]){ const n = m[2] ? +m[2] : 1; let s = 0; for(let i=0;i<n;i++) s += rnd(+m[3]); total += (m[1]==='-'?-1:1)*s; }
    else if(m[5]) total += (m[4]==='-'?-1:1)*(+m[5]);
  }
  return total;
}

  if(c==='both') return S.comp==='both';
  if(typeof c==='function') return c();
  return true;
}
function skillVal(name){
  let v;
  if(name==='幸運') v = S.st.POW*5;
  else if(name==='アイデア') v = S.st.INT*5;
  else if(name==='知識') v = Math.min(99,S.st.EDU*5);
  else if(name==='DEX×5') v = S.st.DEX*5;
  else v = S.skills[name] ?? 0;
  if(S.insane && !['幸運'].includes(name)) v -= 10;
  return Math.max(1, v);
}

/* ---------- ノイズ演出 ---------- */
const nc = $('#noise'), nx = nc.getContext('2d'); let nBase = 0, nBurst = 0;
function drawNoise(){
  const a = Math.max(nBase, nBurst);
  if(a>0.01){
    const img = nx.createImageData(nc.width, nc.height);
    for(let i=0;i<img.data.length;i+=4){const v=Math.random()*255|0; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255;}
    nx.putImageData(img,0,0);
  }
  nc.style.opacity = a; nBurst *= .9;
  requestAnimationFrame(drawNoise);
}
function noiseLevel(v){ nBase = v; }
function noiseBurst(v=.8){ nBurst = v; const g=$('#game'); g.classList.remove('glitch'); void g.offsetWidth; g.classList.add('glitch'); }

/* ---------- 立ち絵表示 ---------- */
let onStage = {};
function show(list){
  const slots = {l:$('#slot-l'), c:$('#slot-c'), r:$('#slot-r')};
  const pos = list.length===1?['c']:list.length===2?['l','r']:['l','c','r'];
  const want = {};
  list.forEach((spec,i)=>{ const [id,pose='def'] = spec.split(':'); want[pos[i]] = {id,pose}; });
  onStage = {};
  for(const k of ['l','c','r']){
    const el = slots[k], w = want[k];
    if(!w){ el.innerHTML=''; el.className='slot'; el.dataset.key=''; continue; }
    onStage[w.id] = k;
    const key = w.id+':'+w.pose;
    if(el.dataset.key!==key){ el.innerHTML = `<img src="${CH[w.id].img[w.pose]||CH[w.id].img.def}" alt="${CH[w.id].name}">`; el.dataset.key = key; }
    el.className = 'slot has' + (w.pose==='float'?' bob':'');
  }
}
function focus(who){
  for(const k of ['l','c','r']){ const el=$('#slot-'+k); if(!el.dataset.key) continue;
    el.classList.toggle('dim', !!who && onStage[who]!==k && who!=='p' && who!=='' ); }
}

/* ---------- テキスト進行 ---------- */
const BACKLOG=[];
let curNode=null, lineIdx=0, typing=false, full='', tTimer=null, waitClick=false;
function playNode(n){
  if(!n){ console.error('scene missing'); return; }
  curNode = n; lineIdx = 0;
  $('#box').style.display=''; $('#hud').style.display = S&&S.story ? 'none' : '';
  if(n.bg) setBg(n.bg);
  if(n.show) show(n.show);
  if(n.on) n.on();
  hud();
  nextLine();
}
function play(id){
  const n = typeof id==='object' ? id : SC[id];
  if(!n){ console.error('no scene', id); return toHub(); }
  playNode(typeof n==='function' ? n() : n);
}
function nextLine(){
  $('#choices').innerHTML=''; $('#next').style.display='none';
  const L = curNode.lines || [];
  while(lineIdx < L.length){
    let x = L[lineIdx++];
    if(Array.isArray(x)){ if(!comp(x[0])) continue; x = x[1]; }
    if(typeof x==='function'){ x = x(); if(!x) continue; }
    if(typeof x==='object'){
      if(x.bg) setBg(x.bg); if(x.show) show(x.show); if(x.fx) x.fx();
      if(x.noise) noiseBurst(x.noise); if(x.shake) shake();
      continue;
    }
    say(x); return;
  }
  finishNode();
}
function say(raw){
  let who='', name='', text=raw;
  const m1 = raw.match(/^([htmp]):([\s\S]*)$/);
  const m2 = raw.match(/^([^：\n]{1,14})：([\s\S]*)$/);
  if(raw.startsWith(':')){ text=raw.slice(1); }
  else if(m1){ who=m1[1]; text=m1[2]; name = who==='p'?S.name:CH[who].name; }
  else if(m2){ who='x'; name=m2[1]; text=m2[2]; }
  text = fmt(text);
  BACKLOG.push({name, text, color:(CH[who]&&CH[who].color)||''}); if(BACKLOG.length>300) BACKLOG.shift();
  const nb = $('#namebox');
  if(name){ nb.style.display='block'; nb.textContent=name; nb.style.color = (CH[who]&&CH[who].color)||'#cfe'; }
  else nb.style.display='none';
  $('#text').classList.toggle('narr', !name);
  focus(who==='x'?'':who);
  typeText(text, ()=>{ waitClick=true; $('#next').style.display='block'; });
}
function typeText(text, done){
  clearInterval(tTimer); full=text; typing=true; waitClick=false;
  const el=$('#text'); el.textContent=''; let i=0;
  tTimer=setInterval(()=>{ i+=1; el.textContent=full.slice(0,i); if(i>=full.length){ clearInterval(tTimer); typing=false; done(); } }, 22);
  typeDone = done;
}
let typeDone=null;
function advance(){
  if($('#overlay').classList.contains('on')) return;
  if(typing){ clearInterval(tTimer); $('#text').textContent=full; typing=false; typeDone&&typeDone(); return; }
  if(waitClick){ waitClick=false; nextLine(); }
}
$('#box').addEventListener('click', e=>{ if(e.target.closest('button')) return; advance(); });
$('#stage').addEventListener('click', advance);
document.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ if(document.activeElement&&document.activeElement.tagName==='INPUT')return; e.preventDefault(); advance(); } });

function finishNode(){
  const n = curNode;
  if(n.choices) return choices(n.choices);
  if(n.roll) return choices([{t:`《${typeof n.roll.s==='string'?n.roll.s:n.roll.s.label}》で判定する`, roll:n.roll.s, mod:n.roll.mod, ok:n.roll.ok, ng:n.roll.ng}]);
  if(n.san) return choices([{t:`SANチェック（${n.san.s}）`, san:n.san.s, go:n.san.next}]);
  if(n.battle) return startBattle(n.battle);
  if(n.storyEnd) return endStory(n.storyEnd);
  if(n.end) return finishRequest(n.end);
  if(n.fail) return failRequest(n.fail);
  if(n.ending) return showEnding(typeof n.ending==='function'?n.ending():n.ending);
  if(n.goto) return play(n.goto());
  if(n.next) return play(n.next);
  return toHub();
}
function choices(list){
  const box=$('#choices'); box.innerHTML='';
  list.filter(c=>(!c.if || comp(c.if)) && (!c.when || c.when())).forEach(c=>{
    const b=document.createElement('button'); b.className='choice';
    let hint='';
    if(c.roll){ const lab = typeof c.roll==='string'?c.roll:c.roll.label; const v = typeof c.roll==='string'?skillVal(c.roll)+(c.mod||0):c.roll.v; hint=`<small>〈${lab}〉${v}%</small>`; }
    if(c.san) hint=`<small>${c.san}</small>`;
    b.innerHTML = fmt(c.t) + hint;
    if(c.disabled && c.disabled()) b.disabled=true;
    b.onclick = ()=>{
      box.innerHTML='';
      if(c.fx) c.fx();
      if(c.roll) return doRoll(c.roll, c.mod||0, ok=>play(ok?c.ok:c.ng));
      if(c.san) return doSan(c.san, ()=>play(c.go));
      if(c.fn) return c.fn();
      play(c.go);
    };
    box.appendChild(b);
  });
  const first = box.querySelector('button'); if(first) first.focus({preventScroll:true});
}

/* ---------- ダイス ---------- */
function judge(r, v){ if(r<=5 && r<=v) return 'crit'; if(r>=96 && r>v) return 'fumble'; return r<=v?'ok':'ng'; }
const JLAB = {crit:'クリティカル！',ok:'成功',ng:'失敗',fumble:'ファンブル…'};
function doRoll(spec, mod, cb, opt={}){
  const isNpc = typeof spec==='object';
  const label = isNpc ? spec.label : spec;
  const v = isNpc ? spec.v : clamp(skillVal(spec)+mod,1,99);
  const o = overlay(`<div class="panel dice"><div class="lab">〈${label}〉 目標値 <b>${v}</b>${S.insane&&!isNpc?' <span class="ng">(一時的狂気 -10)</span>':''}</div>
    <div class="num" id="dn">--</div><div class="res" id="dr"></div><div class="row" style="justify-content:center;margin-top:10px" id="db"></div></div>`);
  let t=0; const iv=setInterval(()=>{ $('#dn').textContent=String(rnd(100)).padStart(2,'0'); if(++t>14){ clearInterval(iv); fin(); } },45);
  function fin(){
    const r = rnd(100), j = judge(r,v), ok = j==='ok'||j==='crit';
    $('#dn').textContent = r; $('#dn').className='num '+(j==='crit'?'crit':ok?'ok':'ng');
    $('#dr').innerHTML = `<span class="${j==='crit'?'crit':ok?'ok':'ng'}">${JLAB[j]}</span>`;
    if(ok && !isNpc && S.skills[spec]!==undefined) S.grow[spec]=1;
    const db=$('#db');
    const done=()=>{ closeOverlay(); cb(ok, r, j); };
    const okb=document.createElement('button'); okb.className='btn pri'; okb.textContent='OK'; okb.onclick=done; db.appendChild(okb);
    if(!ok && !isNpc && (S.items['お守り']||0)>0 && !opt.noReroll){
      const rb=document.createElement('button'); rb.className='btn'; rb.textContent=`お守りで振り直す（残${S.items['お守り']}）`;
      rb.onclick=()=>{ S.items['お守り']--; closeOverlay(); doRoll(spec, mod, cb, {noReroll:true}); };
      db.appendChild(rb);
    }
    okb.focus();
  }
}
function doSan(expr, cb){
  const [sOk,sNg] = expr.split('/');
  const v = S.san;
  const o = overlay(`<div class="panel dice"><div class="lab">SANチェック（${expr}） 現在SAN <b>${v}</b></div>
    <div class="num" id="dn">--</div><div class="res" id="dr"></div><div class="muted" id="dx"></div><div class="row" style="justify-content:center;margin-top:10px" id="db"></div></div>`);
  let t=0; const iv=setInterval(()=>{ $('#dn').textContent=String(rnd(100)).padStart(2,'0'); if(++t>14){ clearInterval(iv); fin(); } },45);
  function fin(){
    const r=rnd(100), ok=r<=v; const loss=Math.max(0,dice(ok?sOk:sNg));
    S.san = Math.max(0, S.san-loss); hud();
    $('#dn').textContent=r; $('#dn').className='num '+(ok?'ok':'ng');
    $('#dr').innerHTML=`<span class="${ok?'ok':'ng'}">${ok?'成功':'失敗'}</span>　SAN -${loss}`;
    if(loss>0) noiseBurst(.4);
    const db=$('#db'); const b=document.createElement('button'); b.className='btn pri'; b.textContent='OK'; db.appendChild(b); b.focus();
    b.onclick=()=>{
      closeOverlay();
      if(S.san<=0) return showEnding('insane');
      if(loss>=5 && !S.insane){
        // アイデアロール → 成功で一時的狂気
        const iv2 = S.st.INT*5, r2=rnd(100);
        if(r2<=iv2){
          S.insane = pick(['震えが止まらない','ノイズの幻聴が聞こえる','周囲の全てが作り物に見える','笑いが止まらない','足元が崩れていく感覚']);
          hud();
          return msg(`<h2 class="ng">一時的狂気</h2><p>アイデアロール ${r2}/${iv2} 成功――理解してしまった。</p><p>《${S.insane}》<br><span class="muted">休むまで全技能 -10</span></p>`, cb);
        }
      }
      cb();
    };
  }
}
function msg(html, cb, btn='OK'){
  overlay(`<div class="panel">${html}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn pri" id="mok">${btn}</button></div></div>`);

let B=null;
function startBattle(cfg){
  const e = Object.assign({}, ENEMIES[cfg.e]); e.hpMax=e.hp; e.calm=e.talk?e.talk.n:0;
  B = {eid:cfg.e, e, win:cfg.win, lose:cfg.lose||'faint', flee:cfg.flee, peace:cfg.peace, round:1, log:[], weak:0, tUlt:false, mHeal:0, busy:false};
  const go = ()=>{ renderBattle(); blog(`<b>${e.name}</b> が現れた！`); if(e.intro) blog(`<span class="muted">${e.intro}</span>`); };
  if(e.san && !cfg.noSan){ msg(`<h2>${e.name}</h2><p>${e.desc}</p><p class="muted">その姿を目にした――</p>`, ()=>doSan(e.san, go), 'SANチェック'); }
  else go();
}
function blog(h){ B.log.push(h); const el=$('#blog'); if(el){ el.innerHTML=B.log.map(x=>`<div>${x}</div>`).join(''); el.scrollTop=el.scrollHeight; } }
function renderBattle(){
  const e=B.e;
  const acts = [];
  acts.push(`<button class="btn" data-a="punch">こぶし<br><small class="muted">${skillVal('こぶし')}% / 1D3${S.db!=='0'?S.db:''}</small></button>`);
  acts.push(`<button class="btn" data-a="kick">キック<br><small class="muted">${skillVal('キック')}% / 1D6${S.db!=='0'?S.db:''}</small></button>`);

  if(e.talk) acts.push(`<button class="btn" data-a="talk">${e.talk.s}で語りかける<br><small class="muted">${clamp(skillVal(e.talk.s)+(e.talk.mod||0),1,99)}% / 残り${B.e.calm}</small></button>`);
  acts.push(`<button class="btn" data-a="guard">回避に専念<br><small class="muted">このラウンド回避+30</small></button>`);
  acts.push(`<button class="btn" data-a="item">アイテム</button>`);
  if(B.flee) acts.push(`<button class="btn" data-a="flee">逃げる<br><small class="muted">DEX×5 ${S.st.DEX*5}%</small></button>`);
  const cn = [];
  if(comp('t')) cn.push(`<span style="color:${CH.t.color}">独</span>`);
  if(comp('m')) cn.push(`<span style="color:${CH.m.color}">紅葉</span>`);
  overlay(`<div class="panel battle">
    <div class="row" style="justify-content:space-between"><span class="tag">ROUND ${B.round}</span><span class="muted">同行：${cn.join('・')||'なし'}</span></div>
    <div class="enemy"><div class="glyph" id="eg">${e.glyph}</div><div class="ename">${e.name}</div>
      <div class="bar e" style="max-width:300px;margin:6px auto"><i style="width:${e.hp/e.hpMax*100}%"></i></div>
      <div class="muted">HP ${e.hp}/${e.hpMax}${e.talk?` ・ 鎮静まで ${B.e.calm}`:''}</div></div>
    <div class="row" style="gap:16px"><div style="flex:1">HP ${S.hp}/${S.hpMax}<div class="bar p"><i style="width:${S.hp/S.hpMax*100}%"></i></div></div>
      <div style="flex:1">SAN ${S.san}<div class="bar s"><i style="width:${S.san/sanMax()*100}%"></i></div></div></div>
    <div class="blog" id="blog"></div>
    <div class="acts" id="acts">${acts.join('')}</div></div>`);
  $('#blog').innerHTML=B.log.map(x=>`<div>${x}</div>`).join(''); $('#blog').scrollTop=1e9;
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));
}
function rollLine(label, v){ const r=rnd(100), j=judge(r,v); return {r, j, ok:j==='ok'||j==='crit', txt:`〈${label}〉${v} → ${r} <span class="${j==='crit'?'crit':j==='ok'?'ok':'ng'}">${JLAB[j]}</span>`}; }
function hitEnemy(d, who){ const e=B.e; d=Math.max(1,d); e.hp=Math.max(0,e.hp-d); blog(`　→ <b>${d}</b> ダメージ！`); const g=$('#eg'); if(g){g.classList.remove('hit');void g.offsetWidth;g.classList.add('hit');} noiseBurst(.25); }
async function act(a){
  if(B.busy) return; B.busy=true; document.querySelectorAll('#acts button').forEach(b=>b.disabled=true);
  const e=B.e; let guard=0;
  if(a==='item'){ B.busy=false; return battleItem(); }
  if(a==='punch'||a==='kick'||a==='rod'){
    const sk = a==='kick'?'キック':'こぶし';
    const R=rollLine(sk, skillVal(sk));
    blog(`<b>${S.name}</b>の攻撃 ${R.txt}`);
    if(R.ok){ S.grow[a==='kick'?'キック':'こぶし']=1;
      let d = dice((a==='punch'?'1D3':a==='kick'?'1D6':'1D6+1') + (S.db!=='0'?S.db:''));
      if(R.j==='crit') d+= dice(a==='punch'?'1D3':'1D6');
      if(B.weak){ const w=dice('1D4'); d+=w; blog(`　紅葉が見抜いた弱点を突いた！（+${w}）`); B.weak=0; }
      hitEnemy(d);
    }
  } else if(a==='talk'){
    const R=rollLine(e.talk.s, clamp(skillVal(e.talk.s)+(e.talk.mod||0),1,99));
    blog(`<b>${S.name}</b>は語りかけた ${R.txt}`);
    if(R.ok){ S.grow[e.talk.s]=1; e.calm -= (R.j==='crit'?2:1); blog(`　${e.name}の動きが鈍った…`); }
    if(e.calm<=0){ await sleep(500); return endBattle(true, true); }
  } else if(a==='guard'){ guard=30; blog(`<b>${S.name}</b>は身構えた。`); }
  else if(a==='flee'){
    const R=rollLine('DEX×5', S.st.DEX*5); blog(`<b>${S.name}</b>は逃げ出した ${R.txt}`);
    if(R.ok){ await sleep(600); closeOverlay(); B.busy=false; return play(B.flee); }
  }
  refreshBattle(); await sleep(550);
  if(e.hp<=0) return endBattle(true);
  // 同行者の行動
  if(comp('t')){
    if(!B.tUlt && e.hp<=e.hpMax/2){ B.tUlt=true; blog(`<span style="color:${CH.t.color}">独</span>「……終わらせる。」〈🤍Re: End of a Dream💙〉100 → <span class="crit">発動</span>`); hitEnemy(dice('1D6+2')); }
    else { const R=rollLine('↓FREEDOM DiVE↓',69); blog(`<span style="color:${CH.t.color}">独</span>の〈↓FREEDOM DiVE↓〉 ${R.txt}`); if(R.ok) hitEnemy(dice('1D6')); }
    refreshBattle(); await sleep(550); if(e.hp<=0) return endBattle(true);
  }
  if(comp('m')){
    if(S.hp<=S.hpMax/2 && B.mHeal<2){ B.mHeal++; const R=rollLine('応急手当',60); blog(`<span style="color:${CH.m.color}">紅葉</span>「ちょっと、じっとしてて！」${R.txt}`); if(R.ok){ const h=dice('1D3'); heal(h); blog(`　HPが ${h} 回復した。`);} }
    else if(!B.weak){ const R=rollLine('目星',85); blog(`<span style="color:${CH.m.color}">紅葉</span>「あそこ、ノイズが薄いよ！」${R.txt}`); if(R.ok){ B.weak=1; blog('　次の攻撃が成功するとダメージ+1D4'); } }
    else { const R=rollLine('こぶし',50); blog(`<span style="color:${CH.m.color}">紅葉</span>のこぶし ${R.txt}`); if(R.ok) hitEnemy(dice('1D3')); }
    refreshBattle(); await sleep(550); if(e.hp<=0) return endBattle(true);
  }
  // 敵の行動
  const ally = (comp('t')||comp('m')) && Math.random()<.25;
  const R=rollLine('攻撃', e.atk); blog(`<b class="ng">${e.name}</b>の${pick(e.moves||['攻撃'])} ${R.txt}`);
  if(R.ok){
    if(ally){ const who = comp('t')&&(!comp('m')||Math.random()<.5) ? '独' : '紅葉'; blog(`　${who}を狙った！――が、${who}は軽く身を翻して躱した。`); }
    else {
      const D=rollLine('回避', clamp(skillVal('回避')+guard,1,95)); blog(`　${S.name}の回避 ${D.txt}`);
      if(D.ok){ S.grow['回避']=1; blog('　攻撃を躱した！'); }
      else { let d=dice(e.dmg); if(R.j==='crit') d+=dice(e.dmg); S.hp=Math.max(0,S.hp-d); blog(`　<span class="ng">${d} ダメージを受けた！</span>`); shake(); noiseBurst(.3); hud(); }
    }
  }
  refreshBattle();
  await sleep(450);
  if(S.hp<=0) return endBattle(false);
  B.round++; B.busy=false; renderBattle();
}
function refreshBattle(){ const ph=document.querySelector('.battle'); if(!ph) return; const e=B.e;
  ph.querySelector('.bar.e i').style.width=(e.hp/e.hpMax*100)+'%';
  ph.querySelector('.enemy .muted').textContent=`HP ${e.hp}/${e.hpMax}${e.talk?` ・ 鎮静まで ${e.calm}`:''}`;
  ph.querySelector('.bar.p i').style.width=(S.hp/S.hpMax*100)+'%'; }
function battleItem(){
  const list=Object.entries(S.items).filter(([k,v])=>v>0&&ITEMS[k].use);
  const box=$('#acts');
  box.innerHTML = list.map(([k,v])=>`<button class="btn" data-i="${k}">${k} ×${v}<br><small class="muted">${ITEMS[k].desc}</small></button>`).join('') + `<button class="btn" data-i="">戻る</button>`;
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.i; if(!k) return renderBattle();
    S.items[k]--; const r=ITEMS[k].use(); blog(`${S.name}は${k}を使った。（${r}）`);
    // アイテム使用で1行動消費：同行者・敵が動く
    await act('noop');
  });
}
function endBattle(win, peaceful){
  B.busy=false;
  const e=B.e;
  if(win) metaAdd('enemy', B.eid);
  const after=()=>{ closeOverlay(); if(win) play(peaceful&&B.peace?B.peace:B.win); else play(B.lose); };
  if(win) msg(`<h2 class="ok">${peaceful?'鎮静化':'勝利'}</h2><p>${peaceful?`${e.name}は静かにノイズの向こうへ消えていった。`:`${e.name}は砂嵐になって崩れ落ちた。`}</p>`, after);
  else msg(`<h2 class="ng">戦闘不能</h2><p>視界が、白黒の砂嵐に塗り潰されていく――</p>`, after);
}

let inHub=false;
function toHub(){
  inHub=false; S.req=null; S.comp='none'; hud();

    S.flags['nt'+S.day]=1;

}
function hubGreeting(){

function hubMenu(){

}
function board(){

    ${locked.map(r=>`<div class="card" style="opacity:.5"><span class="tag">メイン</span><span class="tt">？？？</span><div class="cl">帰還座標の断片を ${r.need} つ集めると…</div></div>`).join('')}

function reqVisible(r){

  return !r.cond || r.cond();

function chooseComp(r){

      <button class="pick" data-c="m"><b style="color:${CH.m.color}">電子 紅葉</b><small>目星85・説得85・応急手当60。弱点看破と手当て</small></button>
      <button class="pick" data-c="none"><b>ひとりで行く</b><small>自分の力だけで挑む</small></button>
    </div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="cb">やめる</button></div></div>`);
  $('#cb').onclick=()=>{ closeOverlay(); toHub(); };
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>startReq(r,b.dataset.c));
}
function startReq(r,c){ closeOverlay(); inHub=false; S.req=r.id; S.comp=c; hud(); play(r.start); }
function finishRequest(end){
  const r = REQ.find(x=>x.id===S.req);
  let lines=[];
  if(end.money){ S.money+=end.money; lines.push(`報酬 ¥${end.money.toLocaleString()}`); }
  if(end.frag){ S.frag+=1; lines.push(`<span style="color:var(--cyan)">◆ 帰還座標の断片を手に入れた（${S.frag}/5）</span>`); }
  if(end.san){ const v=dice(end.san); sanGain(v); lines.push(`依頼達成：SAN +${v}`); }
  if(end.items) for(const [k,v] of Object.entries(end.items)){ S.items[k]=(S.items[k]||0)+v; lines.push(`${k} ×${v} を手に入れた`); }
  if(end.aff) for(const [k,v] of Object.entries(end.aff)){ S.aff[k]+=v; lines.push(`${CH[k].name}との距離が少し縮まった`); }
  if(end.fx) end.fx();
  if(r){ S.done[r.id]=true; metaAdd('req', r.id); }
  S.busy=true; hud();
  msg(`<h2 class="ok">依頼完了</h2><p>${end.msg||(r?r.title:'')}</p><p>${lines.join('<br>')}</p>`, toHub);
}
function failRequest(){
  S.busy=true; S.hp=Math.max(1,S.hp); hud();
  msg(`<h2 class="ng">依頼失敗</h2><p>今日のところは、帰ろう。<br><span class="muted">依頼は掲示板に残っている。また挑戦できる。</span></p>`, toHub);
}

function talkMenu(){
  inHub=false;
  playNode({bg:'shop', show:S.busy?['t:sit','h','m']:['t','h','m'], lines:[':誰と話そう？'], choices:[
    {t:'白石 ハルカ', fn:()=>play(talkScene('h'))},
    {t:'電子 独', fn:()=>play(talkScene('t'))},
    {t:'電子 紅葉', fn:()=>play(talkScene('m'))},
    {t:'やっぱりやめる', fn:toHub},
  ]});
}
function talkScene(who){
  const key = who+S.day;
  S.flags.read = S.flags.read || {}; S.flags.readDay = S.flags.readDay || {};
  const st = who==='t'?[S.busy?'t:sit':'t']:[who];
  // 絆イベント（好感度で解放、その日の最初の会話で発生）
  if(!S.talked[key]){
    const bond = BONDS.find(b=>b.who===who && !S.flags['bond_'+b.id] && S.aff[who]>=b.aff && (!b.when||b.when()));
    if(bond){ S.talked[key]=1; S.aff[who]+=1; S.flags['bond_'+bond.id]=1; metaAdd('bond', bond.id); return bond.scene; }
  }
  let lines;
  if(S.talked[key]){
    // 今日はもう話した → ひとこと雑談
    lines = [pick(IDLE[who].filter(x=>x!==S.flags['lastIdle'+who])||IDLE[who])];
    S.flags['lastIdle'+who]=lines[0];
  } else {
    const pool = TALK[who].filter(x=>!x.when || x.when());
    const unread = pool.filter(x=>!S.flags.read[x.id]).sort((a,b)=>(b.when?1:0)-(a.when?1:0));
    const t = unread.length ? unread[0] : pool.slice().sort((a,b)=>(S.flags.readDay[a.id]||0)-(S.flags.readDay[b.id]||0))[0];
    S.flags.read[t.id]=1; S.flags.readDay[t.id]=S.day; metaAdd('talk', t.id);
    lines = t.lines.slice();
    S.talked[key]=1; S.aff[who]+=1;
  }
  const extra = [];
  if(who==='h' && S.day - S.adjustDay >= 3 && S.noise>=15){
    extra.push({t:'侵食の調整をお願いする', fn:()=>{ S.adjustDay=S.day; addNoise(-10); play({show:['h'], lines:['h:はいは〜い、ちょっと手ぇ貸してね。',{noise:.5},':ハルカさんの指が触れた瞬間、指先のノイズがすうっと引いていく。','h:応急処置だけどね〜。3日に1回くらいなら、やってあげられるよ。',':（侵食度 -10%）'], next:'__hub'}); }});
  }
  return {show:st, lines, choices: extra.length? [...extra, {t:'戻る', fn:toHub}] : null, next: extra.length?null:'__hub'};
}

function renderLine(raw){
  if(typeof raw!=='string') return '';
  const nm = S ? S.name : 'あなた';
  const f = t=>esc(String(t).replace(/\{name\}/g, nm));
  let m;
  if(raw.startsWith(':')) return `<div class="muted">${f(raw.slice(1))}</div>`;
  if((m=raw.match(/^([htmp]):([\s\S]*)$/))) return `<div><b style="color:${CH[m[1]].color}">${m[1]==='p'?nm:CH[m[1]].name}</b>「${f(m[2])}」</div>`;
  if((m=raw.match(/^([^：\n]{1,14})：([\s\S]*)$/))) return `<div><b>${esc(m[1])}</b>「${f(m[2])}」</div>`;
  return `<div>${f(raw)}</div>`;
}

        <div><div class="tt" style="color:${(CH[pf.id]||{color:'#e8e8e8'}).color}">${pf.name} <span class="muted">${pf.kana}</span></div>
        <div class="cl">${pf.info}</div><p style="font-size:13px;margin:6px 0">${pf.desc}</p>
        ${pf.more.map(x=> (x.need ? x.need() : (aff>=x.aff||META.bond[x.bond])) ? `<p style="font-size:13px;margin:4px 0;color:#cfd8ff">◆ ${x.text}</p>` : `<p class="muted" style="font-size:12px;margin:4px 0">◇ ？？？（${x.need?'会話を進めると解放':'もっと仲良くなると解放'}）</p>`).join('')}
        </div></div></div>`;}).join('');
  } else if(dexTab==='talk'){
    const all = ['h','t','m'].flatMap(w=>TALK[w].map(x=>x.id));
    body = cnt('talk',all) + ['h','t','m'].map(w=>`<h3 style="color:${CH[w].color}">${CH[w].name}</h3>`+
      TALK[w].map((x,i)=> META.talk[x.id] ? `<details class="card"><summary>#${i+1} ${esc(x.title||x.lines[0].replace(/^[htmp]:/,'').slice(0,22))}</summary><div style="font-size:13px;line-height:1.8;margin-top:6px">${x.lines.map(renderLine).join('')}</div></details>` : `<div class="card muted">#${i+1} ？？？</div>`).join('')).join('');
  } else if(dexTab==='bond'){
    const all = BONDS.map(b=>b.id);
    body = cnt('bond',all) + BONDS.map(b=> META.bond[b.id] ? `<details class="card"><summary><b style="color:${CH[b.who].color}">${CH[b.who].name}</b>　${b.title}</summary><div style="font-size:13px;line-height:1.8;margin-top:6px">${(SC[b.scene].lines||[]).map(renderLine).join('')}</div></details>` : `<div class="card muted"><b style="color:${CH[b.who].color}">${CH[b.who].name}</b>　？？？ <span style="font-size:11px">（好感度 ${b.aff} 以上で会話すると…）</span></div>`).join('');
  } else if(dexTab==='req'){
    const all = REQ.map(r=>r.id);
    body = cnt('req',all) + REQ.map(r=> META.req[r.id] ? `<div class="card ${r.main?'main':'side'}"><span class="tag">${r.main?'メイン':r.repeat?'日課':'サブ'}</span><span class="tt">${r.title}</span><div class="cl">依頼人：${r.client}</div><p style="font-size:13px;margin:6px 0">${r.desc}</p></div>` : `<div class="card muted"><span class="tag">${r.main?'メイン':r.repeat?'日課':'サブ'}</span>？？？</div>`).join('');
  } else if(dexTab==='enemy'){
    const all = Object.keys(ENEMIES);
    body = cnt('enemy',all) + all.map(k=>{ const e=ENEMIES[k]; return META.enemy[k] ? `<div class="card battle"><div class="row" style="flex-wrap:nowrap;gap:12px"><div class="glyph" style="font-size:14px;animation:none">${e.glyph}</div><div><div class="tt">${e.name}</div><div class="cl">HP ${e.hp} / 攻撃 ${e.atk}% / ${e.dmg} / SAN ${e.san}</div><p style="font-size:13px;margin:6px 0">${e.desc}</p></div></div></div>` : `<div class="card muted">？？？</div>`; }).join('');
  } else if(dexTab==='end'){
    const all = Object.keys(ENDINGS);
    body = cnt('end',all) + all.map(k=>{ const E=ENDINGS[k]; return META.end[k] ? `<div class="card"><b style="color:${E.color}">${E.title}</b><div class="cl">${E.hint||''}</div></div>` : `<div class="card muted">？？？ <span style="font-size:11px">${E.hint||''}</span></div>`; }).join('');
  }
  overlay(`<div class="panel"><h2>図鑑</h2><div class="row" style="margin-bottom:10px">${tabs.map(([k,l])=>`<button class="btn ${k===dexTab?'pri':''}" data-t="${k}" style="padding:5px 12px">${l}</button>`).join('')}</div>
    <div style="max-height:60vh;overflow:auto">${body}</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="dc">閉じる</button></div></div>`);
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openDex(b.dataset.t));
  $('#dc').onclick=back;
}

/* ---------- 購買 ---------- */
function shop(){
  inHub=false;
  const keys=Object.keys(ITEMS).filter(k=>!ITEMS[k].hidden);
  overlay(`<div class="panel"><h2>ハルカの棚</h2><div class="muted">「欲しいものがあったら言ってね〜。お代はちゃんと貰うけど♪」　所持金 ¥<b id="sm">${S.money.toLocaleString()}</b></div><div style="margin-top:10px">
  ${keys.map(k=>`<div class="kv"><span><b>${k}</b> <span class="muted">所持${S.items[k]||0}</span><br><span class="muted">${ITEMS[k].desc}</span></span><span><button class="btn" data-b="${k}">¥${ITEMS[k].price.toLocaleString()}</button></span></div>`).join('')}
  </div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="sc">戻る</button></div></div>`);
  $('#sc').onclick=()=>{ closeOverlay(); toHub(); };
  document.querySelectorAll('[data-b]').forEach(b=>{
    const k=b.dataset.b; if(ITEMS[k].weapon && S.items[k]) b.disabled=true;
    b.onclick=()=>{ if(S.money<ITEMS[k].price){ b.textContent='お金が足りない'; return; } S.money-=ITEMS[k].price; S.items[k]=(S.items[k]||0)+1; closeOverlay(); shop(); hud(); };
  });
}

/* ---------- 休む ---------- */
function rest(){
  inHub=false;
  // 成長ロール
  const res=[];
  for(const k of Object.keys(S.grow)){
    const cur=S.skills[k]; const r=rnd(100);
    if(r>cur || r>95){ const up=dice('1D10'); S.skills[k]=Math.min(99,cur+up); res.push(`${k}：${r} > ${cur} → <span class="ok">+${up}（${S.skills[k]}）</span>`); }
    else res.push(`${k}：${r} ≦ ${cur} → 成長なし`);
  }
  S.grow={};
  const hp=dice('1D3'); heal(hp); S.mp=S.mpMax;
  const wasInsane=S.insane; S.insane=null;
  S.day++; S.busy=false; addNoise(5);
  const warn = S.noise>=80?'<p class="ng">指先だけでなく、腕まで砂嵐が這い上がっている。……急がないと。</p>':S.noise>=50?'<p style="color:var(--gold)">指先のノイズが、前より濃くなった気がする。</p>':'';
  msg(`<h2>${S.day}日目の朝</h2><p class="muted">窓を少しだけ開けて、ベッドに飛び込んだ。</p>
    <p>HP +${hp}　MP全回復${wasInsane?'　一時的狂気から回復した':''}<br>侵食度 +5%（${S.noise}%）</p>${warn}
    ${res.length?`<h3>成長ロール</h3><p style="font-size:13px">${res.join('<br>')}</p>`:''}`, ()=>{
      if(S.noise>=100) return showEnding('assim');
      const ev = MORNING.find(m=>!S.flags['mo_'+m.id] && m.when());
      if(ev){ S.flags['mo_'+ev.id]=1; play(ev.scene); } else toHub();
    });
}

/* ---------- エンディング ---------- */
function showEnding(id){
  const E = ENDINGS[id]; inHub=false; metaAdd('end', id);
  $('#box').style.display='none'; show([]); setBg(E.bg||'black');
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  overlay(`<div class="panel ending"><div class="muted" style="text-align:center">ENDING</div><h2 style="color:${E.color||'#fff'}">${E.title}</h2>
    <p>${fmt(typeof E.text==='function'?E.text():E.text)}</p>
    <div class="muted" style="text-align:center">${S.name} / ${S.day}日目 / SAN ${S.san} / 侵食 ${S.noise}%</div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri" id="et">タイトルへ</button></div></div>`);
  $('#et').onclick=()=>{ closeOverlay(); title(); };
}

/* ---------- キャラクターストーリー ---------- */
function openStories(){
  overlay(`<div class="panel"><h2>キャラクターストーリー</h2><div class="muted">アカルアのみんなの目線で描く、もうひとつの物語。</div><div style="margin-top:10px">
    ${CHAR_STORIES.map(cs=>`<div class="card"><div class="row" style="flex-wrap:nowrap;gap:12px">
      <img src="${CH[cs.who].img.def}" style="width:56px;height:72px;object-fit:contain;background:#d8e0ff22;border-radius:10px;flex:none">
      <div style="flex:1"><div class="tt" style="color:${CH[cs.who].color}">${cs.title} ${META.story[cs.id]?'<span class="tag">クリア済み</span>':''}</div><div class="cl">${cs.sub}</div></div>
      <button class="btn ${cs.start?'pri':''}" data-s="${cs.id}" ${cs.start?'':'disabled'}>${cs.start?'あそぶ':'準備中'}</button></div></div>`).join('')}
    </div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="sb">戻る</button></div></div>`);
  $('#sb').onclick=title;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>startStory(CHAR_STORIES.find(c=>c.id===b.dataset.s)));
}
function startStory(cs){
  S = newState(); S.story = cs.id; S.name = CH[cs.who].name;
  S.st = {STR:10,CON:10,POW:10,DEX:10,APP:10,SIZ:10,INT:10,EDU:10}; S.hp=S.hpMax=10; S.mp=S.mpMax=10; S.san=S.sanStart=50;
  S.skills = Object.assign({}, BASE_SKILLS); if(cs.setup) cs.setup();
  closeOverlay(); inHub=false; play(cs.start);
}
function endStory(label){
  const cs = CHAR_STORIES.find(c=>c.id===S.story); if(cs) metaAdd('story', cs.id);
  $('#box').style.display='none';
  overlay(`<div class="panel ending"><div class="muted" style="text-align:center">CHARACTER STORY</div><h2>${cs?cs.title:''}</h2><p style="text-align:center">${typeof label==='string'?label:'おしまい'}</p>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri" id="se">タイトルへ</button></div></div>`);
  $('#se').onclick=()=>{ closeOverlay(); title(); };
}

/* ---------- タイトル・キャラ作成 ---------- */
function title(){
  S=null; inHub=false; $('#box').style.display='none'; $('#hud').style.display='none'; show([]); setBg('shop');
  const has = !!load();
  overlay(`<div class="panel title" style="background:#070914ee"><div class="muted">CoC6th based / Network RPG</div>
    <h1>Network<br>// アカルア</h1><div class="sub">迷い人の依頼帳</div>
    <div class="row" style="justify-content:center;flex-direction:column;gap:10px">
      <button class="btn pri" id="tn" style="min-width:220px">はじめから</button>
      <button class="btn" id="tc" style="min-width:220px" ${has?'':'disabled'}>つづきから</button>
      ${Object.keys(META.end).length?`<button class="btn" id="ts" style="min-width:220px;border-color:var(--gold)">キャラクターストーリー <small class="muted">追加コンテンツ</small></button>`:`<button class="btn" style="min-width:220px" disabled>キャラクターストーリー <small class="muted">（エンディングを1度見ると解放）</small></button>`}
      <button class="btn" id="td" style="min-width:220px">図鑑 <small class="muted">（エンド ${Object.keys(META.end).filter(k=>ENDINGS[k]).length}/${Object.keys(ENDINGS).length}）</small></button>
    </div>
    <p class="muted" style="margin-top:20px">クリック／タップ・Enterで文章送り。<br>キャラ案・デザイン：あかたん</p></div>`);
  $('#tn').onclick=()=>{ if(has && !confirm('セーブデータがあります。はじめからにしますか？')) return; create(); };
  $('#td').onclick=()=>openDex('chara');
  if($('#ts')) $('#ts').onclick=openStories;
  $('#tc').onclick=()=>{ S=Object.assign(newState(), load()); closeOverlay(); toHub(); };
}
function create(){
  S=newState();
  let st={};
  const roll=()=>{ st={STR:dice('3D6'),CON:dice('3D6'),POW:dice('3D6'),DEX:dice('3D6'),APP:dice('3D6'),SIZ:dice('2D6+6'),INT:dice('2D6+6'),EDU:dice('3D6+3')}; };
  roll();
  let job=JOBS[0], hob=[];
  const draw=()=>{
    const hp=Math.ceil((st.CON+st.SIZ)/2);
    overlay(`<div class="panel"><h2>迷い人の作成</h2>
      <h3>名前</h3><input type="text" id="nm" maxlength="12" placeholder="あなたの名前" value="${S.name}">
      <h3>能力値 <button class="btn" id="rr" style="padding:3px 10px;font-size:12px">振り直す</button></h3>
      <div class="cols">${Object.entries(st).map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}
        <div class="kv"><span>HP</span><span>${hp}</span></div><div class="kv"><span>MP</span><span>${st.POW}</span></div><div class="kv"><span>SAN</span><span>${st.POW*5}</span></div><div class="kv"><span>DB</span><span>${dbOf(st.STR+st.SIZ)}</span></div></div>
      <h3>元の世界での職業</h3><div class="grid2">${JOBS.map(j=>`<button class="pick ${j===job?'sel':''}" data-j="${j.id}"><b>${j.id}</b><small>${j.desc}</small></button>`).join('')}</div>
      <div class="muted" style="margin-top:6px">${Object.entries(job.b).map(([k,v])=>`${k}+${v}`).join(' / ')}</div>
      <h3>得意なこと（2つ選ぶ・各+30）</h3><div class="row">${HOBBY_SKILLS.map(k=>`<button class="pick ${hob.includes(k)?'sel':''}" data-h="${k}" style="padding:5px 10px">${k}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn" id="cbk">戻る</button><button class="btn pri" id="cok">この姿で【Network】へ</button></div></div>`);
    $('#nm').oninput=e=>S.name=e.target.value;
    $('#rr').onclick=()=>{ roll(); draw(); };
    $('#cbk').onclick=title;
    document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ job=JOBS.find(j=>j.id===b.dataset.j); draw(); });
    document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ const k=b.dataset.h; if(hob.includes(k)) hob=hob.filter(x=>x!==k); else if(hob.length<2) hob.push(k); draw(); });
    $('#cok').onclick=()=>{
      S.name=(S.name||'').trim(); if(!S.name){ $('#nm').focus(); $('#nm').placeholder='名前を入力してください'; return; }
      if(hob.length<2){ alert('得意なことを2つ選んでください'); return; }
      S.st=st; S.job=job.id; S.db=dbOf(st.STR+st.SIZ);
      S.hpMax=S.hp=Math.ceil((st.CON+st.SIZ)/2); S.mpMax=S.mp=st.POW; S.san=S.sanStart=st.POW*5;
      S.skills=Object.assign({}, BASE_SKILLS); S.skills['回避']=st.DEX*2;
      for(const [k,v] of Object.entries(job.b)) S.skills[k]=Math.min(99,(S.skills[k]||0)+v);
      for(const k of hob) S.skills[k]=Math.min(99,S.skills[k]+30);
      closeOverlay(); play('pro_0');
    };
  };
  draw();
}

window.addEventListener('load', ()=>{
  SC.__hub = {hub:true};
  drawNoise(); title();
});

/* ---------- 依頼 ---------- */
