<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1624">
<title>BLOCK FLEET - 艦船建造海戦</title>
<style>
:root{
  --bg:#0b1624;--panel:rgba(12,22,36,.86);--panel2:rgba(22,36,56,.92);--line:#2b4363;
  --text:#e9f1fb;--muted:#8fa5c0;--accent:#ffb340;--accent2:#4fd1ff;--danger:#ff5d6c;--ok:#5ee08a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px}
button:active{transform:translateY(1px)}
button.on{background:var(--accent);color:#1d1300;border-color:transparent;font-weight:700}
button.pri{background:linear-gradient(180deg,#ffc35c,#f39a1e);color:#1d1300;border:none;font-weight:800}
button.dng{background:#5a1f2a;border-color:#8a3040}
input,textarea,select{font:inherit;color:var(--text);background:#081221;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.screen{position:fixed;inset:0;pointer-events:none;display:none}
.screen.show{display:block}
.screen .pe{pointer-events:auto}
.hidden{display:none!important}

/* ---------- menu ---------- */
#scr-menu .center{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 46px);transform:translateX(-50%);text-align:center;width:min(92vw,420px)}
#scr-menu .mbtm{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 26px);transform:translateX(-50%);width:min(92vw,420px)}
.logo{font-size:clamp(40px,11vw,72px);font-weight:900;letter-spacing:.04em;line-height:1;margin:0;
  text-shadow:0 4px 24px #0009;color:#fff}
.logo span{color:var(--accent)}
.sub{margin:10px 0 26px;color:#d6e6f5;text-shadow:0 2px 10px #000a;font-size:14px}
.menu-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-btns button{padding:14px;font-size:17px;font-weight:700;background:var(--panel);backdrop-filter:blur(6px)}
.ver{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#c9d8e8;font-size:11px;text-shadow:0 1px 4px #000}

/* ---------- editor ---------- */
.topbar{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;align-items:center}
.topbar input{flex:1;min-width:60px;max-width:260px}
.topbar .sp{flex:1}
label.gl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}
label.gl input[type=range]{flex:1;max-width:60%}
#stats{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 48px);left:8px;width:220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.55}
#stats .row{display:flex;justify-content:space-between;gap:6px}
#stats .row b{font-weight:700}
#stats .warn{color:var(--danger);font-weight:700}
#stats .note{color:var(--accent)}
#stats.mini .body{display:none}
#stats .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--accent2);cursor:pointer}
#tools{position:absolute;right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 48px);display:flex;flex-direction:column;gap:6px;width:64px}
#tools button{padding:6px 2px;font-size:11px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:1px}
#tools button .ic{font-size:18px}
#cutbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;font-size:10px;text-align:center}
#cutbox input{width:100%;padding:0;margin:0}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 8px max(8px,env(safe-area-inset-bottom))}
#pinfo{background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 0 0;padding:5px 10px;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
#pinfo b{color:var(--text)}
#cats{display:flex;gap:4px;overflow-x:auto;background:var(--panel);padding:5px 6px 0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
#cats button{padding:5px 14px;font-size:13px;border-radius:8px 8px 0 0;flex:0 0 auto}
#palette{display:flex;gap:6px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;padding:6px;scrollbar-width:thin}
#palette button{flex:0 0 auto;min-width:72px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
#palette .sw{width:26px;height:18px;border-radius:4px;border:1px solid #0006;display:flex;align-items:center;justify-content:center;font-size:13px}
#palette button.on{background:#3b2a0a;color:var(--accent);border-color:var(--accent)}
#toast{position:fixed;z-index:20;left:50%;top:22%;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* ---------- battle ---------- */
#fleets{position:absolute;top:max(6px,env(safe-area-inset-top));left:6px;right:6px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.fleet{display:flex;flex-direction:column;gap:4px;width:min(46vw,240px)}
.fleet.enemy{align-items:flex-end}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:11px;width:100%}
.sc .nm{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.sc .st{color:var(--accent);font-weight:700}
.sc.dead{opacity:.45}
.bar{height:5px;background:#0008;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .3s}
.bar.fl i{background:var(--accent2)}
.bar.hpb{height:11px;position:relative}.bar.hpb i{transition:width .25s}.hpt{position:absolute;right:4px;top:-1px;font-size:9px;line-height:11px;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}
.enemy .bar i{background:var(--danger)}
.enemy .bar.fl i{background:#7fb2ff}
#blog{position:absolute;left:8px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 60px);font-size:12px;line-height:1.5;text-shadow:0 1px 3px #000,0 0 6px #000;max-width:60vw;pointer-events:none}
#blog div{animation:fade 6s forwards}
#blog.up{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 140px)}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
#bctl{position:absolute;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:96vw}
#bctl button{padding:8px 10px;font-size:13px}
#helm{position:absolute;left:8px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:46px 46px;gap:5px}
#helm button{font-size:20px;padding:0}
#helm .tl{grid-column:2;grid-row:1}
#helm .lf{grid-column:1;grid-row:2}
#helm .dn{grid-column:2;grid-row:2}
#helm .rt{grid-column:3;grid-row:2}
#helmInfo{position:absolute;left:8px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 104px);font-size:12px;background:var(--panel);border-radius:8px;padding:3px 8px}
#ftxt{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;left:0;top:0;font-weight:900;font-size:15px;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 8px #000;will-change:transform,opacity}
.ft.big{font-size:22px}.ft.r{color:#ff8a8a}.ft.y{color:#ffe08a}.ft.b{color:#9fd4ff}.ft.g{color:#c9d2db;font-size:13px}
#mm{position:absolute;right:8px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 48px);width:130px;height:130px;border-radius:50%;border:1px solid var(--line);background:rgba(6,16,28,.6);transition:width .2s,height .2s}
#mm.lg{width:min(70vw,300px);height:min(70vw,300px)}
@media (max-width:560px){.ft{font-size:12px}.ft.big{font-size:16px}#blog{font-size:10.5px;max-width:58vw}#blog div:nth-last-child(n+5){display:none}#mm{width:104px;height:104px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 84px)}#mm.up{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 250px)}}
#mhdr{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
#mhdr>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:6px}
.mh-money b{color:var(--accent)}.mh-rank small{color:var(--muted);font-size:10px}
.xpbar{display:inline-block;width:70px;height:6px;background:#0008;border-radius:3px;overflow:hidden;vertical-align:middle}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd66b,#ff9a3c);width:0}
.smoney{font-weight:700;color:var(--accent);font-size:11px}
#palette button{position:relative}
#palette button.dim{opacity:.55}
.own{position:absolute;top:2px;right:3px;font-size:9px;background:#000a;border-radius:6px;padding:0 4px;color:#cfe}
.own.full{color:#ffb0b0}.own.bu{color:#ffd66b}.own.lk{color:#ff9aa4}
.ownf{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap;padding:0 6px}
.buyl{color:#1d1300!important;background:var(--accent);border-radius:6px;padding:0 6px;cursor:pointer;font-weight:700}
.shophd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:6px;font-size:13px}
.shophd b.money{color:var(--accent)}
.stabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}.stabs button{flex:0 0 auto;padding:5px 10px;font-size:12px}
.slist .item .sw{width:30px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.sbtn{display:flex;flex-direction:column;gap:4px}.sbtn button{padding:5px 10px;font-size:12px}
.rew{background:#0b1626;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.rew .row{display:flex;justify-content:space-between;font-size:13px}.rew .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-size:15px}.rew .tot b{color:var(--accent)}
.rankup{margin-top:6px;padding:6px 8px;border-radius:8px;background:#3b2a0a;color:#ffd66b;font-weight:700}
#bigmsg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(36px,10vw,80px);font-weight:900;text-shadow:0 4px 30px #000;pointer-events:none;letter-spacing:.1em}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.mbox{background:#0f1c2e;border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px}
.mbody{padding:12px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:14px;line-height:1.6;-webkit-user-select:text;user-select:text}
.mfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:#0b1626}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.item .d{font-size:12px;color:var(--muted)}
.item.sel{border-color:var(--accent);background:#2a1f0b}
.item.lock{opacity:.4}
.item button{padding:5px 10px;font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:18px;text-align:center}
.mbody h4{margin:14px 0 6px;color:var(--accent2)}
.mbody ul{padding-left:20px;margin:6px 0}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:#22344e;color:#bcd;margin-left:4px}
textarea{width:100%;height:120px;font-size:11px;font-family:monospace}
@media (max-width:560px){
  #stats{width:160px;font-size:10.5px;padding:6px 8px}
  .topbar button{padding:7px 8px;font-size:13px}
  .topbar .lbl{display:none}
  #tools{width:50px;gap:3px}
  #t-redo{display:none!important}
  #mhdr{font-size:12px}.xpbar{width:46px}.mh-rank small{display:none}
  #tools button{font-size:9.5px;padding:4px 1px}
  #tools button .ic{font-size:15px}
  #pinfo{font-size:10.5px;gap:6px;padding:4px 8px}
  #palette button{min-width:62px;font-size:11px;padding:5px 6px}
  #cats button{padding:4px 10px;font-size:12px}
  .sc{font-size:10px;padding:3px 6px}
  #bctl button{padding:7px 8px;font-size:12px}
  #bctl.man{flex-direction:column;align-items:stretch;width:92px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</script>
</head>
<body>
<canvas id="c"></canvas>

<!-- MENU -->
<div id="scr-menu" class="screen">
  <div id="mhdr" class="pe"><div class="mh-money">💰 <b class="money"></b></div><div class="mh-rank">⭐ <b class="rankname"></b><span class="xpbar"><i></i></span><small class="xptext"></small></div></div>
  <div class="center pe">
    <h1 class="logo">BLOCK<span>FLEET</span></h1>
    <div class="sub">ブロックで軍艦を設計し、大海原で撃ち合え</div>
  </div>
  <div class="mbtm pe">
    <div class="menu-btns">
      <button id="m-edit">⚓ 建造ドック</button>
      <button id="m-shop">🏭 工廠</button>
      <button id="m-camp">🎖 キャンペーン</button>
      <button id="m-wave">🌊 連続海戦</button>
      <button id="m-free">⚔ フリー海戦</button>
      <button id="m-help">❓ 遊び方</button>
      <button id="m-set" style="grid-column:1/3;padding:10px;font-size:15px">⚙ 設定</button>
    </div>
  </div>
  <div class="ver">BLOCK FLEET v2.0 — 戦って資金を稼ぎ、工廠で兵装を揃えよう</div>
</div>

<!-- EDITOR -->
<div id="scr-editor" class="screen">
  <div class="topbar pe">
    <button id="e-back">◀</button>
    <input id="e-name" maxlength="24" value="マイ艦">
    <button id="e-file">📁<span class="lbl"> ファイル</span></button>
    <button id="e-save">💾<span class="lbl"> 保存</span></button>
    <span class="sp"></span>
    <button id="e-go" class="pri">出撃 ▶</button>
  </div>
  <div id="stats" class="pe">
    <div class="hd" id="stats-hd"><span>艦の性能</span><span class="smoney">💰 <span class="money"></span></span><span id="stats-tg">▾</span></div>
    <div class="body" id="stats-body"></div>
  </div>
  <div id="tools" class="pe">
    <button id="t-mode" class="on"><span class="ic">🧱</span>設置</button>
    <button id="t-mirror" class="on"><span class="ic">⇋</span>左右対称</button>
    <button id="t-rect"><span class="ic">▭</span>範囲</button>
    <button id="t-rot"><span class="ic">⟳</span>回転 <span id="t-rotv">0°</span></button>
    <button id="t-paint"><span class="ic">🎨</span>塗装</button>
    <button id="t-undo"><span class="ic">↶</span>戻す</button>
    <button id="t-redo"><span class="ic">↷</span>やり直し</button>
    <button id="t-cam"><span class="ic">🎥</span>視点</button>
    <button id="t-shop"><span class="ic">🏭</span>工廠</button>
    <button id="t-test"><span class="ic">🎯</span>試運転</button>
    <div id="cutbox">断面 <span id="cutv">全</span><input id="t-cut" type="range" min="0" max="15" value="15"></div>
  </div>
  <div id="bottom" class="pe">
    <div id="pinfo"></div>
    <div id="cats"></div>
    <div id="palette"></div>
  </div>
</div>

<!-- BATTLE -->
<div id="scr-battle" class="screen">
  <div id="fleets"><div class="fleet" id="f0"></div><div class="fleet enemy" id="f1"></div></div>
  <div id="blog"></div>
  <div id="ftxt"></div>
  <canvas id="mm" class="pe" width="260" height="260"></canvas>
  <div id="bigmsg"></div>
  <div id="helmInfo" class="pe hidden"></div>
  <div id="helm" class="pe hidden">
    <button class="tl" data-h="up">▲</button>
    <button class="lf" data-h="left">◀</button>
    <button class="dn" data-h="down">▼</button>
    <button class="rt" data-h="right">▶</button>
  </div>
  <div id="bctl" class="pe">
    <button id="b-manual">操舵: 自動</button>
    <button id="b-cam">📷 自艦</button>
    <button id="b-speed">速度 x1</button>
    <button id="b-snd">🔊</button>
    <button id="b-quit" class="dng">撤退</button>
  </div>
</div>

<div id="toast"></div>
<div id="modal" class="hidden"><div class="mbox"><div class="mhead"><span id="mtitle"></span><button id="mclose">✕</button></div><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ================================================================
//  定数 / 部品定義
// ================================================================
const XMIN=-8,XMAX=8,YMAX=15,ZMIN=-45,ZMAX=45;
const G=20;                 // 重力（ゲーム単位）
const key=(x,y,z)=>((x+16)*32+y)*128+(z+64);
const inB=c=>c[0]>=XMIN&&c[0]<=XMAX&&c[1]>=0&&c[1]<=YMAX&&c[2]>=ZMIN&&c[2]<=ZMAX;

// ================================================================
//  部品カタログ
//  pr: 1個あたりの価格（無ければ無料） ul: 一度買えば使い放題の解放価格  rk: 必要階級
//  w: 兵装  range射程 dmg威力 reload装填(s) pen貫通 splash爆風半径 barrels砲身数 yaw旋回速度 spread散布 cal口径表示
// ================================================================
const CATS=['船体','装飾','設備','小口径砲','中口径砲','大口径砲','超大口径砲','近代砲','機銃','高角砲・CIWS','対空ミサイル','対艦ミサイル','魚雷','特殊兵器','航空'];
const nice=v=>{const m=v<200?5:v<1000?10:v<10000?50:100;return Math.max(m,Math.round(v/m)*m);};
const P={
  // ---- 船体（無料） ----
  hull:  {n:'船体',cat:0,sz:[1,1,1],hp:40, m:0.5, d:1,  ar:0,  col:0x8e979f,shape:'box',ic:'■'},
  hullL: {n:'軽量船体',cat:0,sz:[1,1,1],hp:22,m:0.28,d:1, ar:0,  col:0x9aa3ab,shape:'box',ic:'□'},
  deck:  {n:'甲板',cat:0,sz:[1,1,1],hp:35, m:0.45,d:1,  ar:0,  col:0xb88d5a,shape:'box',ic:'▤'},

function dims(t,r){const s=P[t].sz;return (r&1)?[s[2],s[1],s[0]]:s;}
function cellsOf(t,x,y,z,r){const [sx,sy,sz]=dims(t,r);const x0=x-((sx-1)>>1),z0=z-((sz-1)>>1);const o=[];
  for(let i=0;i<sx;i++)for(let j=0;j<sy;j++)for(let k=0;k<sz;k++)o.push([x0+i,y+j,z0+k]);return o;}
function centerOf(t,x,y,z,r){const [sx,,sz]=dims(t,r);return [x-((sx-1)>>1)+(sx-1)/2,y,z-((sz-1)>>1)+(sz-1)/2];}

class Hydro{
  constructor(){this.lv=new Float64Array(YMAX+2);this.lvx=new Float64Array(YMAX+2);this.lvz=new Float64Array(YMAX+2);this.m=0;this.mx=0;this.mz=0;}
  addPart(p,s){const d=P[p.t];const cs=p.cells||cellsOf(p.t,p.x,p.y,p.z,p.r);const c0=p.ctr||centerOf(p.t,p.x,p.y,p.z,p.r);
    for(const c of cs){this.lv[c[1]]+=s*d.d;this.lvx[c[1]]+=s*d.d*c[0];this.lvz[c[1]]+=s*d.d*c[2];}
    this.m+=s*d.m;this.mx+=s*d.m*c0[0];this.mz+=s*d.m*c0[2];}
  addMass(m,x,z){this.m+=m;this.mx+=m*x;this.mz+=m*z;}
  solve(){
    const lv=this.lv;let acc=0,h=-1;
    for(let y=0;y<=YMAX;y++){ if(lv[y]>1e-6&&acc+lv[y]>=this.m){h=y+(this.m-acc)/lv[y];break;} acc+=Math.max(0,lv[y]); }
    if(h<0||this.m<=0) return {h:YMAX+1,sink:this.m>0,heel:0,trim:0};
    let bx=0,bz=0;for(let y=0;y<=YMAX;y++){const f=clamp(h-y,0,1);if(f<=0)break;bx+=f*this.lvx[y];bz+=f*this.lvz[y];}
    const heel=clamp((bx-this.mx)/(this.m*2.5),-1.3,1.3);
    const trim=clamp(-(bz-this.mz)/(this.m*16),-0.5,0.5);
    return {h,sink:false,heel,trim};
  }
}

function analyze(parts){
  const hy=new Hydro();let power=0,bridges=0,disp=0,fdeck=0,heli=0,hpSum=0,value=0,armorN=0;const wc={},planes={};for(const t of PT)planes[t]=0;
  let minX=99,maxX=-99,minZ=99,maxZ=-99,maxY=-1;
  for(const p of parts){const d=P[p.t];if(!d)continue;hy.addPart(p,1);hpSum+=d.hp;value+=d.pr||0;if(d.power)power+=d.power;if(p.t==='bridge')bridges++;
    if(p.t==='armor'||p.t==='armorH')armorN+=p.t==='armorH'?2:1;
    if(d.w)wc[p.t]=(wc[p.t]||0)+1;if(d.hangar)planes[d.hangar]+=HANGAR_CAP;if(p.t==='fdeck')fdeck++;if(p.t==='heli')heli++;
    for(const c of (p.cells||cellsOf(p.t,p.x,p.y,p.z,p.r))){disp+=d.d;minX=Math.min(minX,c[0]);maxX=Math.max(maxX,c[0]);minZ=Math.min(minZ,c[2]);maxZ=Math.max(maxZ,c[2]);maxY=Math.max(maxY,c[1]);}}
  const s=hy.solve();
  const spd=power>0&&hy.m>0?Math.min(26,3+28*Math.sqrt(power/hy.m)):0;
  const usable=t=>t==='H'?heli>0:fdeck>=MIN_FDECK;let np=0,npU=0;for(const t of PT){np+=planes[t];if(usable(t))npU+=planes[t];}
  let fp=0,aap=0;
  for(const p of parts){const d=P[p.t];const w=d&&d.w;if(!w)continue;
    if(!w.aaOnly)fp+=w.dmg*w.barrels/w.reload*clamp(w.range/400,.3,1.5)*(w.torp?.5:1)*(w.dmg<10?.3:1)*Math.min(1.5,.5+w.pen);
    if(w.aa)aap+=(w.aaDmg*Math.max(1,w.aaR)*w.barrels/w.reload)*Math.sqrt(w.range/150)*(w.missile?2:w.beam?3:1)/10;}
  if(fdeck>=MIN_FDECK){fp+=(planes.B*230+planes.T*380+planes.J*450)/40;aap+=planes.F*1.5+planes.X*2.5;}if(heli)fp+=planes.H*300/40;
  return {fp,aap,armorN,hp:Math.round(hpSum*HP_SCALE),value,mass:hy.m,disp,power,bridges,wc,planes,np,npU,fdeck,heli,carrier:npU>0,armed:Object.keys(wc).length>0||npU>0,
    h:s.h,sink:s.sink||parts.length===0,heel:s.heel,trim:s.trim,spd,L:parts.length?maxZ-minZ+1:0,B:parts.length?maxX-minX+1:0,H:maxY+1,n:parts.length};
}

let FXQ=1;
class PSys{
  constructor(max,additive){this.max=max;this.i=0;
    this.pos=new Float32Array(max*3);this.col=new Float32Array(max*3);this.size=new Float32Array(max);this.alpha=new Float32Array(max);
    this.vel=new Float32Array(max*3);this.life=new Float32Array(max);this.ml=new Float32Array(max);this.s0=new Float32Array(max);this.s1=new Float32Array(max);
    this.a0=new Float32Array(max);this.gr=new Float32Array(max);this.dr=new Float32Array(max);
    const g=new THREE.BufferGeometry();
    this.aPos=new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage);this.aCol=new THREE.BufferAttribute(this.col,3).setUsage(THREE.DynamicDrawUsage);
    this.aSize=new THREE.BufferAttribute(this.size,1).setUsage(THREE.DynamicDrawUsage);this.aAlpha=new THREE.BufferAttribute(this.alpha,1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position',this.aPos);g.setAttribute('pcol',this.aCol);g.setAttribute('psize',this.aSize);g.setAttribute('palpha',this.aAlpha);
    this.mat=new THREE.ShaderMaterial({uniforms:{uScale:{value:500}},transparent:true,depthWrite:false,
      blending:additive?THREE.AdditiveBlending:THREE.NormalBlending,
      vertexShader:`attribute vec3 pcol;attribute float psize;attribute float palpha;uniform float uScale;varying vec3 vC;varying float vA;
        void main(){vec4 mv=modelViewMatrix*vec4(position,1.);float dz=-mv.z;vC=pcol;vA=palpha*smoothstep(6.,30.,dz);gl_PointSize=min(psize*uScale/max(dz,.1),360.);gl_Position=projectionMatrix*mv;}`,
      fragmentShader:`varying vec3 vC;varying float vA;void main(){vec2 d=gl_PointCoord-.5;float r=length(d);if(r>.5||vA<.003)discard;
        float a=smoothstep(.5,.1,r)*vA;gl_FragColor=vec4(vC,a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        }`});
    this.pts=new THREE.Points(g,this.mat);this.pts.frustumCulled=false;this.pts.renderOrder=5;this.active=0;}
  emit(x,y,z,vx,vy,vz,life,s0,s1,r,g,b,a0,gr=0,dr=0){if(FXQ<1&&Math.random()>FXQ)return;const i=this.i;this.i=(i+1)%this.max;const i3=i*3;
    this.pos[i3]=x;this.pos[i3+1]=y;this.pos[i3+2]=z;this.vel[i3]=vx;this.vel[i3+1]=vy;this.vel[i3+2]=vz;
    this.col[i3]=r;this.col[i3+1]=g;this.col[i3+2]=b;this.life[i]=life;this.ml[i]=life;this.s0[i]=s0;this.s1[i]=s1;this.a0[i]=a0;this.gr[i]=gr;this.dr[i]=dr;
    this.size[i]=s0;this.alpha[i]=0;this.active=this.max;}
  update(dt){if(!this.active)return;let any=0;
    for(let i=0;i<this.max;i++){if(this.life[i]<=0)continue;any=1;this.life[i]-=dt;const i3=i*3;
      if(this.life[i]<=0){this.alpha[i]=0;this.size[i]=0;continue;}
      const f=1-this.life[i]/this.ml[i];this.vel[i3+1]-=this.gr[i]*dt;const dm=Math.max(0,1-this.dr[i]*dt);
      this.vel[i3]*=dm;this.vel[i3+1]*=dm;this.vel[i3+2]*=dm;
      this.pos[i3]+=this.vel[i3]*dt;this.pos[i3+1]+=this.vel[i3+1]*dt;this.pos[i3+2]+=this.vel[i3+2]*dt;
      this.size[i]=this.s0[i]+(this.s1[i]-this.s0[i])*f;this.alpha[i]=this.a0[i]*(1-f)*Math.min(1,f*12);}
    if(!any)this.active=0;
    this.aPos.needsUpdate=this.aCol.needsUpdate=this.aSize.needsUpdate=this.aAlpha.needsUpdate=true;}
  clear(){this.life.fill(0);this.alpha.fill(0);this.size.fill(0);this.aAlpha.needsUpdate=this.aSize.needsUpdate=true;}
}

let AC=null,NB=null,muted=false,sndN=0;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();const len=AC.sampleRate*2;NB=AC.createBuffer(1,len,AC.sampleRate);
    const d=NB.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=l*.6+w*.4;d[i]=l;}
    const fade=2000;for(let i=0;i<fade;i++){const k=i/fade;d[len-fade+i]=d[len-fade+i]*(1-k)+d[i]*k;}startAmbient();}catch(e){AC=null;}}
let amb=null;
function startAmbient(){if(!AC||amb||!NB)return;try{const src=AC.createBufferSource();src.buffer=NB;src.loop=true;src.playbackRate.value=.5;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g1=AC.createGain();g1.gain.value=.05;const g2=AC.createGain();g2.gain.value=0;
  const lfo=AC.createOscillator();lfo.frequency.value=.11;const lg=AC.createGain();lg.gain.value=.03;lfo.connect(lg);lg.connect(g1.gain);
  src.connect(f);f.connect(g1);g1.connect(g2);g2.connect(AC.destination);src.start();lfo.start();amb={g:g2};updateAmbient();}catch(e){}}
function updateAmbient(){if(!amb)return;const on=settings.amb&&!muted&&mode!=='editor';amb.g.gain.setTargetAtTime(on?1:0,AC.currentTime,.6);}
function sfx(vol,freq,dur){if(!AC||muted||vol<0.015||sndN>16)return;sndN++;setTimeout(()=>sndN--,dur*900);
  const t=AC.currentTime,src=AC.createBufferSource();src.buffer=NB;const f=AC.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.25),t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(Math.min(1,vol),t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t,Math.random()*1.5);src.stop(t+dur+.05);}
function sfxAt(p,vol,freq,dur){const d=p.distanceTo(controls.target);sfx(vol/(1+d/120),freq,dur);}
window.addEventListener('pointerdown',initAudio,{passive:true});

function makeBuilder(){const parts=[],occ=new Map();
  const b={parts,
    put(t,x,y,z,r=0,rep=false){t=normT(t);const cs=cellsOf(t,x,y,z,r);if(!cs.every(inB))return false;
      if(rep){for(const c of cs){const o=occ.get(key(...c));if(o)b.remove(o);}}else if(cs.some(c=>occ.has(key(...c))))return false;
      const p={t,x,y,z,r};parts.push(p);for(const c of cs)occ.set(key(...c),p);return true;},
    remove(p){const i=parts.indexOf(p);if(i>=0)parts.splice(i,1);for(const c of cellsOf(p.t,p.x,p.y,p.z,p.r))occ.delete(key(...c));},
    box(t,x0,x1,y0,y1,z0,z1){for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)b.put(t,x,y,z);},
    sym(t,x,y,z,r=0){t=normT(t);b.put(t,x,y,z,r);if(x!==0)b.put(t,-x,y,z,mirrorRot(t,r));},
  };return b;}
function genHull(b,{L,hw,D,belt,engines=[],bowR=.28}){
  const zs=-Math.floor(L/2),ze=zs+L-1,bl=Math.max(2,Math.round(L*bowR)),sl=Math.max(2,Math.round(L*.12));
  const W=z=>{if(z<zs||z>ze)return -1;const fs=ze-bl;if(z>fs){const f=(z-fs)/bl;return Math.max(0,Math.round(hw*(1-Math.pow(f,1.6))));}
    const as=zs+sl;if(z<as){const f=(as-z)/sl;return Math.round(hw*(1-.45*f*f));}return hw;};
  for(let z=zs;z<=ze;z++){const w=W(z);for(let y=0;y<D;y++){const off=y===0?1:0,wy=w-off;if(wy<0)continue;
    for(let x=-wy;x<=wy;x++){let t=y===D-1?'deck':'hull',r=0;const edge=Math.abs(x)===wy&&wy>0;
      if(edge&&z>0&&W(z+1)-off<wy){t='corner';r=x>0?0:3;}
      else if(edge&&z<0&&W(z-1)-off<wy){t='corner';r=x>0?1:2;}
      else if(belt&&Math.abs(x)===wy&&y>=1&&y<=D-2&&z>=belt[0]&&z<=belt[1])t='armor';
      b.put(t,x,y,z,r);}}}
  for(const [x,z] of engines)b.put('engine',x,1,z,0,true);
}

const RANKS=[['少尉',0],['中尉',800],['大尉',2200],['少佐',5000],['中佐',9500],['大佐',16000],['少将',26000],['中将',40000],['大将',60000],['元帥',90000]];
const rankOf=xp=>{let r=0;for(let i=0;i<RANKS.length;i++)if(xp>=RANKS[i][1])r=i;return r;};
const isFree=t=>{const d=P[t];return !!d&&!d.pr&&!d.ul;};
const fmtG=v=>Math.round(v).toLocaleString()+' G';
let inv=LS.get('bf_inv',null);
function usage(parts){const u={};for(const p of parts){const t=normT(p.t||p[0]);if(P[t]&&P[t].pr)u[t]=(u[t]||0)+1;}return u;}
if(!inv||typeof inv.money!=='number'){
  inv={money:3000,xp:0,own:{},ul:{},daily:'',best:0};
  for(const [t,n] of [['g127_1',4],['t61_3',2],['a25_3',2],['a13_2',2],['g8_1',2]])inv.own[t]=n;
  // 既存データの引き継ぎ：保存済みの艦で使っている兵装は所持済みにする
  const old=[...designs.map(d=>d.parts||[]),(LS.get('bf_current',{})||{}).parts||[]];
  for(const arr of old){const u=usage(arr);for(const t in u)inv.own[t]=Math.max(inv.own[t]||0,u[t]);
    for(const a of arr){const t=normT(a[0]);if(P[t]&&P[t].ul)inv.ul[t]=1;}}
  if(progress.cleared>0){inv.money+=2500*progress.cleared;inv.xp=Math.min(90000,progress.cleared*2600);}
  LS.set('bf_inv',inv);
}
for(const d of designs)if(d.parts)for(const a of d.parts)a[0]=normT(a[0]);
const owned=t=>{t=normT(t);const d=P[t];if(!d)return 0;if(isFree(t))return Infinity;if(d.ul)return inv.ul[t]?Infinity:0;return inv.own[t]||0;};
const canBuy=t=>rankOf(inv.xp)>=(P[t].rk||0);
function saveInv(){LS.set('bf_inv',inv);updateMoneyUI();}
function addMoney(v){inv.money=Math.max(0,Math.round(inv.money+v));}
function addXP(v){const r0=rankOf(inv.xp);inv.xp+=Math.round(v);const r1=rankOf(inv.xp);if(r1>r0){const bonus=500*r1;addMoney(bonus);return {up:true,rank:r1,bonus};}return {up:false};}
function buy(t,n=1){const d=P[t];if(!d||isFree(t)||!canBuy(t))return false;if(d.ul&&inv.ul[t])return false;const price=d.ul?d.ul:d.pr*n;if(inv.money<price)return false;
  inv.money-=price;if(d.ul)inv.ul[t]=1;else inv.own[t]=(inv.own[t]||0)+n;saveInv();return true;}
function sell(t,n=1){const d=P[t];if(!d||!d.pr||(inv.own[t]||0)<n)return false;inv.own[t]-=n;addMoney(Math.floor(d.pr*n*.5));saveInv();return true;}
function missing(parts){const u=usage(parts),m=[];for(const t in u){const lack=u[t]-(inv.own[t]||0);if(lack>0)m.push({t,n:lack});}
  const seen=new Set();for(const p of parts){const t=normT(p.t||p[0]);if(P[t]&&P[t].ul&&!inv.ul[t]&&!seen.has(t)){seen.add(t);m.push({t,n:1,ul:true});}}return m;}
const missingCost=m=>m.reduce((a,x)=>a+(x.ul?P[x.t].ul:P[x.t].pr*x.n),0);
const missingLocked=m=>m.filter(x=>!canBuy(x.t));
function buyMissing(m){if(missingLocked(m).length||inv.money<missingCost(m))return false;for(const x of m){if(x.ul)buy(x.t);else buy(x.t,x.n);}return true;}
function rankLabel(){const r=rankOf(inv.xp),nx=RANKS[r+1];return {r,name:RANKS[r][0],next:nx?nx[1]:null,prev:RANKS[r][1]};}
function updateMoneyUI(){const rl=rankLabel();
  for(const e of document.querySelectorAll('.money'))e.textContent=fmtG(inv.money);
  for(const e of document.querySelectorAll('.rankname'))e.textContent=rl.name;
  const pct=rl.next?Math.min(100,(inv.xp-rl.prev)/(rl.next-rl.prev)*100):100;for(const e of document.querySelectorAll('.xpbar i'))e.style.width=pct+'%';
  for(const e of document.querySelectorAll('.xptext'))e.textContent=rl.next?`${inv.xp.toLocaleString()} / ${rl.next.toLocaleString()} XP`:`${inv.xp.toLocaleString()} XP（最高階級）`;}
function dailyBonus(){const d=new Date().toDateString();if(inv.daily===d)return;inv.daily=d;const v=500+150*rankOf(inv.xp);addMoney(v);saveInv();setTimeout(()=>toast(`🎁 ログインボーナス +${fmtG(v)}`),600);}
function encodeSpec(s){return btoa(unescape(encodeURIComponent(JSON.stringify({n:s.name,p:s.parts,c:s.paint}))));}
function decodeSpec(str){const o=JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
  if(!o||!Array.isArray(o.p))throw new Error('bad');return {name:String(o.n||'艦').slice(0,24),paint:o.c&&typeof o.c==='object'?{h:o.c.h|0,d:o.c.d|0,b:o.c.b|0}:undefined,parts:o.p.filter(a=>Array.isArray(a)&&P[normT(a[0])]).map(a=>[normT(a[0]),a[1]|0,a[2]|0,a[3]|0,(a[4]|0)&3])};}

function edSnap(){return ed.parts.map(p=>[p.t,p.x,p.y,p.z,p.r]);}
function edLoad(arr,name,paint){if(paint!==undefined)ed.paint={...DEF_PAINT,...(paint||{})};ed.parts=[];ed.cells.clear();for(const a of arr){const t0=normT(a[0]);if(!P[t0])continue;const p={t:t0,x:a[1],y:a[2],z:a[3],r:a[4]||0};
  p.cells=cellsOf(p.t,p.x,p.y,p.z,p.r);if(!p.cells.every(inB)||p.cells.some(c=>ed.cells.has(key(...c))))continue;p.ctr=centerOf(p.t,p.x,p.y,p.z,p.r);
  ed.parts.push(p);for(const c of p.cells)ed.cells.set(key(...c),p);}
  if(name!=null){ed.name=name;$('#e-name').value=name;}edRebuild();}
function edPush(){ed.undo.push(edSnap());if(ed.undo.length>60)ed.undo.shift();ed.redo=[];}
function edAdd(p){p.cells=cellsOf(p.t,p.x,p.y,p.z,p.r);p.ctr=centerOf(p.t,p.x,p.y,p.z,p.r);ed.parts.push(p);for(const c of p.cells)ed.cells.set(key(...c),p);}
function edDel(p){const i=ed.parts.indexOf(p);if(i<0)return;ed.parts.splice(i,1);for(const c of p.cells)ed.cells.delete(key(...c));}
let _saveT=0;
function edRebuild(){
  if(ed.vis)edRoot.remove(ed.vis);
  ed.stats=analyze(ed.parts);const s=ed.stats;
  ed.vis=buildShipVisual(ed.parts,{waterline:s.sink?-1:s.h,cutY:ed.cutY,paint:ed.paint});edRoot.add(ed.vis);
  wlPlane.visible=!s.sink;wlPlane.position.y=s.h;
  renderStats();if(mode==='editor')renderPalette();clearTimeout(_saveT);_saveT=setTimeout(()=>LS.set('bf_current',{name:ed.name,parts:edSnap(),paint:ed.paint}),300);
}
function rank(v,th){const L=['E','D','C','B','A','S'];let i=0;while(i<th.length&&v>=th[i])i++;return L[i];}
function renderStats(){const s=ed.stats;const w=s.wc;
  const warns=[];
  if(s.n===0)warns.push('ブロックがありません');
  else if(s.sink)warns.push('⚠ 浮力不足：このままでは沈没します。船体や浮力ブロックを増やすか重い装備を減らそう');
  if(s.n&&!s.power)warns.push('⚠ 機関なし：動けません');
  if(s.n&&!s.bridges)warns.push('⚠ 艦橋なし：命中率が低下');
  if(s.n&&!s.armed)warns.push('⚠ 兵装なし');
  if(s.np-s.planes.H>0&&s.fdeck<MIN_FDECK)warns.push(`⚠ 飛行甲板が不足（${s.fdeck}/${MIN_FDECK}）：艦載機を発艦できません`);
  if(s.planes.H&&!s.heli)warns.push('⚠ ヘリ甲板がありません：ヘリを発艦できません');
  if(!s.sink&&Math.abs(s.heel)>0.05)warns.push(`⚠ 傾斜 ${(s.heel*57.3).toFixed(1)}°（左右の重量差）`);
  if(!s.sink&&Math.abs(s.trim)>0.05)warns.push(`⚠ トリム ${(s.trim*57.3).toFixed(1)}°（前後の重量差）`);
  const miss=missing(ed.parts);if(miss.length)warns.push(`⚠ 未所持パーツ ${miss.reduce((a,x)=>a+x.n,0)}個（購入費 ${fmtG(missingCost(miss))}）`);
  const fb=s.sink?0:s.H-s.h;
  const wl=Object.entries(w).map(([k,v])=>`${P[k].n}×${v}`).join('、')||'なし';
  const pl=PT.filter(t=>s.planes[t]).map(t=>AIR[t].n+s.planes[t]).join(' ');
  $('#stats-body').innerHTML=`
  <div class="row"><span>耐久(HP)</span><b style="color:var(--ok)">${s.hp.toLocaleString()}</b></div>
  <div class="row"><span>全長×幅×高</span><b>${s.L}×${s.B}×${Math.max(0,s.H)}</b></div>
  <div class="row"><span>ブロック数</span><b>${s.n}</b></div>
  <div class="row"><span>重量 / 排水量</span><b>${(s.mass*100).toFixed(0)} / ${(s.disp*100).toFixed(0)} t</b></div>
  <div class="row"><span>喫水 / 乾舷</span><b>${s.sink?'—':s.h.toFixed(2)} / ${s.sink?'—':fb.toFixed(1)}</b></div>
  <div class="row"><span>予備浮力</span><b>${s.sink?'0':Math.round((1-s.mass/Math.max(1,s.disp))*100)}%</b></div>
  <div class="row"><span>速力</span><b>${(s.spd*2.2).toFixed(1)} kt</b></div>
  <div class="row"><span>装備価値</span><b style="color:var(--accent)">${fmtG(s.value)}</b></div>
  <div class="row"><span>対艦火力</span><b>${rank(s.fp,[60,150,250,500,800])} <small>${s.fp.toFixed(0)}</small></b></div>
  <div class="row"><span>対空火力</span><b>${rank(s.aap,[8,25,60,110,180])} <small>${s.aap.toFixed(0)}</small></b></div>
  <div class="row"><span>防御</span><b>${rank(s.hp/40+s.armorN/Math.max(1,s.n)*100,[8,20,45,90,160])}</b></div>
  <div style="margin-top:3px;color:var(--muted)">兵装: ${wl}</div>
  ${pl?`<div style="color:var(--muted)">艦載機: ${pl}</div>`:''}
  ${warns.map(x=>`<div class="warn">${x}</div>`).join('')}
  ${!warns.length?'<div class="note">✓ 出撃可能</div>':''}`;
}
function ownBadge(t){const d=P[t];if(isFree(t))return '';if(!canBuy(t))return `<small class="own lk">🔒${RANKS[d.rk][0]}</small>`;
  if(d.ul)return inv.ul[t]?'':`<small class="own bu">🛒${(d.ul/1000).toFixed(1)}k</small>`;
  const o=inv.own[t]||0,u=ed.parts.reduce((a,p)=>a+(p.t===t?1:0),0);return o?`<small class="own${u>=o?' full':''}">${u}/${o}</small>`:`<small class="own bu">🛒</small>`;}

    if(!owned(k))b.classList.add('dim');

  else info+=`<span>所持 ${inv.own[ed.sel]||0}</span><span class="buyl" data-t="${ed.sel}">🛒 購入 ${fmtG(d.pr)}</span>`;
  if(!canBuy(ed.sel))info+=`<span style="color:var(--danger)">🔒 ${RANKS[d.rk][0]}で解放</span>`;
  $('#pinfo').innerHTML=info;
  for(const e of $('#pinfo').querySelectorAll('.buyl'))e.onclick=()=>quickBuy(e.dataset.t);
}
function partInfo(t){const d=P[t];let info='';
  if(d.ar)info+=`<span>装甲 ${d.ar}</span>`;
  if(d.power)info+=`<span>出力 ${d.power}</span>`;
  if(d.w){info+=`<span>射程 ${d.w.range}</span>`;if(d.w.dmg>3)info+=`<span>威力 ${Math.round(d.w.dmg)}${d.w.barrels>1?'×'+d.w.barrels:''}</span>`;info+=`<span>装填 ${d.w.reload}s</span>`;
    if(d.w.aaOnly)info+='<span style="color:var(--accent2)">対空専用</span>';else if(d.w.aa)info+='<span style="color:var(--accent2)">対空・対艦両用</span>';
    if(d.w.missile==='ssm'||d.w.missile==='bm')info+='<span>誘導・迎撃されることあり</span>';if(d.w.homing)info+='<span>目標を追尾</span>';if(d.w.lob)info+='<span>曲射（山なり弾道）</span>';
    if(d.w.beam)info+='<span style="color:var(--accent2)">ビーム（即着弾）</span>';if(d.w.rail)info+='<span style="color:var(--accent2)">超高速弾・高貫通</span>';if(d.w.plasma)info+='<span style="color:var(--accent2)">プラズマ弾・大爆発</span>';
    if(d.w.barrels>=8)info+=`<span>${d.w.barrels}連装斉射</span>`;}
  if(d.fx)info+=`<span style="color:var(--accent2)">${d.fx}</span>`;
  if(t==='float')info+='<span style="color:var(--accent2)">とても軽い。重い艦を浮かせるのに便利</span>';
  if(d.hangar)info+=`<span style="color:var(--accent2)">${AIR[d.hangar].n}${HANGAR_CAP}機搭載（${d.hangar==='H'?'ヘリ甲板':'飛行甲板'+MIN_FDECK+'個以上'}が必要）</span>`;
  if(t==='fdeck')info+=`<span style="color:var(--accent2)">${MIN_FDECK}個以上で艦載機が発着艦可能</span>`;

function quickBuy(t){const d=P[t];if(!d||isFree(t))return;
  if(!canBuy(t)){toast(`🔒 ${RANKS[d.rk][0]}で解放されます`);return;}
  const box=el(`<div><div style="font-weight:800;font-size:16px">${esc(d.n)}</div><div class="d" style="color:var(--muted);margin:4px 0 10px">${partInfo(t).replace(/<span[^>]*>/g,'').replace(/<\/span>/g,' / ')}</div>
    <div>所持金: <b class="money"></b></div><div>${d.ul?'解放価格':'価格'}: <b>${fmtG(d.ul||d.pr)}</b>${d.ul?'':`　所持: <b>${inv.own[t]||0}</b>`}</div></div>`);
  const btns=[{label:'閉じる'}];
  if(d.ul){if(!inv.ul[t])btns.push({label:`解放する（${fmtG(d.ul)}）`,cls:'pri',fn:()=>{if(!buy(t)){toast('資金が足りません');return false;}toast(`「${d.n}」を解放しました`);afterBuy();}});}
  else{btns.push({label:'×5 購入',fn:()=>{if(!buy(t,5)){toast('資金が足りません');return false;}toast(`「${d.n}」×5 を購入`);afterBuy();}});
    btns.push({label:`購入（${fmtG(d.pr)}）`,cls:'pri',fn:()=>{if(!buy(t,1)){toast('資金が足りません');return false;}toast(`「${d.n}」を購入`);afterBuy();}});}
  modal('パーツ購入',box,btns);updateMoneyUI();}

// ---- ボクセルレイキャスト (DDA) ----
function voxelPick(ro,rd){
  const o=[ro.x+.5,ro.y,ro.z+.5],d=[rd.x,rd.y,rd.z],lo=[XMIN,0,ZMIN],hi=[XMAX+1,YMAX+1,ZMAX+1];
  let t0=-Infinity,t1=Infinity,ea=-1;
  for(let a=0;a<3;a++){if(Math.abs(d[a])<1e-9){if(o[a]<lo[a]||o[a]>hi[a])return null;continue;}
    let ta=(lo[a]-o[a])/d[a],tb=(hi[a]-o[a])/d[a];if(ta>tb)[ta,tb]=[tb,ta];if(ta>t0){t0=ta;ea=a;}if(tb<t1)t1=tb;}
  if(t1<Math.max(t0,0))return null;
  const t=Math.max(t0,0);const p=[o[0]+d[0]*t,o[1]+d[1]*t,o[2]+d[2]*t];
  const c=[0,1,2].map(a=>clamp(Math.floor(p[a]+(d[a]>0?1e-6:-1e-6)),lo[a],hi[a]-1));
  let n=null;if(t0>0&&ea>=0){n=[0,0,0];n[ea]=d[ea]>0?-1:1;}
  const st=[],tM=[],tD=[];
  for(let a=0;a<3;a++){st[a]=d[a]>0?1:d[a]<0?-1:0;tD[a]=st[a]?Math.abs(1/d[a]):Infinity;
    tM[a]=st[a]>0?t+(c[a]+1-p[a])/d[a]:st[a]<0?t+(c[a]-p[a])/d[a]:Infinity;}
  for(let it=0;it<500;it++){
    if(c[1]<=ed.cutY){const pt=ed.cells.get(key(c[0],c[1],c[2]));if(pt)return {part:pt,cell:c.slice(),n};}
    let a=tM[0]<tM[1]?(tM[0]<tM[2]?0:2):(tM[1]<tM[2]?1:2);
    const prev=c.slice();c[a]+=st[a];tM[a]+=tD[a];n=[0,0,0];n[a]=-st[a];
    if(c[a]<lo[a]||c[a]>hi[a]-1){if(a===1&&st[1]<0)return {ground:true,cell:prev,n:[0,1,0]};return null;}
  }
  return null;
}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pickAt(cx,cy){const r=canvas.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);return voxelPick(ray.ray.origin,ray.ray.direction);}
function placementFor(hit){
  if(!hit||!hit.n)return null;const t=ed.sel,d=P[t];const r=d.rot?ed.rot:0;const [sx,,sz]=dims(t,r);
  let x,y,z;
  if(hit.ground){[x,y,z]=hit.cell;y=0;}else{x=hit.cell[0]+hit.n[0];y=hit.cell[1]+hit.n[1];z=hit.cell[2]+hit.n[2];}
  if(hit.n[0])x+=hit.n[0]*((sx-1)>>1);if(hit.n[2])z+=hit.n[2]*((sz-1)>>1);
  if(hit.n[1]<0)y-=d.sz[1]-1;
  const list=[{t,x,y,z,r}];
  if(ed.mirror){const m={t,x:-x,y,z,r:mirrorRot(t,r)};if(!(m.x===x&&m.r===r)){
    const a=new Set(cellsOf(t,x,y,z,r).map(c=>key(...c)));if(!cellsOf(m.t,m.x,m.y,m.z,m.r).some(c=>a.has(key(...c))))list.push(m);}}
  const valid=list.map(p=>cellsOf(p.t,p.x,p.y,p.z,p.r).every(c=>inB(c)&&!ed.cells.has(key(...c))));
  return {list,valid};
}
function hideGhosts(){ghosts.forEach(g=>g.visible=false);}
function showGhost(g,t,x,y,z,r,ok){const [sx,sy,sz]=dims(t,r);const c=centerOf(t,x,y,z,r);g.scale.set(sx+.04,sy+.04,sz+.04);g.position.set(c[0],y+sy/2,c[2]);
  g.material.color.setHex(ok?0x5ee08a:0xff5d6c);g.visible=true;}
function rectCell(hit){if(!hit)return null;if(ed.tool==='erase')return hit.part?hit.cell.slice():null;
  if(!hit.n)return null;if(hit.ground)return [hit.cell[0],0,hit.cell[2]];return [hit.cell[0]+hit.n[0],hit.cell[1]+hit.n[1],hit.cell[2]+hit.n[2]];}
function showBox(g,a,b,ok){const x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]),z0=Math.min(a[2],b[2]),z1=Math.max(a[2],b[2]);
  g.scale.set(x1-x0+1.04,y1-y0+1.04,z1-z0+1.04);g.position.set((x0+x1)/2,(y0+y1)/2+.5,(z0+z1)/2);g.material.color.setHex(ok?0x5ee08a:0xff5d6c);g.visible=true;}
function rectApply(a,b){const x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]),z0=Math.min(a[2],b[2]),z1=Math.max(a[2],b[2]);
  if((x1-x0+1)*(y1-y0+1)*(z1-z0+1)>5000){toast('範囲が大きすぎます');return;}
  edPush();let n=0;
  if(ed.tool==='erase'){const del=new Set();const chk=(x,y,z)=>{const p=ed.cells.get(key(x,y,z));if(p)del.add(p);};
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++){if(!inB([x,y,z]))continue;chk(x,y,z);if(ed.mirror)chk(-x,y,z);}
    for(const p of del){edDel(p);n++;}toast(`${n}個削除しました`);}
  else{const t=ed.sel,r=P[t].rot?ed.rot:0;let left=isFree(t)?Infinity:owned(t)-ed.parts.reduce((a,p)=>a+(p.t===t?1:0),0);
    if(left<=0){ed.undo.pop();toast('未所持・所持数不足のパーツです');quickBuy(t);return;}
    const put=(x,y,z,rr)=>{if(left<=0||!inB([x,y,z])||ed.cells.has(key(x,y,z)))return;edAdd({t,x,y,z,r:rr});n++;left--;};
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++){put(x,y,z,r);if(ed.mirror&&x!==0)put(-x,y,z,mirrorRot(t,r));}
    toast(`${n}個設置しました`);}
  edRebuild();}
function edHover(cx,cy){hideGhosts();const hit=pickAt(cx,cy);if(!hit)return;
  if(ed.rect){const c=rectCell(hit);if(!c)return;const ok=ed.tool==='erase'||P[ed.sel].sz.join()==='1,1,1';
    if(ed.rectA){showBox(ghosts[0],ed.rectA,c,ed.tool!=='erase'&&ok);if(ed.mirror)showBox(ghosts[1],[-ed.rectA[0],ed.rectA[1],ed.rectA[2]],[-c[0],c[1],c[2]],ed.tool!=='erase'&&ok);}
    else showBox(ghosts[0],c,c,ed.tool!=='erase'&&ok);return;}
  if(ed.tool==='erase'){if(hit.part){const p=hit.part;showGhost(ghosts[0],p.t,p.x,p.y,p.z,p.r,false);
      const m=edMirrorOf(p);if(m)showGhost(ghosts[1],m.t,m.x,m.y,m.z,m.r,false);}return;}
  const pl=placementFor(hit);if(!pl)return;pl.list.forEach((p,i)=>showGhost(ghosts[i],p.t,p.x,p.y,p.z,p.r,pl.valid[i]));}
function edMirrorOf(p){if(!ed.mirror||p.x===0&&!P[p.t].rot)return null;const c=cellsOf(p.t,-p.x,p.y,p.z,mirrorRot(p.t,p.r))[0];const q=ed.cells.get(key(...c));
  return q&&q!==p&&q.t===p.t&&q.x===-p.x&&q.y===p.y&&q.z===p.z?q:null;}
function edTap(cx,cy){const hit=pickAt(cx,cy);if(!hit)return;
  if(ed.rect){if(ed.tool!=='erase'&&P[ed.sel].sz.join()!=='1,1,1'){toast('範囲設置は1マスのブロックのみです');return;}
    const c=rectCell(hit);if(!c)return;
    if(!ed.rectA){ed.rectA=c;toast('始点を設定。終点をタップ');showBox(ghosts[0],c,c,ed.tool!=='erase');}
    else{const a=ed.rectA;ed.rectA=null;rectApply(a,c);hideGhosts();}return;}
  if(ed.tool==='erase'){if(!hit.part)return;edPush();const m=edMirrorOf(hit.part);edDel(hit.part);if(m)edDel(m);edRebuild();edHover(cx,cy);return;}
  const pl=placementFor(hit);if(!pl)return;
  if(!pl.valid[0]){toast(pl.list[0].y+P[pl.list[0].t].sz[1]-1>YMAX||!cellsOf(pl.list[0].t,pl.list[0].x,pl.list[0].y,pl.list[0].z,pl.list[0].r).every(inB)?'範囲外です':'他のブロックと重なっています');return;}
  {const t=pl.list[0].t;if(!isFree(t)){const o=owned(t),u=ed.parts.reduce((a,p)=>a+(p.t===t?1:0),0),need=pl.valid.filter(v=>v).length;
    if(o-u<need){if(o-u>=1){pl.list=pl.list.slice(0,1);pl.valid=pl.valid.slice(0,1);toast('所持数が足りないため片側だけ設置しました');}
      else{toast(o?`所持数が足りません（使用${u}/所持${o}）`:'未所持のパーツです');quickBuy(t);return;}}}}
  edPush();pl.list.forEach((p,i)=>{if(pl.valid[i])edAdd({...p});});edRebuild();if(lastPointerType==='mouse')edHover(cx,cy);}

let downInfo=null,activePtr=0,lastPointerType='mouse';
canvas.addEventListener('pointerdown',e=>{activePtr++;lastPointerType=e.pointerType;
  downInfo=activePtr===1?{x:e.clientX,y:e.clientY,t:performance.now()}:null;});
canvas.addEventListener('pointermove',e=>{lastPointerType=e.pointerType;
  if(downInfo&&Math.hypot(e.clientX-downInfo.x,e.clientY-downInfo.y)>8)downInfo=null;
  if(mode==='editor'&&e.pointerType==='mouse'&&!e.buttons)edHover(e.clientX,e.clientY);});
const ptrUp=e=>{activePtr=Math.max(0,activePtr-1);
  if(e.type==='pointerup'&&downInfo&&performance.now()-downInfo.t<600&&e.button===0){if(mode==='editor')edTap(e.clientX,e.clientY);else if(mode==='battle')battleTap(e.clientX,e.clientY);}
  downInfo=null;};
canvas.addEventListener('pointerup',ptrUp);canvas.addEventListener('pointercancel',ptrUp);
canvas.addEventListener('pointerleave',()=>{if(mode==='editor'&&lastPointerType==='mouse')hideGhosts();});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(mode==='editor'){
    if(e.key==='r'||e.key==='R')$('#t-rot').click();

  } else if(mode==='battle')helmKey(e.key,true);
});

const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_v3=new THREE.Vector3();
const HP_SCALE=0.15;
const _SC=new THREE.Color();
class Ship{
  constructor(spec,team,opt={}){
    this.name=spec.name;this.team=team;this.cells=new Map();this.hydro=new Hydro();this.parts=[];
    let minZ=99,maxZ=-99,maxY=0,rad=0,hpSum=0;

$('#b-quit').onclick=()=>{if(battle.mode==='test'){goEditor();return;}if(battle.over){showResult(battle.ships.some(s=>s.team===0&&!s.out));return;}if(confirm('撤退しますか？（敗北扱い）')){battle.over=true;showResult(false);}};

const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const specParts=sp=>sp.parts.map(a=>({t:normT(a[0]),x:a[1],y:a[2],z:a[3],r:a[4]||0}));
function fleetMissing(specs){const u={},ulset=new Set();
  for(const sp of specs){const us=usage(sp.parts);for(const t in us)u[t]=Math.max(u[t]||0,us[t]);for(const a of sp.parts){const t=normT(a[0]);if(P[t]&&P[t].ul&&!inv.ul[t])ulset.add(t);}}
  const m=[];for(const t in u){const lack=u[t]-(inv.own[t]||0);if(lack>0)m.push({t,n:lack});}for(const t of ulset)m.push({t,n:1,ul:true});return m;}
// 不足パーツがあれば購入を確認してから実行
function ensureOwned(specs,go){const m=fleetMissing(specs);if(!m.length){go();return;}
  const cost=missingCost(m),locked=missingLocked(m);
  const box=el(`<div><div style="margin-bottom:8px">出撃に必要なパーツが不足しています。</div>${m.map(x=>`<div class="item"><div class="grow"><div class="t">${esc(P[x.t].n)} ${x.ul?'（解放）':'×'+x.n}</div>
    <div class="d">${x.ul?fmtG(P[x.t].ul):fmtG(P[x.t].pr)+' × '+x.n}${canBuy(x.t)?'':` <span style="color:var(--danger)">🔒 ${RANKS[P[x.t].rk][0]}で解放</span>`}</div></div></div>`).join('')}
    <div style="margin-top:8px">合計 <b>${fmtG(cost)}</b>　所持金 <b class="money"></b></div></div>`);
  const btns=[{label:'キャンセル'}];
  if(locked.length)btns.push({label:'工廠へ',fn:()=>{openShop(P[locked[0].t].cat);return false;}});
  else if(inv.money<cost)btns.push({label:'資金不足（工廠へ）',fn:()=>{openShop();return false;}});
  else btns.push({label:`まとめて購入して出撃（${fmtG(cost)}）`,cls:'pri',fn:()=>{if(!buyMissing(m)){toast('購入できませんでした');return false;}toast('不足パーツを購入しました');go();}});
  modal('パーツが足りません',box,btns);updateMoneyUI();}

// ---- 戦闘の開始・終了 ----
const TARGET_SPEC=(()=>{const b=makeBuilder();genHull(b,{L:46,hw:4,D:4});b.box('sup',-2,2,4,5,-6,4);b.put('mast',0,6,0);b.put('bridge',0,6,2);
  return {name:'標的艦',parts:b.parts.map(p=>[p.t,p.x,p.y,p.z,p.r]),paint:{h:5,d:4,b:1}};})();
const WAVES=[['dd'],['dd','dd'],['cl'],['cl','dd'],['ca'],['ca','dd'],['cv','dd'],['bb'],['ddg','ddg'],['bb','ca'],['cv','cv'],['bbx'],['fut','ddg'],['bbx','cv'],['bbz']];
function waveFleet(n){if(n<=WAVES.length)return WAVES[n-1];const pool=['bb','bbx','cv','fut','ddg','ca','bbz'];const k=2+Math.min(2,((n-WAVES.length)/4)|0);
  return Array.from({length:k},()=>pool[(Math.random()*pool.length)|0]);}
const waveReward=n=>300+150*n;
function addShip(sp,team,x,z,hd,opt){const s=new Ship(sp,team,opt);s.place(x,z,hd);s.throttle=1;battle.ships.push(s);battleRoot.add(s.root);return s;}
function startBattle(mySpecs,enemySpecs,stage=-1,bmode){
  clearBattle();battle.mode=bmode||(stage>=0?'campaign':'free');battle.stage=stage;battle.over=false;battle.time=0;battle.follow=0;battle.camMode='own';
  battle.earn={sink:0,sunk:0};battle.wave=0;battle.waveBonus=0;battle.waveT=0;battle.startCleared=progress.cleared;
  mySpecs.forEach((sp,i)=>{const off=(i%2?1:-1)*Math.ceil(i/2)*80;addShip(sp,0,off+rand(-10,10),-280+rand(-20,20),0);});
  if(battle.mode==='wave')spawnWave(1);
  else if(battle.mode==='test'){const t=addShip(TARGET_SPEC,1,0,-90,Math.PI/2,{hpMul:4});t.dummy=true;t.throttle=0;t.power=0;t.updateSpeed();}
  else enemySpecs.forEach((sp,i)=>{const off=(i%2?1:-1)*Math.ceil(i/2)*80;addShip(sp,1,off+rand(-10,10),280+rand(-20,20),Math.PI);});
  buildHud();setMode('battle');
  $('#b-quit').textContent=battle.mode==='test'?'終了':'撤退';
  setTimeout(()=>{if(mode==='battle'&&battle.time<8)blog(battle.mode==='test'?'🎯 試運転：標的艦を自由に撃ってみよう（報酬なし）':'💡 敵艦をタップで攻撃目標を指定 / 右下のレーダーはタップで拡大',1);},2500);
  const me=battle.ships[0];controls.target.copy(me.pos).setY(4);camera.position.set(me.pos.x-70,45,me.pos.z-90);
  $('#bigmsg').textContent='';showBig(battle.mode==='wave'?'WAVE 1':battle.mode==='test'?'試運転':'戦闘開始',1800);
  $('#b-speed').textContent='速度 x'+battle.speed;
}
function spawnWave(n){battle.wave=n;
  for(const s of battle.ships.filter(s=>s.team===1&&s.gone))battleRoot.remove(s.root);battle.ships=battle.ships.filter(s=>!(s.team===1&&s.gone));
  const mine=battle.ships.filter(s=>s.team===0&&!s.sinking);const c=new THREE.Vector3();mine.forEach(s=>c.add(s.pos));if(mine.length)c.divideScalar(mine.length);
  if(Math.hypot(c.x,c.z)>350){c.multiplyScalar(350/Math.hypot(c.x,c.z));}
  const a=Math.atan2(-c.x,-c.z)+rand(-.6,.6),bx=c.x+Math.sin(a)*560,bz=c.z+Math.cos(a)*560,hm=n>10?1+.12*(n-10):1;
  waveFleet(n).forEach((id,i)=>{const off=(i%2?1:-1)*Math.ceil(i/2)*80;addShip(presetSpec(id),1,bx+Math.cos(a)*off,bz-Math.sin(a)*off,a+Math.PI,{hpMul:hm});});
  buildHud();}
function onShipSunk(s,by){if(!battle.earn||battle.mode==='test')return;
  if(s.team===1){const v=Math.round(100+s.maxHP*.04+s.value*.05);battle.earn.sink+=v;battle.earn.sunk++;if(mode==='battle')floatText(s.pos,`+${fmtG(v)}`,'y',3);}}
function battleEndCheck(dt){
  if(battle.over||battle.mode==='test')return;const ships=battle.ships;
  const a0=ships.some(s=>s.team===0&&!s.out),a1=ships.some(s=>s.team===1&&!s.out);
  if(battle.mode==='wave'&&a0&&!a1){
    if(!battle.waveT){battle.waveT=4;const b=waveReward(battle.wave);battle.waveBonus+=b;showBig(`WAVE ${battle.wave} クリア`,2600);blog(`🌊 WAVE ${battle.wave} クリア！ +${fmtG(b)}`,1);
      for(const s of ships)if(s.team===0&&!s.sinking){s.hp=Math.min(s.maxHP,s.hp+s.maxHP*.3);for(const t of PT)s.air.stock[t]=s.air.cap[t];}}
    battle.waveT-=dt;if(battle.waveT<=0){battle.waveT=0;spawnWave(battle.wave+1);showBig(`WAVE ${battle.wave}`,1600);}
    return;}
  if(!a0||!a1){battle.over=true;const win=a0;showBig(win?'勝利':battle.mode==='wave'?'艦隊全滅':'敗北');setTimeout(()=>showResult(win),3500);}
}
function showResult(win){
  if(mode!=='battle'||battle.mode==='test')return;
  const mine=battle.ships.filter(s=>s.team===0);const lines=[];let total=0;const add=(l,v)=>{v=Math.round(v);if(v>0){lines.push([l,v]);total+=v;}};
  const dmg=mine.reduce((a,s)=>a+s.dmgDealt,0);let starHtml='',head='';
  if(battle.mode==='campaign'){const st=battle.stage,S=STAGES[st];
    if(win){add('勝利報酬',S.reward);if(battle.startCleared<=st)add('初回クリアボーナス',S.reward);if(progress.cleared<=st)progress.cleared=st+1;}
    const noLoss=!mine.some(s=>s.sinking),healthy=mine.every(s=>!s.sinking&&s.hp>=s.maxHP*.5);
    const n=win?1+(noLoss?1:0)+(healthy?1:0):0;progress.stars=progress.stars||{};
    if(n>(progress.stars[st]||0)){if(n===3&&(progress.stars[st]||0)<3&&win)add('★3達成ボーナス',S.reward*.5);progress.stars[st]=n;}LS.set('bf_progress',progress);
    starHtml=`<div style="text-align:center;font-size:34px;color:var(--accent);letter-spacing:4px">${starStr(n)}</div>
      <div class="d" style="text-align:center;margin-bottom:8px">${win?'✔':'✘'} 勝利　${win&&noLoss?'✔':'✘'} 撃沈されずに勝利　${win&&healthy?'✔':'✘'} 全艦HP50%以上で勝利</div>`;
    head=win?esc(S.name)+' をクリアしました！':'艦の設計を見直して再挑戦しよう。工廠で強い兵装を買うのも手です。';}
  else if(battle.mode==='wave'){const cleared=battle.wave-1;head=`WAVE ${cleared} までクリア${cleared>(inv.best||0)?'（自己ベスト更新！）':''}`;inv.best=Math.max(inv.best||0,cleared);add('ウェーブ報酬',battle.waveBonus);}
  else{if(win)add('勝利報酬',150*battle.ships.filter(s=>s.team===1).length);head=win?'敵艦隊を撃滅しました！':'敗北…設計を見直そう。';}
  add('撃沈報酬',battle.earn.sink);add('与ダメージボーナス',dmg*.04);
  if(battle.mode==='free'){for(const l of lines)l[1]=Math.round(l[1]*.5);total=Math.round(total*.5);lines.push(['（フリー海戦は報酬50%）',0]);}
  addMoney(total);const up=addXP(total);saveInv();
  const score=s=>s.dmgDealt+s.planeKills*60+s.intercepts*40;
  let mvp=null;for(const s of mine)if(!mvp||score(s)>score(mvp))mvp=s;
  const rows=battle.ships.filter(s=>s.team===0||!s.gone||s.sinking).map(s=>{const ex=[];if(s.shots)ex.push(`命中率 ${Math.round(s.hits/s.shots*100)}%`);if(s.planeKills)ex.push(`撃墜 ${s.planeKills}`);if(s.intercepts)ex.push(`迎撃 ${s.intercepts}`);
    return `<div class="item"><div class="grow"><div class="t">${s.team===0?'🔵':'🔴'} ${esc(s.name)}${s===mvp&&score(s)>0?' <span class="tag" style="background:#5a420c;color:#ffd66b">👑 MVP</span>':''}</div>
    <div class="d">与ダメージ ${Math.round(s.dmgDealt).toLocaleString()}${ex.length?' / '+ex.join(' / '):''}<br>状態: ${s.sinking?'撃沈':s.out?'戦闘不能':'健在'}（HP ${Math.round(s.hp/s.maxHP*100)}%）</div></div></div>`;}).join('');
  const rew=`<div class="rew">${lines.map(([l,v])=>`<div class="row"><span>${l}</span><b>${v?'+'+fmtG(v):''}</b></div>`).join('')}<div class="row tot"><span>獲得資金</span><b>+${fmtG(total)}</b></div>
    <div class="row"><span>獲得経験値</span><b>+${Math.round(total).toLocaleString()} XP</b></div>${up.up?`<div class="rankup">⭐ 昇進！「${RANKS[up.rank][0]}」になりました（ボーナス +${fmtG(up.bonus)}）<br><small>新しい兵装が工廠で購入できるようになりました</small></div>`:''}</div>`;
  const btns=[{label:'建造ドックへ',fn:()=>goEditor()},{label:'工廠',fn:()=>{goMenu();openShop();return false;}},{label:'メニュー',fn:()=>goMenu()}];
  if(battle.lastArgs)btns.unshift({label:battle.mode==='wave'?'もう一度':'再戦',cls:'pri',fn:()=>{const a=battle.lastArgs;ensureOwned(a[0],()=>startBattle(...a));return false;}});
  if(win&&battle.mode==='campaign'&&battle.stage+1<STAGES.length)btns.unshift({label:'次の海戦へ',cls:'pri',fn:()=>{closeModal();openFleetSelect(battle.stage+1);return false;}});
  const air=battle.downed[0]+battle.downed[1]?`<div class="d" style="margin-bottom:6px">航空機損失: 自軍 ${battle.downed[0]}機 / 敵軍 ${battle.downed[1]}機</div>`:'';
  modal(battle.mode==='wave'?'🌊 連続海戦 終了':win?'🎉 勝利！':'💥 敗北…',starHtml+`<div style="margin-bottom:8px">${head}</div>`+rew+air+rows,btns);updateMoneyUI();
}

const STAGES=[

function specList(){const l=[];
  if(ed.parts.length)l.push({id:'cur',name:ed.name+'（編集中）',spec:{name:ed.name,parts:edSnap(),paint:{...ed.paint}},mine:true});
  designs.forEach((d,i)=>l.push({id:'d'+i,name:d.name,spec:d,mine:true}));
  for(const id in PRESETS)l.push({id:'p'+id,name:PRESETS[id].name,spec:presetSpec(id),preset:true});
  for(const it of l){const s=analyze(specParts(it.spec));it.st=s;it.ok=!s.sink&&s.armed;it.miss=missing(it.spec.parts);}
  return l;}
function specDesc(s){return `HP ${s.hp.toLocaleString()} / ${(s.spd*2.2).toFixed(1)}kt / 火力${rank(s.fp,[60,150,250,500,800])} 対空${rank(s.aap,[8,25,60,110,180])} / ${Object.entries(s.wc).slice(0,4).map(([k,v])=>P[k].n+'×'+v).join(' ')}${Object.keys(s.wc).length>4?' ほか':''}${s.carrier?` 艦載機${s.npU}機`:''}`;}
function missDesc(m){return m.length?`<div class="d" style="color:var(--accent)">🛒 不足パーツ ${m.reduce((a,x)=>a+x.n,0)}個（${fmtG(missingCost(m))}）${missingLocked(m).length?' 🔒階級不足あり':''}</div>`:'';}
function openCampaign(){const box=el('<div></div>');
  STAGES.forEach((st,i)=>{const lock=i>progress.cleared;const sn=(progress.stars||{})[i]||0;const hp=st.enemies.reduce((a,e)=>a+analyze(specParts(presetSpec(e))).hp,0);
    const it=el(`<div class="item ${lock?'lock':''}"><div class="grow"><div class="t">${esc(st.name)} <span style="color:var(--accent)">${lock?'':starStr(sn)}</span></div><div class="d">${esc(st.desc)}<br>敵: ${st.enemies.map(e=>esc(PRESETS[e].name)).join('、')}（総HP ${hp.toLocaleString()}）<br>報酬 ${fmtG(st.reward)}${i>=progress.cleared?'（初回は2倍）':''}</div></div></div>`);
    const b=el(`<button ${lock?'disabled':''}>${lock?'🔒':'出撃'}</button>`);if(!lock)b.onclick=()=>{closeModal();openFleetSelect(i);};it.appendChild(b);box.appendChild(it);});
  modal('キャンペーン',box);}
function openFleetSelect(stage,preselect,bmode){
  const list=specList();const sel=new Set(preselect||[]);if(!sel.size){const f=list.find(x=>x.ok&&x.mine&&!x.miss.length)||list.find(x=>x.ok&&x.mine)||list.find(x=>x.ok);if(f)sel.add(f.id);}
  const box=el('<div></div>');const wave=bmode==='wave',max=wave?3:3;
  box.appendChild(el(`<div style="margin-bottom:8px"><b>${wave?'🌊 連続海戦':esc(STAGES[stage].name)}</b><br><span style="color:var(--muted)">出撃する艦を最大${max}隻選んでください${wave?`（自己ベスト WAVE ${inv.best||0}）`:''}</span></div>`));
  const render=()=>{box.querySelectorAll('.item').forEach(e=>e.remove());
    for(const it of list){const e=el(`<div class="item ${sel.has(it.id)?'sel':''} ${it.ok?'':'lock'}"><div class="grow"><div class="t">${sel.has(it.id)?'☑':'☐'} ${esc(it.name)}${it.preset?'<span class="tag">プリセット</span>':''}</div><div class="d">${it.ok?specDesc(it.st):'出撃不可（浮かない/兵装なし）'}</div>${it.ok?missDesc(it.miss):''}</div></div>`);
      if(it.ok)e.onclick=()=>{if(sel.has(it.id))sel.delete(it.id);else if(sel.size<max)sel.add(it.id);else toast(`最大${max}隻です`);render();};box.appendChild(e);}};
  render();
  modal(wave?'連続海戦':'出撃艦の選択',box,[{label:'キャンセル'},{label:'出撃！',cls:'pri',fn:()=>{if(!sel.size){toast('艦を選んでください');return false;}
    const mine=list.filter(x=>sel.has(x.id)).map(x=>x.spec);const en=wave?[]:STAGES[stage].enemies.map(presetSpec);
    const args=[mine,en,wave?-1:stage,wave?'wave':'campaign'];battle.lastArgs=args;ensureOwned(mine,()=>startBattle(...args));return false;}}]);
}
function openSortie(){openFleetSelect(Math.min(progress.cleared,STAGES.length-1),['cur']);}
function openWave(){openFleetSelect(-1,null,'wave');}
function openFree(){
  const list=specList().filter(x=>x.ok);const cnt=[{},{}];
  const f=list.find(x=>x.mine&&!x.miss.length)||list.find(x=>x.mine)||list[0];if(f)cnt[0][f.id]=1;const e=list.find(x=>x.id==='pdd');if(e)cnt[1][e.id]=1;
  const box=el('<div></div>');
  const render=()=>{box.innerHTML='<div class="d" style="color:var(--muted)">好きな艦同士で対戦（報酬は50%）。敵側には自分の設計やプリセットを自由に選べます。</div>';
    [0,1].forEach(team=>{box.appendChild(el(`<h4>${team===0?'🔵 自軍':'🔴 敵軍'}（最大4隻）</h4>`));
      for(const it of list){const n=cnt[team][it.id]||0;const row=el(`<div class="item ${n?'sel':''}"><div class="grow"><div class="t">${esc(it.name)}</div><div class="d">${specDesc(it.st)}</div>${team===0?missDesc(it.miss):''}</div><div class="stepper"><button>−</button><b>${n}</b><button>＋</button></div></div>`);
        const [m,p]=row.querySelectorAll('button');const tot=()=>Object.values(cnt[team]).reduce((a,b)=>a+b,0);
        m.onclick=()=>{cnt[team][it.id]=Math.max(0,n-1);render();};p.onclick=()=>{if(tot()>=4){toast('最大4隻です');return;}cnt[team][it.id]=n+1;render();};box.appendChild(row);}});};
  render();
  modal('フリー海戦',box,[{label:'キャンセル'},{label:'開戦！',cls:'pri',fn:()=>{const sides=[0,1].map(t=>{const a=[];for(const it of list)for(let i=0;i<(cnt[t][it.id]||0);i++)a.push(it.spec);return a;});
    if(!sides[0].length||!sides[1].length){toast('両軍に1隻以上必要です');return false;}const args=[sides[0],sides[1],-1,'free'];battle.lastArgs=args;ensureOwned(sides[0],()=>startBattle(...args));return false;}}]);
}
function openTest(){const s=ed.stats;if(s.sink){alert('この艦は浮きません。船体ブロックを増やしてください。');return;}
  const spec={name:ed.name,parts:edSnap(),paint:{...ed.paint}};battle.lastArgs=null;
  const m=fleetMissing([spec]);
  if(m.length){toast('試運転では未所持パーツもお試しで使えます');}
  startBattle([spec],[],-1,'test');}
// ---- 工廠（ショップ） ----
let shopCat=3,shopAvail=false;
function openShop(cat){if(cat!=null)shopCat=cat;
  const cats=CATS.map((c,i)=>i).filter(i=>Object.keys(P).some(k=>P[k].cat===i&&!isFree(k)));if(!cats.includes(shopCat))shopCat=cats[0];
  const box=el(`<div><div class="shophd"><span>💰 <b class="money"></b></span><span>⭐ <b class="rankname"></b> <span class="xpbar"><i></i></span> <small class="xptext"></small></span></div>
    <div class="stabs"></div><label class="ownf" style="margin:4px 0 8px"><input type="checkbox" ${shopAvail?'checked':''}> 購入できるものだけ表示</label><div class="slist"></div></div>`);
  const tabs=box.querySelector('.stabs'),listEl=box.querySelector('.slist');
  box.querySelector('.ownf input').onchange=e=>{shopAvail=e.target.checked;renderList();};
  const renderTabs=()=>{tabs.innerHTML='';for(const i of cats){const b=el(`<button class="${i===shopCat?'on':''}">${CATS[i]}</button>`);b.onclick=()=>{shopCat=i;renderTabs();renderList();listEl.scrollTop=0;};tabs.appendChild(b);}};
  const renderList=()=>{listEl.innerHTML='';const keys=Object.keys(P).filter(k=>P[k].cat===shopCat&&!isFree(k)).sort((a,b)=>(P[a].rk||0)-(P[b].rk||0)||(P[a].pr||P[a].ul)-(P[b].pr||P[b].ul));
    for(const k of keys){const d=P[k],lock=!canBuy(k);if(shopAvail&&lock)continue;const price=d.ul||d.pr,have=d.ul?(inv.ul[k]?'解放済み':'未解放'):`所持 ${inv.own[k]||0}`;
      const row=el(`<div class="item ${lock?'lock':''}"><span class="sw" style="background:#${d.col.toString(16).padStart(6,'0')}">${d.ic}</span><div class="grow"><div class="t">${esc(d.n)} <small style="color:var(--muted)">${have}</small></div>
        <div class="d">${partInfo(k).replace(/<span[^>]*>/g,'').replace(/<\/span>/g,' / ')}</div>
        <div class="d"><b style="color:var(--accent)">${fmtG(price)}</b>${d.ul?'（一度買えば使い放題）':''}${lock?` <span style="color:var(--danger)">🔒 ${RANKS[d.rk][0]}で解放</span>`:''}</div></div><div class="sbtn"></div></div>`);
      const bb=row.querySelector('.sbtn');
      if(!lock){if(d.ul){if(!inv.ul[k]){const b=el(`<button class="pri">解放</button>`);b.onclick=()=>{if(buy(k)){toast(`「${d.n}」を解放`);renderList();}else toast('資金が足りません');};bb.appendChild(b);}}
        else{const b1=el('<button class="pri">購入</button>'),b5=el('<button>×5</button>');b1.onclick=()=>{if(buy(k,1)){toast(`「${d.n}」を購入`);renderList();}else toast('資金が足りません');};
          b5.onclick=()=>{if(buy(k,5)){toast(`「${d.n}」×5 を購入`);renderList();}else toast('資金が足りません');};bb.appendChild(b1);bb.appendChild(b5);
          if(inv.own[k]){const bs=el('<button class="dng">売却</button>');bs.onclick=()=>{if(confirm(`「${d.n}」を1個 ${fmtG(d.pr*.5)} で売却しますか？`)&&sell(k,1)){toast('売却しました');renderList();}};bb.appendChild(bs);}}}
      listEl.appendChild(row);}
    if(!listEl.children.length)listEl.appendChild(el('<div class="d" style="color:var(--muted)">表示できる商品がありません</div>'));updateMoneyUI();};
  renderTabs();renderList();
  modal('🏭 工廠（ショップ）',box,[{label:'閉じる',fn:()=>{if(mode==='editor'){renderPalette();renderStats();}}}]);updateMoneyUI();}

function openHelp(){modal('遊び方',`
<h4 style="margin-top:0">🔁 ゲームの流れ</h4>
<ul><li><b>建造ドック</b>で艦を設計 → <b>キャンペーン／連続海戦</b>で戦って<b>資金(G)</b>と<b>経験値</b>を獲得 → <b>工廠</b>で兵装を購入 → さらに強い艦へ！</li>
<li>船体・甲板・装甲・斜めブロック・機関・艦橋・装飾などの<b>基本ブロックは無料・無制限</b>。兵装や特殊な設備は工廠で<b>1個ずつ購入</b>（重装甲などの特殊ブロックは一度の解放で使い放題）。</li>
<li>買ったパーツは何隻の設計にも使えます（1隻に置ける数＝所持数）。売却は半額で可能。</li>
<li>経験値がたまると<b>階級</b>が上がり、大口径砲・ミサイル・特殊兵器などが購入できるようになります。昇進ボーナスもあります。</li>
<li>毎日最初の起動で<b>ログインボーナス</b>がもらえます。</li></ul>
<h4>🛠 建造ドック</h4>
<ul><li><b>タップ/クリック</b>でブロック設置。面をタップするとその隣に置けます。<b>ドラッグ</b>で視点回転、<b>ピンチ/ホイール</b>でズーム、<b>2本指/右ドラッグ</b>で移動。</li>
<li>「設置」ボタンで<b>削除モード</b>、「左右対称」で反対舷にも同時配置、「回転」で向きを変更。</li>
<li><b>範囲</b>モード：2回タップした範囲をまとめて設置／削除（1マスのブロック）。<b>断面</b>スライダーで上の層を隠して内部を編集。</li>
<li>「📁ファイル」→<b>船体自動生成</b>で船体を一瞬で作成。<b>🎨塗装</b>で色を変更。<b>🎯試運転</b>で標的艦相手に試し撃ち（未所持パーツもお試し可）。</li>
<li>パレットの右上の数字は「使用数/所持数」、🛒は未所持、🔒は階級不足です。「所持品のみ」で絞り込めます。</li>
<li>キー操作: R=回転 / E=削除切替 / M=対称 / Ctrl+Z=戻す</li></ul>
<h4>⚖ 浮力と重量</h4>
<ul><li>ブロックは水面下にある分だけ浮力を生みます。重い砲や装甲を積みすぎると<b>沈みます</b>。浮力ブロック（工廠で解放）を使うと重い艦も浮かせられます。</li>
<li>青い半透明の面が喫水線。左右・前後の重量バランスが崩れると艦が傾きます。</li></ul>
<h4>⚔ 海戦</h4>
<ul><li>艦の<b>耐久値(HP)</b>は積んだブロックの耐久の合計で決まり、0になると撃沈。<b>ブロックは壊れません</b>（被弾すると焦げ跡と火災が残ります）。</li>
<li>砲弾は最初に当たったブロックで受け止めます。<b>装甲</b>に当たると貫通力に応じてダメージが減ります（跳弾）。外側を装甲で覆うと効果的。</li>
<li>照準・射撃は<b>全自動</b>。「操舵: 手動」で操艦も可能（WASD / 矢印 / 画面ボタン）。<b>敵艦をタップ</b>で集中攻撃の目標を指定。</li>
<li>レーダー・測距儀＝命中率アップ、自動装填装置＝装填短縮、強化弾薬庫＝威力アップ、ECM＝敵ミサイル妨害、応急修理室＝HP回復。</li>
<li>空母：飛行甲板${MIN_FDECK}個以上＋格納庫で艦載機（戦闘機・爆撃機・雷撃機・ジェット攻撃機・ジェット戦闘機）。ヘリ甲板＋ヘリ格納庫で哨戒ヘリ（誘導魚雷）。</li></ul>
<h4>🏆 モード</h4>
<ul><li><b>キャンペーン</b>：全12海戦。初回クリアは報酬2倍。★2＝撃沈されずに勝利、★3＝全艦HP50%以上で勝利（★3初達成でボーナス）。</li>
<li><b>連続海戦</b>：次々に現れる敵艦隊と戦い続ける。ウェーブごとに報酬、HPが30%回復。どこまで行けるか挑戦！</li>
<li><b>フリー海戦</b>：好きな艦同士で対戦（報酬50%）。自分の設計同士の対戦も可能。</li></ul>`,[{label:'閉じる'}]);}

// ================================================================
//  モード切替
// ================================================================
let mode='menu',showcase=null;
function setMode(m){mode=m;
  if(m==='editor'){showScreen('scr-editor');controls.maxPolarAngle=Math.PI*.95;controls.minDistance=5;controls.maxDistance=250;controls.enablePan=true;controls.autoRotate=false;}
  else if(m==='battle'){showScreen('scr-battle');controls.maxPolarAngle=Math.PI*.47;controls.minDistance=8;controls.maxDistance=900;controls.enablePan=true;controls.autoRotate=false;
    battleRoot.visible=true;if(showcase)showcase.root.visible=false;}
  else {showScreen('scr-menu');controls.maxPolarAngle=Math.PI*.47;controls.minDistance=30;controls.maxDistance=300;controls.autoRotate=true;controls.autoRotateSpeed=0.6;}
  hideGhosts();closeModal();updateAmbient();
}
function goMenu(){clearBattle();setMode('menu');
  if(!showcase){showcase=new Ship(presetSpec("bb"),0);showcase.throttle=0;seaScene.add(showcase.root);showcase.place(0,0,0);}
  showcase.root.visible=true;controls.target.set(0,6,0);camera.position.set(75,22,90);updateMoneyUI();dailyBonus();}
function goEditor(){clearBattle();setMode('editor');renderPalette();edRebuild();edCam();updateMoneyUI();}
$('#m-set').onclick=openSettings;$('#m-shop').onclick=()=>openShop();$('#m-wave').onclick=openWave;$('#t-shop').onclick=()=>openShop(ed.cat>=3?ed.cat:3);$('#t-test').onclick=openTest;$('#m-edit').onclick=goEditor;$('#m-camp').onclick=openCampaign;$('#m-free').onclick=openFree;$('#m-help').onclick=openHelp;

// 初期化
{const cur=LS.get('bf_current',null);
 if(cur&&Array.isArray(cur.parts))edLoad(cur.parts,cur.name||'マイ艦',cur.paint||null);
 else {const s=presetSpec('dd');edLoad(s.parts,'マイ駆逐艦');}
 ed.undo=[];}
if(innerWidth<560){$('#stats').classList.add('mini');$('#stats-tg').textContent='▸';}
applySettings();
goMenu();

// ================================================================
//  メインループ
// ================================================================
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
  waterMat.uniforms.uTime.value=now/1000;
  if(mode==='battle'){const n=battle.speed;for(let i=0;i<n;i++)updateBattle(dt);updateBattleCam(dt);fxAdd.update(dt*n);fxNorm.update(dt*n);
    updateFloat(dt);battle.mmT=(battle.mmT||0)-dt;if(battle.mmT<=0){battle.mmT=.08;drawMinimap();}
    battle.hudT-=dt;if(battle.hudT<=0){battle.hudT=.2;updateHud();}}
  else if(mode==='menu'&&showcase){showcase.update(dt,now/1000);fxAdd.update(dt);fxNorm.update(dt);}
  const sc=mode==='editor'?editScene:seaScene;
  if(sc===seaScene){water.position.set(Math.round(camera.position.x/50)*50,0,Math.round(camera.position.z/50)*50);sky.position.copy(camera.position);}
  controls.update();renderer.render(sc,camera);}
requestAnimationFrame(loop);
window.__bf={get inv(){return inv},buy,missing,openShop,openWave,openTest,STAGES,HP_SCALE,P,fxAdd,fxNorm,waterMat,camera,controls,battle,ed,startBattle,presetSpec,analyze,goEditor,goMenu,updateBattle};
</script>
