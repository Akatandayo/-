<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1624">
<title>BLOCK FLEET - 艦船建造海戦</title>
<style>
:root{
  --bg:#0b1624;--panel:rgba(12,22,36,.86);--panel2:rgba(22,36,56,.92);--line:#2b4363;
  --text:#e9f1fb;--muted:#8fa5c0;--accent:#ffb340;--accent2:#4fd1ff;--danger:#ff5d6c;--ok:#5ee08a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 12px}
button:active{transform:translateY(1px)}
button.on{background:var(--accent);color:#1d1300;border-color:transparent;font-weight:700}
button.pri{background:linear-gradient(180deg,#ffc35c,#f39a1e);color:#1d1300;border:none;font-weight:800}
button.dng{background:#5a1f2a;border-color:#8a3040}
input,textarea,select{font:inherit;color:var(--text);background:#081221;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.screen{position:fixed;inset:0;pointer-events:none;display:none}
.screen.show{display:block}
.screen .pe{pointer-events:auto}
.hidden{display:none!important}

/* ---------- menu ---------- */
#scr-menu .center{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 46px);transform:translateX(-50%);text-align:center;width:min(92vw,420px)}
#scr-menu .mbtm{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 26px);transform:translateX(-50%);width:min(92vw,420px)}
.logo{font-size:clamp(40px,11vw,72px);font-weight:900;letter-spacing:.04em;line-height:1;margin:0;
  text-shadow:0 4px 24px #0009;color:#fff}
.logo span{color:var(--accent)}
.sub{margin:10px 0 26px;color:#d6e6f5;text-shadow:0 2px 10px #000a;font-size:14px}
.menu-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-btns button{padding:14px;font-size:17px;font-weight:700;background:var(--panel);backdrop-filter:blur(6px)}
.ver{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#c9d8e8;font-size:11px;text-shadow:0 1px 4px #000}

/* ---------- editor ---------- */
.topbar{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;align-items:center}
.topbar input{flex:1;min-width:60px;max-width:260px}
.topbar .sp{flex:1}
label.gl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}
label.gl input[type=range]{flex:1;max-width:60%}
#stats{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 48px);left:8px;width:220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.55}
#stats .row{display:flex;justify-content:space-between;gap:6px}
#stats .row b{font-weight:700}
#stats .warn{color:var(--danger);font-weight:700}
#stats .note{color:var(--accent)}
#stats.mini .body{display:none}
#stats .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--accent2);cursor:pointer}
#tools{position:absolute;right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 48px);display:flex;flex-direction:column;gap:6px;width:64px}
#tools button{padding:6px 2px;font-size:11px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:1px}
#tools button .ic{font-size:18px}
#cutbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;font-size:10px;text-align:center}
#cutbox input{width:100%;padding:0;margin:0}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 8px max(8px,env(safe-area-inset-bottom))}
#pinfo{background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 0 0;padding:5px 10px;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
#pinfo b{color:var(--text)}
#cats{display:flex;gap:4px;overflow-x:auto;background:var(--panel);padding:5px 6px 0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
#cats button{padding:5px 14px;font-size:13px;border-radius:8px 8px 0 0;flex:0 0 auto}
#palette{display:flex;gap:6px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;padding:6px;scrollbar-width:thin}
#palette button{flex:0 0 auto;min-width:72px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
#palette .sw{width:26px;height:18px;border-radius:4px;border:1px solid #0006;display:flex;align-items:center;justify-content:center;font-size:13px}
#palette button.on{background:#3b2a0a;color:var(--accent);border-color:var(--accent)}
#toast{position:fixed;z-index:20;left:50%;top:22%;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* ---------- battle ---------- */
#fleets{position:absolute;top:max(6px,env(safe-area-inset-top));left:6px;right:6px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.fleet{display:flex;flex-direction:column;gap:4px;width:min(46vw,240px)}
.fleet.enemy{align-items:flex-end}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:11px;width:100%}
.sc .nm{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.sc .st{color:var(--accent);font-weight:700}
.sc.dead{opacity:.45}
.bar{height:5px;background:#0008;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .3s}
.bar.fl i{background:var(--accent2)}
.bar.hpb{height:11px;position:relative}.bar.hpb i{transition:width .25s}.hpt{position:absolute;right:4px;top:-1px;font-size:9px;line-height:11px;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}
.enemy .bar i{background:var(--danger)}
.enemy .bar.fl i{background:#7fb2ff}
#blog{position:absolute;left:8px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 60px);font-size:12px;line-height:1.5;text-shadow:0 1px 3px #000,0 0 6px #000;max-width:60vw;pointer-events:none}
#blog div{animation:fade 6s forwards}
#blog.up{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 140px)}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
#bctl{position:absolute;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:96vw}
#bctl button{padding:8px 10px;font-size:13px}
#helm{position:absolute;left:8px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:46px 46px;gap:5px}
#helm button{font-size:20px;padding:0}
#helm .tl{grid-column:2;grid-row:1}
#helm .lf{grid-column:1;grid-row:2}
#helm .dn{grid-column:2;grid-row:2}
#helm .rt{grid-column:3;grid-row:2}
#helmInfo{position:absolute;left:8px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 104px);font-size:12px;background:var(--panel);border-radius:8px;padding:3px 8px}
#ftxt{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;left:0;top:0;font-weight:900;font-size:15px;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 8px #000;will-change:transform,opacity}
.ft.big{font-size:22px}.ft.r{color:#ff8a8a}.ft.y{color:#ffe08a}.ft.b{color:#9fd4ff}.ft.g{color:#c9d2db;font-size:13px}
#mm{position:absolute;right:8px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 48px);width:130px;height:130px;border-radius:50%;border:1px solid var(--line);background:rgba(6,16,28,.6);transition:width .2s,height .2s}
#mm.lg{width:min(70vw,300px);height:min(70vw,300px)}
@media (max-width:560px){.ft{font-size:12px}.ft.big{font-size:16px}#blog{font-size:10.5px;max-width:58vw}#blog div:nth-last-child(n+5){display:none}#mm{width:104px;height:104px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 84px)}#mm.up{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 250px)}}
#mhdr{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
#mhdr>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:6px}
.mh-money b{color:var(--accent)}.mh-rank small{color:var(--muted);font-size:10px}
.xpbar{display:inline-block;width:70px;height:6px;background:#0008;border-radius:3px;overflow:hidden;vertical-align:middle}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd66b,#ff9a3c);width:0}
.smoney{font-weight:700;color:var(--accent);font-size:11px}
#palette button{position:relative}
#palette button.dim{opacity:.55}
.own{position:absolute;top:2px;right:3px;font-size:9px;background:#000a;border-radius:6px;padding:0 4px;color:#cfe}
.own.full{color:#ffb0b0}.own.bu{color:#ffd66b}.own.lk{color:#ff9aa4}
.ownf{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap;padding:0 6px}
.buyl{color:#1d1300!important;background:var(--accent);border-radius:6px;padding:0 6px;cursor:pointer;font-weight:700}
.shophd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:6px;font-size:13px}
.shophd b.money{color:var(--accent)}
.stabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}.stabs button{flex:0 0 auto;padding:5px 10px;font-size:12px}
.slist .item .sw{width:30px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.sbtn{display:flex;flex-direction:column;gap:4px}.sbtn button{padding:5px 10px;font-size:12px}
.rew{background:#0b1626;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.rew .row{display:flex;justify-content:space-between;font-size:13px}.rew .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-size:15px}.rew .tot b{color:var(--accent)}
.rankup{margin-top:6px;padding:6px 8px;border-radius:8px;background:#3b2a0a;color:#ffd66b;font-weight:700}
#bigmsg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(36px,10vw,80px);font-weight:900;text-shadow:0 4px 30px #000;pointer-events:none;letter-spacing:.1em}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:10;padding:12px}
.mbox{background:#0f1c2e;border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px}
.mbody{padding:12px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:14px;line-height:1.6;-webkit-user-select:text;user-select:text}
.mfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:#0b1626}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.item .d{font-size:12px;color:var(--muted)}
.item.sel{border-color:var(--accent);background:#2a1f0b}
.item.lock{opacity:.4}
.item button{padding:5px 10px;font-size:13px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:18px;text-align:center}
.mbody h4{margin:14px 0 6px;color:var(--accent2)}
.mbody ul{padding-left:20px;margin:6px 0}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:#22344e;color:#bcd;margin-left:4px}
textarea{width:100%;height:120px;font-size:11px;font-family:monospace}
@media (max-width:560px){
  #stats{width:160px;font-size:10.5px;padding:6px 8px}
  .topbar button{padding:7px 8px;font-size:13px}
  .topbar .lbl{display:none}
  #tools{width:50px;gap:3px}
  #t-redo{display:none!important}
  #mhdr{font-size:12px}.xpbar{width:46px}.mh-rank small{display:none}
  #tools button{font-size:9.5px;padding:4px 1px}
  #tools button .ic{font-size:15px}
  #pinfo{font-size:10.5px;gap:6px;padding:4px 8px}
  #palette button{min-width:62px;font-size:11px;padding:5px 6px}
  #cats button{padding:4px 10px;font-size:12px}
  .sc{font-size:10px;padding:3px 6px}
  #bctl button{padding:7px 8px;font-size:12px}
  #bctl.man{flex-direction:column;align-items:stretch;width:92px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- MENU -->
<div id="scr-menu" class="screen">
  <div id="mhdr" class="pe"><div class="mh-money">💰 <b class="money"></b></div><div class="mh-rank">⭐ <b class="rankname"></b><span class="xpbar"><i></i></span><small class="xptext"></small></div></div>
  <div class="center pe">
    <h1 class="logo">BLOCK<span>FLEET</span></h1>
    <div class="sub">ブロックで軍艦を設計し、大海原で撃ち合え</div>
  </div>
  <div class="mbtm pe">
    <div class="menu-btns">
      <button id="m-edit">⚓ 建造ドック</button>
      <button id="m-shop">🏭 工廠</button>
      <button id="m-camp">🎖 キャンペーン</button>
      <button id="m-wave">🌊 連続海戦</button>
      <button id="m-free">⚔ フリー海戦</button>
      <button id="m-help">❓ 遊び方</button>
      <button id="m-set" style="grid-column:1/3;padding:10px;font-size:15px">⚙ 設定</button>
    </div>
  </div>
  <div class="ver">BLOCK FLEET v2.0 — 戦って資金を稼ぎ、工廠で兵装を揃えよう</div>
</div>

<!-- EDITOR -->
<div id="scr-editor" class="screen">
  <div class="topbar pe">
    <button id="e-back">◀</button>
    <input id="e-name" maxlength="24" value="マイ艦">
    <button id="e-file">📁<span class="lbl"> ファイル</span></button>
    <button id="e-save">💾<span class="lbl"> 保存</span></button>
    <span class="sp"></span>
    <button id="e-go" class="pri">出撃 ▶</button>
  </div>
  <div id="stats" class="pe">
    <div class="hd" id="stats-hd"><span>艦の性能</span><span class="smoney">💰 <span class="money"></span></span><span id="stats-tg">▾</span></div>
    <div class="body" id="stats-body"></div>
  </div>
  <div id="tools" class="pe">
    <button id="t-mode" class="on"><span class="ic">🧱</span>設置</button>
    <button id="t-mirror" class="on"><span class="ic">⇋</span>左右対称</button>
    <button id="t-rect"><span class="ic">▭</span>範囲</button>
    <button id="t-rot"><span class="ic">⟳</span>回転 <span id="t-rotv">0°</span></button>
    <button id="t-paint"><span class="ic">🎨</span>塗装</button>
    <button id="t-undo"><span class="ic">↶</span>戻す</button>
    <button id="t-redo"><span class="ic">↷</span>やり直し</button>
    <button id="t-cam"><span class="ic">🎥</span>視点</button>
    <button id="t-shop"><span class="ic">🏭</span>工廠</button>
    <button id="t-test"><span class="ic">🎯</span>試運転</button>
    <div id="cutbox">断面 <span id="cutv">全</span><input id="t-cut" type="range" min="0" max="15" value="15"></div>
  </div>
  <div id="bottom" class="pe">
    <div id="pinfo"></div>
    <div id="cats"></div>
    <div id="palette"></div>
  </div>
</div>

<!-- BATTLE -->
<div id="scr-battle" class="screen">
  <div id="fleets"><div class="fleet" id="f0"></div><div class="fleet enemy" id="f1"></div></div>
  <div id="blog"></div>
  <div id="ftxt"></div>
  <canvas id="mm" class="pe" width="260" height="260"></canvas>
  <div id="bigmsg"></div>
  <div id="helmInfo" class="pe hidden"></div>
  <div id="helm" class="pe hidden">
    <button class="tl" data-h="up">▲</button>
    <button class="lf" data-h="left">◀</button>
    <button class="dn" data-h="down">▼</button>
    <button class="rt" data-h="right">▶</button>
  </div>
  <div id="bctl" class="pe">
    <button id="b-manual">操舵: 自動</button>
    <button id="b-cam">📷 自艦</button>
    <button id="b-speed">速度 x1</button>
    <button id="b-snd">🔊</button>
    <button id="b-quit" class="dng">撤退</button>
  </div>
</div>

<div id="toast"></div>
<div id="modal" class="hidden"><div class="mbox"><div class="mhead"><span id="mtitle"></span><button id="mclose">✕</button></div><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div>
